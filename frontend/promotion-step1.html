<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>选择歌曲｜KJ 音乐推广</title>
<link rel="stylesheet" href="assets/css/song-selector.css">
<style>
:root{--brand:#f04444;--brand-dark:#d83939;--ink:#171717;--muted:#707177;--line:#e8e8eb;--max:1120px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.container{max-width:var(--max);margin:auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.06)}.nav-inner{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:850}.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.16em;color:#92939a;margin-top:2px}.menu{display:flex;gap:30px;font-size:14px;color:#55565b}.menu a.active,.menu a:hover{color:#111;font-weight:750}.secondary,.primary{display:inline-flex;align-items:center;justify-content:center;border-radius:13px;font-weight:750}.secondary{border:1px solid #dedee1;background:#fff;padding:11px 17px}.primary{border:0;background:var(--brand);color:#fff;padding:12px 18px;cursor:pointer}.primary:disabled{opacity:.42;cursor:not-allowed}
.page{padding:46px 0 82px}.crumb{font-size:12px;color:#92939a;margin-bottom:18px}.page-head{max-width:780px}.page-head h1{font-size:42px;line-height:1.12;letter-spacing:-.04em;margin:0 0 12px}.page-head p{font-size:16px;line-height:1.7;color:var(--muted);margin:0}.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:30px 0}.step{border-top:3px solid #e6e6e8;padding-top:10px;color:#9a9ba0;font-size:12px}.step strong{display:block;font-size:14px;color:#77787e;margin-top:2px}.step.active{border-color:var(--brand);color:var(--brand)}.step.active strong{color:#181818}.panel{border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff}.panel-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.panel-head h2{font-size:22px;margin:0 0 6px}.panel-head p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.badge{display:inline-flex;border-radius:999px;background:#fff0ef;color:#b52e2a;padding:6px 9px;font-size:11px;white-space:nowrap}.actions-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px}.selection-note{font-size:12px;color:#898a90;line-height:1.55}.selection-note strong{color:#333}footer{border-top:1px solid var(--line);padding:32px 0 44px;color:#777;font-size:13px}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:760px){.menu{display:none}.container{padding:0 18px}.page-head h1{font-size:34px}.panel{padding:18px}.actions-row{align-items:stretch;flex-direction:column-reverse}.actions-row .primary,.actions-row .secondary{width:100%}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">KJ</span><span>看见音乐<small>KANJIAN MUSIC</small></span></a><nav class="menu"><a href="index.html">首页</a><a class="active" href="music-promotion.html">音乐推广</a><a href="#">订单</a></nav><a class="secondary" href="#">登录</a></div></header>

<main class="page"><div class="container">
  <div class="crumb">音乐推广 / 创建推广</div>
  <div class="page-head"><h1>先选择你要推广的歌曲</h1><p>可以直接粘贴外部流媒体歌曲链接，也可以登录星球发行，从你已经发行的歌曲中选择一首。</p></div>

  <div class="stepper"><div class="step active">STEP 1<strong>选择歌曲</strong></div><div class="step">STEP 2<strong>选择推广目标</strong></div><div class="step">STEP 3<strong>选择方案与预算</strong></div></div>

  <section class="panel">
    <div class="panel-head"><div><h2>选择歌曲</h2><p>两种方式任选一种。选择完成后即可进入下一步。</p></div><span class="badge">STEP 1</span></div>
    <div class="song-picker" id="songPicker" data-song-picker></div>
  </section>

  <div class="actions-row"><a class="secondary" href="music-promotion.html">返回音乐推广</a><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end"><div class="selection-note" id="selectionNote">尚未选择歌曲</div><button class="primary" id="nextBtn" disabled>下一步：选择推广目标 →</button></div></div>
</div></main>
<footer><div class="container foot"><div>© 2026 KANJIAN MUSIC · KJ Music Promotion</div><div>音乐推广 · 订单 · 帮助中心</div></div></footer>
<script src="assets/js/song-selector.js"></script>
<script>
let selectedSong=null;
const picker=document.getElementById('songPicker');
const nextBtn=document.getElementById('nextBtn');
const note=document.getElementById('selectionNote');
picker.addEventListener('songselected',e=>{selectedSong=e.detail;nextBtn.disabled=false;note.innerHTML='已选择：<strong>'+selectedSong.title+'</strong> · '+selectedSong.artist;});
picker.addEventListener('songcleared',()=>{selectedSong=null;nextBtn.disabled=true;note.textContent='尚未选择歌曲';});
nextBtn.addEventListener('click',()=>{if(!selectedSong)return;const params=new URLSearchParams({title:selectedSong.title||'',artist:selectedSong.artist||'',platform:selectedSong.platform||'',source:selectedSong.source||''});location.href='promotion-step2.html?'+params.toString();});
</script>
</body></html>
