function statusClass(s){return s==='已完成'?'done':s==='推广中'?'running':s==='待执行'?'waiting':s==='待支付'?'pending':'closed'}
function timeline(){document.getElementById('timeline').innerHTML=o.events.map(e=>`<div class="event"><div class="event-time">${e[0]}</div><div class="dot"></div><div class="event-copy">${e[1]}</div></div>`).join('')}
function render(){document.getElementById('orderMeta').textContent=`订单号 ${id} · ${o.created} 创建`;const os=document.getElementById('orderStatus');os.textContent=o.statusName;os.className='status '+o.status;document.getElementById('cover').textContent=o.cover;document.getElementById('cover').style.background=o.gradient;document.getElementById('songName').textContent=o.song;document.getElementById('songMeta').textContent=`${o.artist} · ${o.album}`;document.getElementById('planName').textContent=o.plan;document.getElementById('goalTags').innerHTML=o.goals.map(g=>`<span class="goal-tag">${g}</span>`).join('');document.getElementById('projectCount').textContent=`${o.projects.length} 个推广项目`;document.getElementById('projects').innerHTML=o.projects.map((x,i)=>`<article class="project"><div><div class="project-main"><span class="platform" style="background:${x.color}">${x.p==='QQ音乐'?'Q':x.p.slice(0,1)}</span><div><div class="project-name">${x.p} · ${x.service}</div><div class="service">推广项目</div></div></div><div class="expected"><div class="expected-label">预计结果</div><div class="expected-value"><strong>${x.expected}</strong></div></div></div><div class="project-side"><div class="project-price">${money(x.price)}</div><div class="project-status"><span class="status ${statusClass(x.status)}">${x.status}</span></div><div class="project-note">${x.note}</div>${x.results?.length?`<button class="result-btn" data-result="${i}">查看结果（${x.results.length}）→</button>`:''}</div></article>`).join('');document.getElementById('total').textContent=money(o.total);document.getElementById('deduct').textContent='- '+money(o.deduct);document.getElementById('paid').textContent=money(o.paid);document.getElementById('method').textContent=o.method;document.getElementById('payTime').textContent=o.payTime;document.getElementById('orderNo').textContent=id;document.getElementById('created').textContent=o.created;const ps=document.getElementById('paymentStatus');ps.textContent=o.payment;ps.className='status '+(o.status==='pending'?'pending':o.payment==='已支付'?'done':'closed');const pay=document.getElementById('payBtn'),cancel=document.getElementById('cancelOrder');if(o.status==='pending'){document.getElementById('paidLabel').textContent='仍需支付';pay.style.display='block';pay.textContent='继续支付 '+money(o.total);cancel.style.display='block'}else{document.getElementById('paidLabel').textContent='实际支付';pay.style.display='none';cancel.style.display='none'}document.querySelectorAll('.result-btn').forEach(b=>b.onclick=()=>openResult(Number(b.dataset.result)));timeline()}
function resultRow(r){return `<div class="result-row"><div class="result-time">${r.time}</div><div class="result-dot"></div><div class="result-body">${r.text?`<div>${r.text}</div>`:''}${r.link?`<a class="result-link" href="${r.link}" target="_blank" rel="noopener">查看链接</a>`:''}${r.images?.length?`<div class="result-images">${r.images.map(img=>`<img class="result-thumb" src="${img.src}" alt="${img.name||'执行结果图片'}" data-preview="${encodeURIComponent(img.src)}">`).join('')}</div>`:''}</div></div>`}
function openResult(i){const x=o.projects[i];if(!x?.results?.length)return;document.getElementById('resultSub').textContent=`${x.p} · ${x.service} · ${x.results.length} 条记录`;document.getElementById('resultBody').innerHTML=x.results.map(resultRow).join('');document.getElementById('resultModal').classList.add('show');document.querySelectorAll('[data-preview]').forEach(img=>img.onclick=()=>{document.getElementById('imagePreview').src=decodeURIComponent(img.dataset.preview);document.getElementById('imageModal').classList.add('show')})}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('payBtn').onclick=()=>{const q=new URLSearchParams({source:'star-release',order_no:id,title:'音乐推广订单',plan_name:o.plan,order_total:String(o.total),balance_deduct:'0',amount:String(o.total)});location.href='../payment-center-checkout.html?'+q.toString()};document.getElementById('cancelOrder').onclick=()=>{if(o.status!=='pending'||!confirm('确认取消这笔未支付的推广订单？'))return;o.status='closed';o.statusName='已关闭';o.payment='未支付';o.projects.forEach(x=>{x.status='已关闭';x.note='订单已取消，项目未执行'});o.events.unshift(['刚刚','订单已取消']);render();toast('订单已取消')};document.getElementById('modalClose').onclick=()=>document.getElementById('resultModal').classList.remove('show');document.getElementById('resultModal').onclick=e=>{if(e.target.id==='resultModal')e.currentTarget.classList.remove('show')};document.getElementById('imageClose').onclick=()=>document.getElementById('imageModal').classList.remove('show');document.getElementById('imageModal').onclick=e=>{if(e.target.id==='imageModal')e.currentTarget.classList.remove('show')};render();
</script>
<script src="star-release-shell.js"></script>
</body>
</html>
