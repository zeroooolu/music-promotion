const id=new URLSearchParams(location.search).get('id')||'KJ202608190001',o=data[id]||data['KJ202608190001'],money=n=>'¥'+n.toLocaleString('zh-CN');function statusClass(s){if(s==='已完成')return'done';if(s==='推广中')return'running';if(s==='待执行')return'waiting';if(s==='待支付')return'pending';return'closed'}document.getElementById('orderMeta').textContent=`订单号 ${id} · ${o.created} 创建`;const os=document.getElementById('orderStatus');os.textContent=o.statusName;os.className='status '+o.status;document.getElementById('cover').textContent=o.cover;document.getElementById('cover').style.background=o.gradient;document.getElementById('songName').textContent=o.song;document.getElementById('songMeta').textContent=`${o.artist} · ${o.album}`;document.getElementById('planName').textContent=o.plan;document.getElementById('goalTags').innerHTML=o.goals.map(g=>`<span class="goal-tag">${g}</span>`).join('');document.getElementById('projectCount').textContent=`${o.projects.length} 个推广项目`;document.getElementById('projects').innerHTML=o.projects.map((x,i)=>`<article class="project"><div class="project-left"><div class="project-main"><span class="platform" style="background:${x.color}">${x.p==='QQ音乐'?'Q':x.p.slice(0,1)}</span><div><div class="project-name">${x.p} · ${x.service}</div><div class="service">推广项目</div></div></div><div class="expected"><div class="expected-label">预计结果</div><div class="expected-value"><strong>${x.expected}</strong></div></div></div><div class="project-side"><div class="project-price">${money(x.price)}</div><div class="project-status"><span class="status ${statusClass(x.status)}">${x.status}</span></div><div class="project-note">${x.note}</div>${x.result?`<button class="result-btn" data-result="${i}">查看结果 →</button>`:''}</div></article>`).join('');document.getElementById('timeline').innerHTML=o.events.map(e=>`<div class="event"><div class="event-time">${e[0]}</div><div class="dot"></div><div class="event-copy">${e[1]}</div></div>`).join('');document.getElementById('total').textContent=money(o.total);document.getElementById('deduct').textContent='- '+money(o.deduct);document.getElementById('paid').textContent=money(o.paid);document.getElementById('method').textContent=o.method;document.getElementById('payTime').textContent=o.payTime;document.getElementById('orderNo').textContent=id;document.getElementById('created').textContent=o.created;const ps=document.getElementById('paymentStatus');ps.textContent=o.payment;ps.className='status '+(o.status==='pending'?'pending':o.payment==='已支付'?'done':'closed');if(o.status==='pending'){document.getElementById('paidLabel').textContent='仍需支付';const btn=document.getElementById('payBtn');btn.style.display='block';btn.textContent='继续支付 '+money(o.total);btn.onclick=()=>{const q=new URLSearchParams({source:'star-release',order_no:id,title:'音乐推广订单',plan_name:o.plan,order_total:String(o.total),balance_deduct:'0',amount:String(o.total)});location.href='../payment-center-checkout.html?'+q.toString()}}
function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}function openResult(index){const x=o.projects[index],r=x&&x.result;if(!r)return;document.getElementById('resultTitle').textContent=r.title;document.getElementById('resultSub').textContent=`${x.p} · ${x.service}`;let html='';if(r.type==='image')html=`<span class="result-type">效果截图</span><div class="screenshot-placeholder"><div class="screenshot-icon">▧</div><strong>推广效果截图</strong><span>实际环境展示执行方上传的图片</span></div><div class="result-caption">${r.text}</div>`;if(r.type==='text')html=`<span class="result-type">结果说明</span><div class="result-text">${r.text}</div>`;if(r.type==='link')html=`<span class="result-type">结果链接</span><div class="result-link-box"><strong>${r.title}</strong><p>${r.text} 实际环境中将跳转到执行方回传的结果页面。</p><button class="open-link" id="openResultLink">打开结果链接 ↗</button></div>`;document.getElementById('resultBody').innerHTML=html;document.getElementById('resultModal').classList.add('show');const link=document.getElementById('openResultLink');if(link)link.onclick=()=>showToast('Demo：这里将打开实际回传的结果链接')}document.querySelectorAll('.result-btn').forEach(btn=>btn.onclick=()=>openResult(Number(btn.dataset.result)));document.getElementById('modalClose').onclick=()=>document.getElementById('resultModal').classList.remove('show');document.getElementById('resultModal').onclick=e=>{if(e.target.id==='resultModal')e.currentTarget.classList.remove('show')};
</script></body></html>
