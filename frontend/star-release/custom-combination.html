  {id:'qq-playlist-chart',platform:'QQ音乐',name:'QQ 音乐官方歌单打榜',desc:'官方私人歌单打榜服务，同时覆盖歌单曝光和热度目标。',mode:'fixed',badge:'固定套餐',packages:[['基础打榜',10000,'预计 20 万播放'],['中级打榜',15000,'预计 30 万播放'],['高级打榜',20000,'预计 40 万播放']],covers:['playlist','chart']},
  {id:'kugou-playlist-chart',platform:'酷狗音乐',name:'酷狗音乐官方歌单打榜',desc:'酷狗官方私人歌单推广服务。',mode:'fixed',badge:'固定套餐',packages:[['基础',6000,'预计 10 万播放'],['进阶',12000,'预计 20 万播放'],['高级',24000,'预计 40 万播放']],covers:['playlist','chart']},
  {id:'netease-playlist',platform:'网易云音乐',name:'网易云音乐官方歌单打榜',desc:'网易云官方私人歌单打榜服务。',mode:'fixed',badge:'固定套餐',packages:[['基础',6000,'预计 12 万播放'],['进阶',12000,'预计 25 万播放'],['高级',18000,'预计 38 万播放']],covers:['playlist','chart']}
 ],
 ktv:[
  {id:'ktv-publish',platform:'KTV',name:'KTV 制作上架',desc:'单次固定服务，将 1 首歌曲制作并上架合作 KTV 曲库。',mode:'single',badge:'固定服务',price:2000,result:'1 首歌曲制作并上架',covers:['ktv']}
 ]
};
let activeGoal=goals[0],selectedPlatforms={},cart=[],uiState={};goals.forEach(g=>selectedPlatforms[g]=new Set());
const money=n=>'¥'+Number(n).toLocaleString('zh-CN');
document.getElementById('songName').textContent=song.title;document.getElementById('songMeta').textContent=[song.artist,song.album].filter(Boolean).join(' · ');document.getElementById('songCover').textContent=song.cover;document.getElementById('summaryGoals').innerHTML=goals.map(g=>`<span class="summary-goal">${goalNames[g]||g}</span>`).join('');
function allProductsForGoal(g){return products[g]||[]}
function platformsForGoal(g){return [...new Set(allProductsForGoal(g).map(x=>x.platform))]}
function covered(g){return cart.some(i=>(i.covers||[]).includes(g))}
function goalItemCount(g){return cart.filter(i=>(i.covers||[]).includes(g)).length}
function renderTabs(){document.getElementById('goalTabs').innerHTML=goals.map(g=>`<button class="goal-tab ${g===activeGoal?'active':''}" data-goal="${g}"><span>${goalNames[g]||g}</span><span class="tab-count ${covered(g)?'done':''}">${goalItemCount(g)||'—'}</span></button>`).join('');document.querySelectorAll('.goal-tab').forEach(b=>b.onclick=()=>{activeGoal=b.dataset.goal;renderAll()})}
function renderCurrent(){document.getElementById('currentGoalTitle').textContent=goalNames[activeGoal]||activeGoal;document.getElementById('currentGoalDesc').textContent=goalDescs[activeGoal]||'';const c=document.getElementById('currentCoverage');c.textContent=covered(activeGoal)?`已选 ${goalItemCount(activeGoal)} 项服务`:'尚未选择服务';c.className='coverage-tip '+(covered(activeGoal)?'done':'')}
function renderPlatforms(){const ps=platformsForGoal(activeGoal);document.getElementById('platforms').innerHTML=ps.map(p=>{const count=allProductsForGoal(activeGoal).filter(x=>x.platform===p).length,sel=selectedPlatforms[activeGoal].has(p);return `<div class="platform-check ${sel?'selected':''}" data-platform="${p}"><span class="check-box">✓</span><span class="platform-dot" style="background:${colors[p]||'#6f7785'}">${p==='QQ音乐'?'Q':p==='网易云音乐'?'云':p.slice(0,2)}</span><span>${p}</span><span class="platform-count">${count} 个服务</span></div>`}).join('');document.querySelectorAll('.platform-check').forEach(el=>el.onclick=()=>{const p=el.dataset.platform,s=selectedPlatforms[activeGoal];s.has(p)?s.delete(p):s.add(p);renderPlatforms();renderProducts()})}
function stateFor(id){return uiState[id]||(uiState[id]={packageIndex:0,qty:1,budget:250})}
function resultFor(x){const st=stateFor(x.id);if(x.mode==='fixed')return x.packages[st.packageIndex][2];if(x.mode==='quantity')return `${st.qty*x.unitResult} ${x.unit}`;if(x.mode==='single')return x.result;if(x.mode==='foreignBudget')return `Spotify 广告预算 USD ${st.budget}`;return x.priceText||'需要确认报价'}
function priceFor(x){const st=stateFor(x.id);if(x.mode==='fixed')return x.packages[st.packageIndex][1];if(x.mode==='quantity')return st.qty*x.unitPrice;if(x.mode==='single')return x.price;if(x.mode==='foreignBudget')return st.budget;return 0}
function itemKey(x){return x.id}
function inCart(x){return cart.some(i=>i.id===x.id)}
function productHtml(x){const st=stateFor(x.id),added=inCart(x);let control='';if(x.mode==='fixed'){control=`<div><span class="control-label">选择套餐</span><select class="package-select" data-product="${x.id}">${x.packages.map((p,i)=>`<option value="${i}" ${i===st.packageIndex?'selected':''}>${p[0]} · ${money(p[1])}</option>`).join('')}</select></div><button class="add-btn ${added?'added':''}" data-add="${x.id}">${added?'已加入组合':'加入推广组合'}</button>`}else if(x.mode==='quantity'){control=`<div><span class="control-label">购买数量（每份 ${x.unitResult} 个）</span><div class="qty-control"><button class="qty-btn" data-qty-minus="${x.id}">−</button><div class="qty-value">${st.qty}</div><button class="qty-btn" data-qty-plus="${x.id}">＋</button></div></div><button class="add-btn ${added?'added':''}" data-add="${x.id}">${added?'更新组合':'加入推广组合'}</button>`}else if(x.mode==='single'){control=`<div><span class="control-label">固定服务</span><div style="height:38px;display:flex;align-items:center;color:#555">1 首歌曲 · ${money(x.price)}</div></div><button class="add-btn ${added?'added':''}" data-add="${x.id}">${added?'已加入组合':'加入推广组合'}</button>`}else if(x.mode==='foreignBudget'){control=`<div><span class="control-label">推广预算（USD）</span><input class="budget-input" data-budget="${x.id}" type="number" min="${x.minBudget}" step="50" value="${st.budget}"></div><button class="add-btn" data-foreign="${x.id}">加入海外预算</button>`}else{control=`<div class="quote-row" style="grid-column:1/-1"><div class="quote-copy">${x.priceText||'需要根据具体资源确认报价'}</div><button class="quote-btn" data-quote="${x.id}">获取报价</button></div>`}return `<article class="product-card" data-card="${x.id}"><div class="product-top"><div class="product-main"><div class="product-name">${x.name}</div><div class="product-desc">${x.desc}</div></div><span class="sale-badge">${x.badge}</span></div><div class="product-result"><div class="result-label">${x.mode==='quote'?'售卖方式':'预计结果'}</div><div class="result-value">${resultFor(x)}</div></div><div class="control-row">${control}</div></article>`}
function renderProducts(){const selected=[...selectedPlatforms[activeGoal]];const area=document.getElementById('productsArea');if(!selected.length){area.innerHTML='<div class="empty-products">勾选一个或多个推广平台后，这里会展示平台当前可购买的推广产品和套餐。</div>';return}area.innerHTML=selected.map(p=>{const xs=allProductsForGoal(activeGoal).filter(x=>x.platform===p);return `<section class="platform-group"><div class="group-head"><span class="platform-dot" style="background:${colors[p]||'#6f7785'}">${p==='QQ音乐'?'Q':p==='网易云音乐'?'云':p.slice(0,2)}</span>${p}</div>${xs.map(productHtml).join('')}</section>`}).join('');bindProductControls()}
function findProduct(id){for(const g of Object.keys(products)){const x=products[g].find(p=>p.id===id);if(x)return x}return null}
function bindProductControls(){document.querySelectorAll('.package-select').forEach(el=>el.onchange=()=>{stateFor(el.dataset.product).packageIndex=Number(el.value);renderProducts()});document.querySelectorAll('[data-qty-minus]').forEach(b=>b.onclick=()=>{const st=stateFor(b.dataset.qtyMinus);st.qty=Math.max(1,st.qty-1);renderProducts()});document.querySelectorAll('[data-qty-plus]').forEach(b=>b.onclick=()=>{const st=stateFor(b.dataset.qtyPlus);st.qty=Math.min(20,st.qty+1);renderProducts()});document.querySelectorAll('[data-budget]').forEach(el=>el.onchange=()=>{const x=findProduct(el.dataset.budget),st=stateFor(x.id);st.budget=Math.max(x.minBudget,Number(el.value)||x.minBudget);renderProducts()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addProduct(findProduct(b.dataset.add)));document.querySelectorAll('[data-quote]').forEach(b=>b.onclick=()=>toast('Demo：这里进入报价申请流程'));document.querySelectorAll('[data-foreign]').forEach(b=>b.onclick=()=>toast('Demo 暂不把 USD 预算与人民币推广项目合并结算'))}
function addProduct(x){if(!x)return;if(x.mode==='foreignBudget'||x.mode==='quote')return;const item={id:x.id,goal:activeGoal,covers:(x.covers||[activeGoal]).filter(g=>goals.includes(g)),platform:x.platform,product:x.name,result:resultFor(x),price:priceFor(x),currency:'CNY',packageLabel:x.mode==='fixed'?x.packages[stateFor(x.id).packageIndex][0]:x.mode==='quantity'?`${stateFor(x.id).qty} 份`:'固定服务'};const idx=cart.findIndex(i=>i.id===x.id);if(idx>=0)cart[idx]=item;else cart.push(item);renderAll();toast(idx>=0?'已更新推广项目':'已加入推广组合')}
function removeItem(id){cart=cart.filter(i=>i.id!==id);renderAll()}
function renderCart(){document.getElementById('coverageList').innerHTML=goals.map(g=>`<div class="coverage-row"><span>${goalNames[g]}</span><strong class="coverage-state ${covered(g)?'done':''}">${covered(g)?'✓ 已覆盖':'未选择'}</strong></div>`).join('');document.getElementById('cartItems').innerHTML=cart.length?cart.map(i=>`<div class="cart-item"><div class="cart-item-top"><div><div class="cart-result">${i.result}</div><div class="cart-service">${i.platform} · ${i.product}<br>${i.packageLabel}</div></div><button class="remove-item" data-remove="${i.id}" title="移除">×</button></div><div class="cart-price">${money(i.price)}</div></div>`).join(''):'<div class="cart-empty">还没有选择推广项目。<br>从左侧勾选平台并加入服务。</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeItem(b.dataset.remove));const total=cart.reduce((s,i)=>s+i.price,0),coveredCount=goals.filter(covered).length;document.getElementById('cartTotal').textContent=money(total);const w=document.getElementById('coverageWarning');w.textContent=cart.length?(coveredCount===goals.length?`已覆盖全部 ${goals.length} 个推广目标`:`已覆盖 ${coveredCount} / ${goals.length} 个推广目标，可继续选择或直接确认`):'还没有添加推广项目';w.className='coverage-warning '+(cart.length&&coveredCount===goals.length?'all':'');document.getElementById('confirmBtn').disabled=!cart.length}
function renderAll(){renderTabs();renderCurrent();renderPlatforms();renderProducts();renderCart()}
function nextUncovered(){const idx=goals.indexOf(activeGoal);for(let offset=1;offset<=goals.length;offset++){const g=goals[(idx+offset)%goals.length];if(!covered(g)){activeGoal=g;renderAll();return}}const next=goals[(idx+1)%goals.length];activeGoal=next;renderAll()}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('nextGoalBtn').onclick=nextUncovered;document.getElementById('backRecommend').onclick=e=>{e.preventDefault();history.back()};document.getElementById('confirmBtn').onclick=()=>{if(!cart.length)return;const payload={song,goals,items:cart,total:cart.reduce((s,i)=>s+i.price,0),currency:'CNY',createdAt:Date.now()};sessionStorage.setItem('starPromotionCustomOrder',JSON.stringify(payload));const q=new URLSearchParams({...song,goals:goals.join(','),custom:'1'});location.href='order-confirm.html?'+q.toString()};renderAll();
</script>
