const products={
plays:[{id:'netease-play',platform:'网易云音乐',name:'网易云音乐播放推广',hint:'保底新增播放 1,980 次起',priceHint:'¥99 起',budget:{min:99,max:2499,step:1,factor:20,resultPrefix:'保底新增播放'},covers:['plays']},{id:'qq-play',platform:'QQ音乐',name:'在 QQ 音乐推广',hint:'保底新增播放 1,980 次起',priceHint:'¥99 起',skus:[['体验套餐',99,'保底新增播放 1,980 次'],['起量套餐',209,'保底新增播放 4,000 次'],['加强套餐',509,'保底新增播放 10,000 次']],covers:['plays']},{id:'kugou-play',platform:'酷狗音乐',name:'在酷狗推广',hint:'保底新增播放 1,980 次起',priceHint:'¥99 起',skus:[['体验套餐',99,'保底新增播放 1,980 次'],['起量套餐',209,'保底新增播放 4,000 次'],['加强套餐',509,'保底新增播放 10,000 次']],covers:['plays']},{id:'kuwo-play',platform:'酷我音乐',name:'在酷我推广',hint:'保底新增播放 1,980 次起',priceHint:'¥99 起',skus:[['体验套餐',99,'保底新增播放 1,980 次'],['起量套餐',209,'保底新增播放 4,000 次'],['加强套餐',509,'保底新增播放 10,000 次']],covers:['plays']}],

const selected={};const productMap=(()=>{const map={};Object.values(products).flat().forEach(p=>{if(!map[p.id])map[p.id]=p});return map})();const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');const priceMin=s=>Number(s.price??s.priceMin??0);const priceMax=s=>Number(s.price??s.priceMax??s.priceMin??0);const specPriceText=s=>s.price!=null?money(s.price):`${money(s.priceMin)}–${money(s.priceMax)}`;function short(n){return n==='网易云音乐'?'易':n==='QQ音乐'?'Q':n==='酷狗音乐'?'狗':n==='酷我音乐'?'我':n==='Spotify'?'S':n==='YouTube'?'Y':n==='抖音'?'抖':n==='小红书'?'红':n==='KTV'?'KTV':'T'}function resultHtml(t){const m=String(t).match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);return m?`${m[1]}<strong>${m[2]}</strong>${m[3]}`:t}function budgetResult(p,v){return `${p.budget.resultPrefix||'预计新增播放'} ${(Number(v)*p.budget.factor).toLocaleString('zh-CN')} 次`}
function chosenItems(id){const p=productMap[id],s=selected[id];if(!p||!s)return[];if(p.quantitySpecs)return Object.entries(s.specs||{}).map(([idx,bundles])=>{const spec=p.quantitySpecs[Number(idx)],count=Number(bundles),min=priceMin(spec)*count,max=priceMax(spec)*count;return{key:`${p.id}::${idx}`,id:p.id,platform:p.platform,product:p.name,packageLabel:`${spec.name} × ${count} 份`,price:min,priceMin:min,priceMax:max,priceText:min===max?money(min):`${money(min)}–${money(max)}`,result:`${(spec.quantity*count).toLocaleString('zh-CN')} ${spec.unit}参与传播`,covers:p.covers}});if(p.skus){const sk=p.skus[s.sku||0];return[{key:p.id,id:p.id,platform:p.platform,product:p.name,packageLabel:sk[0],price:sk[1],priceMin:sk[1],priceMax:sk[1],priceText:money(sk[1]),result:sk[2],covers:p.covers}]}if(p.budget){const v=Number(s.budget||p.budget.min);return[{key:p.id,id:p.id,platform:p.platform,product:p.name,packageLabel:`推广预算 ${money(v)}`,price:v,priceMin:v,priceMax:v,priceText:money(v),result:budgetResult(p,v),covers:p.covers}]}return[{key:p.id,id:p.id,platform:p.platform,product:p.name,packageLabel:p.single.label,price:p.single.price,priceMin:p.single.price,priceMax:p.single.price,priceText:money(p.single.price),result:p.single.result,covers:p.covers}]}
function cart(){return Object.keys(selected).flatMap(chosenItems)}function covered(g){return cart().some(i=>i.covers.includes(g))}function toggleProduct(id){const p=productMap[id];if(selected[id])delete selected[id];else if(p.quantitySpecs)selected[id]={specs:{}};else if(p.skus)selected[id]={sku:0};else if(p.budget)selected[id]={budget:p.budget.min};else selected[id]={};renderAll()}function selectSku(id,i){selected[id]={sku:i};renderAll()}function toggleQuantitySpec(id,i){const p=productMap[id];if(!selected[id])selected[id]={specs:{}};const specs=selected[id].specs||(selected[id].specs={});if(specs[i])delete specs[i];else specs[i]=p.quantitySpecs[i].min||1;renderAll()}function changeQuantity(id,i,delta){const p=productMap[id],spec=p.quantitySpecs[i];if(!selected[id])selected[id]={specs:{}};const specs=selected[id].specs||(selected[id].specs={});const current=Number(specs[i]||spec.min||1);specs[i]=Math.max(spec.min||1,current+delta);renderAll()}function setBudget(id,v){const p=productMap[id];selected[id]={budget:Math.max(p.budget.min,Math.min(p.budget.max,Number(v)||p.budget.min))};renderAll()}function removeItem(key){if(key.includes('::')){const[id,idx]=key.split('::');if(selected[id]?.specs)delete selected[id].specs[idx];if(selected[id]&&Object.keys(selected[id].specs||{}).length===0)delete selected[id]}else delete selected[key];renderAll()}
function renderProduct(p){const on=!!selected[p.id],state=selected[p.id]||{};let effect=p.hint,price=p.priceHint,sub='',type='';if(p.skus){type='has-sku';const c=p.skus[state.sku||0];if(on){effect=c[2];price=money(c[1])}sub=`<div class="sku-wrap"><div class="sku-label">选择套餐</div>${p.skus.map((s,i)=>`<div class="sku-row ${on&&(state.sku||0)===i?'selected':''}" data-sku="${p.id}" data-index="${i}"><div class="sku-main"><span class="radio"></span><div><div class="sku-result">${resultHtml(s[2])}</div><div class="sku-package">${s[0]}</div></div></div><span class="sku-price">${money(s[1])}</span></div>`).join('')}</div>`}else if(p.quantitySpecs){type='is-quantity';const picked=Object.keys(state.specs||{});if(on&&picked.length){const min=picked.reduce((sum,i)=>sum+priceMin(p.quantitySpecs[Number(i)])*Number(state.specs[i]),0),max=picked.reduce((sum,i)=>sum+priceMax(p.quantitySpecs[Number(i)])*Number(state.specs[i]),0);effect=`已选 ${picked.length} 个规格`;price=min===max?money(min):`${money(min)}–${money(max)}`}sub=`<div class="quantity-wrap"><div class="quantity-label">规格可多选，每个规格可独立增加购买份数</div>${p.quantitySpecs.map((s,i)=>{const qty=Number(state.specs?.[i]||s.min||1),selectedSpec=!!state.specs?.[i],min=priceMin(s)*qty,max=priceMax(s)*qty;return`<div class="quantity-row ${selectedSpec?'selected':''}" data-quantity="${p.id}" data-index="${i}"><div class="quantity-main"><span class="spec-check">✓</span><div><div class="quantity-name">${s.name}</div><div class="quantity-meta">每份 ${s.quantity.toLocaleString('zh-CN')} ${s.unit} · ${specPriceText(s)} / 份</div>${selectedSpec?`<div class="quantity-result">当前 <strong>${(s.quantity*qty).toLocaleString('zh-CN')}</strong> ${s.unit}参与传播</div>`:''}</div></div><div class="quantity-side"><span class="quantity-price">${selectedSpec?(min===max?money(min):`${money(min)}–${money(max)}`):specPriceText(s)}</span>${selectedSpec?`<div class="stepper"><button type="button" data-step="-1" data-id="${p.id}" data-i="${i}">−</button><span>${qty} 份</span><button type="button" data-step="1" data-id="${p.id}" data-i="${i}">＋</button></div>`:''}</div></div>`}).join('')}</div>`}else if(p.budget){type='is-budget';const v=Number(state.budget||p.budget.min);if(on){effect=budgetResult(p,v);price=money(v)}sub=`<div class="budget-wrap"><div class="budget-label">推广预算</div><div class="budget-control"><div><input class="budget-range" data-budget-range="${p.id}" type="range" min="${p.budget.min}" max="${p.budget.max}" step="${p.budget.step}" value="${v}"><div class="range-scale"><span>${money(p.budget.min)}</span><span>${money(p.budget.max)}</span></div></div><label class="budget-input-wrap"><span class="currency-prefix">¥</span><input class="budget-input" data-budget-input="${p.id}" type="number" min="${p.budget.min}" max="${p.budget.max}" step="${p.budget.step}" value="${v}"></label></div><div class="budget-result">${resultHtml(budgetResult(p,v))}</div></div>`}else type='is-single';return`<div class="product ${type} ${on?'selected':''}"><div class="product-row" data-toggle="${p.id}"><div class="product-main"><span class="check">✓</span><span class="platform" style="background:${colors[p.platform]||'#777'}">${short(p.platform)}</span><span class="product-copy"><span class="product-name">${p.name}</span><span class="product-meta">${p.platform}</span></span></div><div class="product-side"><div class="effect">${resultHtml(effect)}</div><div class="price-hint">${price}</div></div></div>${sub}</div>`}
function renderGoals(){document.getElementById('goalSections').innerHTML=goals.map((g,gi)=>{const list=products[g]||[];return`<section class="goal-section"><div class="goal-head"><div class="goal-head-main"><span class="goal-index">${gi+1}</span><span class="goal-title">${goalNames[g]||g}</span><span class="goal-count">${list.length} 个可选产品</span></div><span class="goal-state ${covered(g)?'done':''}">${covered(g)?'✓ 已选择':'未选择'}</span></div><div class="product-list">${list.map(renderProduct).join('')}</div></section>`}).join('');bindBuilder()}
function bindBuilder(){document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>toggleProduct(el.dataset.toggle));document.querySelectorAll('[data-sku]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectSku(el.dataset.sku,Number(el.dataset.index))});document.querySelectorAll('[data-quantity]').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleQuantitySpec(el.dataset.quantity,Number(el.dataset.index))});document.querySelectorAll('[data-step]').forEach(el=>el.onclick=e=>{e.stopPropagation();changeQuantity(el.dataset.id,Number(el.dataset.i),Number(el.dataset.step))});document.querySelectorAll('[data-budget-range]').forEach(el=>el.oninput=e=>{e.stopPropagation();setBudget(el.dataset.budgetRange,e.target.value)});document.querySelectorAll('[data-budget-input]').forEach(el=>{el.onclick=e=>e.stopPropagation();el.onchange=e=>setBudget(el.dataset.budgetInput,e.target.value)})}
function renderCart(){const items=cart();document.getElementById('coverageList').innerHTML=goals.map(g=>`<div class="coverage-row"><span>${goalNames[g]}</span><strong class="coverage-state ${covered(g)?'done':''}">${covered(g)?'✓ 已覆盖':'未选择'}</strong></div>`).join('');document.getElementById('cartSub').textContent=`已选择 ${items.length} 个推广项目`;document.getElementById('cartItems').innerHTML=items.length?items.map(i=>`<div class="cart-item"><div class="cart-item-top"><div><div class="cart-result">${resultHtml(i.result)}</div><div class="cart-service">${i.platform} · ${i.product}<br>${i.packageLabel}</div></div><button class="remove-item" data-remove="${i.key}">×</button></div><div class="cart-price">${i.priceText}</div></div>`).join(''):'<div class="cart-empty">还没有选择推广项目。<br>从左侧按目标选择产品和规格即可。</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeItem(b.dataset.remove));const min=items.reduce((s,i)=>s+Number(i.priceMin||0),0),max=items.reduce((s,i)=>s+Number(i.priceMax||0),0),coveredCount=goals.filter(covered).length;document.getElementById('cartTotal').textContent=min===max?money(min):`${money(min)}–${money(max)}`;const w=document.getElementById('coverageWarning');if(!items.length)w.textContent='还没有选择推广项目';else if(coveredCount===goals.length)w.textContent=`已覆盖全部 ${goals.length} 个推广目标`;else w.textContent=`已覆盖 ${coveredCount} / ${goals.length} 个推广目标，可继续选择或直接确认`;w.className='coverage-warning '+(items.length&&coveredCount===goals.length?'all':'');document.getElementById('confirmBtn').disabled=!items.length}
function renderAll(){renderGoals();renderCart()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}document.getElementById('songName').textContent=song.title;document.getElementById('songMeta').textContent=[song.artist,song.album].filter(Boolean).join(' · ');document.getElementById('songCover').textContent=song.cover;document.getElementById('summaryGoals').innerHTML=goals.map(g=>`<span class="summary-goal">${goalNames[g]||g}</span>`).join('');document.getElementById('backRecommend').onclick=e=>{e.preventDefault();history.back()};document.getElementById('confirmBtn').onclick=()=>{const items=cart();if(!items.length)return;const totalMin=items.reduce((s,i)=>s+Number(i.priceMin||0),0),totalMax=items.reduce((s,i)=>s+Number(i.priceMax||0),0);const payload={song,goals,items,total:totalMin,totalMin,totalMax,currency:'CNY',createdAt:Date.now()};sessionStorage.setItem('starPromotionCustomOrder',JSON.stringify(payload));const q=new URLSearchParams({...song,goals:goals.join(','),custom:'1'});location.href='order-confirm.html?'+q.toString()};renderAll();
</script>
