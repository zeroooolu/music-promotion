let goals=(params.get('goals')||'plays,playlist,social').split(',').filter(Boolean);if(!goals.length)goals=['plays','playlist','social'];
const colors={'网易云音乐':'#e94b3c','TME':'#20a6ff','QQ音乐':'#20a6ff','酷狗音乐':'#2d8cff','抖音':'#222','小红书':'#ff4058','Spotify':'#24c269','YouTube':'#ff3b30','KTV':'#7c62d9'};
const products={

],

],

const selected={};
const allProducts=()=>{const map={};Object.values(products).flat().forEach(p=>{if(!map[p.id])map[p.id]=p});return map};
const productMap=allProducts();
const money=n=>n==null?'—':'¥'+Number(n).toLocaleString('zh-CN');
const fx=n=>'USD '+Number(n).toLocaleString('en-US');
function platformShort(name){return name==='QQ音乐'?'Q':name==='网易云音乐'?'易':name==='酷狗音乐'?'酷':name==='Spotify'?'S':name==='YouTube'?'Y':name==='小红书'?'红':name==='抖音'?'抖':name==='KTV'?'KTV':'T'}
function resultHtml(text){const m=String(text).match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);if(!m)return text;return `${m[1]}<strong>${m[2]}</strong>${m[3]}`}
function budgetResult(p,value){return `预计 ${(Number(value)*p.budget.factor).toLocaleString('zh-CN')} ${p.budget.unit}`}
function chosenItem(id){const p=productMap[id],state=selected[id];if(!p||!state)return null;if(p.skus){const s=p.skus[state.sku||0];return{id:p.id,platform:p.platform,product:p.name,packageLabel:s[0],price:s[1],priceText:money(s[1]),result:s[2],covers:p.covers,foreign:false}}if(p.budget){const v=Number(state.budget||p.budget.min),foreign=p.budget.currency!=='CNY';return{id:p.id,platform:p.platform,product:p.name,packageLabel:`推广预算 ${foreign?fx(v):money(v)}`,price:foreign?null:v,foreignAmount:foreign?v:0,priceText:foreign?fx(v):money(v),result:budgetResult(p,v),covers:p.covers,foreign}}const s=p.single;return{id:p.id,platform:p.platform,product:p.name,packageLabel:s.label,price:s.price,priceText:s.price==null?s.label:money(s.price),result:s.result,covers:p.covers,foreign:false}}
function cart(){return Object.keys(selected).map(chosenItem).filter(Boolean)}
function covered(goal){return cart().some(i=>i.covers.includes(goal))}
function toggleProduct(id){const p=productMap[id];if(selected[id])delete selected[id];else if(p.skus)selected[id]={sku:0};else if(p.budget)selected[id]={budget:p.budget.min};else selected[id]={};renderAll()}
function selectSku(id,index){if(!selected[id])selected[id]={sku:index};else selected[id].sku=index;renderAll()}
function setBudget(id,value){const p=productMap[id];if(!selected[id])selected[id]={budget:p.budget.min};const v=Math.max(p.budget.min,Math.min(p.budget.max,Number(value)||p.budget.min));selected[id].budget=v;renderAll()}
function removeItem(id){delete selected[id];renderAll()}
function renderGoals(){document.getElementById('goalSections').innerHTML=goals.map((g,gi)=>{const list=products[g]||[];return `<section class="goal-section"><div class="goal-head"><div class="goal-head-main"><span class="goal-index">${gi+1}</span><span class="goal-title">${goalNames[g]||g}</span><span class="goal-count">${list.length} 个可选产品</span></div><span class="goal-state ${covered(g)?'done':''}">${covered(g)?'✓ 已选择':'未选择'}</span></div><div class="product-list">${list.map(renderProduct).join('')}</div></section>`}).join('');bindBuilder()}
function renderProduct(p){const on=!!selected[p.id],state=selected[p.id]||{},chosen=p.skus?p.skus[state.sku||0]:null,budgetValue=p.budget?Number(state.budget||p.budget.min):0,effect=on?(p.skus?chosen[2]:p.budget?budgetResult(p,budgetValue):p.single.result):p.hint,price=on?(p.skus?money(chosen[1]):p.budget?(p.budget.currency==='CNY'?money(budgetValue):fx(budgetValue)):(p.single.price==null?p.single.label:money(p.single.price))):p.priceHint;let sub='';if(p.skus){sub=`<div class="sku-wrap"><div class="sku-label">选择套餐</div>${p.skus.map((s,i)=>`<div class="sku-row ${on&&(state.sku||0)===i?'selected':''}" data-sku="${p.id}" data-index="${i}"><div class="sku-main"><span class="radio"></span><div class="sku-copy"><div class="sku-result">${resultHtml(s[2])}</div><div class="sku-package">${s[0]}</div></div></div><span class="sku-price">${money(s[1])}</span></div>`).join('')}</div>`}else if(p.budget){const prefix=p.budget.currency==='CNY'?'¥':'USD';sub=`<div class="budget-wrap"><div class="budget-label">推广预算</div><div class="budget-control"><div class="range-wrap"><input class="budget-range" data-budget-range="${p.id}" type="range" min="${p.budget.min}" max="${p.budget.max}" step="${p.budget.step}" value="${budgetValue}"><div class="range-scale"><span>${prefix} ${Number(p.budget.min).toLocaleString()}</span><span>${prefix} ${Number(p.budget.max).toLocaleString()}</span></div></div><label class="budget-input-wrap"><span class="currency-prefix">${prefix}</span><input class="budget-input" data-budget-input="${p.id}" type="number" min="${p.budget.min}" max="${p.budget.max}" step="${p.budget.step}" value="${budgetValue}"></label></div><div class="budget-result">${resultHtml(budgetResult(p,budgetValue))}<span>预计效果随预算变化</span></div></div>`}const typeClass=p.skus?'has-sku':p.budget?'is-budget':'is-single';return `<div class="product ${typeClass} ${on?'selected':''}" data-product="${p.id}"><div class="product-row" data-toggle="${p.id}"><div class="product-main"><span class="check">✓</span><span class="platform" style="background:${colors[p.platform]||'#777'}">${platformShort(p.platform)}</span><span class="product-copy"><span class="product-name">${p.name}</span><span class="product-meta">${p.platform}</span></span></div><div class="product-side"><div class="effect">${resultHtml(effect)}</div><div class="price-hint">${price}</div></div></div>${sub}</div>`}
function bindBuilder(){document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>toggleProduct(el.dataset.toggle));document.querySelectorAll('[data-sku]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectSku(el.dataset.sku,Number(el.dataset.index))});document.querySelectorAll('[data-budget-range]').forEach(el=>el.oninput=e=>{e.stopPropagation();setBudget(el.dataset.budgetRange,e.target.value)});document.querySelectorAll('[data-budget-input]').forEach(el=>{el.onclick=e=>e.stopPropagation();el.onchange=e=>setBudget(el.dataset.budgetInput,e.target.value)})}
function renderCart(){const items=cart();document.getElementById('coverageList').innerHTML=goals.map(g=>`<div class="coverage-row"><span>${goalNames[g]}</span><strong class="coverage-state ${covered(g)?'done':''}">${covered(g)?'✓ 已覆盖':'未选择'}</strong></div>`).join('');document.getElementById('cartSub').textContent=`已选择 ${items.length} 个推广项目`;document.getElementById('cartItems').innerHTML=items.length?items.map(i=>`<div class="cart-item"><div class="cart-item-top"><div><div class="cart-result">${resultHtml(i.result)}</div><div class="cart-service">${i.platform} · ${i.product}<br>${i.packageLabel}</div></div><button class="remove-item" data-remove="${i.id}" title="移除">×</button></div><div class="cart-price">${i.priceText}</div></div>`).join(''):'<div class="cart-empty">还没有选择推广项目。<br>从左侧按目标勾选产品即可。</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeItem(b.dataset.remove));const cny=items.filter(i=>i.price!=null&&!i.foreign).reduce((s,i)=>s+i.price,0),usd=items.filter(i=>i.foreign).reduce((s,i)=>s+(i.foreignAmount||0),0),unresolved=items.some(i=>i.price==null&&!i.foreign),coveredCount=goals.filter(covered).length;document.getElementById('cartTotal').textContent=money(cny);const foreign=document.getElementById('foreignTotal');foreign.textContent=usd?`另含海外推广预算 ${fx(usd)}`:'';foreign.classList.toggle('show',!!usd);const w=document.getElementById('coverageWarning');if(!items.length)w.textContent='还没有选择推广项目';else if(unresolved)w.textContent='组合中包含需要报价的项目，Demo 暂不支持直接确认订单';else if(usd)w.textContent='组合中包含美元预算项目，Demo 暂不与人民币项目合并结算';else if(coveredCount===goals.length)w.textContent=`已覆盖全部 ${goals.length} 个推广目标`;else w.textContent=`已覆盖 ${coveredCount} / ${goals.length} 个推广目标，可继续选择或直接确认`;w.className='coverage-warning '+(!unresolved&&!usd&&items.length&&coveredCount===goals.length?'all':'');document.getElementById('confirmBtn').disabled=!items.length||unresolved||!!usd}
function renderAll(){renderGoals();renderCart()}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('songName').textContent=song.title;document.getElementById('songMeta').textContent=[song.artist,song.album].filter(Boolean).join(' · ');document.getElementById('songCover').textContent=song.cover;document.getElementById('summaryGoals').innerHTML=goals.map(g=>`<span class="summary-goal">${goalNames[g]||g}</span>`).join('');document.getElementById('backRecommend').onclick=e=>{e.preventDefault();history.back()};document.getElementById('confirmBtn').onclick=()=>{const items=cart();if(!items.length)return;if(items.some(i=>i.price==null||i.foreign)){toast('当前组合包含暂不能直接结算的项目');return}const payload={song,goals,items,total:items.reduce((s,i)=>s+i.price,0),currency:'CNY',createdAt:Date.now()};sessionStorage.setItem('starPromotionCustomOrder',JSON.stringify(payload));const q=new URLSearchParams({...song,goals:goals.join(','),custom:'1'});location.href='order-confirm.html?'+q.toString()};renderAll();
</script>
