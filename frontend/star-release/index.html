<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星球发行 · 音乐推广</title>
  <style>
    :root {
      --brand: #2448ff;
      --brand-hover: #1839e8;
      --brand-soft: #e9edff;
      --page-bg: #f4f6f9;
      --surface: #ffffff;
      --text: #30343a;
      --text-strong: #20232a;
      --text-secondary: #666b75;
      --text-tertiary: #9aa0aa;
      --border: #e5e8ee;
      --border-strong: #d9dde5;
      --sidebar-width: 244px;
      --topbar-height: 88px;
      --radius: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 1100px; min-height: 100%; margin: 0; color: var(--text); background: var(--page-bg); font-size: 14px; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }
    .app-shell { min-height: 100vh; background: var(--page-bg); }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; width: var(--sidebar-width); min-height: 100vh; background: #fff; border-right: 1px solid var(--border); }
    .brand { height: var(--topbar-height); display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); }
    .brand-logo { width: 120px; height: 30px; display: flex; align-items: center; color: var(--brand); }
    .brand-logo svg { width: 120px; height: 30px; overflow: visible; }
    .nav { padding: 6px 12px 24px; }
    .nav-item { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 20px; color: #30343a; text-decoration: none; border-radius: 2px; transition: background-color .15s ease, color .15s ease; user-select: none; }
    .nav-item:hover { background: #f6f7fa; }
    .nav-item.active { color: var(--brand); background: var(--brand-soft); font-weight: 500; }
    .nav-icon { width: 20px; height: 20px; flex: 0 0 20px; color: currentColor; }
    .nav-label { font-size: 16px; line-height: 1; white-space: nowrap; }
    .topbar { position: fixed; top: 0; right: 0; left: var(--sidebar-width); z-index: 15; height: var(--topbar-height); display: flex; align-items: center; justify-content: flex-end; padding: 0 26px; background: var(--page-bg); }
    .topbar-actions { display: flex; align-items: center; gap: 28px; color: #30343a; }
    .topbar-action { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; color: inherit; text-decoration: none; white-space: nowrap; }
    .topbar-action .icon { width: 20px; height: 20px; color: #25282d; }
    .caret { width: 10px; height: 10px; margin-left: 1px; }
    .workspace { min-height: 100vh; margin-left: var(--sidebar-width); padding-top: var(--topbar-height); background: var(--page-bg); }
    .page-content { width: 100%; min-height: calc(100vh - var(--topbar-height)); padding: 0 22px 28px; }
    #promotion-root { width: 100%; min-height: calc(100vh - var(--topbar-height) - 28px); }
    .page-card { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(31,35,48,.02); }
    .page-card + .page-card { margin-top: 16px; }
    .page-card-header { min-height: 56px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); color: var(--text-strong); font-size: 16px; font-weight: 600; }
    .page-card-body { padding: 24px 20px; }
    .section-title { margin: 0 0 18px; color: var(--text-strong); font-size: 16px; font-weight: 600; }
    .form-row { display: flex; align-items: flex-start; margin-bottom: 22px; }
    .form-label { width: 110px; flex: 0 0 110px; padding: 8px 16px 0 0; color: #5c616b; text-align: right; line-height: 20px; }
    .form-label.required::before { content: "*"; margin-right: 4px; color: var(--brand); }
    .form-control, .select-control, .textarea-control { width: 400px; min-height: 34px; padding: 6px 10px; color: var(--text); background: #fff; border: 1px solid #d8dde7; border-radius: 4px; outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
    .textarea-control { min-height: 88px; resize: vertical; }
    .form-control::placeholder, .textarea-control::placeholder { color: #b2b7c0; }
    .form-control:focus, .select-control:focus, .textarea-control:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(36,72,255,.08); }
    .btn { height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; border: 1px solid transparent; border-radius: 4px; font-weight: 400; transition: background-color .15s ease, border-color .15s ease; }
    .btn-primary { color: #fff; background: var(--brand); border-color: var(--brand); }
    .btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
    .btn-default { color: #434750; background: #fff; border-color: #d7dce5; }
    .btn-default:hover { color: var(--brand); border-color: var(--brand); }
    .muted { color: var(--text-tertiary); }
    @media (max-width: 1180px) { :root { --sidebar-width: 224px; } .topbar-actions { gap: 20px; } .page-content { padding-left: 18px; padding-right: 18px; } }
  </style>
</head>
<body>

            </g>
          </svg>
        </div>
      </div>

        <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="currentColor"/><circle cx="12" cy="12" r="2.3" fill="#fff"/><circle cx="16.3" cy="8.2" r="1.1" fill="#fff" opacity=".85"/></svg><span class="nav-label">专辑列表</span></a>

        <a class="topbar-action" href="#"><span>简体中文</span><svg class="caret" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4H2Z" fill="currentColor"/></svg></a>
        <a class="topbar-action" href="#"><span>环环</span><svg class="caret" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4H2Z" fill="currentColor"/></svg></a>
      </div>
    </header>
    <main class="workspace"><div class="page-content"><div id="promotion-root" aria-label="音乐推广内容区域"></div></div></main>
  </div>
</body>
</html>
