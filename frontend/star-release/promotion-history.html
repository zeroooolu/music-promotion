<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推广历史 · 星球发行</title><style>
:root{--brand:#2448ff;--brand-soft:#e9edff;--page:#f4f6f9;--surface:#fff;--text:#30343a;--strong:#20232a;--muted:#7b818c;--tertiary:#9aa0aa;--border:#e5e8ee;--border2:#d9dde5;--sidebar:244px;--topbar:88px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:1100px;min-height:100%;background:var(--page);color:var(--text);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}svg{display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--border);z-index:20}.brand{height:var(--topbar);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border)}.brand img{width:120px}.nav{padding:6px 12px}.nav-item{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;border-radius:2px;color:#30343a}.nav-item:hover{background:#f6f7fa}.nav-item.active{color:var(--brand);background:var(--brand-soft);font-weight:500}.nav-icon{width:20px;height:20px}.nav-label{font-size:16px}.topbar{position:fixed;top:0;right:0;left:var(--sidebar);height:var(--topbar);display:flex;justify-content:flex-end;align-items:center;padding:0 26px;background:var(--page);z-index:15}.topbar-actions{display:flex;align-items:center;gap:28px}.topbar-action{display:inline-flex;align-items:center;gap:7px}.caret{width:10px;height:10px}.workspace{margin-left:var(--sidebar);padding-top:var(--topbar);min-height:100vh}.page{max-width:1500px;margin:0 auto;padding:0 22px 36px}.page-head{height:76px;display:flex;align-items:center;justify-content:space-between}.head-copy h1{margin:0 0 5px;color:var(--strong);font-size:22px;font-weight:600}.head-copy p{margin:0;color:var(--muted);font-size:12px}.back-link{color:var(--brand);font-size:13px}.card{background:#fff;border:1px solid var(--border2);border-radius:4px}.toolbar{padding:15px 16px;display:flex;align-items:center;gap:12px}.search{position:relative;width:340px}.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:#9298a2}.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid #d8dde7;border-radius:4px;outline:0;background:#fff}.search input:focus{border-color:var(--brand)}.status-tabs{display:flex;align-items:center;gap:6px;flex:1}.tab{height:34px;padding:0 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:#707782}.tab:hover{background:#f6f7fa}.tab.active{color:var(--brand);background:#eef2ff;border-color:#dce3ff}.date-select{height:36px;border:1px solid #d8dde7;border-radius:4px;background:#fff;padding:0 28px 0 10px;color:#5d636d}.orders-card{margin-top:14px;overflow:hidden}.orders-head{height:52px;display:grid;grid-template-columns:minmax(250px,1fr) minmax(390px,1.55fr) 185px 120px;gap:20px;align-items:center;padding:0 20px;background:#fafbfc;border-bottom:1px solid var(--border);color:#8b919b;font-size:11px}.orders{padding:0 20px}.order{display:grid;grid-template-columns:minmax(250px,1fr) minmax(390px,1.55fr) 185px 120px;gap:20px;align-items:center;min-height:132px;padding:17px 0;border-bottom:1px solid #edf0f4}.order:last-child{border-bottom:0}.song{display:flex;align-items:center;gap:13px;min-width:0}.cover{width:58px;height:58px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:600;flex:none}.song-copy{min-width:0}.song-name{color:var(--strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-meta{margin-top:5px;color:#858c97;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order-no{margin-top:7px;color:#a0a5ae;font-size:11px}.effects{display:flex;gap:8px;flex-wrap:wrap}.effect{min-width:112px;padding:9px 10px;border:1px solid #e2e6ee;border-radius:4px;background:#fafbfc}.effect-label{color:#9197a1;font-size:10px}.effect-value{margin-top:3px;color:var(--strong);font-size:14px;font-weight:600}.effect-value strong{color:var(--brand);font-weight:650}.plan{margin-top:7px;color:#9298a2;font-size:11px}.order-info{min-width:0}.status{height:25px;display:inline-flex;align-items:center;padding:0 8px;border-radius:3px;font-size:11px;font-weight:500}.status.running{color:#2448ff;background:#eef2ff}.status.waiting{color:#8a6a25;background:#fff6df}.status.done{color:#168653;background:#edf9f2}.status.pending{color:#c4473d;background:#fff0ef}.status.closed{color:#777e88;background:#f2f3f5}.amount{margin-top:10px;color:var(--strong);font-size:17px;font-weight:600}.time{margin-top:5px;color:#999fa9;font-size:11px}.actions{text-align:right}.detail-link{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 13px;border:1px solid #d7dce5;border-radius:4px;background:#fff;color:#4d535d}.detail-link:hover{border-color:var(--brand);color:var(--brand)}.pay-btn{display:inline-flex;align-items:center;justify-content:center;height:34px;margin-bottom:7px;padding:0 13px;border:1px solid var(--brand);border-radius:4px;background:var(--brand);color:#fff}.cancel-link{display:inline-block;margin-top:9px;padding:0;border:0;background:transparent;color:#8b919b;font-size:12px;line-height:1}.cancel-link:hover{color:#555d68;text-decoration:underline}.empty{display:none;padding:70px 20px;text-align:center;color:#999fa9}.footer{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid var(--border);background:#fafbfc;color:#9298a2;font-size:12px}.pager{display:flex;gap:6px}.page-btn{width:28px;height:28px;border:1px solid #dfe3ea;border-radius:3px;background:#fff}.page-btn.active{color:var(--brand);border-color:var(--brand)}.toast{position:fixed;left:50%;top:28px;z-index:100;display:none;transform:translateX(-50%);padding:10px 16px;border-radius:4px;background:#30343a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.show{display:block}@media(max-width:1240px){.orders-head,.order{grid-template-columns:minmax(230px,1fr) minmax(330px,1.3fr) 160px 100px}.effect{min-width:100px}}@media(max-width:1180px){:root{--sidebar:224px}.toolbar{flex-wrap:wrap}.search{width:300px}}
</style><link rel="stylesheet" href="star-release-shell.css"></head><body><aside class="sidebar"></aside><header class="topbar"></header><main class="workspace"><div class="page"><div class="page-head"><div class="head-copy"><h1>推广历史</h1><p>查看推广订单、支付状态和执行进度。</p></div><a class="back-link" href="index.html">← 返回音乐推广</a></div><section class="card toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2"/></svg><input id="searchInput" placeholder="搜索歌曲名或订单号"></div><div class="status-tabs" id="statusTabs"><button class="tab active" data-status="all">全部</button><button class="tab" data-status="pending">待支付</button><button class="tab" data-status="waiting">待执行</button><button class="tab" data-status="running">推广中</button><button class="tab" data-status="done">已完成</button><button class="tab" data-status="closed">已关闭</button></div><select class="date-select"><option>全部时间</option><option>近 30 天</option><option>近 3 个月</option></select></section><section class="card orders-card"><div class="orders-head"><span>推广歌曲 / 订单</span><span>预计推广结果</span><span>状态 / 金额</span><span></span></div><div class="orders" id="orders"></div><div class="empty" id="empty">没有找到符合条件的推广订单</div><div class="footer"><span id="countText"></span><div class="pager"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button></div></div></section></div></main><div class="toast" id="toast"></div><script>
const orders=[{id:'KJ202608190001',song:'晚风来信',artist:'林屿',album:'城市漫游',cover:'夜',gradient:'linear-gradient(145deg,#5468ff,#8d6af7)',plan:'均衡推广',status:'running',statusName:'推广中',amount:1199,date:'2026-08-19 14:32',effects:[['预计 +','1,600','播放'],['预计 ','3','个歌单'],['预计 ','10','条内容']]},{id:'KJ202608180018',song:'如果海知道',artist:'沈禾',album:'如果海知道',cover:'海',gradient:'linear-gradient(145deg,#27a9df,#39c6bb)',plan:'起步推广',status:'waiting',statusName:'待执行',amount:699,date:'2026-08-18 16:10',effects:[['预计 +','1,000','播放'],['预计 ','2','个歌单']]},{id:'KJ202608160007',song:'慢慢走',artist:'周棠',album:'沿途',cover:'慢',gradient:'linear-gradient(145deg,#e08084,#ca93bd)',plan:'加强推广',status:'done',statusName:'已完成',amount:1899,date:'2026-08-16 10:25',effects:[['预计 +','2,600','播放'],['预计 ','4','个歌单'],['预计 ','12','条内容']]},{id:'KJ202608150021',song:'Daylight Again',artist:'Noah Chen',album:'Daylight Again',cover:'D',gradient:'linear-gradient(145deg,#f09d55,#ef6f78)',plan:'均衡推广',status:'pending',statusName:'待支付',amount:1299,date:'2026-08-15 19:08',effects:[['预计 ','18,000','次触达'],['预计 ','2','个歌单']]},{id:'KJ202608120009',song:'凌晨三点的城市',artist:'Miro',album:'凌晨三点',cover:'城',gradient:'linear-gradient(145deg,#38445e,#776c9d)',plan:'起步推广',status:'closed',statusName:'已关闭',amount:799,date:'2026-08-12 09:40',effects:[['预计 +','1,100','播放'],['预计 ','2','个歌单']]}];const money=n=>'¥'+n.toLocaleString('zh-CN');let active='all';function detailUrl(o){return 'promotion-order-detail.html?id='+encodeURIComponent(o.id)}function payUrl(o){const q=new URLSearchParams({source:'star-release',order_no:o.id,title:'音乐推广订单',plan_name:o.plan,order_total:String(o.amount),balance_deduct:'0',amount:String(o.amount)});return '../payment-center-checkout.html?'+q.toString()}function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function cancelOrder(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='pending')return;if(!confirm('确认取消这笔未支付的推广订单？'))return;o.status='closed';o.statusName='已关闭';render();toast('订单已取消')}function render(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const list=orders.filter(o=>(active==='all'||o.status===active)&&(!q||(`${o.song}${o.id}${o.artist}`).toLowerCase().includes(q)));document.getElementById('orders').innerHTML=list.map(o=>`<article class="order"><div class="song"><div class="cover" style="background:${o.gradient}">${o.cover}</div><div class="song-copy"><div class="song-name">${o.song}</div><div class="song-meta">${o.artist} · ${o.album}</div><div class="order-no">${o.id}</div></div></div><div><div class="effects">${o.effects.map(e=>`<div class="effect"><div class="effect-label">预计结果</div><div class="effect-value">${e[0]}<strong>${e[1]}</strong> ${e[2]}</div></div>`).join('')}</div><div class="plan">${o.plan} · ${o.effects.length} 个推广项目</div></div><div class="order-info"><span class="status ${o.status}">${o.statusName}</span><div class="amount">${money(o.amount)}</div><div class="time">${o.date}</div></div><div class="actions">${o.status==='pending'?`<a class="pay-btn" href="${payUrl(o)}">继续支付</a><br>`:''}<a class="detail-link" href="${detailUrl(o)}">查看详情 →</a>${o.status==='pending'?`<br><button class="cancel-link" data-cancel="${o.id}">取消订单</button>`:''}</div></article>`).join('');document.getElementById('empty').style.display=list.length?'none':'block';document.getElementById('countText').textContent=`共 ${list.length} 笔推广订单`;document.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=()=>cancelOrder(btn.dataset.cancel))}document.getElementById('searchInput').addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.status;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script><script src="star-release-shell.js"></script></body></html>
