<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择推广方案 · 星球发行</title>
  <style>
    :root{--brand:#2448ff;--brand-hover:#1839e8;--brand-soft:#e9edff;--page-bg:#f4f6f9;--surface:#fff;--text:#30343a;--strong:#20232a;--muted:#717884;--tertiary:#9aa0aa;--border:#e5e8ee;--border-strong:#d9dde5;--sidebar:244px;--topbar:88px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-width:1100px;min-height:100%;background:var(--page-bg);color:var(--text);font-size:14px}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}svg{display:block}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--border);z-index:20}.brand{height:var(--topbar);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--border)}.brand img{width:120px;height:auto}.nav{padding:6px 12px 24px}.nav-item{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;border-radius:2px;color:#30343a}.nav-item:hover{background:#f6f7fa}.nav-item.active{color:var(--brand);background:var(--brand-soft);font-weight:500}.nav-icon{width:20px;height:20px;flex:0 0 20px}.nav-label{font-size:16px}
    .topbar{position:fixed;top:0;right:0;left:var(--sidebar);height:var(--topbar);display:flex;justify-content:flex-end;align-items:center;padding:0 26px;z-index:15;background:var(--page-bg)}.topbar-actions{display:flex;align-items:center;gap:28px}.topbar-action{display:inline-flex;align-items:center;gap:7px}.topbar-action .icon{width:20px;height:20px}.caret{width:10px;height:10px}
    .workspace{min-height:100vh;margin-left:var(--sidebar);padding-top:var(--topbar)}.page{max-width:1500px;margin:0 auto;padding:0 22px 36px}.progress{height:58px;display:flex;align-items:center;margin-bottom:14px}.progress-step{flex:1;display:flex;align-items:center;gap:10px;color:#9ca2ad;font-size:13px}.progress-step:not(:last-child):after{content:"";height:1px;background:#dce1e9;flex:1;margin:0 16px}.progress-dot{width:26px;height:26px;border:1px solid #d8dde7;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:12px;font-weight:600}.progress-step.done{color:#646b76}.progress-step.done .progress-dot{background:#eef2ff;border-color:#cbd5ff;color:var(--brand)}.progress-step.active{color:var(--strong);font-weight:500}.progress-step.active .progress-dot{background:var(--brand);border-color:var(--brand);color:#fff}
    .card{background:#fff;border:1px solid var(--border-strong);border-radius:4px;box-shadow:0 1px 2px rgba(31,35,48,.02)}.card+.card{margin-top:14px}.summary{min-height:88px;padding:15px 20px;display:flex;align-items:center;gap:14px}.cover{width:52px;height:52px;border-radius:4px;background:linear-gradient(145deg,#5468ff,#8d6af7);display:grid;place-items:center;color:#fff;font-size:19px;font-weight:600}.summary-copy{min-width:0;flex:1}.summary-label{color:#959ba6;font-size:12px;margin-bottom:4px}.summary-name{color:var(--strong);font-size:16px;font-weight:600}.summary-meta{margin-top:4px;color:#848a94;font-size:12px}.goal-tags{display:flex;gap:6px;flex-wrap:wrap;max-width:600px;justify-content:flex-end}.goal-tag{height:26px;display:inline-flex;align-items:center;padding:0 8px;background:#eef2ff;border-radius:3px;color:#596bd8;font-size:12px}
    .plans-card{padding:20px}.plans-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.plans-head h1{margin:0 0 5px;font-size:22px;color:var(--strong);font-weight:600}.plans-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.regen{border:0;background:transparent;color:var(--brand);padding:6px 0;white-space:nowrap}.budget-inline{display:grid;grid-template-columns:168px minmax(300px,1fr) 100px;gap:18px;align-items:center;margin:15px 0 17px;padding:12px 14px;border:1px solid #e6e9ef;border-radius:4px;background:#fafbfc}.budget-label strong{display:block;color:var(--strong);font-size:14px;font-weight:600}.budget-label span{display:block;margin-top:3px;color:#9aa0aa;font-size:11px}.range{width:100%;accent-color:var(--brand);display:block}.range-scale{display:flex;justify-content:space-between;margin-top:4px;color:#a2a8b2;font-size:10px}.budget-value{text-align:right;font-size:23px;font-weight:650;color:var(--brand);white-space:nowrap}.budget-tip{display:flex;align-items:center;gap:7px;margin:-6px 0 14px;color:#858c98;font-size:11px}.budget-tip:before{content:"i";width:15px;height:15px;border:1px solid #aeb5c0;border-radius:50%;display:grid;place-items:center;font-size:10px}
    .plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.plan{position:relative;display:flex;flex-direction:column;min-height:445px;padding:18px;border:1px solid #dfe3ea;border-radius:4px;background:#fff;transition:.15s;cursor:pointer}.plan:hover{border-color:#b7c4ff;box-shadow:0 6px 18px rgba(36,72,255,.08)}.plan.recommended{border-color:#95a8ff;box-shadow:0 0 0 1px rgba(36,72,255,.06)}.plan.selected{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}.recommend-badge{position:absolute;right:13px;top:13px;height:23px;display:inline-flex;align-items:center;padding:0 8px;border-radius:3px;background:#eef2ff;color:var(--brand);font-size:11px}.plan-kicker{font-size:11px;color:#8d939e}.plan-title{margin-top:5px;font-size:18px;font-weight:600;color:var(--strong)}.price{margin-top:10px;font-size:28px;font-weight:650;color:var(--strong)}.price small{font-size:11px;color:#9298a2;font-weight:400;margin-left:3px}.plan-desc{min-height:37px;margin-top:6px;color:#808793;font-size:12px;line-height:1.55}.deliveries{margin-top:13px;border-top:1px solid #edf0f4}.delivery{padding:12px 0;border-bottom:1px solid #edf0f4}.delivery:last-child{border-bottom:0}.delivery-top{display:flex;align-items:center;gap:8px}.platform-logo{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}.delivery-result{color:var(--strong);font-size:14px;font-weight:600}.delivery-result strong{color:var(--brand);font-weight:650}.delivery-service{margin-top:3px;color:#9298a2;font-size:11px}.coverage{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:13px;border-top:1px dashed #dfe3ea;color:#858c96;font-size:12px}.coverage strong{color:#4f5661;font-weight:500}.select-plan{height:36px;margin-top:12px;border:1px solid #cbd5ff;border-radius:4px;background:#fff;color:var(--brand)}.plan.selected .select-plan{background:var(--brand);border-color:var(--brand);color:#fff}
    .custom-card{padding:18px 20px}.custom-entry{display:flex;align-items:center;gap:18px}.custom-copy{flex:1}.custom-copy h3{margin:0 0 5px;color:var(--strong);font-size:16px}.custom-copy p{margin:0;color:#7d8490;font-size:13px}.custom-meta{display:flex;align-items:center;gap:12px}.custom-min{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 11px;border-radius:3px;background:#eef2ff;color:#596bd8;font-size:12px;font-weight:600;white-space:nowrap}.custom-min strong{color:var(--brand);font-size:17px;line-height:1;font-weight:650}.btn{height:36px;padding:0 17px;border-radius:4px}.btn-primary{border:1px solid var(--brand);background:var(--brand);color:#fff}.btn-default{border:1px solid #d7dce5;background:#fff;color:#454b55}.btn-default:hover{border-color:var(--brand);color:var(--brand)}.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.next-area{display:flex;align-items:center;gap:12px}.selection-text{color:#8c929d;font-size:12px}.toast{position:fixed;left:50%;top:30px;z-index:100;transform:translateX(-50%);display:none;padding:10px 18px;border-radius:4px;background:#30343a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}.toast.show{display:block}
    @media(max-width:1240px){.plan-grid{grid-template-columns:1fr}.plan{min-height:auto}.deliveries{display:grid;grid-template-columns:repeat(2,1fr);column-gap:20px}}@media(max-width:1180px){:root{--sidebar:224px}.topbar-actions{gap:20px}.budget-inline{grid-template-columns:1fr}.budget-value{text-align:left}.custom-entry{align-items:flex-start;flex-direction:column}.custom-meta{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <aside class="sidebar"><div class="brand"><img src="https://star.kanjian.com/app/release/images/star-logo.png" alt="星球发行"></div><nav class="nav">
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 10.6 12 3l9 7.6V21h-6v-6H9v6H3V10.6Z"/></svg><span class="nav-label">主页</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="currentColor"/><circle cx="12" cy="12" r="2.3" fill="#fff"/></svg><span class="nav-label">专辑列表</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3.2" y="6.5" width="12.8" height="11" rx="1.5" fill="currentColor"/><path d="M16 9.7 21 7.4v9.2L16 14.3V9.7Z" fill="currentColor"/></svg><span class="nav-label">视频</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4" fill="currentColor"/><path d="M2.8 20c.4-4.1 2.7-6.2 6.2-6.2 3.4 0 5.8 2.1 6.2 6.2H2.8Z" fill="currentColor"/></svg><span class="nav-label">艺人</span></a>
    <a class="nav-item active" href="index.html"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M2.7 13.1c2.8-1.2 4.4-3.4 5.1-6.4 4.9-.3 8.7 1 11.5 4-1 4.7-4 7.6-8.9 8.8-2.8.7-5.3-.1-7.2-2.5 1.1-.9 1.8-2.2 2-3.8-.9.3-1.7.3-2.5-.1Z" fill="currentColor"/><circle cx="14.6" cy="10.2" r="1.2" fill="#fff"/></svg><span class="nav-label">音乐推广</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3" fill="currentColor"/></svg><span class="nav-label">我的版税</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 2.8h10l4 4V21H5V2.8Z" fill="currentColor"/></svg><span class="nav-label">我的合同</span></a>
    <a class="nav-item" href="#"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/></svg><span class="nav-label">销售分析</span></a>
  </nav></aside>
  <header class="topbar"><div class="topbar-actions"><a class="topbar-action" href="#"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.8 9.2a2.4 2.4 0 1 1 4.6 1c-.35.8-1.1 1.2-1.7 1.7-.5.4-.7.9-.7 1.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17.1" r="1" fill="currentColor"/></svg><span>帮助中心</span></a><a class="topbar-action" href="#"><span>简体中文</span><svg class="caret" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4H2Z" fill="currentColor"/></svg></a><a class="topbar-action" href="#"><span>环环</span><svg class="caret" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4H2Z" fill="currentColor"/></svg></a></div></header>
  <main class="workspace"><div class="page">
    <div class="progress"><div class="progress-step done"><span class="progress-dot">✓</span><span>选择歌曲</span></div><div class="progress-step done"><span class="progress-dot">✓</span><span>选择推广目标</span></div><div class="progress-step active"><span class="progress-dot">3</span><span>选择方案与预算</span></div></div>
    <section class="card summary"><div class="cover" id="songCover">夜</div><div class="summary-copy"><div class="summary-label">本次推广</div><div class="summary-name" id="songName">晚风来信</div><div class="summary-meta" id="songMeta">林屿 · 城市漫游</div></div><div class="goal-tags" id="goalTags"></div></section>
    <section class="card plans-card">
      <div class="plans-head"><div><h1>为你推荐 3 个推广组合</h1><p>根据当前推广目标和预算自动组合可执行服务，直接比较预计交付结果。</p></div><button class="regen" id="regenBtn">重新生成组合 ↻</button></div>
      <div class="budget-inline"><div class="budget-label"><strong>我的推广预算</strong><span>拖动后自动重新组合</span></div><div><input class="range" id="budgetRange" type="range" min="500" max="20000" step="100" value="1200"><div class="range-scale"><span>¥500</span><span>¥20,000</span></div></div><div class="budget-value" id="budgetValue">¥1,200</div></div>
      <div class="budget-tip">播放、内容数量、歌单数量等为当前套餐的预计交付规模，实际执行以订单确认信息为准。</div>
      <div class="plan-grid" id="planGrid"></div>
    </section>
    <section class="card custom-card"><div class="custom-entry"><div class="custom-copy"><h3>想自己搭配推广方式？</h3><p>可按当前歌曲和推广目标，自行选择具体推广服务并组合预算。</p></div><div class="custom-meta"><span class="custom-min">最低 <strong>¥499</strong> 起</span><button class="btn btn-default" id="customBtn">自定义推广组合 →</button></div></div></section>
    <div class="actions-row"><button class="btn btn-default" id="backBtn">← 返回上一步</button><div class="next-area"><span class="selection-text" id="selectionText">请选择一个推广方案</span><button class="btn btn-primary" id="nextBtn" disabled>确认方案并继续</button></div></div>
  </div></main>
  <div class="toast" id="toast"></div>
  <script>
    const params=new URLSearchParams(location.search);
    const song={id:params.get('id')||'',title:params.get('title')||'晚风来信',artist:params.get('artist')||'林屿',album:params.get('album')||'城市漫游',cover:params.get('cover')||'夜'};
    const goalNames={plays:'增加歌曲播放',playlist:'进入更多歌单',social:'短视频 / 内容传播',global:'推广到海外',chart:'提升热度 / 冲榜',ktv:'上架到 KTV'};
    let goals=(params.get('goals')||'plays,playlist,social').split(',').filter(Boolean);if(!goals.length)goals=['plays'];
    document.getElementById('songName').textContent=song.title;document.getElementById('songMeta').textContent=[song.artist,song.album].filter(Boolean).join(' · ');document.getElementById('songCover').textContent=song.cover;document.getElementById('goalTags').innerHTML=goals.map(g=>`<span class="goal-tag">${goalNames[g]||g}</span>`).join('');
    const colors={'网易云':'#e94b3c','QQ音乐':'#20a6ff','酷狗':'#2d8cff','抖音':'#222','小红书':'#ff4058','Spotify':'#24c269','YouTube':'#ff3b30','KTV':'#7c62d9'};
    const catalog={plays:[{p:'网易云',label:'播放推广',base:2.0,unit:'播放',prefix:'预计 +'},{p:'QQ音乐',label:'播放推广',base:1.65,unit:'播放',prefix:'预计 +'},{p:'酷狗',label:'播放推广',base:1.4,unit:'播放',prefix:'预计 +'}],playlist:[{p:'QQ音乐',label:'歌单推广',base:.004,unit:'个歌单',prefix:'预计 '},{p:'网易云',label:'歌单推广',base:.003,unit:'个歌单',prefix:'预计 '},{p:'酷狗',label:'歌单推广',base:.003,unit:'个歌单',prefix:'预计 '}],social:[{p:'抖音',label:'内容推广',base:.012,unit:'条内容',prefix:'预计 '},{p:'小红书',label:'KOC 内容推广',base:.007,unit:'篇内容',prefix:'预计 '}],global:[{p:'Spotify',label:'海外广告推广',base:18,unit:'次触达',prefix:'预计 '},{p:'YouTube',label:'视频广告推广',base:12,unit:'次触达',prefix:'预计 '}],chart:[{p:'QQ音乐',label:'热度资源',base:.003,unit:'组资源',prefix:'预计 '},{p:'酷狗',label:'榜单推广',base:.003,unit:'组资源',prefix:'预计 '}],ktv:[{p:'KTV',label:'制作上架',base:1,unit:'首歌曲',prefix:''}]};
    const money=n=>'¥'+n.toLocaleString('zh-CN');function price99(n){return Math.max(499,Math.min(19999,Math.round((n+1)/100)*100-1))}function tierPrices(b){let a=price99(b*.65),m=price99(b),h=price99(b*1.35);if(m<=a)m=Math.min(19999,a+200);if(h<=m)h=Math.min(19999,m+300);if(h===m&&h===19999){m=17999;if(a>=m)a=14999}return[a,m,h]}function formatQty(v,unit){if(unit.includes('触达'))return Math.max(1000,Math.round(v/1000)*1000).toLocaleString();if(unit.includes('播放'))return Math.max(600,Math.round(v/100)*100).toLocaleString();return Math.max(1,Math.round(v)).toLocaleString()}
    function buildDeliveries(price,tier){let pool=[];goals.forEach((g,gi)=>{const opts=catalog[g]||[];if(opts.length){const pick=opts[(tier+gi)%opts.length];pool.push({...pick,goal:g})}});const extraGoal=goals.find(g=>(catalog[g]||[]).length>1);if(tier===2&&extraGoal){const opts=catalog[extraGoal];pool.push({...opts[1],goal:extraGoal})}const max=tier===0?Math.min(2,pool.length):tier===1?Math.min(3,pool.length):Math.min(4,pool.length);pool=pool.slice(0,max);const share=price/Math.max(pool.length,1);return pool.map(x=>({...x,qty:formatQty(x.goal==='ktv'?1:share*x.base*(tier===2?1.06:1),x.unit)}))}
    let selectedPlan=1;function renderPlans(){const b=Number(document.getElementById('budgetRange').value),prices=tierPrices(b);document.getElementById('budgetValue').textContent=money(b);const defs=[['起步推广','用更低预算优先获得最明确的推广动作'],['均衡推广','尽可能覆盖当前选择的推广目标'],['加强推广','覆盖目标后继续强化重点平台投入']];document.getElementById('planGrid').innerHTML=defs.map((d,i)=>{const dels=buildDeliveries(prices[i],i);return `<article class="plan ${i===1?'recommended selected':''}" data-index="${i}" data-price="${prices[i]}">${i===1?'<span class="recommend-badge">推荐</span>':''}<div class="plan-kicker">方案 ${i+1}</div><div class="plan-title">${d[0]}</div><div class="price">${money(prices[i])}<small>/ 次</small></div><div class="plan-desc">${d[1]}</div><div class="deliveries">${dels.map(x=>`<div class="delivery"><div class="delivery-top"><span class="platform-logo" style="background:${colors[x.p]||'#6f7785'}">${x.p==='QQ音乐'?'Q':x.p.slice(0,1)}</span><div><div class="delivery-result">${x.prefix}<strong>${x.qty}</strong> ${x.unit}</div><div class="delivery-service">${x.p} · ${x.label}</div></div></div></div>`).join('')}</div><div class="coverage"><span>目标覆盖</span><strong>${Math.min(goals.length,dels.length)} / ${goals.length} 个</strong></div><button class="select-plan">${i===1?'已选择':'选择此方案'}</button></article>`}).join('');bindPlans(1)}
    function bindPlans(defaultIndex){selectedPlan=defaultIndex;document.querySelectorAll('.plan').forEach(el=>el.addEventListener('click',()=>{selectedPlan=Number(el.dataset.index);document.querySelectorAll('.plan').forEach((x,j)=>{x.classList.toggle('selected',j===selectedPlan);x.querySelector('.select-plan').textContent=j===selectedPlan?'已选择':'选择此方案'});syncNext()}));syncNext()}
    function syncNext(){const el=document.querySelector(`.plan[data-index="${selectedPlan}"]`);document.getElementById('nextBtn').disabled=!el;document.getElementById('selectionText').textContent=el?`已选 ${el.querySelector('.plan-title').textContent} · ${money(Number(el.dataset.price))}`:'请选择一个推广方案'}
    document.getElementById('budgetRange').addEventListener('input',renderPlans);document.getElementById('regenBtn').addEventListener('click',()=>{renderPlans();toast('已根据当前预算重新生成组合')});document.getElementById('customBtn').addEventListener('click',()=>{const p=new URLSearchParams({...song,goals:goals.join(',')});location.href='custom-combination.html?'+p.toString()});document.getElementById('backBtn').addEventListener('click',()=>history.back());document.getElementById('nextBtn').addEventListener('click',()=>{const p=new URLSearchParams({...song,goals:goals.join(','),plan:String(selectedPlan),budget:document.getElementById('budgetRange').value});location.href='order-confirm.html?'+p.toString()});
    function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}renderPlans();
  </script>
</body>
</html>
