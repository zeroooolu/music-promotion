<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专辑列表 · 星球发行</title>
<link rel="stylesheet" href="star-release-shell.css">
<style>
:root{--brand:#2448ff;--page:#f4f6f9;--text:#30343a;--strong:#20232a;--muted:#777e88;--tertiary:#9aa0aa;--border:#e5e8ee;--border2:#d9dde5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:1100px;min-height:100%;background:var(--page);color:var(--text);font-size:14px}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}svg{display:block}.page{padding:0 24px 36px}.card{background:#fff;border:1px solid var(--border);border-radius:4px}.album-card{padding:24px 24px 0}.album-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.album-head h1{margin:0;color:var(--strong);font-size:18px;font-weight:600}.create-btn{height:40px;padding:0 20px;border:1px solid var(--brand);border-radius:4px;background:var(--brand);color:#fff}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px 20px;padding-bottom:22px}.field label{display:block;margin-bottom:8px;color:#6f737b;font-size:13px}.field input{width:100%;height:32px;border:1px solid #d9dde5;border-radius:3px;padding:0 10px;outline:0}.field input:focus{border-color:var(--brand)}.filter-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px;margin-top:-2px}.filter-btn{height:32px;padding:0 16px;border-radius:4px}.reset{border:1px solid #d6dae1;background:#fff;color:#555c66}.search{border:1px solid var(--brand);background:var(--brand);color:#fff}.table-wrap{margin:0 -24px}.album-table{width:100%;border-collapse:collapse;table-layout:fixed}.album-table th{height:40px;padding:0 12px;background:#f0f1f3;color:#4f5359;text-align:left;font-size:12px;font-weight:600}.album-table td{padding:8px 12px;border-bottom:1px solid #e8ebef;vertical-align:top}.album-table tbody tr:nth-child(even){background:#fafbfc}.album-info{display:flex;gap:10px;min-width:0}.cover{width:76px;height:76px;border-radius:2px;display:grid;place-items:center;flex:none;color:#fff;font-size:18px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.album-copy{min-width:0}.album-name{color:var(--brand);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album-upc,.track-count{margin-top:6px;color:#707782;font-size:12px}.extra-line{color:#727985;font-size:12px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.extra-line+.extra-line{margin-top:5px}.license{display:inline-flex;align-items:center;gap:7px;color:#6b727d;font-size:12px}.license:before{content:"";width:8px;height:8px;border-radius:2px;background:#2448ff}.license.bad:before{background:#ff2020}.release-tags{display:flex;flex-wrap:wrap;gap:6px}.release-tag{height:24px;display:inline-flex;align-items:center;padding:0 8px;border-radius:4px;border:1px solid}.release-tag.live{border-color:#d6efc9;background:#f1fbea;color:#67bf46}.release-tag.progress{border-color:#cad6ff;background:#eef2ff;color:#2448ff}.release-tag.off{border-color:#e1e3e7;background:#f5f5f6;color:#a0a5ad}.audit-fail{color:#ee2c2c;font-size:12px;line-height:1.7}.ops{display:flex;align-items:center;justify-content:flex-end;gap:12px;white-space:nowrap}.view-link{color:var(--brand);font-size:12px}.toast{position:fixed;left:50%;top:28px;transform:translateX(-50%);display:none;padding:10px 16px;border-radius:4px;background:#30343a;color:#fff;z-index:100}.toast.show{display:block}@media(max-width:1180px){.page{padding-left:18px;padding-right:18px}.filters{grid-template-columns:1fr 1fr}.field:nth-child(3){grid-column:1/2}.table-wrap{margin:0 -18px}}
</style>
</head>
<body>
<aside class="sidebar"></aside><header class="topbar"></header>
<main class="workspace"><div class="page"><section class="card album-card"><div class="album-head"><h1>专辑列表</h1><button class="create-btn">创建专辑</button></div><div class="filters"><div class="field"><label>专辑名称</label><input id="albumName"></div><div class="field"><label>UPC</label><input id="upc"></div><div class="field"><label>厂牌/唱片公司</label><input id="labelName"></div><div class="field"><label>主要表演者</label><input id="artist"></div><div class="filter-actions"><button class="filter-btn reset" id="resetBtn">重置</button><button class="filter-btn search" id="searchBtn">搜索</button></div></div><div class="table-wrap"><table class="album-table"><colgroup><col style="width:20%"><col style="width:20%"><col style="width:14%"><col style="width:26%"><col style="width:20%"></colgroup><thead><tr><th>专辑信息</th><th>附加信息</th><th>授权状态</th><th>发行状态</th><th style="text-align:right">操作</th></tr></thead><tbody id="albumRows"></tbody></table></div></section></div></main><div class="toast" id="toast"></div>
<script>
const albums=[
{id:'ALB-001',name:'城市漫游',upc:'6936740285619',tracks:3,artist:'林屿',label:'看见音乐',date:'2026.06.20',cover:'城',gradient:'linear-gradient(145deg,#5368ff,#8d6af7)',licensed:true,live:17,progress:3,off:1,promotable:true},
{id:'ALB-002',name:'如果海知道',upc:'6936740217160',tracks:1,artist:'沈禾',label:'看见音乐',date:'2026.05.16',cover:'海',gradient:'linear-gradient(145deg,#27a9df,#39c6bb)',licensed:true,live:34,progress:6,off:0,promotable:true},
{id:'ALB-003',name:'沿途',upc:'6936740242391',tracks:2,artist:'周棠',label:'看见音乐',date:'2026.04.30',cover:'慢',gradient:'linear-gradient(145deg,#e08084,#ca93bd)',licensed:true,live:19,progress:2,off:1,promotable:true},
{id:'ALB-004',name:'Daylight Again',upc:'6936740234332',tracks:1,artist:'Noah Chen',label:'Sunset Records',date:'2026.07.28',cover:'D',gradient:'linear-gradient(145deg,#f09d55,#ef6f78)',licensed:true,live:20,progress:4,off:0,promotable:true},
{id:'ALB-005',name:'凌晨三点',upc:'6936740201998',tracks:1,artist:'Miro',label:'看见音乐',date:'2026.03.12',cover:'夜',gradient:'linear-gradient(145deg,#38445e,#776c9d)',licensed:true,live:18,progress:3,off:0,promotable:true},
{id:'ALB-006',name:'未完成的夏天',upc:'—',tracks:5,artist:'—',label:'—',date:'—',cover:'夏',gradient:'linear-gradient(145deg,#d5a964,#8d7048)',licensed:false,auditFail:'审核未通过，请修改信息后重新提交！',promotable:false}
];
const $=id=>document.getElementById(id);function releaseHtml(a){if(a.auditFail)return `<div class="audit-fail">${a.auditFail}</div>`;return `<div class="release-tags">${a.live?`<span class="release-tag live">${a.live} 已上架</span>`:''}${a.off?`<span class="release-tag off">${a.off} 已下架</span>`:''}${a.progress?`<span class="release-tag progress">${a.progress} 进行中</span>`:''}</div>`}function render(){const n=$('albumName').value.trim().toLowerCase(),u=$('upc').value.trim().toLowerCase(),l=$('labelName').value.trim().toLowerCase(),ar=$('artist').value.trim().toLowerCase();const list=albums.filter(a=>(!n||a.name.toLowerCase().includes(n))&&(!u||a.upc.toLowerCase().includes(u))&&(!l||a.label.toLowerCase().includes(l))&&(!ar||a.artist.toLowerCase().includes(ar)));$('albumRows').innerHTML=list.map(a=>`<tr><td><div class="album-info"><div class="cover" style="background:${a.gradient}">${a.cover}</div><div class="album-copy"><div class="album-name">${a.name}</div><div class="album-upc">${a.upc}</div><div class="track-count">${a.tracks} 首</div></div></div></td><td><div class="extra-line">表演者：${a.artist}</div><div class="extra-line">厂牌：${a.label}</div><div class="extra-line">首发日期：${a.date}</div></td><td><span class="license ${a.licensed?'':'bad'}">${a.licensed?'已授权':'未授权'}</span></td><td>${releaseHtml(a)}</td><td><div class="ops"><a class="view-link" href="#">查看</a></div></td></tr>`).join('')||'<tr><td colspan="5" style="padding:48px;text-align:center;color:#9aa0aa">没有找到符合条件的专辑</td></tr>'}
$('searchBtn').onclick=render;$('resetBtn').onclick=()=>{$('albumName').value='';$('upc').value='';$('labelName').value='';$('artist').value='';render()};render();
</script>
<script src="star-release-shell.js"></script>
</body></html>
