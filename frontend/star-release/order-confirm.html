let useBalance=true;function sync(){const deduct=useBalance?Math.min(balance,total):0,due=total-deduct;document.getElementById('topTotal').textContent=money(total);document.getElementById('billTotal').textContent=money(total);document.getElementById('billDeduct').textContent='- '+money(deduct);document.getElementById('payDue').textContent=money(due);document.getElementById('balanceAvailable').textContent='当前可用 '+money(balance);document.getElementById('balanceAfter').textContent=useBalance?'抵扣后可提现余额 '+money(balance-deduct):'本次不使用可提现余额';document.getElementById('balanceToggle').classList.toggle('on',useBalance);document.getElementById('submitBtn').textContent=useBalance?(due>0?'提交订单并支付 '+money(due):'确认抵扣并提交订单'):'提交订单并支付 '+money(total)}
