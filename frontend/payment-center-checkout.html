<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>统一收银台</title>
<style>
:root{--brand:#612fff;--brand-hover:#5124dc;--ink:#17191c;--muted:#6f7682;--line:#e5e7eb;--field:#f8f9fb;--summary:#fafafa;--success:#128a4d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.page{min-height:100vh;display:grid;grid-template-columns:minmax(420px,.9fr) minmax(560px,1.1fr)}.summary-panel{grid-column:1;grid-row:1;padding:58px 72px;background:var(--summary);border-right:1px solid var(--line);display:flex;justify-content:flex-end}.summary-inner{width:min(100%,460px)}.checkout-panel{grid-column:2;padding:54px 72px;display:flex;justify-content:flex-start}.checkout-inner{width:min(100%,540px)}h1{font-size:24px;margin:0 0 24px}.summary-title{font-size:14px;font-weight:700;margin:0 0 24px}.order-item{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.cover{width:58px;height:72px;border:1px solid #d7dbe1;border-radius:4px;background:linear-gradient(145deg,#fff 0 22%,#eeeafc 22% 56%,#ddd7fa 56%);position:relative;box-shadow:0 4px 12px rgba(23,25,28,.08)}.cover:before{content:"MUSIC";position:absolute;top:9px;left:7px;font-size:7px;font-weight:800;letter-spacing:.12em}.cover:after{content:"PROMOTION";position:absolute;bottom:10px;left:7px;font-size:6px;font-weight:700}.item-name{font-size:13px;font-weight:650}.item-desc{font-size:11px;color:#828894;margin-top:5px}.item-price{font-size:13px;font-weight:650;white-space:nowrap}.summary-row{display:flex;justify-content:space-between;gap:20px;font-size:13px;padding:16px 0;border-bottom:1px solid var(--line)}.summary-row span{color:#686f7a}.summary-row.discount strong{color:#168653}.total{display:flex;justify-content:space-between;gap:24px;padding-top:22px}.total-label{font-size:13px;font-weight:650}.total-amount{text-align:right}.total-amount strong{display:block;font-size:22px}.total-amount span{display:block;color:#747b86;font-size:11px;margin-top:5px}.trust{margin-top:32px;color:#878e98;font-size:11px;line-height:1.6}.express-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.express-btn{height:46px;border-radius:5px;font-weight:700;font-size:15px}.express-btn.apple{border:1px solid #000;background:#000;color:#fff}.express-btn.google{border:1px solid #d9dde3;background:#fff;color:#202124}.divider{display:flex;align-items:center;gap:14px;color:#8a909a;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.methods{border:1px solid var(--line);border-radius:8px;overflow:hidden}.method{border-bottom:1px solid var(--line)}.method:last-child{border-bottom:0}.method-head{width:100%;min-height:62px;display:grid;grid-template-columns:22px 42px 1fr auto;align-items:center;gap:12px;padding:13px 16px;border:0;background:#fff;text-align:left}.radio{width:18px;height:18px;border:2px solid #9aa1ac;border-radius:50%;position:relative}.method.active .radio{border-color:var(--brand)}.method.active .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}.logo{width:42px;height:30px;border-radius:4px;background:#f2f3f6;display:grid;place-items:center;font-size:11px;font-weight:800}.method-name{font-size:14px;font-weight:650}.method-side{font-size:11px;color:#7a818d}.method-body{display:none;padding:0 16px 18px 58px}.method.active .method-body{display:block}.field{margin-top:12px}.field label{display:block;font-size:12px;margin-bottom:7px}.input{width:100%;height:42px;border:1px solid #dfe3e8;border-radius:6px;background:var(--field);padding:0 12px;outline:0}.input:focus{border-color:var(--brand);background:#fff}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{padding:13px;border-radius:6px;background:#f7f7fa;color:#555d68;font-size:12px;line-height:1.55}.pay-btn{width:100%;height:44px;border:0;border-radius:5px;background:var(--brand);color:#fff;font-weight:700;margin-top:18px}.pay-btn:hover{background:var(--brand-hover)}.pay-btn:disabled{opacity:.65;cursor:wait}.qr{width:150px;height:150px;margin:8px auto;background:repeating-linear-gradient(45deg,#111 0 5px,#fff 5px 10px);border:10px solid #fff;box-shadow:0 0 0 1px #e5e7eb}.qr-copy{text-align:center;font-size:12px;color:#5e6570}.processing{display:none;margin-top:12px;color:var(--success);font-size:12px}.processing.show{display:block}@media(max-width:980px){.page{grid-template-columns:1fr}.summary-panel{grid-column:1;padding:28px 22px;border-right:0;border-bottom:1px solid var(--line);justify-content:center}.checkout-panel{grid-column:1;padding:32px 22px 48px;justify-content:center}.summary-inner,.checkout-inner{width:min(100%,540px)}}
</style>
</head>
<body>
<main class="page">
<aside class="summary-panel"><div class="summary-inner"><h2 class="summary-title">订单摘要</h2><div class="order-item"><div class="cover"></div><div><div class="item-name" id="orderTitle">音乐推广订单</div><div class="item-desc" id="orderDesc">推广服务 · 订单已创建</div></div><div class="item-price" id="orderTotal">¥0</div></div><div class="summary-row"><span>订单号</span><strong id="orderNo">KJ202608190001</strong></div><div class="summary-row discount" id="deductRow"><span>余额抵扣</span><strong id="deductAmount">- ¥0</strong></div><div class="total"><div class="total-label">应付总额</div><div class="total-amount"><strong id="payAmount">¥0</strong><span>一次性付款</span></div></div><div class="trust">请确认订单信息后完成支付。支付方式由 Payment Center 根据当前订单动态提供，最终支付结果以服务端确认状态为准。</div></div></aside>
<section class="checkout-panel"><div class="checkout-inner"><h1>选择支付方式</h1><div class="express-grid"><button class="express-btn apple" data-pay="Apple Pay"> Pay</button><button class="express-btn google" data-pay="Google Pay">Google Pay</button></div><div class="divider">或选择其他方式</div><div class="methods">
<section class="method active" data-method="银行卡"><button class="method-head"><span class="radio"></span><span class="logo">CARD</span><span class="method-name">银行卡</span><span class="method-side">Visa · Mastercard · Amex · UnionPay</span></button><div class="method-body"><div class="field"><label>邮箱</label><input class="input" type="email" placeholder="name@example.com"></div><div class="field"><label>银行卡信息</label><input class="input" id="cardNumber" placeholder="1234 1234 1234 1234"></div><div class="split"><div class="field"><input class="input" placeholder="MM / YY"></div><div class="field"><input class="input" placeholder="CVC"></div></div><button class="pay-btn" data-pay="银行卡">立即支付</button></div></section>
<section class="method" data-method="PayPal"><button class="method-head"><span class="radio"></span><span class="logo">P</span><span class="method-name">PayPal</span><span class="method-side">跳转支付</span></button><div class="method-body"><div class="note">点击支付后将跳转至 PayPal 完成授权，返回后系统会确认最终支付结果。</div><button class="pay-btn" data-pay="PayPal">使用 PayPal 支付</button></div></section>
<section class="method" data-method="支付宝"><button class="method-head"><span class="radio"></span><span class="logo">支</span><span class="method-name">支付宝</span><span class="method-side">扫码支付</span></button><div class="method-body"><div class="qr"></div><div class="qr-copy">请使用支付宝 App 扫码完成付款</div><button class="pay-btn" data-pay="支付宝">演示支付成功</button></div></section>
<section class="method" data-method="微信支付"><button class="method-head"><span class="radio"></span><span class="logo">微</span><span class="method-name">微信支付</span><span class="method-side">扫码支付</span></button><div class="method-body"><div class="qr"></div><div class="qr-copy">请使用微信扫码完成付款</div><button class="pay-btn" data-pay="微信支付">演示支付成功</button></div></section>
</div><div class="processing" id="processing">正在提交支付并确认结果，请勿重复操作…</div></div></section>
</main>
<script>
const p=new URLSearchParams(location.search),money=n=>'¥'+Math.max(0,Math.round(Number(n)||0)).toLocaleString('zh-CN');const amount=Number(p.get('amount')||0),orderTotal=Number(p.get('order_total')||amount),deduct=Number(p.get('balance_deduct')||0),source=p.get('source')||'standalone',orderNo=p.get('order_no')||'KJ202608190001',title=p.get('title')||'音乐推广订单',plan=p.get('plan_name')||'推广组合';document.getElementById('orderTitle').textContent=title;document.getElementById('orderDesc').textContent=plan+' · 推广服务';document.getElementById('orderTotal').textContent=money(orderTotal);document.getElementById('orderNo').textContent=orderNo;document.getElementById('deductAmount').textContent='- '+money(deduct);document.getElementById('deductRow').style.display=deduct>0?'flex':'none';document.getElementById('payAmount').textContent=money(amount);
document.querySelectorAll('.method').forEach(m=>m.querySelector('.method-head').onclick=()=>document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x===m)));
function pay(method){document.querySelectorAll('[data-pay]').forEach(b=>b.disabled=true);document.getElementById('processing').classList.add('show');const q=new URLSearchParams({status:'success',source,order_no:orderNo,title,plan_name:plan,order_total:String(orderTotal),balance_deduct:String(deduct),paid_amount:String(amount),method});setTimeout(()=>location.href='payment-success.html?'+q.toString(),900)}document.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>pay(b.dataset.pay)));const card=document.getElementById('cardNumber');card.addEventListener('input',()=>{const v=card.value.replace(/\D/g,'').slice(0,16);card.value=v.replace(/(.{4})/g,'$1 ').trim()});
</script>
</body></html>
