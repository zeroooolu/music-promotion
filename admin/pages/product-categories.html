<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品类目｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/product-categories.css">
</head>
<body data-admin-page="categories" data-page-title="产品类目">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="page-header">
    <div><h1>产品类目</h1></div>
    <a class="pc-btn pc-btn-primary" href="product-category-form.html">＋ 新增类目</a>
  </div>

  <div class="pc-toolbar">
    <div class="pc-filters">
      <input class="pc-input" id="categorySearch" placeholder="搜索类目名称 / 描述 / 标识">
      <select class="pc-select" id="statusFilter"><option value="all">全部状态</option><option value="on">启用</option><option value="off">停用</option></select>
      <button class="pc-btn pc-btn-secondary" id="resetBtn" type="button">重置</button>
    </div>
    <div style="font-size:12px;color:#93a0b0">共 <span id="categoryCount">0</span> 个类目</div>
  </div>

  <section class="pc-card">
    <div class="pc-table-wrap">
      <table class="pc-table" id="categoryTable">
        <thead><tr><th style="width:200px">类目名称</th><th>描述</th><th style="width:170px">多语言</th><th style="width:80px">产品</th><th style="width:80px">方案</th><th style="width:80px">排序</th><th style="width:90px">状态</th><th style="width:150px">更新时间</th><th style="width:150px">操作</th></tr></thead>
        <tbody id="categoryRows"></tbody>
      </table>
    </div>
    <div class="pc-pagination"><span id="rangeText">显示 0，共 0 条</span><div class="pc-pages"><span class="pc-page">‹</span><span class="pc-page active">1</span><span class="pc-page">›</span></div></div>
  </section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script>
const search=document.getElementById('categorySearch');
const status=document.getElementById('statusFilter');
const rows=document.getElementById('categoryRows');
const count=document.getElementById('categoryCount');
const rangeText=document.getElementById('rangeText');

function languageSummary(category){
  const completed=PRODUCT_CATEGORY_LANGUAGES.filter(language=>category.names[language.key]||category.descriptions?.[language.key]).length;
  return `<div class="pc-name">${completed} / ${PRODUCT_CATEGORY_LANGUAGES.length}</div><div class="pc-code">${PRODUCT_CATEGORY_LANGUAGES.map(language=>language.shortLabel).join(' · ')}</div>`;
}

function render(){
  const q=(search.value||'').trim().toLowerCase();
  const filtered=PRODUCT_CATEGORIES.filter(category=>{
    const searchable=[category.id,...Object.values(category.names),...Object.values(category.descriptions||{})].join(' ').toLowerCase();
    const hit=!q||searchable.includes(q);
    const statusHit=status.value==='all'||category.status===status.value;
    return hit&&statusHit;
  });

  rows.innerHTML=filtered.map(category=>`
    <tr>
      <td><div class="pc-name">${category.names.zhCN}</div><div class="pc-code">${category.id} · ${category.names.en}</div></td>
      <td><div class="pc-desc">${category.descriptions?.zhCN||'—'}</div></td>
      <td>${languageSummary(category)}</td>
      <td><span class="pc-count">${category.products}</span></td>
      <td><span class="pc-count">${category.plans}</span></td>
      <td>${category.sort}</td>
      <td><span class="pc-status${category.status==='off'?' off':''}">${category.status==='on'?'启用':'停用'}</span></td>
      <td>${category.updated}</td>
      <td><a class="pc-link" href="product-category-detail.html?id=${encodeURIComponent(category.id)}">查看</a><a class="pc-link" href="product-category-form.html?mode=edit&id=${encodeURIComponent(category.id)}">编辑</a></td>
    </tr>
  `).join('');

  if(!filtered.length){
    rows.innerHTML='<tr><td colspan="9" style="text-align:center;color:#97a3b3;padding:36px 16px">暂无符合条件的类目</td></tr>';
  }
  count.textContent=filtered.length;
  rangeText.textContent=`显示 ${filtered.length}，共 ${filtered.length} 条`;
}

search.addEventListener('input',render);
status.addEventListener('change',render);
document.getElementById('resetBtn').addEventListener('click',()=>{search.value='';status.value='all';render();});
render();
</script>
</body>
</html>
