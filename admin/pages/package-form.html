<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑推广套餐｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css">
<style>
[hidden]{display:none!important}.pk-layout{display:grid;gap:14px}.pk-card{background:#fff;border:1px solid #d9dde2;border-radius:8px;overflow:visible}.pk-card-head{min-height:54px;padding:0 18px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between;gap:12px}.pk-card-head h2{margin:0;font-size:15px}.pk-card-body{padding:18px}.pk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.pk-field.full{grid-column:1/-1}.pk-field label{display:block;margin-bottom:7px;color:#536277;font-size:12px;font-weight:500}.pk-field input,.pk-field select,.pk-field textarea{width:100%;height:38px;border:1px solid #d4dae1;border-radius:4px;background:#fff;color:#3e4b5c;padding:0 10px;outline:0}.pk-field textarea{height:auto;min-height:72px;padding:9px 10px;resize:vertical}.pk-field input:focus,.pk-field select:focus,.pk-field textarea:focus{border-color:#2448ff;box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pk-help{margin-top:6px;color:#99a3af;font-size:11px;line-height:1.55}.pk-money{position:relative}.pk-money span{position:absolute;left:10px;top:10px;color:#7f8995}.pk-money input{padding-left:27px}.pk-builder-item{border:1px solid #dde2e8;border-radius:6px;overflow:hidden;background:#fff}.pk-builder-item+.pk-builder-item{margin-top:10px}.pk-builder-head{min-height:48px;padding:8px 13px;background:#f8f9fb;border-bottom:1px solid #e9ecef;display:flex;align-items:center;justify-content:space-between;gap:12px}.pk-builder-title{display:flex;align-items:center;gap:8px;color:#3d4652;font-size:13px;font-weight:600}.pk-index{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#2448ff;font-size:10px}.pk-relation{height:20px;display:inline-flex;align-items:center;padding:0 7px;border-radius:10px;background:#eef2ff;color:#2448ff;font-size:9px}.pk-actions-inline{display:flex;gap:8px}.pk-text-btn{border:0;background:transparent;color:#778492;font-size:11px}.pk-builder-body{padding:14px}.pk-item-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.pk-item-field label{display:block;margin-bottom:6px;color:#7f8b98;font-size:11px}.pk-item-field input,.pk-item-field select{width:100%;height:34px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;color:#445162;background:#fff;font-size:12px}.pk-option-wrap{margin-top:13px;padding-top:12px;border-top:1px solid #edf0f3}.pk-option-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.pk-option-head strong{color:#667487;font-size:11px}.pk-option-row{display:grid;grid-template-columns:120px minmax(170px,1fr) minmax(190px,1fr) minmax(230px,1.4fr) 110px 28px;gap:8px;align-items:center;padding:6px 0}.pk-option-row select,.pk-option-row input{width:100%;height:32px;border:1px solid #d6dbe2;border-radius:4px;padding:0 7px;color:#465260;background:#fff;font-size:11px;min-width:0}.pk-option-row .pk-addon{position:relative}.pk-option-row .pk-addon span{position:absolute;left:7px;top:8px;color:#9aa3ad;font-size:10px}.pk-option-row .pk-addon input{padding-left:20px}.pk-remove-option{width:28px;height:28px;border:0;background:transparent;color:#a2aab4;font-size:16px}.pk-add{height:32px;padding:0 11px;border:1px solid #cbd5ff;border-radius:4px;background:#fff;color:#2448ff}.pk-add-content{width:100%;height:40px;margin-top:12px;border:1px dashed #bfc8d4;border-radius:5px;background:#fafbfc;color:#52647a}.pk-preview-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}.pk-preview-help{color:#788595;font-size:12px;line-height:1.8}.pk-preview-card{position:relative;min-height:360px;padding:20px 20px 76px;border:1px solid #d9dde5;border-radius:4px;background:#fff}.pk-preview-badge{position:absolute;right:15px;top:15px;padding:4px 7px;border-radius:3px;background:#2448ff;color:#fff;font-size:10px}.pk-preview-title{color:#20232a;font-size:17px;font-weight:600}.pk-preview-list{display:grid;gap:9px;margin-top:18px}.pk-preview-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;color:#515966;font-size:11px;line-height:18px}.pk-check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#2448ff;font-size:9px;font-weight:700}.pk-preview-fit{margin-top:14px;padding-top:11px;border-top:1px dashed #e7eaf0;color:#8a919b;font-size:11px}.pk-preview-fit strong{color:#4c5460}.pk-preview-note{margin-top:8px;color:#9299a4;font-size:10px}.pk-preview-foot{position:absolute;left:20px;right:20px;bottom:18px}.pk-preview-foot small{display:block;color:#9aa0aa;font-size:10px}.pk-preview-foot b{display:block;margin-top:2px;font-size:22px;color:#20232a}.pk-form-actions{position:sticky;bottom:0;z-index:10;margin-top:14px;padding:12px 16px;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);display:flex;justify-content:flex-end;gap:9px}.pk-toast{position:fixed;left:50%;top:24px;z-index:100;transform:translateX(-50%);display:none;padding:10px 16px;background:#30343a;color:#fff;border-radius:4px;font-size:12px}.pk-toast.show{display:block}@media(max-width:1100px){.pk-option-row{grid-template-columns:1fr 1fr}.pk-preview-grid{grid-template-columns:1fr}}@media(max-width:800px){.pk-grid,.pk-item-grid{grid-template-columns:1fr}.pk-field.full{grid-column:auto}}
</style></head>
<body data-admin-page="packages" data-page-title="推广套餐 / 编辑"><div id="admin-shell"></div>
<template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div><div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1></div></div>
<div class="pk-layout">
<section class="pk-card"><div class="pk-card-head"><h2>套餐信息</h2></div><div class="pk-card-body"><div class="pk-grid"><div class="pk-field"><label>套餐编号</label><input id="packageCode"></div><div class="pk-field"><label>套餐名称</label><input id="name"></div><div class="pk-field"><label>适合</label><input id="fit" placeholder="例如：短期起量"></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option value="">不展示</option><option value="推荐">推荐</option></select></div><div class="pk-field"><label>套餐售价</label><div class="pk-money"><span>¥</span><input id="price" type="number"></div></div><div class="pk-field"><label>排序</label><input id="sort" type="number"></div><div class="pk-field"><label>状态</label><select id="status"><option>上架</option><option>下架</option></select></div><div class="pk-field full"><label>价格补差说明（可选）</label><input id="note" placeholder="例如：进阶补差 ¥8,600 · 高级补差 ¥25,700"></div></div></div></section>
<section class="pk-card"><div class="pk-card-head"><div><h2>套餐包含内容</h2></div><button class="pk-add" id="addContentTop" type="button">＋ 添加内容</button></div><div class="pk-card-body"><div class="pk-help" style="margin:0 0 12px">每一项先配置前台套餐卡片显示的内容，再配置确认订单时实际执行的选项。执行来源可以引用现有产品/规格，也可以配置为套餐专属内容。</div><div id="builder"></div><button class="pk-add-content" id="addContent" type="button">＋ 添加一个套餐内容</button></div></section>
<section class="pk-card"><div class="pk-card-head"><h2>前台套餐卡片预览</h2></div><div class="pk-card-body"><div class="pk-preview-grid"><div class="pk-preview-help">预览内容与当前星球发行前台保持同一结构：<strong>套餐名称 + 推荐标记 + 套餐包含 + 关系 tag + 适合 + 套餐价</strong>。<br><br>这里不再单独配置“前台亮点”“前台套餐名称”等重复字段。</div><div class="pk-preview-card" id="previewCard"></div></div></div></section>
</div>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存套餐</button></div><div class="pk-toast" id="toast">套餐已保存（原型）</div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script src="../assets/js/package-catalog-data.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');
const params=new URLSearchParams(location.search),mode=params.get('mode')||'new',sourceId=params.get('id')||'popular-1',source=getAdminPackage(sourceId);
let current=source?JSON.parse(JSON.stringify(source)):{id:'',name:'',price:0,fit:'',badge:'',sort:60,status:'上架',updated:'',items:[{title:'新套餐内容',tag:'',mode:'included',pick:1,options:[{source:'package',label:'套餐专属内容',addon:0}]}]};
if(mode==='copy'){current.id=sourceId+'-copy';current.name=current.name+'（复制）'}if(mode==='new'&&!params.get('id'))current={id:'',name:'',price:0,fit:'',badge:'',sort:60,status:'上架',updated:'',items:[{title:'新套餐内容',tag:'',mode:'included',pick:1,options:[{source:'package',label:'套餐专属内容',addon:0}]}]};
function saleItems(p){if(!p)return[];if(p.tiers)return p.tiers;if(p.specs)return p.specs;if(p.budget)return[{name:'连续预算',effectName:p.effectName,value:p.budget.referenceValue,unit:p.unit,price:p.budget.min}];return[]}
function saleLabel(item){if(!item)return'默认规格';const effect=[item.effectName,item.value,item.unit].filter(v=>v!==undefined&&v!=='').join(' ');return [item.name,effect,item.price?money(item.price):''].filter(Boolean).join(' · ')}
function productOptions(selected){return `<option value="">选择产品</option>`+ADMIN_PRODUCT_CATALOG.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.title)}</option>`).join('')}
function saleOptions(productId,selected){const p=getAdminProduct(productId),list=saleItems(p);return `<option value="0">选择规格/档位</option>`+list.map((x,i)=>`<option value="${i}" ${i===Number(selected||0)?'selected':''}>${esc(saleLabel(x))}</option>`).join('')}
function relationOptions(v){return ['','四选一','三选一','二选一','基础档已含'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x||'不显示 tag'}</option>`).join('')}
function renderBuilder(){
  $('builder').innerHTML=current.items.map((item,i)=>`<div class="pk-builder-item"><div class="pk-builder-head"><div class="pk-builder-title"><span class="pk-index">${i+1}</span><span>${esc(item.title||'未命名内容')}</span>${item.tag?`<span class="pk-relation">${esc(item.tag)}</span>`:''}</div><div class="pk-actions-inline"><button class="pk-text-btn" data-up="${i}" type="button">上移</button><button class="pk-text-btn" data-down="${i}" type="button">下移</button><button class="pk-text-btn" data-remove-item="${i}" type="button">删除</button></div></div><div class="pk-builder-body"><div class="pk-item-grid"><div class="pk-item-field"><label>前台包含内容</label><input data-item-title="${i}" value="${esc(item.title)}"></div><div class="pk-item-field"><label>关系 tag</label><select data-item-tag="${i}">${relationOptions(item.tag||'')}</select></div><div class="pk-item-field"><label>获得方式</label><select data-item-mode="${i}"><option value="included" ${item.mode==='included'?'selected':''}>直接包含</option><option value="choose" ${item.mode==='choose'?'selected':''}>用户选择 1 项</option></select></div></div><div class="pk-option-wrap"><div class="pk-option-head"><strong>确认订单执行选项</strong><button class="pk-text-btn" data-add-option="${i}" type="button">＋ 添加选项</button></div>${item.options.map((o,j)=>`<div class="pk-option-row"><select data-source="${i}:${j}"><option value="product" ${o.source==='product'?'selected':''}>引用产品</option><option value="package" ${o.source!=='product'?'selected':''}>套餐专属</option></select><select data-product="${i}:${j}" ${o.source==='product'?'':'disabled'}>${productOptions(o.productId)}</select><select data-sale="${i}:${j}" ${o.source==='product'?'':'disabled'}>${saleOptions(o.productId,o.saleIndex)}</select><input data-label="${i}:${j}" value="${esc(o.label)}" placeholder="确认订单中的选项文案"><div class="pk-addon"><span>¥</span><input data-addon="${i}:${j}" type="number" value="${Number(o.addon||0)}" title="补差金额"></div><button class="pk-remove-option" data-remove-option="${i}:${j}" type="button">×</button></div>`).join('')}</div></div></div>`).join('');bindBuilder();syncPreview();
}
function bindBuilder(){
  document.querySelectorAll('[data-item-title]').forEach(el=>el.oninput=()=>{current.items[+el.dataset.itemTitle].title=el.value;renderBuilder()});
  document.querySelectorAll('[data-item-tag]').forEach(el=>el.onchange=()=>{current.items[+el.dataset.itemTag].tag=el.value;renderBuilder()});
  document.querySelectorAll('[data-item-mode]').forEach(el=>el.onchange=()=>{current.items[+el.dataset.itemMode].mode=el.value;renderBuilder()});
  document.querySelectorAll('[data-source]').forEach(el=>el.onchange=()=>{const[i,j]=el.dataset.source.split(':').map(Number),o=current.items[i].options[j];o.source=el.value;if(o.source==='product'){o.productId=ADMIN_PRODUCT_CATALOG[0].id;o.saleIndex=0}else{delete o.productId;delete o.saleIndex}renderBuilder()});
  document.querySelectorAll('[data-product]').forEach(el=>el.onchange=()=>{const[i,j]=el.dataset.product.split(':').map(Number),o=current.items[i].options[j];o.productId=el.value;o.saleIndex=0;renderBuilder()});
  document.querySelectorAll('[data-sale]').forEach(el=>el.onchange=()=>{const[i,j]=el.dataset.sale.split(':').map(Number);current.items[i].options[j].saleIndex=Number(el.value||0)});
  document.querySelectorAll('[data-label]').forEach(el=>el.oninput=()=>{const[i,j]=el.dataset.label.split(':').map(Number);current.items[i].options[j].label=el.value});
  document.querySelectorAll('[data-addon]').forEach(el=>el.oninput=()=>{const[i,j]=el.dataset.addon.split(':').map(Number);current.items[i].options[j].addon=Number(el.value||0)});
  document.querySelectorAll('[data-add-option]').forEach(el=>el.onclick=()=>{current.items[+el.dataset.addOption].options.push({source:'package',label:'新执行选项',addon:0});renderBuilder()});
  document.querySelectorAll('[data-remove-option]').forEach(el=>el.onclick=()=>{const[i,j]=el.dataset.removeOption.split(':').map(Number);current.items[i].options.splice(j,1);if(!current.items[i].options.length)current.items[i].options.push({source:'package',label:'套餐专属内容',addon:0});renderBuilder()});
  document.querySelectorAll('[data-remove-item]').forEach(el=>el.onclick=()=>{current.items.splice(+el.dataset.removeItem,1);renderBuilder()});
  document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{const i=+el.dataset.up;if(i){[current.items[i-1],current.items[i]]=[current.items[i],current.items[i-1]];renderBuilder()}});
  document.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>{const i=+el.dataset.down;if(i<current.items.length-1){[current.items[i+1],current.items[i]]=[current.items[i],current.items[i+1]];renderBuilder()}});
}
function syncFromFields(){current.id=$('packageCode').value.trim();current.name=$('name').value;current.fit=$('fit').value;current.badge=$('badge').value;current.price=Number($('price').value||0);current.sort=Number($('sort').value||0);current.status=$('status').value;current.note=$('note').value;syncPreview()}
function syncPreview(){$('previewCard').innerHTML=`${current.badge?`<span class="pk-preview-badge">${esc(current.badge)}</span>`:''}<div class="pk-preview-title">${esc(current.name||'未命名套餐')}</div><div class="pk-preview-list">${current.items.map(i=>`<div class="pk-preview-item"><span class="pk-check">✓</span><div>${esc(i.title||'未命名内容')}${i.tag?` <span class="pk-relation">${esc(i.tag)}</span>`:''}</div></div>`).join('')}</div><div class="pk-preview-fit">适合：<strong>${esc(current.fit||'—')}</strong></div>${current.note?`<div class="pk-preview-note">${esc(current.note)}</div>`:''}<div class="pk-preview-foot"><small>套餐价</small><b>${money(current.price)}</b></div>`}
function addContent(){current.items.push({title:'新套餐内容',tag:'',mode:'included',pick:1,options:[{source:'package',label:'套餐专属内容',addon:0}]});renderBuilder()}
$('packageCode').value=current.id;$('name').value=current.name;$('fit').value=current.fit;$('badge').value=current.badge||'';$('price').value=current.price;$('sort').value=current.sort;$('status').value=current.status;$('note').value=current.note||'';
if(mode==='copy'){$('pageTitle').textContent=$('crumb').textContent='复制套餐'}else if(mode==='edit'){$('pageTitle').textContent=$('crumb').textContent='编辑套餐'}else{$('pageTitle').textContent=$('crumb').textContent='新增套餐'}
['packageCode','name','fit','badge','price','sort','status','note'].forEach(id=>$(id).addEventListener(id==='badge'||id==='status'?'change':'input',syncFromFields));$('addContent').onclick=$('addContentTop').onclick=addContent;$('saveBottom').onclick=()=>{syncFromFields();if(!current.id||!current.name||!current.fit||!current.price)return alert('请填写套餐编号、套餐名称、适合场景和套餐售价');const toast=$('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)};renderBuilder();syncPreview();
</script></body></html>
