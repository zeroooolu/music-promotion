<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑推广套餐｜星球发行 · 音乐推广 Admin</title><link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css"></head>
<body data-admin-page="packages" data-page-title="推广套餐 / 编辑套餐"><div id="admin-shell"></div><template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div>
<div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1><p>套餐只负责销售包装；实际履约能力仍引用产品与规格。</p></div><div class="pk-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBtn">保存并发布</button></div></div>
<div class="pk-form-layout"><div class="pk-form-main">
<section class="pk-form-card"><div class="pk-form-card-head"><h2>基本信息</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐名称</label><input id="name" value="人气飙升包（一）"></div><div class="pk-field"><label>套餐简称</label><input id="shortName" value="人气飙升 I"></div><div class="pk-field full"><label>适合人群 / 套餐描述</label><textarea id="desc">作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div><div class="pk-field"><label>标签</label><input id="tags" value="核心流量, 官方歌单, 内容传播"></div><div class="pk-field"><label>排序</label><input id="sort" type="number" value="10"></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>套餐内容</h2><div class="pk-builder-toolbar"><button class="pk-btn" id="addFixed" type="button">＋ 固定项目</button><button class="pk-btn" id="addChoice" type="button">＋ 选择组</button></div></div><div class="pk-form-card-body"><div class="pk-builder" id="builder"></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>价格</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐售价</label><div class="pk-price-input"><span>¥</span><input id="price" type="number" value="799"></div><div class="pk-help">前台只展示套餐总价，不拆分单个项目价格。</div></div><div class="pk-field"><label>划线价（可选）</label><div class="pk-price-input"><span>¥</span><input id="marketPrice" type="number" placeholder="例如 999"></div></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>前台展示</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field full"><label>套餐亮点</label><input id="highlights" value="10,000+ 播放 | 1 张官方歌单 | 抖音 / 小红书任选"><div class="pk-help">使用 “|” 分隔，最多建议 3 条，用于套餐卡片快速展示结果。</div></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option>推荐</option><option>热门</option><option>不展示</option></select></div><div class="pk-field"><label>发布状态</label><select id="status"><option>上架</option><option>下架</option></select></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>版本发布</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>当前版本</label><input value="V1" disabled></div><div class="pk-field"><label>本次发布</label><select><option>生成新版本并立即生效</option><option>仅保存草稿</option></select></div><div class="pk-field full"><label>版本备注</label><input value="调整套餐内容后发布新版本"></div></div></div></section>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存并发布</button></div>
</div><aside class="pk-preview"><div class="pk-preview-head"><h2>前台预览</h2><p>预览用户在“官方推广套餐”中看到的核心信息。</p></div><div class="pk-preview-body"><div class="pk-preview-card"><span class="pk-preview-badge" id="previewBadge">推荐</span><div class="pk-preview-name" id="previewName">人气飙升包（一）</div><div class="pk-preview-desc" id="previewDesc"></div><div class="pk-preview-results" id="previewResults"></div><div class="pk-preview-foot"><div class="pk-preview-price"><small>套餐价</small><strong id="previewPrice">¥799</strong></div><button class="pk-preview-cta">选择套餐</button></div></div><div class="pk-publish"><div class="pk-publish-row"><span>发布后版本</span><strong>V2</strong></div><div class="pk-publish-row"><span>订单快照</span><strong>保留购买时版本</strong></div><div class="pk-publish-row"><span>产品更新</span><strong>不自动覆盖套餐</strong></div></div></div></aside></div>
<div class="pk-toast" id="toast">已保存并发布新版本</div>
</template><script src="../assets/js/admin-shell.js"></script><script>
const productOptions=[['netease-play','网易云音乐播放推广'],['tme-play','TME 播放推广'],['netease-playlist','网易云歌单矩阵'],['qq-playlist-chart','QQ 音乐官方歌单打榜'],['douyin-gesture','抖音投放'],['netease-diy-comments','网易云音乐红心收藏'],['resource-apply','资源位代申请']];
let items=[{type:'choice',name:'核心流量',label:'请选择核心投流平台',min:1,max:1,options:[{product:'netease-play',result:'10,000 次播放'},{product:'tme-play',result:'12,500 次播放'}]},{type:'fixed',name:'官方歌单',product:'qq-playlist-chart',result:'1 张官方垂类歌单推荐'},{type:'choice',name:'内容传播',label:'请选择本项目执行方式',min:1,max:1,options:[{product:'douyin-gesture',result:'10 条手势舞内容'},{product:'douyin-gesture',result:'10 条对口型内容'},{product:'resource-apply',result:'3 个小红书素人账号'}]}];
const productName=id=>(productOptions.find(x=>x[0]===id)||[id,id])[1],selectOptions=selected=>productOptions.map(x=>`<option value="${x[0]}" ${x[0]===selected?'selected':''}>${x[1]}</option>`).join('');
function renderBuilder(){document.getElementById('builder').innerHTML=items.map((x,i)=>`<div class="pk-builder-item"><div class="pk-builder-item-head"><div class="pk-builder-item-head-left"><span class="pk-builder-index">${i+1}</span><span class="pk-builder-title">${x.type==='fixed'?'固定项目':'选择组'} · ${x.name}</span></div><div class="pk-builder-tools"><button class="pk-mini-link" data-up="${i}">上移</button><button class="pk-mini-link" data-down="${i}">下移</button><button class="pk-mini-link danger" data-remove="${i}">删除</button></div></div><div class="pk-builder-body">${x.type==='fixed'?fixedBody(x,i):choiceBody(x,i)}</div></div>`).join('');bindBuilder();syncPreview()}
function fixedBody(x,i){return `<div class="pk-builder-grid"><div class="pk-builder-field"><label>项目名称</label><input data-field="name" data-index="${i}" value="${x.name}"></div><div class="pk-builder-field"><label>用户看到的结果</label><input data-field="result" data-index="${i}" value="${x.result}"></div><div class="pk-builder-field full"><label>关联产品 / 规格</label><select data-field="product" data-index="${i}">${selectOptions(x.product)}</select></div></div><div class="pk-product-ref"><div><strong>${productName(x.product)}</strong><span>引用产品配置；套餐发布后保存版本快照</span></div><a class="pk-link" href="product-detail.html?id=${x.product}">查看产品</a></div>`}
function choiceBody(x,i){return `<div class="pk-builder-grid"><div class="pk-builder-field"><label>选择组名称</label><input data-field="name" data-index="${i}" value="${x.name}"></div><div class="pk-builder-field"><label>用户提示</label><input data-field="label" data-index="${i}" value="${x.label}"></div><div class="pk-builder-field"><label>最少选择</label><input data-field="min" data-index="${i}" type="number" min="0" value="${x.min}"></div><div class="pk-builder-field"><label>最多选择</label><input data-field="max" data-index="${i}" type="number" min="1" value="${x.max}"></div></div><div class="pk-choice-builder"><div class="pk-choice-builder-head"><span>选项</span><span>一个选项可引用一个产品规格</span></div>${x.options.map((o,j)=>`<div class="pk-choice-row"><select data-option-product="${i}:${j}">${selectOptions(o.product)}</select><input data-option-result="${i}:${j}" value="${o.result}" placeholder="用户看到的结果"><button class="pk-remove-choice" data-option-remove="${i}:${j}" title="删除">×</button></div>`).join('')}<button class="pk-add-choice" data-add-option="${i}" type="button">＋ 添加选项</button></div>`}
function bindBuilder(){document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{const x=items[+el.dataset.index];x[el.dataset.field]=el.type==='number'?+el.value:el.value;if(el.dataset.field==='product')renderBuilder();else syncPreview()});document.querySelectorAll('[data-option-product]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionProduct.split(':').map(Number);items[i].options[j].product=el.value;syncPreview()});document.querySelectorAll('[data-option-result]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionResult.split(':').map(Number);items[i].options[j].result=el.value;syncPreview()});document.querySelectorAll('[data-option-remove]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.optionRemove.split(':').map(Number);items[i].options.splice(j,1);renderBuilder()});document.querySelectorAll('[data-add-option]').forEach(b=>b.onclick=()=>{items[+b.dataset.addOption].options.push({product:'netease-play',result:'新的推广结果'});renderBuilder()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.remove,1);renderBuilder()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}
function move(i,d){const n=i+d;if(n<0||n>=items.length)return;[items[i],items[n]]=[items[n],items[i]];renderBuilder()}
document.getElementById('addFixed').onclick=()=>{items.push({type:'fixed',name:'新的固定项目',product:'netease-play',result:'填写用户最终获得的结果'});renderBuilder()};document.getElementById('addChoice').onclick=()=>{items.push({type:'choice',name:'新的选择组',label:'请选择 1 项',min:1,max:1,options:[{product:'netease-play',result:'新的推广结果'},{product:'tme-play',result:'新的推广结果'}]});renderBuilder()};
function syncPreview(){const name=document.getElementById('name').value||'未命名套餐',desc=document.getElementById('desc').value||'',price=Number(document.getElementById('price').value||0),highlights=document.getElementById('highlights').value.split('|').map(x=>x.trim()).filter(Boolean).slice(0,3),badge=document.getElementById('badge').value;document.getElementById('previewName').textContent=name;document.getElementById('previewDesc').textContent=desc;document.getElementById('previewPrice').textContent='¥'+price.toLocaleString('zh-CN');document.getElementById('previewBadge').textContent=badge;document.getElementById('previewBadge').style.display=badge==='不展示'?'none':'inline-flex';document.getElementById('previewResults').innerHTML=(highlights.length?highlights:items.slice(0,3).map(x=>x.result||x.options?.[0]?.result)).map((x,i)=>`<div class="pk-preview-result"><strong>${x}</strong><span>${items[i]?.name||'套餐结果'}</span></div>`).join('')}
['name','desc','price','highlights','badge'].forEach(id=>document.getElementById(id).addEventListener(id==='badge'?'change':'input',syncPreview));
function save(){const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');location.href='package-detail.html?id=popular-1'},850)}document.getElementById('saveBtn').onclick=save;document.getElementById('saveBottom').onclick=save;
const params=new URLSearchParams(location.search),mode=params.get('mode');if(!mode){document.getElementById('pageTitle').textContent='新增套餐';document.getElementById('crumb').textContent='新增套餐'}else if(mode==='copy'){document.getElementById('pageTitle').textContent='复制套餐';document.getElementById('crumb').textContent='复制套餐';document.getElementById('name').value+=' - 副本'}renderBuilder();syncPreview();
</script></body></html>
