<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑推广套餐｜星球发行 · 音乐推广 Admin</title><link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css">
<style>
.pk-goals{display:flex;gap:7px;flex-wrap:wrap}.pk-goal{height:31px;padding:0 10px;border:1px solid #d7dde5;border-radius:4px;background:#fff;color:#607087}.pk-goal.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pk-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pk-section-note{margin:0;color:#98a2af;font-size:11px}.pk-tag-editor{min-height:36px;border:1px solid #d3d8df;border-radius:4px;padding:5px 7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff}.pk-tag-editor input{border:0!important;height:24px!important;min-width:130px;flex:1;padding:0 3px!important}.pk-tag-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pk-tag-chip button{border:0;background:transparent;color:#8a97c9;padding:0}.pk-mode{display:flex;border:1px solid #d6dbe2;border-radius:4px;overflow:hidden;width:max-content}.pk-mode button{height:32px;padding:0 13px;border:0;border-right:1px solid #d6dbe2;background:#fff;color:#687483;font-size:11px}.pk-mode button:last-child{border-right:0}.pk-mode button.active{background:#eef2ff;color:#2448ff;font-weight:600}.pk-simple-item{border:1px solid #dde2e8;border-radius:6px;background:#fff;overflow:hidden}.pk-simple-item+.pk-simple-item{margin-top:10px}.pk-simple-head{height:46px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#f8f9fb;border-bottom:1px solid #e9ecef}.pk-simple-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3d4652}.pk-simple-type{height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:999px;background:#f1f3f6;color:#6f7a87;font-size:10px}.pk-simple-type.choose{background:#eef2ff;color:#2448ff}.pk-simple-body{padding:14px}.pk-simple-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pk-simple-field.full{grid-column:1/-1}.pk-simple-field label{display:block;color:#7f8b98;font-size:11px;margin-bottom:6px}.pk-simple-field input,.pk-simple-field select{width:100%;height:34px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;color:#445162;font-size:12px;background:#fff}.pk-simple-rule{margin-top:13px;padding-top:13px;border-top:1px solid #edf0f3}.pk-option-row{display:grid;grid-template-columns:1.05fr 1fr 1.35fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0f2f5}.pk-option-row:first-of-type{border-top:0}.pk-option-row input,.pk-option-row select{height:32px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;font-size:11px;color:#465260;background:#fff;min-width:0}.pk-option-remove{width:26px;height:26px;border:0;background:transparent;color:#a1aab5;font-size:16px}.pk-add-option{border:0;background:transparent;color:#2448ff;font-size:11px;padding:6px 0}.pk-add-content{width:100%;height:42px;border:1px dashed #bfc8d4;border-radius:5px;background:#fafbfc;color:#52647a;font-size:12px}.pk-item-actions{display:flex;gap:8px}.pk-item-actions button{border:0;background:transparent;color:#7f8a97;font-size:11px}.pk-tip{margin-top:12px;padding:10px 12px;border:1px solid #e4e8ef;border-radius:5px;background:#f8f9fc;color:#7e8996;font-size:11px;line-height:1.6}.pk-tip strong{color:#42516a}.pk-language-tabs{display:flex;gap:3px;margin-bottom:14px;border-bottom:1px solid #e7eaee}.pk-lang{height:36px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:#778393}.pk-lang.active{color:#2448ff;border-bottom-color:#2448ff;font-weight:600}.pk-preview-meta{margin-top:12px;padding-top:12px;border-top:1px solid #eceff2;display:grid;gap:7px}.pk-preview-meta-row{display:flex;justify-content:space-between;font-size:11px}.pk-preview-meta-row span{color:#929daa}.pk-preview-meta-row strong{color:#465260;font-weight:500;text-align:right}
</style></head>
<body data-admin-page="packages" data-page-title="推广套餐 / 编辑套餐"><div id="admin-shell"></div><template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div>
<div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1><p>套餐只组合已有产品与具体售卖规格；结果文案可覆盖，但不再代替规格关系。</p></div><div class="pk-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBtn">保存套餐</button></div></div>
<div class="pk-form-layout"><div class="pk-form-main">
<section class="pk-form-card"><div class="pk-form-card-head"><h2>基本信息</h2></div><div class="pk-form-card-body"><div class="pk-form-grid">
<div class="pk-field"><label>套餐编号</label><input id="packageCode" class="pk-code" value="popular-1"><div class="pk-help">用于前台选择、订单和后台引用，保持唯一。</div></div><div class="pk-field"><label>套餐名称</label><input id="name" value="人气飙升包（一）"></div>
<div class="pk-field full"><label>适用推广目标</label><div class="pk-goals" id="goalGrid"></div><div class="pk-help">用于前台按用户选择的推广目标筛选或推荐官方套餐。</div></div>
<div class="pk-field full"><label>适合场景文案</label><input id="target" value="短期提升播放量和歌曲热度"><div class="pk-help">这是面向用户的营销表达，不代替上面的结构化推广目标。</div></div>
<div class="pk-field full"><label>简介</label><textarea id="intro">作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div>
<div class="pk-field full"><label>标签</label><div class="pk-tag-editor" id="tagEditor"><div id="tagList"></div><input id="tagInput" placeholder="输入标签后按回车"></div></div><div class="pk-field"><label>排序</label><input id="sort" type="number" value="10"></div><div class="pk-field"><label>状态</label><select id="status"><option selected>上架</option><option>下架</option></select></div>
</div></div></section>

<section class="pk-form-card"><div class="pk-form-card-head"><div><h2>套餐包含什么</h2><p class="pk-section-note">每一项关联“产品 + 具体售卖规格”，可设置直接包含或让用户选择。</p></div></div><div class="pk-form-card-body"><div class="pk-builder" id="builder"></div><button class="pk-add-content" id="addContent" type="button">＋ 添加一个套餐内容</button><div class="pk-tip"><strong>字段关系：</strong> 套餐内容 → 产品编号 → 规格编号 → 结构化结果；“用户展示结果”仅用于套餐场景下的前台表达覆盖。</div></div></section>

<section class="pk-form-card"><div class="pk-form-card-head"><h2>价格</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐售价</label><div class="pk-price-input"><span>¥</span><input id="price" type="number" value="799"></div><div class="pk-help">前台展示套餐总价，不拆分单个项目价格。</div></div><div class="pk-field"><label>划线价（可选）</label><div class="pk-price-input"><span>¥</span><input id="marketPrice" type="number" placeholder="例如 999"></div></div></div></div></section>

<section class="pk-form-card"><div class="pk-form-card-head"><h2>前台展示</h2></div><div class="pk-form-card-body"><div class="pk-language-tabs"><button class="pk-lang active">简体中文</button><button class="pk-lang">English</button><button class="pk-lang">日本語</button><button class="pk-lang">繁體中文</button></div><div class="pk-form-grid"><div class="pk-field full"><label>套餐名称</label><input value="人气飙升包（一）"></div><div class="pk-field full"><label>套餐简介</label><textarea>作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div><div class="pk-field full"><label>套餐亮点</label><input id="highlights" value="10,000+ 播放 | 1 张官方歌单 | 抖音 / 小红书任选"><div class="pk-help">使用 “|” 分隔，建议最多 3 条，用于套餐卡片快速展示。</div></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option selected>推荐</option><option>热门</option><option>不展示</option></select></div></div></div></section>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存套餐</button></div>
</div><aside class="pk-preview"><div class="pk-preview-head"><h2>前台预览</h2><p>对应“选择推广方式 / 官方推广套餐”的卡片信息。</p></div><div class="pk-preview-body"><div class="pk-preview-card"><span class="pk-preview-badge" id="previewBadge">推荐</span><div class="pk-preview-name" id="previewName">人气飙升包（一）</div><div class="pk-preview-desc" id="previewDesc">作品质量过关、想短期冲播放量榜单的音乐人。</div><div class="pk-preview-results" id="previewResults"><span class="pk-tag blue">10,000+ 播放</span><span class="pk-tag blue">1 张官方歌单</span><span class="pk-tag blue">内容传播</span></div><div class="pk-preview-foot"><div class="pk-preview-price"><small>套餐价</small><strong id="previewPrice">¥799</strong></div><button class="pk-preview-cta">选择套餐</button></div></div><div class="pk-preview-meta"><div class="pk-preview-meta-row"><span>适用推广目标</span><strong id="previewGoals">增加歌曲播放 / 提升热度</strong></div><div class="pk-preview-meta-row"><span>适合场景</span><strong id="previewTarget">短期提升播放量和歌曲热度</strong></div><div class="pk-preview-meta-row"><span>状态</span><strong>上架</strong></div></div></div></aside></div>
<div class="pk-toast" id="toast">套餐已保存（原型）</div>
</template><script src="../assets/js/admin-shell.js"></script><script>
const goals=[['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']];let selectedGoals=new Set(['plays','chart']);
const products={
'netease-play':{name:'网易云音乐播放推广',specs:[['play-10000','10,000 次播放'],['play-24000','24,000 次播放'],['play-40000','40,000 次播放']]},
'tme-play':{name:'TME 播放推广',specs:[['play-12500','12,500 次播放'],['play-30000','30,000 次播放'],['play-50000','50,000 次播放']]},
'qq-playlist-chart':{name:'QQ 音乐官方歌单打榜',specs:[['official-playlist','1 张官方垂类歌单推荐'],['basic-chart','保底 20 万播放']]},
'douyin-promotion':{name:'抖音投放',specs:[['gesture','手势舞号 · 10 个账号'],['lip-sync','对口型号 · 10 个账号'],['mixcut-10k','万粉混剪号 · 15 个账号']]},
'xiaohongshu-promotion':{name:'小红书投放',specs:[['amateur-1-5k','素人投放（粉丝 1–5k）'],['koc-1-3w','KOC 投放（粉丝 1–3w）']]},
'netease-favorites':{name:'网易云音乐红心收藏',specs:[['favorite-1000','1,000 个红心收藏']]},
'resource-apply':{name:'平台资源位代申请',specs:[['resource-5','5 个资源位申请']]},
'netease-playlist':{name:'网易云歌单矩阵',specs:[['playlist-18w','18 万 / 月总播放']]},
'kugou-chart':{name:'酷狗音乐官方冲榜',specs:[['basic','基础冲榜'],['advanced','进阶冲榜'],['premium','高级冲榜']]}
};
const productOptions=selected=>Object.entries(products).map(([id,p])=>`<option value="${id}" ${id===selected?'selected':''}>${p.name}</option>`).join('');const specOptions=(product,selected)=>products[product].specs.map(s=>`<option value="${s[0]}" ${s[0]===selected?'selected':''}>${s[1]}</option>`).join('');
let tags=['核心流量','官方歌单','内容传播'];let items=[{mode:'choose',name:'核心流量',pick:1,options:[{product:'netease-play',spec:'play-10000',result:'10,000 次播放'},{product:'tme-play',spec:'play-12500',result:'12,500 次播放'}]},{mode:'included',name:'官方歌单',product:'qq-playlist-chart',spec:'official-playlist',result:'1 张官方垂类歌单推荐'},{mode:'choose',name:'内容传播',pick:1,options:[{product:'douyin-promotion',spec:'gesture',result:'10 个手势舞账号参与传播'},{product:'douyin-promotion',spec:'lip-sync',result:'10 个对口型账号参与传播'},{product:'xiaohongshu-promotion',spec:'amateur-1-5k',result:'3 个小红书素人账号参与传播'}]}];
function renderGoals(){document.getElementById('goalGrid').innerHTML=goals.map(g=>`<button type="button" class="pk-goal ${selectedGoals.has(g[0])?'active':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals();syncPreview()})}
function renderTags(){document.getElementById('tagList').innerHTML=tags.map((t,i)=>`<span class="pk-tag-chip">${t}<button type="button" data-tag-remove="${i}">×</button></span>`).join('');document.querySelectorAll('[data-tag-remove]').forEach(b=>b.onclick=()=>{tags.splice(+b.dataset.tagRemove,1);renderTags()})}document.getElementById('tagInput').onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const v=e.target.value.trim();if(v&&!tags.includes(v))tags.push(v);e.target.value='';renderTags()};
function typeText(x){return x.mode==='included'?'套餐直接包含':`用户任选 ${x.pick} 项`}
function includedBody(x,i){return `<div class="pk-simple-rule"><div class="pk-simple-grid"><div class="pk-simple-field"><label>关联推广产品</label><select data-product="${i}">${productOptions(x.product)}</select></div><div class="pk-simple-field"><label>关联售卖规格</label><select data-spec="${i}">${specOptions(x.product,x.spec)}</select></div><div class="pk-simple-field full"><label>用户展示结果（可覆盖）</label><input data-result="${i}" value="${x.result||''}"></div></div></div>`}
function chooseBody(x,i){return `<div class="pk-simple-rule"><div class="pk-simple-grid"><div class="pk-simple-field"><label>用户需要选几项</label><select data-pick="${i}">${Array.from({length:Math.max(1,x.options.length)},(_,n)=>n+1).map(n=>`<option value="${n}" ${n===x.pick?'selected':''}>任选 ${n} 项</option>`).join('')}</select></div></div><div style="margin-top:10px">${x.options.map((o,j)=>`<div class="pk-option-row"><select data-option-product="${i}:${j}">${productOptions(o.product)}</select><select data-option-spec="${i}:${j}">${specOptions(o.product,o.spec)}</select><input data-option-result="${i}:${j}" value="${o.result}" placeholder="用户展示结果（可覆盖）"><button class="pk-option-remove" data-option-remove="${i}:${j}">×</button></div>`).join('')}<button class="pk-add-option" data-add-option="${i}">＋ 添加可选方案</button></div></div>`}
function renderBuilder(){document.getElementById('builder').innerHTML=items.map((x,i)=>`<div class="pk-simple-item"><div class="pk-simple-head"><div class="pk-simple-title"><span>${i+1}</span><span>${x.name}</span><span class="pk-simple-type ${x.mode==='choose'?'choose':''}">${typeText(x)}</span></div><div class="pk-item-actions"><button data-up="${i}">上移</button><button data-down="${i}">下移</button><button data-remove="${i}">删除</button></div></div><div class="pk-simple-body"><div class="pk-simple-grid"><div class="pk-simple-field"><label>这一项叫什么</label><input data-name="${i}" value="${x.name}"></div><div class="pk-simple-field"><label>用户怎么获得</label><div class="pk-mode"><button class="${x.mode==='included'?'active':''}" data-mode="${i}:included">直接包含</button><button class="${x.mode==='choose'?'active':''}" data-mode="${i}:choose">让用户选择</button></div></div></div>${x.mode==='included'?includedBody(x,i):chooseBody(x,i)}</div></div>`).join('');bindBuilder();syncPreview()}
function bindBuilder(){document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>{items[+el.dataset.name].name=el.value;syncPreview()});document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{const [i,m]=btn.dataset.mode.split(':');const x=items[+i];if(x.mode===m)return;if(m==='included'){const o=x.options?.[0]||{product:'netease-play',spec:'play-10000',result:''};items[+i]={mode:m,name:x.name,product:o.product,spec:o.spec,result:o.result}}else{items[+i]={mode:m,name:x.name,pick:1,options:[{product:x.product||'netease-play',spec:x.spec||'play-10000',result:x.result||''}]}}renderBuilder()});document.querySelectorAll('[data-product]').forEach(el=>el.onchange=()=>{const x=items[+el.dataset.product];x.product=el.value;x.spec=products[x.product].specs[0][0];renderBuilder()});document.querySelectorAll('[data-spec]').forEach(el=>el.onchange=()=>items[+el.dataset.spec].spec=el.value);document.querySelectorAll('[data-result]').forEach(el=>el.oninput=()=>items[+el.dataset.result].result=el.value);document.querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>items[+el.dataset.pick].pick=+el.value);document.querySelectorAll('[data-option-product]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionProduct.split(':').map(Number),o=items[i].options[j];o.product=el.value;o.spec=products[o.product].specs[0][0];renderBuilder()});document.querySelectorAll('[data-option-spec]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionSpec.split(':').map(Number);items[i].options[j].spec=el.value});document.querySelectorAll('[data-option-result]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionResult.split(':').map(Number);items[i].options[j].result=el.value});document.querySelectorAll('[data-option-remove]').forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.optionRemove.split(':').map(Number);items[i].options.splice(j,1);items[i].pick=Math.min(items[i].pick,Math.max(1,items[i].options.length));renderBuilder()});document.querySelectorAll('[data-add-option]').forEach(el=>el.onclick=()=>{items[+el.dataset.addOption].options.push({product:'netease-play',spec:'play-10000',result:''});renderBuilder()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{items.splice(+el.dataset.remove,1);renderBuilder()});document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{const i=+el.dataset.up;if(i){[items[i-1],items[i]]=[items[i],items[i-1]];renderBuilder()}});document.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>{const i=+el.dataset.down;if(i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];renderBuilder()}})}
function syncPreview(){document.getElementById('previewName').textContent=document.getElementById('name').value||'未命名套餐';document.getElementById('previewDesc').textContent=document.getElementById('intro').value;document.getElementById('previewTarget').textContent=document.getElementById('target').value;document.getElementById('previewGoals').textContent=goals.filter(g=>selectedGoals.has(g[0])).map(g=>g[1]).join(' / ')||'未选择';document.getElementById('previewPrice').textContent='¥'+Number(document.getElementById('price').value||0).toLocaleString();document.getElementById('previewBadge').textContent=document.getElementById('badge').value;document.getElementById('previewResults').innerHTML=document.getElementById('highlights').value.split('|').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="pk-tag blue">${x}</span>`).join('')}
['name','intro','target','price','highlights','badge'].forEach(id=>document.getElementById(id).addEventListener('input',syncPreview));document.getElementById('addContent').onclick=()=>{items.push({mode:'included',name:'新套餐内容',product:'netease-play',spec:'play-10000',result:'10,000 次播放'});renderBuilder()};document.querySelectorAll('.pk-lang').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pk-lang').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function saved(){const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='',1200)}document.getElementById('saveBtn').onclick=saved;document.getElementById('saveBottom').onclick=saved;
const params=new URLSearchParams(location.search);if(params.get('mode')==='copy'){document.getElementById('pageTitle').textContent='复制套餐';document.getElementById('crumb').textContent='复制套餐';document.getElementById('packageCode').value='popular-copy'}else if(params.get('mode')!=='edit'){document.getElementById('pageTitle').textContent='新增套餐';document.getElementById('crumb').textContent='新增套餐'}renderGoals();renderTags();renderBuilder();
</script></body></html>
