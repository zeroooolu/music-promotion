lor:#7f8b98;font-size:11px}.pk-mini-field input{width:100%;height:34px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;color:#445162;background:#fff}.pk-rule-readonly{height:34px;display:flex;align-items:center;padding:0 10px;border:1px solid #e1e5ea;border-radius:4px;background:#fafbfc;color:#687587;font-size:11px}.pk-options{margin-top:15px;padding-top:14px;border-top:1px solid #edf0f3}.pk-options-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.pk-options-head strong{color:#59677a;font-size:12px}.pk-option{border:1px solid #e3e7ed;border-radius:6px;background:#fbfcfd}.pk-option+.pk-option{margin-top:8px}.pk-option-head{min-height:42px;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.pk-option-main{display:flex;align-items:center;gap:8px;min-width:0}.pk-option-name{width:220px;height:32px;border:1px solid #d7dce3;border-radius:4px;padding:0 8px;background:#fff;color:#455265;font-size:12px}.pk-default{height:22px;padding:0 8px;border:1px solid #d8dde6;border-radius:11px;background:#fff;color:#798594;font-size:10px}.pk-default.active{border-color:#aebcff;background:#eef2ff;color:#2448ff}.pk-addon{position:relative;width:110px}.pk-addon span{position:absolute;left:8px;top:8px;color:#98a2ae;font-size:10px}.pk-addon input{width:100%;height:30px;padding:0 7px 0 20px;border:1px solid #d7dce3;border-radius:4px;background:#fff;color:#526174;font-size:11px}.pk-exec{padding:0 11px 11px}.pk-exec-rule{display:flex;align-items:center;gap:8px;margin:0 0 8px;color:#85909d;font-size:10px}.pk-exec-rule input{width:48px;height:28px;border:1px solid #d7dce3;border-radius:4px;text-align:center}.pk-exec-list{display:grid;gap:6px}.pk-exec-item{min-height:42px;padding:7px 9px;border:1px solid #e4e8ed;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.pk-exec-copy{min-width:0}.pk-source{display:inline-flex;height:18px;align-items:center;padding:0 6px;border-radius:9px;background:#eef2ff;color:#2448ff;font-size:9px;margin-right:6px}.pk-source.package{background:#f1f3f6;color:#6e7987}.pk-exec-copy strong{color:#48576a;font-size:11px;font-weight:500}.pk-exec-copy small{display:block;margin-top:3px;color:#9aa4b0;font-size:9px}.pk-exec-actions{display:flex;align-items:center;gap:8px}.pk-remove{border:0;background:transparent;color:#a2aab4;font-size:15px}.pk-add-actions{display:flex;gap:8px;margin-top:8px}.pk-small-add{height:30px;padding:0 10px;border:1px solid #d6ddea;border-radius:4px;background:#fff;color:#52657a;font-size:10px}.pk-small-add.primary{border-color:#bdc8ff;color:#2448ff}.pk-add{height:32px;padding:0 11px;border:1px solid #cbd5ff;border-radius:4px;background:#fff;color:#2448ff}.pk-add-content{width:100%;height:40px;margin-top:12px;border:1px dashed #bfc8d4;border-radius:5px;background:#fafbfc;color:#52647a}.pk-preview-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}.pk-preview-help{color:#788595;font-size:12px;line-height:1.8}.pk-preview-card{position:relative;min-height:350px;padding:20px 20px 76px;border:1px solid #d9dde5;border-radius:4px;background:#fff}.pk-preview-badge{position:absolute;right:15px;top:15px;padding:4px 7px;border-radius:3px;background:#2448ff;color:#fff;font-size:10px}.pk-preview-title{color:#20232a;font-size:17px;font-weight:600}.pk-preview-list{display:grid;gap:9px;margin-top:18px}.pk-preview-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;color:#515966;font-size:11px;line-height:18px}.pk-check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#2448ff;font-size:9px;font-weight:700}.pk-preview-fit{margin-top:14px;padding-top:11px;border-top:1px dashed #e7eaf0;color:#8a919b;font-size:11px}.pk-preview-fit strong{color:#4c5460}.pk-preview-note{margin-top:8px;color:#9299a4;font-size:10px}.pk-preview-foot{position:absolute;left:20px;right:20px;bottom:18px}.pk-preview-foot small{display:block;color:#9aa0aa;font-size:10px}.pk-preview-foot b{display:block;margin-top:2px;font-size:22px;color:#20232a}.pk-form-actions{position:sticky;bottom:0;z-index:20;margin-top:14px;padding:12px 16px;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);display:flex;justify-content:flex-end;gap:9px}.pk-toast{position:fixed;left:50%;top:24px;z-index:300;transform:translateX(-50%);display:none;padding:10px 16px;background:#30343a;color:#fff;border-radius:4px;font-size:12px}.pk-toast.show{display:block}.pk-modal-mask{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(30,35,48,.42);padding:20px}.pk-modal-mask.show{display:flex}.pk-modal{width:520px;background:#fff;border-radius:7px;box-shadow:0 20px 70px rgba(30,35,48,.22)}.pk-modal-head{padding:18px 20px 13px;border-bottom:1px solid #edf0f3}.pk-modal-head h3{margin:0;font-size:16px;color:#303b4a}.pk-modal-body{padding:18px 20px}.pk-modal-field+.pk-modal-field{margin-top:14px}.pk-modal-field label{display:block;margin-bottom:6px;color:#738093;font-size:11px}.pk-modal-field select,.pk-modal-field input{width:100%;height:38px;border:1px solid #d4dae1;border-radius:4px;padding:0 10px;background:#fff}.pk-modal-actions{padding:13px 20px 18px;display:flex;justify-content:flex-end;gap:8px}.pk-modal-actions button{height:34px;padding:0 14px;border-radius:4px}.pk-modal-cancel{border:1px solid #d4dae1;background:#fff;color:#536174}.pk-modal-ok{border:1px solid #2448ff;background:#2448ff;color:#fff}@media(max-width:1100px){.pk-preview-grid{grid-template-columns:1fr}.pk-group-fields{grid-template-columns:1fr 1fr}.pk-group-fields>div:first-child{grid-column:1/-1}}@media(max-width:800px){.pk-grid,.pk-group-fields{grid-template-columns:1fr}.pk-field.full,.pk-group-fields>div:first-child{grid-column:auto}.pk-option-head{align-items:flex-start;flex-direction:column}.pk-option-name{width:100%}}

<body data-admin-page="packages" data-page-title="推广套餐 / 编辑"><div id="admin-shell"></div>
<template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div><div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1></div></div>
<div class="pk-layout">
<section class="pk-card"><div class="pk-card-head"><h2>套餐信息</h2></div><div class="pk-card-body"><div class="pk-grid"><div class="pk-field"><label>套餐编号</label><input id="packageCode"></div><div class="pk-field"><label>套餐名称</label><input id="name"></div><div class="pk-field"><label>适合</label><input id="fit" placeholder="例如：短期起量"></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option value="">不展示</option><option value="推荐">推荐</option></select></div><div class="pk-field"><label>套餐售价</label><div class="pk-money"><span>¥</span><input id="price" type="number"></div></div><div class="pk-field"><label>排序</label><input id="sort" type="number"></div><div class="pk-field"><label>状态</label><select id="status"><option>上架</option><option>下架</option></select></div><div class="pk-field full"><label>补差说明（可选）</label><input id="note" placeholder="例如：进阶补差 ¥8,600 · 高级补差 ¥25,700"></div></div></div></section>
<section class="pk-card"><div class="pk-card-head"><div><h2>套餐包含内容</h2></div><button class="pk-add" id="addContentTop" type="button">＋ 添加内容组</button></div><div class="pk-card-body"><div class="pk-help" style="margin-bottom:13px">每一条前台“套餐包含”就是一个内容组。添加方案并设置“至少选 / 最多选”即可，<strong>四选一、五选二、最多选两项等标签由系统自动生成</strong>。</div><div id="builder"></div><button class="pk-add-content" id="addContent" type="button">＋ 添加一个套餐内容组</button></div></section>
<section class="pk-card"><div class="pk-card-head"><h2>前台套餐卡片预览</h2></div><div class="pk-card-body"><div class="pk-preview-grid"><div class="pk-preview-help">前台关系标签完全由配置自动计算，不再维护枚举。<br><br>例如：<strong>4 个方案 + 选 1 个 → 四选一</strong><br><strong>5 个方案 + 选 2 个 → 五选二</strong><br><strong>5 个方案 + 0–2 个 → 最多选二项</strong>。<br><br>当设置默认方案且其他方案存在补差时，会自动生成类似<strong>“基础档已含”</strong>的状态。</div><div class="pk-preview-card" id="previewCard"></div></div></div></section>
</div>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存套餐</button></div><div class="pk-toast" id="toast">套餐已保存（原型）</div>
<div class="pk-modal-mask" id="productModal"><div class="pk-modal"><div class="pk-modal-head"><h3>从产品中选择执行项</h3></div><div class="pk-modal-body"><div class="pk-modal-field"><label>产品</label><select id="modalProduct"></select></div><div class="pk-modal-field"><label>规格 / 档位</label><select id="modalSale"></select></div></div><div class="pk-modal-actions"><button class="pk-modal-cancel" id="modalCancel" type="button">取消</button><button class="pk-modal-ok" id="modalOk" type="button">添加</button></div></div></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script src="../assets/js/package-catalog-data.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');
const params=new URLSearchParams(location.search),mode=params.get('mode')||'new',sourceId=params.get('id')||'popular-1',source=getAdminPackage(sourceId);
const emptyPackage=()=>({id:'',name:'',price:0,fit:'',badge:'',sort:60,status:'上架',updated:'',items:[{title:'新套餐内容',selection:{min:1,max:1},options:[{name:'方案 1',executionItems:[{source:'package',name:'套餐专属内容'}]}]}]});
let current=source?JSON.parse(JSON.stringify(source)):emptyPackage();if(mode==='copy'){current.id=sourceId+'-copy';current.name=current.name+'（复制）'}if(mode==='new'&&!params.get('id'))current=emptyPackage();
let modalTarget=null;
function saleItems(p){if(!p)return[];if(p.tiers)return p.tiers;if(p.specs)return p.specs;if(p.budget)return[{name:'连续预算',effectName:p.effectName,value:p.budget.referenceValue,unit:p.unit,price:p.budget.min}];return[]}
function saleLabel(item){if(!item)return'默认规格';const effect=[item.effectName,item.value,item.unit].filter(v=>v!==undefined&&v!=='').join(' ');return [item.name,effect,item.price?money(item.price):''].filter(Boolean).join(' · ')}
function execLabel(exec){if(exec.source==='package')return exec.name||'套餐专属内容';const p=getAdminProduct(exec.productId),item=saleItems(p)[Number(exec.saleIndex||0)];return exec.display||[p?.title,saleLabel(item)].filter(Boolean).join(' · ')||'未选择产品'}
function execMeta(exec){if(exec.source==='package')return '套餐专属内容';const p=getAdminProduct(exec.productId),item=saleItems(p)[Number(exec.saleIndex||0)];return [p?.title,item?.name||item?.effectName].filter(Boolean).join(' / ')}
function normalizeGroup(item){item.options=item.options||[];item.selection=getAdminPackageNormalizeSelection(item.selection,item.options.length);if(item.options.length===1)item.selection={min:1,max:1};item.options.forEach(o=>{o.executionItems=o.executionItems||[];if(o.executionItems.length>1){o.executionSelection=getAdminPackageNormalizeSelection(o.executionSelection||{min:o.executionItems.length,max:o.executionItems.length},o.executionItems.length)}})}
function syncFields(){current.id=$('packageCode').value.trim();current.name=$('name').value.trim();current.fit=$('fit').value.trim();current.badge=$('badge').value;current.price=Number($('price').value||0);current.sort=Number($('sort').value||0);current.status=$('status').value;current.note=$('note').value.trim();syncPreview()}
function renderBuilder(){current.items.forEach(normalizeGroup);$('builder').innerHTML=current.items.map((item,i)=>{const relation=getAdminPackageRelationLabel(item)||'直接包含',summary=getAdminPackageSelectionSummary(item);return `<div class="pk-group"><div class="pk-group-head"><div class="pk-group-title"><span class="pk-index">${i+1}</span><span>${esc(item.title||'未命名内容')}</span><span class="pk-auto-tag ${relation==='直接包含'?'muted':''}">${esc(relation)}</span></div><div><button class="pk-text-btn" data-up="${i}" type="button">上移</button><button class="pk-text-btn" data-down="${i}" type="button">下移</button><button class="pk-text-btn" data-remove-group="${i}" type="button">删除</button></div></div><div class="pk-group-body"><div class="pk-group-fields"><div class="pk-mini-field"><label>前台包含内容</label><input data-title="${i}" value="${esc(item.title)}"></div><div class="pk-mini-field"><label>至少选择</label><input data-min="${i}" type="number" min="0" max="${item.options.length}" value="${item.selection.min}" ${item.options.length<=1?'disabled':''}></div><div class="pk-mini-field"><label>最多选择</label><input data-max="${i}" type="number" min="0" max="${item.options.length}" value="${item.selection.max}" ${item.options.length<=1?'disabled':''}></div></div><div class="pk-help" style="margin-top:7px">${summary} · 前台自动显示：${relation}</div><div class="pk-options"><div class="pk-options-head"><strong>可选方案（${item.options.length}）</strong><button class="pk-small-add primary" data-add-option="${i}" type="button">＋ 添加方案</button></div>${item.options.map((o,j)=>renderOption(o,i,j,item)).join('')}</div></div></div>`}).join('');bindBuilder();syncPreview()}
function renderOption(o,i,j,item){const execRelation=getAdminPackageExecutionRelationLabel(o),isDefault=Number(item.defaultOption)===j;return `<div class="pk-option"><div class="pk-option-head"><div class="pk-option-main"><input class="pk-option-name" data-option-name="${i}:${j}" value="${esc(o.name||`方案 ${j+1}`)}"><button class="pk-default ${isDefault?'active':''}" data-default="${i}:${j}" type="button">${isDefault?'默认方案':'设为默认'}</button><div class="pk-addon"><span>¥</span><input data-option-addon="${i}:${j}" type="number" value="${Number(o.addon||0)}" title="选择该方案的补差金额"></div></div><button class="pk-remove" data-remove-option="${i}:${j}" type="button">×</button></div><div class="pk-exec">${o.executionItems.length>1?`<div class="pk-exec-rule"><span>${o.executionItems.length} 个执行项</span><span>至少执行</span><input data-exec-min="${i}:${j}" type="number" min="0" max="${o.executionItems.length}" value="${o.executionSelection?.min??o.executionItems.length}"><span>最多执行</span><input data-exec-max="${i}:${j}" type="number" min="0" max="${o.executionItems.length}" value="${o.executionSelection?.max??o.executionItems.length}"><span>${execRelation?`· 自动：${esc(execRelation)}`:''}</span></div>`:''}<div class="pk-exec-list">${o.executionItems.map((e,k)=>`<div class="pk-exec-item"><div class="pk-exec-copy"><div><span class="pk-source ${e.source==='package'?'package':''}">${e.source==='product'?'产品':'套餐专属'}</span><strong>${esc(execLabel(e))}</strong></div><small>${esc(execMeta(e))}</small></div><div class="pk-exec-actions"><button class="pk-remove" data-remove-exec="${i}:${j}:${k}" type="button">×</button></div></div>`).join('')}</div><div class="pk-add-actions"><button class="pk-small-add primary" data-add-product="${i}:${j}" type="button">＋ 从产品中选择</button><button class="pk-small-add" data-add-package="${i}:${j}" type="button">＋ 套餐专属内容</button></div></div></div>`}
function bindBuilder(){
  document.querySelectorAll('[data-title]').forEach(el=>el.oninput=()=>{current.items[+el.dataset.title].title=el.value;syncPreview()});
  document.querySelectorAll('[data-min]').forEach(el=>el.onchange=()=>{const x=current.items[+el.dataset.min];x.selection.min=Number(el.value||0);normalizeGroup(x);renderBuilder()});
  document.querySelectorAll('[data-max]').forEach(el=>el.onchange=()=>{const x=current.items[+el.dataset.max];x.selection.max=Number(el.value||0);normalizeGroup(x);renderBuilder()});
  document.querySelectorAll('[data-option-name]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionName.split(':').map(Number);current.items[i].options[j].name=el.value;syncPreview()});
  document.querySelectorAll('[data-option-addon]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionAddon.split(':').map(Number);current.items[i].options[j].addon=Number(el.value||0);syncPreview()});
  document.querySelectorAll('[data-default]').forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.default.split(':').map(Number),x=current.items[i];x.defaultOption=Number(x.defaultOption)===j?null:j;renderBuilder()});
  document.querySelectorAll('[data-exec-min]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.execMin.split(':').map(Number),o=current.items[i].options[j];o.executionSelection=o.executionSelection||{};o.executionSelection.min=Number(el.value||0);renderBuilder()});
  document.querySelectorAll('[data-exec-max]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.execMax.split(':').map(Number),o=current.items[i].options[j];o.executionSelection=o.executionSelection||{};o.executionSelection.max=Number(el.value||0);renderBuilder()});
  document.querySelectorAll('[data-add-option]').forEach(el=>el.onclick=()=>{const x=current.items[+el.dataset.addOption];x.options.push({name:`方案 ${x.options.length+1}`,executionItems:[{source:'package',name:'套餐专属内容'}]});normalizeGroup(x);renderBuilder()});
  document.querySelectorAll('[data-remove-option]').forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.removeOption.split(':').map(Number),x=current.items[i];x.options.splice(j,1);if(Number(x.defaultOption)===j)x.defaultOption=null;else if(Number(x.defaultOption)>j)x.defaultOption--;if(!x.options.length)x.options.push({name:'方案 1',executionItems:[{source:'package',name:'套餐专属内容'}]});normalizeGroup(x);renderBuilder()});
  document.querySelectorAll('[data-add-product]').forEach(el=>el.onclick=()=>openProductModal(el.dataset.addProduct));
  document.querySelectorAll('[data-add-package]').forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.addPackage.split(':').map(Number),name=prompt('套餐专属内容名称','套餐专属内容');if(!name)return;current.items[i].options[j].executionItems.push({source:'package',name});renderBuilder()});
  document.querySelectorAll('[data-remove-exec]').forEach(el=>el.onclick=()=>{const [i,j,k]=el.dataset.removeExec.split(':').map(Number),o=current.items[i].options[j];o.executionItems.splice(k,1);if(!o.executionItems.length)o.executionItems.push({source:'package',name:'套餐专属内容'});renderBuilder()});
  document.querySelectorAll('[data-remove-group]').forEach(el=>el.onclick=()=>{current.items.splice(+el.dataset.removeGroup,1);renderBuilder()});
  document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{const i=+el.dataset.up;if(i){[current.items[i-1],current.items[i]]=[current.items[i],current.items[i-1]];renderBuilder()}});
  document.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>{const i=+el.dataset.down;if(i<current.items.length-1){[current.items[i+1],current.items[i]]=[current.items[i],current.items[i+1]];renderBuilder()}})
}
function openProductModal(target){modalTarget=target;const list=ADMIN_PRODUCT_CATALOG;$('modalProduct').innerHTML=list.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('');renderModalSales();$('productModal').classList.add('show')}
function renderModalSales(){$('modalSale').innerHTML=saleItems(getAdminProduct($('modalProduct').value)).map((x,i)=>`<option value="${i}">${esc(saleLabel(x))}</option>`).join('')}
$('modalProduct').onchange=renderModalSales;$('modalCancel').onclick=()=>$('productModal').classList.remove('show');$('modalOk').onclick=()=>{if(!modalTarget)return;const [i,j]=modalTarget.split(':').map(Number);current.items[i].options[j].executionItems.push({source:'product',productId:$('modalProduct').value,saleIndex:Number($('modalSale').value||0)});$('productModal').classList.remove('show');renderBuilder()};$('productModal').onclick=e=>{if(e.target===$('productModal'))$('productModal').classList.remove('show')};
function addGroup(){current.items.push({title:'新套餐内容',selection:{min:1,max:1},options:[{name:'方案 1',executionItems:[{source:'package',name:'套餐专属内容'}]}]});renderBuilder()}
function syncPreview(){const relationRows=current.items.map(i=>({title:i.title,tag:getAdminPackageRelationLabel(i)}));$('previewCard').innerHTML=`${current.badge?`<span class="pk-preview-badge">${esc(current.badge)}</span>`:''}<div class="pk-preview-title">${esc(current.name||'未命名套餐')}</div><div class="pk-preview-list">${relationRows.map(i=>`<div class="pk-preview-item"><span class="pk-check">✓</span><div>${esc(i.title)}${i.tag?` <span class="pk-auto-tag">${esc(i.tag)}</span>`:''}</div></div>`).join('')}</div><div class="pk-preview-fit">适合：<strong>${esc(current.fit||'—')}</strong></div>${current.note?`<div class="pk-preview-note">${esc(current.note)}</div>`:''}<div class="pk-preview-foot"><small>套餐价</small><b>${money(current.price)}</b></div>`}
$('packageCode').value=current.id;$('name').value=current.name;$('fit').value=current.fit;$('badge').value=current.badge||'';$('price').value=current.price;$('sort').value=current.sort;$('status').value=current.status;$('note').value=current.note||'';
if(mode==='copy'){$('pageTitle').textContent=$('crumb').textContent='复制套餐'}else if(mode==='edit'){$('pageTitle').textContent=$('crumb').textContent='编辑套餐'}else{$('pageTitle').textContent=$('crumb').textContent='新增套餐'}
['packageCode','name','fit','badge','price','sort','status','note'].forEach(id=>$(id).addEventListener(id==='badge'||id==='status'?'change':'input',syncFields));$('addContent').onclick=$('addContentTop').onclick=addGroup;$('saveBottom').onclick=()=>{syncFields();if(!current.id||!current.name||!current.fit||!current.price)return alert('请填写套餐编号、套餐名称、适合场景和套餐售价');const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)};renderBuilder();syncPreview();
</script></body></html>
