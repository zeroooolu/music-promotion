<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑推广套餐｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/packages.css">
<style>
[hidden]{display:none!important}.pk-form-layout{display:block}.pk-form-main{display:grid;gap:14px}.pk-form-card{background:#fff;border:1px solid #d9dde2;border-radius:8px;overflow:visible}.pk-form-card-head{min-height:54px;height:auto;padding:0 18px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between}.pk-form-card-head h2{margin:0;font-size:15px;color:#30343a}.pk-form-card-body{padding:18px}.pk-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.pk-field.full{grid-column:1/-1}.pk-field label{display:block;margin-bottom:7px;color:#536277;font-size:12px;font-weight:500}.pk-field input,.pk-field select,.pk-field textarea{width:100%;border:1px solid #d4dae1;border-radius:4px;background:#fff;color:#3e4b5c;outline:0}.pk-field input,.pk-field select{height:38px;padding:0 10px}.pk-field textarea{min-height:82px;padding:9px 10px;resize:vertical}.pk-field input:focus,.pk-field select:focus,.pk-field textarea:focus{border-color:#2448ff;box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pk-help{margin-top:6px;color:#99a3af;font-size:11px;line-height:1.5}.pk-goals{display:flex;gap:8px;flex-wrap:wrap}.pk-goal{height:32px;padding:0 11px;border:1px solid #d8dde5;border-radius:4px;background:#fff;color:#607187}.pk-goal.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pk-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pk-tag-editor{min-height:38px;border:1px solid #d4dae1;border-radius:4px;padding:5px 7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff}.pk-tag-editor input{border:0!important;height:26px!important;min-width:130px;flex:1;padding:0 3px!important;box-shadow:none!important}.pk-tag-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pk-tag-chip button{border:0;background:transparent;color:#8a97c9;padding:0;cursor:pointer}.pk-simple-item{border:1px solid #dde2e8;border-radius:6px;background:#fff;overflow:hidden}.pk-simple-item+.pk-simple-item{margin-top:10px}.pk-simple-head{height:46px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#f8f9fb;border-bottom:1px solid #e9ecef}.pk-simple-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3d4652}.pk-simple-title>span:first-child{width:22px;height:22px;border-radius:50%;background:#eef2ff;color:#2448ff;display:grid;place-items:center;font-size:10px}.pk-simple-type{height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:999px;background:#f1f3f6;color:#6f7a87;font-size:10px}.pk-simple-type.choose{background:#eef2ff;color:#2448ff}.pk-simple-body{padding:14px}.pk-simple-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pk-simple-field.full{grid-column:1/-1}.pk-simple-field label{display:block;color:#7f8b98;font-size:11px;margin-bottom:6px}.pk-simple-field input,.pk-simple-field select{width:100%;height:34px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;color:#445162;font-size:12px;background:#fff}.pk-mode{display:flex;border:1px solid #d6dbe2;border-radius:4px;overflow:hidden;width:max-content}.pk-mode button{height:32px;padding:0 13px;border:0;border-right:1px solid #d6dbe2;background:#fff;color:#687483;font-size:11px}.pk-mode button:last-child{border-right:0}.pk-mode button.active{background:#eef2ff;color:#2448ff;font-weight:600}.pk-simple-rule{margin-top:13px;padding-top:13px;border-top:1px solid #edf0f3}.pk-option-row{display:grid;grid-template-columns:1.05fr 1fr 1.35fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0f2f5}.pk-option-row:first-of-type{border-top:0}.pk-option-row input,.pk-option-row select{height:32px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;font-size:11px;color:#465260;background:#fff;min-width:0}.pk-option-remove{width:26px;height:26px;border:0;background:transparent;color:#a1aab5;font-size:16px;cursor:pointer}.pk-add-option{border:0;background:transparent;color:#2448ff;font-size:11px;padding:6px 0;cursor:pointer}.pk-add-content{width:100%;height:40px;margin-top:12px;border:1px dashed #bfc8d4;border-radius:5px;background:#fafbfc;color:#52647a;font-size:12px;cursor:pointer}.pk-item-actions{display:flex;gap:10px}.pk-item-actions button{border:0;background:transparent;color:#7f8a97;font-size:11px;cursor:pointer}.pk-language-tabs{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid #e6e9ed}.pk-lang{height:37px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:#768294;cursor:pointer}.pk-lang.active{border-bottom-color:#2448ff;color:#2448ff;font-weight:600}.pk-price-input{position:relative}.pk-price-input span{position:absolute;left:10px;top:10px;color:#7e8996}.pk-price-input input{padding-left:27px}.pk-preview-inline{margin-top:18px;padding:18px 20px;border:1px solid #e4e8ed;border-radius:6px;background:#fafbfc}.pk-preview-badge{display:inline-flex;height:22px;padding:0 8px;align-items:center;border-radius:3px;background:#2448ff;color:#fff;font-size:10px}.pk-preview-name{margin-top:10px;font-size:17px;font-weight:650;color:#2e3440}.pk-preview-desc{margin-top:7px;color:#7e8895;font-size:12px;line-height:1.6}.pk-preview-results{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.pk-preview-price{margin-top:16px;font-size:24px;font-weight:650;color:#242a32}.pk-form-actions{position:sticky;bottom:0;z-index:10;margin-top:14px;padding:12px 16px;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);display:flex;justify-content:flex-end;gap:9px}.pk-toast{position:fixed;left:50%;top:24px;z-index:100;transform:translateX(-50%);display:none;padding:10px 16px;background:#30343a;color:#fff;border-radius:4px;font-size:12px}.pk-toast.show{display:block}@media(max-width:900px){.pk-form-grid,.pk-simple-grid{grid-template-columns:1fr}.pk-field.full,.pk-simple-field.full{grid-column:auto}.pk-option-row{grid-template-columns:1fr}}
</style>
</head>
<body data-admin-page="packages" data-page-title="推广套餐 / 编辑套餐">
<div id="admin-shell"></div>
<template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div>
<div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1></div></div>
<div class="pk-form-layout"><div class="pk-form-main">
<section class="pk-form-card"><div class="pk-form-card-head"><h2>基本信息</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐编号</label><input id="packageCode" class="pk-code" value="popular-1"><div class="pk-help">用于前台选择、订单和后台引用，保持唯一。</div></div><div class="pk-field"><label>套餐名称</label><input id="name" value="人气飙升包（一）"></div><div class="pk-field full"><label>适用推广目标</label><div class="pk-goals" id="goalGrid"></div></div><div class="pk-field full"><label>适合场景</label><input id="target" value="短期提升播放量和歌曲热度"></div><div class="pk-field full"><label>套餐简介</label><textarea id="intro">作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div><div class="pk-field full"><label>标签</label><div class="pk-tag-editor"><div id="tagList"></div><input id="tagInput" placeholder="输入标签后按回车"></div></div><div class="pk-field"><label>排序</label><input id="sort" type="number" value="10"></div><div class="pk-field"><label>状态</label><select id="status"><option selected>上架</option><option>下架</option></select></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>套餐内容</h2><button class="pk-btn" id="addContentTop" type="button">＋ 添加内容</button></div><div class="pk-form-card-body"><div id="builder"></div><button class="pk-add-content" id="addContent" type="button">＋ 添加一个套餐内容</button></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>价格</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐售价</label><div class="pk-price-input"><span>¥</span><input id="price" type="number" value="799"></div></div><div class="pk-field"><label>划线价（可选）</label><div class="pk-price-input"><span>¥</span><input id="marketPrice" type="number" placeholder="例如 999"></div></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>前台展示</h2></div><div class="pk-form-card-body"><div class="pk-language-tabs"><button class="pk-lang active" type="button">简体中文</button><button class="pk-lang" type="button">English</button><button class="pk-lang" type="button">日本語</button><button class="pk-lang" type="button">繁體中文</button></div><div class="pk-form-grid"><div class="pk-field full"><label>套餐名称</label><input id="frontName" value="人气飙升包（一）"></div><div class="pk-field full"><label>套餐简介</label><textarea id="frontIntro">作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div><div class="pk-field full"><label>套餐亮点</label><input id="highlights" value="10,000+ 播放 | 1 张官方歌单 | 抖音 / 小红书任选"><div class="pk-help">使用 “|” 分隔，建议最多 3 条。</div></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option selected>推荐</option><option>热门</option><option>不展示</option></select></div></div><div class="pk-preview-inline"><span class="pk-preview-badge" id="previewBadge">推荐</span><div class="pk-preview-name" id="previewName">人气飙升包（一）</div><div class="pk-preview-desc" id="previewDesc">作品质量过关、想短期冲播放量榜单的音乐人。</div><div class="pk-preview-results" id="previewResults"></div><div class="pk-preview-price" id="previewPrice">¥799</div></div></div></section>
</div></div>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存套餐</button></div><div class="pk-toast" id="toast">套餐已保存（原型）</div>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const goals=[['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']];let selectedGoals=new Set(['plays','chart']);
const products={'netease-play':{name:'网易云音乐播放推广',specs:[['play-10000','10,000 次播放'],['play-24000','24,000 次播放'],['play-40000','40,000 次播放']]},'tme-play':{name:'TME 播放推广',specs:[['play-12500','12,500 次播放'],['play-30000','30,000 次播放'],['play-50000','50,000 次播放']]},'qq-playlist-chart':{name:'QQ 音乐官方歌单打榜',specs:[['official-playlist','1 张官方垂类歌单推荐'],['basic-chart','保底 20 万播放']]},'douyin-promotion':{name:'抖音投放',specs:[['gesture','手势舞号 · 10 个账号'],['lip-sync','对口型号 · 10 个账号'],['mixcut-10k','万粉混剪号 · 15 个账号']]},'xiaohongshu-promotion':{name:'小红书投放',specs:[['amateur-1-5k','素人投放（粉丝 1–5k）'],['koc-1-3w','KOC 投放（粉丝 1–3w）']]},'netease-favorites':{name:'网易云音乐红心收藏',specs:[['favorite-1000','1,000 个红心收藏']]},'resource-apply':{name:'平台资源位代申请',specs:[['resource-5','5 个资源位申请']]},'netease-playlist':{name:'网易云歌单矩阵',specs:[['playlist-18w','18 万 / 月总播放']]},'kugou-chart':{name:'酷狗音乐官方冲榜',specs:[['basic','基础冲榜'],['advanced','进阶冲榜'],['premium','高级冲榜']]}};
const productOptions=selected=>Object.entries(products).map(([id,p])=>`<option value="${id}" ${id===selected?'selected':''}>${p.name}</option>`).join('');const specOptions=(product,selected)=>products[product].specs.map(s=>`<option value="${s[0]}" ${s[0]===selected?'selected':''}>${s[1]}</option>`).join('');let tags=['核心流量','官方歌单','内容传播'];let items=[{mode:'choose',name:'核心流量',pick:1,options:[{product:'netease-play',spec:'play-10000',result:'10,000 次播放'},{product:'tme-play',spec:'play-12500',result:'12,500 次播放'}]},{mode:'included',name:'官方歌单',product:'qq-playlist-chart',spec:'official-playlist',result:'1 张官方垂类歌单推荐'},{mode:'choose',name:'内容传播',pick:1,options:[{product:'douyin-promotion',spec:'gesture',result:'10 个手势舞账号参与传播'},{product:'douyin-promotion',spec:'lip-sync',result:'10 个对口型账号参与传播'},{product:'xiaohongshu-promotion',spec:'amateur-1-5k',result:'3 个小红书素人账号参与传播'}]}];
function renderGoals(){document.getElementById('goalGrid').innerHTML=goals.map(g=>`<button type="button" class="pk-goal ${selectedGoals.has(g[0])?'active':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals()})}
function renderTags(){document.getElementById('tagList').innerHTML=tags.map((t,i)=>`<span class="pk-tag-chip">${t}<button type="button" data-tag-remove="${i}">×</button></span>`).join('');document.querySelectorAll('[data-tag-remove]').forEach(b=>b.onclick=()=>{tags.splice(+b.dataset.tagRemove,1);renderTags()})}document.getElementById('tagInput').onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const v=e.target.value.trim();if(v&&!tags.includes(v))tags.push(v);e.target.value='';renderTags()};
function typeText(x){return x.mode==='included'?'套餐直接包含':`用户任选 ${x.pick} 项`}function includedBody(x,i){return `<div class="pk-simple-rule"><div class="pk-simple-grid"><div class="pk-simple-field"><label>关联推广产品</label><select data-product="${i}">${productOptions(x.product)}</select></div><div class="pk-simple-field"><label>关联售卖规格</label><select data-spec="${i}">${specOptions(x.product,x.spec)}</select></div><div class="pk-simple-field full"><label>用户展示结果</label><input data-result="${i}" value="${x.result||''}"></div></div></div>`}function chooseBody(x,i){return `<div class="pk-simple-rule"><div class="pk-simple-grid"><div class="pk-simple-field"><label>用户需要选几项</label><select data-pick="${i}">${Array.from({length:Math.max(1,x.options.length)},(_,n)=>n+1).map(n=>`<option value="${n}" ${n===x.pick?'selected':''}>任选 ${n} 项</option>`).join('')}</select></div></div><div style="margin-top:10px">${x.options.map((o,j)=>`<div class="pk-option-row"><select data-option-product="${i}:${j}">${productOptions(o.product)}</select><select data-option-spec="${i}:${j}">${specOptions(o.product,o.spec)}</select><input data-option-result="${i}:${j}" value="${o.result}" placeholder="用户展示结果"><button class="pk-option-remove" data-option-remove="${i}:${j}" type="button">×</button></div>`).join('')}<button class="pk-add-option" data-add-option="${i}" type="button">＋ 添加可选方案</button></div></div>`}
function renderBuilder(){document.getElementById('builder').innerHTML=items.map((x,i)=>`<div class="pk-simple-item"><div class="pk-simple-head"><div class="pk-simple-title"><span>${i+1}</span><span>${x.name}</span><span class="pk-simple-type ${x.mode==='choose'?'choose':''}">${typeText(x)}</span></div><div class="pk-item-actions"><button data-up="${i}" type="button">上移</button><button data-down="${i}" type="button">下移</button><button data-remove="${i}" type="button">删除</button></div></div><div class="pk-simple-body"><div class="pk-simple-grid"><div class="pk-simple-field"><label>内容名称</label><input data-name="${i}" value="${x.name}"></div><div class="pk-simple-field"><label>用户获得方式</label><div class="pk-mode"><button class="${x.mode==='included'?'active':''}" data-mode="${i}:included" type="button">直接包含</button><button class="${x.mode==='choose'?'active':''}" data-mode="${i}:choose" type="button">让用户选择</button></div></div></div>${x.mode==='included'?includedBody(x,i):chooseBody(x,i)}</div></div>`).join('');bindBuilder();syncPreview()}
function bindBuilder(){document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>{items[+el.dataset.name].name=el.value});document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{const [i,m]=btn.dataset.mode.split(':');const x=items[+i];if(x.mode===m)return;if(m==='included'){const o=x.options?.[0]||{product:'netease-play',spec:'play-10000',result:''};items[+i]={mode:m,name:x.name,product:o.product,spec:o.spec,result:o.result}}else{items[+i]={mode:m,name:x.name,pick:1,options:[{product:x.product||'netease-play',spec:x.spec||'play-10000',result:x.result||''}]}}renderBuilder()});document.querySelectorAll('[data-product]').forEach(el=>el.onchange=()=>{const x=items[+el.dataset.product];x.product=el.value;x.spec=products[x.product].specs[0][0];renderBuilder()});document.querySelectorAll('[data-spec]').forEach(el=>el.onchange=()=>items[+el.dataset.spec].spec=el.value);document.querySelectorAll('[data-result]').forEach(el=>el.oninput=()=>items[+el.dataset.result].result=el.value);document.querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>items[+el.dataset.pick].pick=+el.value);document.querySelectorAll('[data-option-product]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionProduct.split(':').map(Number),o=items[i].options[j];o.product=el.value;o.spec=products[o.product].specs[0][0];renderBuilder()});document.querySelectorAll('[data-option-spec]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionSpec.split(':').map(Number);items[i].options[j].spec=el.value});document.querySelectorAll('[data-option-result]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionResult.split(':').map(Number);items[i].options[j].result=el.value});document.querySelectorAll('[data-option-remove]').forEach(el=>el.onclick=()=>{const [i,j]=el.dataset.optionRemove.split(':').map(Number);items[i].options.splice(j,1);items[i].pick=Math.min(items[i].pick,Math.max(1,items[i].options.length));renderBuilder()});document.querySelectorAll('[data-add-option]').forEach(el=>el.onclick=()=>{items[+el.dataset.addOption].options.push({product:'netease-play',spec:'play-10000',result:''});renderBuilder()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{items.splice(+el.dataset.remove,1);renderBuilder()});document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{const i=+el.dataset.up;if(i){[items[i-1],items[i]]=[items[i],items[i-1]];renderBuilder()}});document.querySelectorAll('[data-down]').forEach(el=>el.onclick=()=>{const i=+el.dataset.down;if(i<items.length-1){[items[i+1],items[i]]=[items[i],items[i+1]];renderBuilder()}})}
function syncPreview(){document.getElementById('previewName').textContent=document.getElementById('frontName').value||document.getElementById('name').value||'未命名套餐';document.getElementById('previewDesc').textContent=document.getElementById('frontIntro').value||document.getElementById('intro').value;document.getElementById('previewPrice').textContent='¥'+Number(document.getElementById('price').value||0).toLocaleString();document.getElementById('previewBadge').textContent=document.getElementById('badge').value;document.getElementById('previewResults').innerHTML=document.getElementById('highlights').value.split('|').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="pk-tag blue">${x}</span>`).join('')}['name','intro','price','frontName','frontIntro','highlights','badge'].forEach(id=>document.getElementById(id).addEventListener('input',syncPreview));function addContent(){items.push({mode:'included',name:'新套餐内容',product:'netease-play',spec:'play-10000',result:'10,000 次播放'});renderBuilder()}document.getElementById('addContent').onclick=addContent;document.getElementById('addContentTop').onclick=addContent;document.querySelectorAll('.pk-lang').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pk-lang').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function saved(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}document.getElementById('saveBottom').onclick=saved;const params=new URLSearchParams(location.search),mode=params.get('mode'),id=params.get('id')||'popular-1';if(mode==='copy'){document.getElementById('pageTitle').textContent='复制套餐';document.getElementById('crumb').textContent='复制套餐';document.getElementById('packageCode').value=id+'-copy'}else if(mode!=='edit'){document.getElementById('pageTitle').textContent='新增套餐';document.getElementById('crumb').textContent='新增套餐';document.getElementById('packageCode').value='';document.getElementById('name').value='';document.getElementById('frontName').value=''}else{document.getElementById('packageCode').value=id}renderGoals();renderTags();renderBuilder();syncPreview();
</script>
</body></html>
