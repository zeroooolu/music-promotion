<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑推广套餐｜星球发行 · 音乐推广 Admin</title><link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css"><style>
.pk-section-note{margin:0;color:#98a2af;font-size:11px}.pk-tag-editor{min-height:36px;border:1px solid #d3d8df;border-radius:4px;padding:5px 7px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:#fff}.pk-tag-editor:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pk-tag-editor input{border:0!important;box-shadow:none!important;height:24px!important;min-width:130px;flex:1;padding:0 3px!important}.pk-tag-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pk-tag-chip button{border:0;background:transparent;color:#8a97c9;padding:0;font-size:13px}.pk-mode{display:flex;gap:0;border:1px solid #d6dbe2;border-radius:4px;overflow:hidden;width:max-content}.pk-mode button{height:32px;padding:0 13px;border:0;border-right:1px solid #d6dbe2;background:#fff;color:#687483;font-size:11px}.pk-mode button:last-child{border-right:0}.pk-mode button.active{background:#eef2ff;color:#2448ff;font-weight:600}.pk-simple-item{border:1px solid #dde2e8;border-radius:6px;background:#fff;overflow:hidden}.pk-simple-head{height:46px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;background:#f8f9fb;border-bottom:1px solid #e9ecef}.pk-simple-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3d4652}.pk-simple-type{height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:999px;background:#f1f3f6;color:#6f7a87;font-size:10px}.pk-simple-type.choose{background:#eef2ff;color:#2448ff}.pk-simple-body{padding:14px}.pk-simple-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pk-simple-field label{display:block;color:#7f8b98;font-size:11px;margin-bottom:6px}.pk-simple-field input,.pk-simple-field select{width:100%;height:34px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;color:#445162;font-size:12px;background:#fff;outline:0}.pk-simple-field input:focus,.pk-simple-field select:focus{border-color:var(--brand)}.pk-simple-field.full{grid-column:1/-1}.pk-simple-rule{margin-top:13px;padding-top:13px;border-top:1px solid #edf0f3}.pk-simple-rule-title{font-size:11px;color:#7f8a97;margin-bottom:8px}.pk-option-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0f2f5}.pk-option-row:first-of-type{border-top:0}.pk-option-row input,.pk-option-row select{height:32px;border:1px solid #d6dbe2;border-radius:4px;padding:0 8px;font-size:11px;color:#465260;background:#fff}.pk-option-remove{width:26px;height:26px;border:0;background:transparent;color:#a1aab5;font-size:16px}.pk-add-option{border:0;background:transparent;color:var(--brand);font-size:11px;padding:6px 0}.pk-item-actions{display:flex;gap:8px}.pk-item-actions button{border:0;background:transparent;color:#7f8a97;font-size:11px;padding:0}.pk-item-actions .danger:hover{color:#c74747}.pk-add-content{width:100%;height:42px;border:1px dashed #bfc8d4;border-radius:5px;background:#fafbfc;color:#52647a;font-size:12px}.pk-add-content:hover{border-color:var(--brand);color:var(--brand);background:#f8f9ff}.pk-preview-meta{margin-top:12px;padding-top:12px;border-top:1px solid #eceff2;display:grid;gap:7px}.pk-preview-meta-row{display:flex;justify-content:space-between;font-size:11px}.pk-preview-meta-row span{color:#929daa}.pk-preview-meta-row strong{color:#465260;font-weight:500}
</style></head>
<body data-admin-page="packages" data-page-title="推广套餐 / 编辑套餐"><div id="admin-shell"></div><template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">编辑套餐</b></div>
<div class="page-header"><div><h1 id="pageTitle">编辑套餐</h1><p>把已有推广产品组合成用户容易理解、可以直接购买的套餐。</p></div><div class="pk-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBtn">保存套餐</button></div></div>
<div class="pk-form-layout"><div class="pk-form-main">
<section class="pk-form-card"><div class="pk-form-card-head"><h2>基本信息</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐名称</label><input id="name" value="人气飙升包（一）"></div><div class="pk-field"><label>适合目标</label><input id="target" value="短期提升播放量和歌曲热度"></div><div class="pk-field full"><label>简介</label><textarea id="intro">作品质量过关、想短期冲播放量榜单的音乐人。</textarea></div><div class="pk-field full"><label>标签</label><div class="pk-tag-editor" id="tagEditor"><div id="tagList"></div><input id="tagInput" placeholder="输入标签后按回车"></div><div class="pk-help">例如：核心流量、官方歌单、内容传播。</div></div><div class="pk-field"><label>排序</label><input id="sort" type="number" value="10"></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><div><h2>套餐包含什么</h2><p class="pk-section-note">按前台展示顺序添加。每一项只需要选择“直接包含”或“让用户选择”。</p></div></div><div class="pk-form-card-body"><div class="pk-builder" id="builder"></div><button class="pk-add-content" id="addContent" type="button">＋ 添加一个套餐内容</button></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>价格</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field"><label>套餐售价</label><div class="pk-price-input"><span>¥</span><input id="price" type="number" value="799"></div><div class="pk-help">前台只展示套餐总价，不拆分单个项目价格。</div></div><div class="pk-field"><label>划线价（可选）</label><div class="pk-price-input"><span>¥</span><input id="marketPrice" type="number" placeholder="例如 999"></div></div></div></div></section>
<section class="pk-form-card"><div class="pk-form-card-head"><h2>前台展示</h2></div><div class="pk-form-card-body"><div class="pk-form-grid"><div class="pk-field full"><label>套餐亮点</label><input id="highlights" value="10,000+ 播放 | 1 张官方歌单 | 抖音 / 小红书任选"><div class="pk-help">使用 “|” 分隔，建议最多 3 条，用于套餐卡片快速展示结果。</div></div><div class="pk-field"><label>推荐标记</label><select id="badge"><option>推荐</option><option>热门</option><option>不展示</option></select></div><div class="pk-field"><label>状态</label><select id="status"><option>上架</option><option>下架</option></select></div></div></div></section>
<div class="pk-form-actions"><a class="pk-btn" href="packages.html">取消</a><button class="pk-btn pk-btn-primary" id="saveBottom">保存套餐</button></div>
</div><aside class="pk-preview"><div class="pk-preview-head"><h2>前台预览</h2><p>预览用户在“官方推广套餐”中看到的核心信息。</p></div><div class="pk-preview-body"><div class="pk-preview-card"><span class="pk-preview-badge" id="previewBadge">推荐</span><div class="pk-preview-name" id="previewName">人气飙升包（一）</div><div class="pk-preview-desc" id="previewDesc"></div><div class="pk-preview-results" id="previewResults"></div><div class="pk-preview-foot"><div class="pk-preview-price"><small>套餐价</small><strong id="previewPrice">¥799</strong></div><button class="pk-preview-cta">选择套餐</button></div></div><div class="pk-preview-meta"><div class="pk-preview-meta-row"><span>适合目标</span><strong id="previewTarget"></strong></div><div class="pk-preview-meta-row"><span>状态</span><strong id="previewStatus">上架</strong></div></div></div></aside></div>
<div class="pk-toast" id="toast">套餐已保存</div>
</template><script src="../assets/js/admin-shell.js"></script><script>
const productOptions=[['netease-play','网易云音乐播放推广'],['tme-play','TME 播放推广'],['netease-playlist','网易云歌单矩阵'],['qq-playlist-chart','QQ 音乐官方歌单打榜'],['douyin-gesture','抖音投放'],['netease-diy-comments','网易云音乐红心收藏'],['resource-apply','资源位代申请']];
let tags=['核心流量','官方歌单','内容传播'];
let items=[{mode:'choose',name:'核心流量',pick:1,options:[{product:'netease-play',result:'10,000 次播放'},{product:'tme-play',result:'12,500 次播放'}]},{mode:'included',name:'官方歌单',product:'qq-playlist-chart',result:'1 张官方垂类歌单推荐'},{mode:'choose',name:'内容传播',pick:1,options:[{product:'douyin-gesture',result:'10 条手势舞内容'},{product:'douyin-gesture',result:'10 条对口型内容'},{product:'resource-apply',result:'3 个小红书素人账号'}]}];
const selectOptions=selected=>productOptions.map(x=>`<option value="${x[0]}" ${x[0]===selected?'selected':''}>${x[1]}</option>`).join('');
function typeText(x){return x.mode==='included'?'套餐直接包含':`用户任选 ${x.pick} 项`}
function renderTags(){document.getElementById('tagList').innerHTML=tags.map((t,i)=>`<span class="pk-tag-chip">${t}<button type="button" data-tag-remove="${i}">×</button></span>`).join('');document.querySelectorAll('[data-tag-remove]').forEach(b=>b.onclick=()=>{tags.splice(+b.dataset.tagRemove,1);renderTags()})}
const tagInput=document.getElementById('tagInput');tagInput.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const value=tagInput.value.trim();if(value&&!tags.includes(value))tags.push(value);tagInput.value='';renderTags()});
function renderBuilder(){document.getElementById('builder').innerHTML=items.map((x,i)=>`<div class="pk-simple-item"><div class="pk-simple-head"><div class="pk-simple-title"><span class="pk-builder-index">${i+1}</span><span>${x.name}</span><span class="pk-simple-type ${x.mode==='choose'?'choose':''}">${typeText(x)}</span></div><div class="pk-item-actions"><button data-up="${i}">上移</button><button data-down="${i}">下移</button><button class="danger" data-remove="${i}">删除</button></div></div><div class="pk-simple-body"><div class="pk-simple-grid"><div class="pk-simple-field"><label>这一项叫什么</label><input data-name="${i}" value="${x.name}"></div><div class="pk-simple-field"><label>用户怎么获得</label><div class="pk-mode"><button type="button" class="${x.mode==='included'?'active':''}" data-mode="${i}:included">直接包含</button><button type="button" class="${x.mode==='choose'?'active':''}" data-mode="${i}:choose">让用户选择</button></div></div></div>${x.mode==='included'?includedBody(x,i):chooseBody(x,i)}</div></div>`).join('');bindBuilder();syncPreview()}
function includedBody(x,i){return `<div class="pk-simple-rule"><div class="pk-simple-rule-title">这个结果直接包含在套餐里</div><div class="pk-simple-grid"><div class="pk-simple-field"><label>关联推广产品</label><select data-product="${i}">${selectOptions(x.product)}</select></div><div class="pk-simple-field"><label>用户最终看到的结果</label><input data-result="${i}" value="${x.result||''}" placeholder="例如：1 张官方垂类歌单推荐"></div></div></div>`}
function chooseBody(x,i){const max=Math.max(1,x.options.length);return `<div class="pk-simple-rule"><div class="pk-simple-grid"><div class="pk-simple-field"><label>用户需要选几项</label><select data-pick="${i}">${Array.from({length:max},(_,n)=>n+1).map(n=>`<option value="${n}" ${n===x.pick?'selected':''}>任选 ${n} 项</option>`).join('')}</select></div><div class="pk-simple-field"><label>可选方案</label><div class="pk-help" style="margin-top:9px">下面每一行就是用户可以选择的一个方案。</div></div></div><div style="margin-top:10px">${x.options.map((o,j)=>`<div class="pk-option-row"><select data-option-product="${i}:${j}">${selectOptions(o.product)}</select><input data-option-result="${i}:${j}" value="${o.result}" placeholder="用户看到的结果"><button class="pk-option-remove" data-option-remove="${i}:${j}" type="button">×</button></div>`).join('')}<button class="pk-add-option" data-add-option="${i}" type="button">＋ 添加一个可选方案</button></div></div>`}
function bindBuilder(){document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>{items[+el.dataset.name].name=el.value;syncPreview()});document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{const [i,mode]=btn.dataset.mode.split(':');const x=items[+i];if(x.mode===mode)return;if(mode==='included'){x.mode='included';x.product=x.options?.[0]?.product||'netease-play';x.result=x.options?.[0]?.result||'';delete x.options;delete x.pick}else{x.mode='choose';x.pick=1;x.options=[{product:x.product||'netease-play',result:x.result||''},{product:'tme-play',result:'新的推广结果'}];delete x.product;delete x.result}renderBuilder()});document.querySelectorAll('[data-product]').forEach(el=>el.onchange=()=>{items[+el.dataset.product].product=el.value});document.querySelectorAll('[data-result]').forEach(el=>el.oninput=()=>{items[+el.dataset.result].result=el.value;syncPreview()});document.querySelectorAll('[data-pick]').forEach(el=>el.onchange=()=>{items[+el.dataset.pick].pick=+el.value;renderBuilder()});document.querySelectorAll('[data-option-product]').forEach(el=>el.onchange=()=>{const [i,j]=el.dataset.optionProduct.split(':').map(Number);items[i].options[j].product=el.value});document.querySelectorAll('[data-option-result]').forEach(el=>el.oninput=()=>{const [i,j]=el.dataset.optionResult.split(':').map(Number);items[i].options[j].result=el.value;syncPreview()});document.querySelectorAll('[data-option-remove]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.optionRemove.split(':').map(Number);if(items[i].options.length<=1)return;items[i].options.splice(j,1);items[i].pick=Math.min(items[i].pick,items[i].options.length);renderBuilder()});document.querySelectorAll('[data-add-option]').forEach(b=>b.onclick=()=>{items[+b.dataset.addOption].options.push({product:'netease-play',result:'新的推广结果'});renderBuilder()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.remove,1);renderBuilder()});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}
function move(i,d){const n=i+d;if(n<0||n>=items.length)return;[items[i],items[n]]=[items[n],items[i]];renderBuilder()}
document.getElementById('addContent').onclick=()=>{items.push({mode:'included',name:'新的套餐内容',product:'netease-play',result:'填写用户最终获得的结果'});renderBuilder()};
function syncPreview(){const name=document.getElementById('name').value||'未命名套餐',intro=document.getElementById('intro').value||'',target=document.getElementById('target').value||'',price=Number(document.getElementById('price').value||0),highlights=document.getElementById('highlights').value.split('|').map(x=>x.trim()).filter(Boolean).slice(0,3),badge=document.getElementById('badge').value,status=document.getElementById('status').value;document.getElementById('previewName').textContent=name;document.getElementById('previewDesc').textContent=intro;document.getElementById('previewTarget').textContent=target||'—';document.getElementById('previewStatus').textContent=status;document.getElementById('previewPrice').textContent='¥'+price.toLocaleString('zh-CN');document.getElementById('previewBadge').textContent=badge;document.getElementById('previewBadge').style.display=badge==='不展示'?'none':'inline-flex';const fallback=items.slice(0,3).map(x=>x.mode==='included'?x.result:x.options?.[0]?.result);document.getElementById('previewResults').innerHTML=(highlights.length?highlights:fallback).filter(Boolean).map((x,i)=>`<div class="pk-preview-result"><strong>${x}</strong><span>${items[i]?.name||'套餐结果'}</span></div>`).join('')}
['name','intro','target','price','highlights'].forEach(id=>document.getElementById(id).addEventListener('input',syncPreview));['badge','status'].forEach(id=>document.getElementById(id).addEventListener('change',syncPreview));
function save(){const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');location.href='package-detail.html?id=popular-1'},650)}document.getElementById('saveBtn').onclick=save;document.getElementById('saveBottom').onclick=save;
const params=new URLSearchParams(location.search),mode=params.get('mode');if(!mode){document.getElementById('pageTitle').textContent='新增套餐';document.getElementById('crumb').textContent='新增套餐'}else if(mode==='copy'){document.getElementById('pageTitle').textContent='复制套餐';document.getElementById('crumb').textContent='复制套餐';document.getElementById('name').value+=' - 副本'}renderTags();renderBuilder();syncPreview();
</script></body></html>
