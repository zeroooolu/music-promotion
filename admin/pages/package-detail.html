<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css">
<style>

7px;border-radius:3px;background:#2448ff;color:#fff;font-size:10px}.pkg-preview-title{color:#20232a;font-size:17px;font-weight:600}.pkg-preview-list{display:grid;gap:9px;margin-top:18px}.pkg-preview-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;color:#515966;font-size:11px;line-height:18px}.pkg-check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#2448ff;font-size:9px;font-weight:700}.pkg-preview-fit{margin-top:14px;padding-top:11px;border-top:1px dashed #e7eaf0;color:#8a919b;font-size:11px}.pkg-preview-fit strong{color:#4c5460}.pkg-preview-note-line{margin-top:8px;color:#9299a4;font-size:10px}.pkg-preview-foot{position:absolute;left:20px;right:20px;bottom:18px}.pkg-preview-foot small{display:block;color:#9aa0aa;font-size:10px}.pkg-preview-foot b{display:block;margin-top:2px;font-size:22px;color:#20232a}@media(max-width:1000px){.pkg-info{grid-template-columns:repeat(2,minmax(0,1fr))}.pkg-preview-wrap{grid-template-columns:1fr}}
</style></head>
<body data-admin-page="packages" data-page-title="套餐详情"><div id="admin-shell"></div>
<template id="page-content">
<div class="pkg-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><strong id="breadcrumbName"></strong></div>
<div class="pkg-header"><div><div class="pkg-title-line"><h1 id="title"></h1><span class="pkg-badge" id="topBadge" hidden></span></div><div class="pkg-meta"><span><em>套餐编号</em><b id="metaCode"></b></span><span><em>套餐价</em><b id="metaPrice"></b></span><span><em>状态</em><b id="metaStatus"></b></span><span><em>排序</em><b id="metaSort"></b></span></div></div><a class="pk-btn pk-btn-primary" id="editLink">编辑</a></div>
<div class="pkg-tabs"><button class="pkg-tab active" data-tab="basic">基本信息</button><button class="pkg-tab" data-tab="content">套餐结构</button><button class="pkg-tab" data-tab="preview">前台预览</button></div>
<div class="pkg-panel active" data-panel="basic"><section class="pkg-card"><div class="pkg-card-body"><div class="pkg-info"><div class="pkg-field"><label>套餐名称</label><strong id="name"></strong></div><div class="pkg-field"><label>套餐价格</label><strong id="price"></strong></div><div class="pkg-field"><label>推荐标记</label><div id="badge"></div></div><div class="pkg-field full"><label>适合</label><div id="fit"></div></div><div class="pkg-field"><label>包含内容组</label><strong id="itemCount"></strong></div><div class="pkg-field"><label>含选择规则</label><strong id="choiceCount"></strong></div><div class="pkg-field"><label>状态</label><div id="status"></div></div><div class="pkg-field full" id="noteField" hidden><label>补差说明</label><div id="note"></div></div></div></div></section></div>
<div class="pkg-panel" data-panel="content"><section class="pkg-card"><div class="pkg-card-head"><h2>套餐内容组 → 可选方案 → 执行项</h2><span id="contentCount"></span></div><div class="pkg-card-body" id="contentList"></div></section></div>
<div class="pkg-panel" data-panel="preview"><section class="pkg-card"><div class="pkg-card-body"><div class="pkg-preview-wrap"><div class="pkg-preview-note">前台标签由选择规则自动计算，例如“四选一”“五选二”“最多选二项”。<br><br>如果某个内容组设置了默认方案且其他方案存在升级补差，则会自动显示类似“基础档已含”的状态，而不是后台手填标签。</div><div class="pkg-preview-card" id="previewCard"></div></div></div></section></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script src="../assets/js/package-catalog-data.js"></script>
<script>
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN'),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const id=new URLSearchParams(location.search).get('id')||'popular-1',x=getAdminPackage(id)||ADMIN_PACKAGE_CATALOG[0];
function saleItems(p){if(!p)return[];if(p.tiers)return p.tiers;if(p.specs)return p.specs;if(p.budget)return[{name:'连续预算',effectName:p.effectName,value:p.budget.referenceValue,unit:p.unit,price:p.budget.min}];return[]}
function execLabel(exec){if(exec.source==='package')return exec.name||'套餐专属内容';const p=getAdminProduct(exec.productId),s=saleItems(p)[Number(exec.saleIndex||0)];return exec.display||[p?.title,s?.name||`${s?.effectName||''} ${s?.value||''} ${s?.unit||''}`.trim()].filter(Boolean).join(' · ')}
function execMeta(exec){if(exec.source==='package')return '套餐专属内容';const p=getAdminProduct(exec.productId),s=saleItems(p)[Number(exec.saleIndex||0)];return [p?.title,s?.name||s?.effectName].filter(Boolean).join(' / ')}
$('title').textContent=$('breadcrumbName').textContent=$('name').textContent=x.name;$('metaCode').textContent=id;$('metaPrice').textContent=$('price').textContent=money(x.price);$('metaStatus').textContent=$('status').textContent=x.status;$('metaSort').textContent=x.sort;$('badge').textContent=x.badge||'不展示';$('fit').textContent=x.fit;$('itemCount').textContent=x.items.length+' 组';$('choiceCount').textContent=getAdminPackageChoiceItemCount(x)+' 组';$('contentCount').textContent=`共 ${x.items.length} 组`;$('editLink').href=`package-form.html?mode=edit&id=${x.id}`;if(x.badge){$('topBadge').hidden=false;$('topBadge').textContent=x.badge}if(x.note){$('noteField').hidden=false;$('note').textContent=x.note}
$('contentList').innerHTML=x.items.map((item,i)=>{const relation=getAdminPackageRelationLabel(item),summary=getAdminPackageSelectionSummary(item);return `<div class="pkg-group"><div class="pkg-group-head"><div class="pkg-group-title"><b>${i+1}. ${esc(item.title)}</b>${relation?`<span class="pkg-relation">${esc(relation)}</span>`:''}</div><span class="pkg-summary">${esc(summary)}</span></div><div class="pkg-options">${item.options.map((o,j)=>`<div class="pkg-option"><div class="pkg-option-head"><strong>${esc(o.name)}</strong><div class="pkg-option-meta">${Number(item.defaultOption)===j?'<span class="pkg-default">默认方案</span>':''}${o.addon?`<span class="pkg-addon">+${money(o.addon)}</span>`:''}<span>${esc(getAdminPackageExecutionRelationLabel(o)||`${o.executionItems.length} 个执行项`)}</span></div></div><div class="pkg-exec-list">${o.executionItems.map(e=>`<div class="pkg-exec"><div class="pkg-exec-main"><div><span class="pkg-source ${e.source==='package'?'package':''}">${e.source==='product'?'产品':'套餐专属'}</span><strong>${esc(execLabel(e))}</strong></div><small>${esc(execMeta(e))}</small></div></div>`).join('')}</div></div>`).join('')}</div></div>`}).join('');
$('previewCard').innerHTML=`${x.badge?`<span class="pkg-preview-badge">${esc(x.badge)}</span>`:''}<div class="pkg-preview-title">${esc(x.name)}</div><div class="pkg-preview-list">${x.items.map(i=>{const tag=getAdminPackageRelationLabel(i);return `<div class="pkg-preview-item"><span class="pkg-check">✓</span><div>${esc(i.title)}${tag?` <span class="pkg-relation">${esc(tag)}</span>`:''}</div></div>`}).join('')}</div><div class="pkg-preview-fit">适合：<strong>${esc(x.fit)}</strong></div>${x.note?`<div class="pkg-preview-note-line">${esc(x.note)}</div>`:''}<div class="pkg-preview-foot"><small>套餐价</small><b>${money(x.price)}</b></div>`;
document.querySelectorAll('.pkg-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.pkg-tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.pkg-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===btn.dataset.tab))});
</script></body></html>
