<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>套餐详情｜星球发行 · 音乐推广 Admin</title><link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css"></head>
<body data-admin-page="packages" data-page-title="推广套餐 / 套餐详情"><div id="admin-shell"></div><template id="page-content">
<div class="pk-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><b id="crumb">套餐详情</b></div>
<section class="pk-detail-head"><div><h1 id="title"></h1><div class="pk-detail-sub" id="intro"></div><div class="pk-detail-meta" id="meta"></div></div><div class="pk-actions"><a class="pk-btn" href="packages.html">返回列表</a><a class="pk-btn pk-btn-primary" id="editBtn">编辑套餐</a></div></section>
<section class="pk-section"><div class="pk-section-head"><h2>基本信息</h2></div><div class="pk-section-body"><div class="pk-info-grid" id="basic"></div></div></section>
<section class="pk-section"><div class="pk-section-head"><h2>套餐包含什么</h2><span class="pk-muted" id="contentCount"></span></div><div class="pk-section-body"><div class="pk-content-list" id="content"></div></div></section>
<section class="pk-section"><div class="pk-section-head"><h2>价格与前台展示</h2></div><div class="pk-section-body"><div class="pk-info-grid" id="displayInfo"></div></div></section>
</template><script src="../assets/js/admin-shell.js"></script><script>
const datasets={
'popular-1':{name:'人气飙升包（一）',target:'短期提升播放量和歌曲热度',intro:'作品质量过关、想短期冲播放量榜单的音乐人。',price:799,status:'上架',sort:10,tags:['核心流量','官方歌单','内容传播'],items:[{mode:'choose',name:'核心流量',result:'10,000 / 12,500 次播放',pick:1,options:[['网易云音乐播放推广','10,000 次播放'],['TME 播放推广','12,500 次播放']]},{mode:'included',name:'官方歌单',result:'1 张官方垂类歌单推荐',ref:'QQ音乐 / 网易云音乐垂类歌单推荐'},{mode:'choose',name:'内容传播',result:'10 条内容 / 3 个账号',pick:1,options:[['抖音 · 手势舞号','10 条'],['抖音 · 对口型号','10 条'],['小红书素人投放','3 个账号']]}],highlights:['10,000+ 播放','1 张官方歌单','抖音 / 小红书任选']},
'allround-2':{name:'全能打歌包（二）',target:'重点打歌、资源扶持和破圈传播',intro:'更高强度的播放、资源位和内容传播组合，适合重点作品形成破圈效应。',price:6600,status:'上架',sort:40,tags:['海量曝光','重点打歌','破圈'],items:[{mode:'choose',name:'核心流量',result:'40,000 / 50,000 次播放',pick:1,options:[['网易云音乐播放推广','40,000 次播放'],['TME 播放推广','50,000 次播放']]},{mode:'included',name:'官方歌单',result:'1 张官方垂类歌单推荐',ref:'QQ音乐 / 网易云音乐垂类歌单推荐'},{mode:'included',name:'资源位代申请',result:'保底 5 个资源位申请',ref:'覆盖 QQ音乐、网易云、酷狗、酷我、咪咕、Apple Music、Spotify 等平台'},{mode:'choose',name:'内容传播',result:'小红书种草 / 15 个抖音账号',pick:1,options:[['小红书种草','1 个 KOC + 3 个素人'],['抖音混剪','15 个优质账号']]},{mode:'choose',name:'红心收藏',result:'1,000 个收藏',pick:1,options:[['网易云音乐红心收藏','1,000 个'],['QQ音乐收藏','1,000 个']]}],highlights:['40,000+ 播放','5 个资源位','内容传播 + 收藏']}}
const id=new URLSearchParams(location.search).get('id')||'popular-1',d=datasets[id]||datasets['popular-1'];
document.getElementById('crumb').textContent=d.name;document.getElementById('title').textContent=d.name;document.getElementById('intro').textContent=d.intro;document.getElementById('editBtn').href=`package-form.html?mode=edit&id=${id}`;document.getElementById('meta').innerHTML=`<span class="pk-tag green">${d.status}</span>${d.tags.map(x=>`<span class="pk-tag">${x}</span>`).join('')}`;
document.getElementById('basic').innerHTML=`<div class="pk-info"><label>套餐名称</label><div>${d.name}</div></div><div class="pk-info"><label>适合目标</label><div>${d.target}</div></div><div class="pk-info"><label>当前售价</label><div class="pk-price">¥${d.price.toLocaleString('zh-CN')}</div></div><div class="pk-info"><label>排序</label><div>${d.sort}</div></div><div class="pk-info" style="grid-column:span 4"><label>简介</label><div>${d.intro}</div></div>`;
document.getElementById('contentCount').textContent=`${d.items.length} 项内容`;
document.getElementById('content').innerHTML=d.items.map((x,i)=>`<div class="pk-content-item"><div class="pk-content-row"><div><div class="pk-content-title">${i+1}. ${x.name}</div><div class="pk-content-result">${x.result}</div><div class="pk-content-meta">${x.mode==='included'?x.ref:`用户从下面方案中任选 ${x.pick} 项`}</div></div><span class="pk-kind">${x.mode==='included'?'套餐直接包含':`用户任选 ${x.pick} 项`}</span></div>${x.options?`<div class="pk-choice-options">${x.options.map(o=>`<div class="pk-choice-option"><strong>${o[0]}</strong><span>${o[1]}</span></div>`).join('')}</div>`:''}</div>`).join('');
document.getElementById('displayInfo').innerHTML=`<div class="pk-info"><label>套餐售价</label><div class="pk-price">¥${d.price.toLocaleString('zh-CN')}</div></div><div class="pk-info"><label>状态</label><div>${d.status}</div></div><div class="pk-info" style="grid-column:span 2"><label>标签</label><div>${d.tags.map(x=>`<span class="pk-tag">${x}</span>`).join('')}</div></div><div class="pk-info" style="grid-column:span 4"><label>套餐亮点</label><div>${d.highlights.map(x=>`<span class="pk-tag blue">${x}</span>`).join('')}</div></div>`;
</script></body></html>
