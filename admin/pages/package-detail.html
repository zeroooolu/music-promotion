<title>套餐详情｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css">
<style>

t-item{margin-top:12px}.pkg-content-head{padding:13px 15px;background:#f8f9fb;display:flex;align-items:center;justify-content:space-between;gap:16px}.pkg-content-title{display:flex;align-items:center;gap:8px}.pkg-content-title b{color:#3b4655;font-size:13px}.pkg-relation{height:19px;display:inline-flex;align-items:center;padding:0 6px;border-radius:10px;background:#eef2ff;color:#2448ff;font-size:9px}.pkg-mode{color:#8a95a3;font-size:11px}.pkg-option-table{width:100%;border-collapse:collapse}.pkg-option-table th{height:38px;padding:0 12px;background:#fff;border-top:1px solid #edf0f3;border-bottom:1px solid #edf0f3;text-align:left;color:#8a95a3;font-size:10px;font-weight:500}.pkg-option-table td{padding:11px 12px;border-bottom:1px solid #edf0f3;color:#526174;font-size:11px;line-height:1.55}.pkg-option-table tr:last-child td{border-bottom:0}.pkg-source{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:10px;background:#f1f3f6;color:#687483;font-size:9px}.pkg-source.product{background:#eef2ff;color:#2448ff}.pkg-ref{color:#40536d}.pkg-ref small{display:block;margin-top:2px;color:#9aa4b0}.pkg-addon{color:#2448ff;font-weight:600;white-space:nowrap}.pkg-preview-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}.pkg-preview-note{color:#788595;font-size:12px;line-height:1.8}.pkg-preview-card{position:relative;min-height:360px;padding:20px 20px 76px;border:1px solid #d9dde5;border-radius:4px;background:#fff}.pkg-preview-badge{position:absolute;right:15px;top:15px;padding:4px 7px;border-radius:3px;background:#2448ff;color:#fff;font-size:10px}.pkg-preview-title{color:#20232a;font-size:17px;font-weight:600}.pkg-preview-list{display:grid;gap:9px;margin-top:18px}.pkg-preview-item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;color:#515966;font-size:11px;line-height:18px}.pkg-check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#2448ff;font-size:9px;font-weight:700}.pkg-preview-fit{margin-top:14px;padding-top:11px;border-top:1px dashed #e7eaf0;color:#8a919b;font-size:11px}.pkg-preview-fit strong{color:#4c5460}.pkg-preview-note-line{margin-top:8px;color:#9299a4;font-size:10px}.pkg-preview-foot{position:absolute;left:20px;right:20px;bottom:18px}.pkg-preview-foot small{display:block;color:#9aa0aa;font-size:10px}.pkg-preview-foot b{display:block;margin-top:2px;font-size:22px;color:#20232a}@media(max-width:1000px){.pkg-info{grid-template-columns:repeat(2,minmax(0,1fr))}.pkg-preview-wrap{grid-template-columns:1fr}}
</style></head>
<body data-admin-page="packages" data-page-title="套餐详情"><div id="admin-shell"></div>
<template id="page-content">
<div class="pkg-breadcrumb"><a href="packages.html">推广套餐</a><span>/</span><strong id="breadcrumbName"></strong></div>
<div class="pkg-header"><div><div class="pkg-title-line"><h1 id="title"></h1><span class="pkg-badge" id="topBadge" hidden></span></div><div class="pkg-meta"><span><em>套餐编号</em><b id="metaCode"></b></span><span><em>套餐价</em><b id="metaPrice"></b></span><span><em>状态</em><b id="metaStatus"></b></span><span><em>排序</em><b id="metaSort"></b></span></div></div><a class="pk-btn pk-btn-primary" id="editLink">编辑</a></div>
<div class="pkg-tabs"><button class="pkg-tab active" data-tab="basic">基本信息</button><button class="pkg-tab" data-tab="content">套餐内容</button><button class="pkg-tab" data-tab="preview">前台预览</button></div>
<div class="pkg-panel active" data-panel="basic"><section class="pkg-card"><div class="pkg-card-body"><div class="pkg-info"><div class="pkg-field"><label>套餐名称</label><strong id="name"></strong></div><div class="pkg-field"><label>套餐价格</label><strong id="price"></strong></div><div class="pkg-field"><label>推荐标记</label><div id="badge"></div></div><div class="pkg-field full"><label>适合</label><div id="fit"></div></div><div class="pkg-field"><label>包含内容</label><strong id="itemCount"></strong></div><div class="pkg-field"><label>需要用户选择</label><strong id="choiceCount"></strong></div><div class="pkg-field"><label>状态</label><div id="status"></div></div><div class="pkg-field full" id="noteField" hidden><label>价格补差说明</label><div id="note"></div></div></div></div></section></div>
<div class="pkg-panel" data-panel="content"><section class="pkg-card"><div class="pkg-card-head"><h2>套餐包含内容</h2><span id="contentCount"></span></div><div class="pkg-card-body" id="contentList"></div></section></div>
<div class="pkg-panel" data-panel="preview"><section class="pkg-card"><div class="pkg-card-body"><div class="pkg-preview-wrap"><div class="pkg-preview-note">这里直接预览前台套餐卡片的核心展示元素：<strong>套餐名称、推荐标记、包含内容、四选一/三选一/二选一标签、适合场景和套餐价格</strong>。<br><br>套餐内容里的执行选项不会全部暴露在卡片上，而是在用户进入确认订单后展开。</div><div class="pkg-preview-card" id="previewCard"></div></div></div></section></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script src="../assets/js/package-catalog-data.js"></script>
<script>
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN'),esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const id=new URLSearchParams(location.search).get('id')||'popular-1',x=getAdminPackage(id)||ADMIN_PACKAGE_CATALOG[0];
function saleItems(p){if(!p)return[];if(p.tiers)return p.tiers;if(p.specs)return p.specs;if(p.budget)return[{name:'连续预算',effectName:p.effectName,value:p.budget.referenceValue,unit:p.unit,price:p.budget.min}];return[]}
function reference(option){if(option.source!=='product')return {source:'套餐专属内容',product:'—',sale:'—'};const p=getAdminProduct(option.productId),item=saleItems(p)[option.saleIndex||0];return {source:'引用产品',product:p?.title||option.productId,sale:item?.name||`${item?.effectName||''} ${item?.value||''} ${item?.unit||''}`.trim()||'默认规格'}}
$('title').textContent=$('breadcrumbName').textContent=$('name').textContent=x.name;$('metaCode').textContent=id;$('metaPrice').textContent=$('price').textContent=money(x.price);$('metaStatus').textContent=$('status').textContent=x.status;$('metaSort').textContent=x.sort;$('badge').textContent=x.badge||'不展示';$('fit').textContent=x.fit;$('itemCount').textContent=x.items.length+' 项';$('choiceCount').textContent=x.items.filter(i=>i.mode==='choose').length+' 项';$('contentCount').textContent=`共 ${x.items.length} 项`;$('editLink').href=`package-form.html?mode=edit&id=${x.id}`;if(x.badge){$('topBadge').hidden=false;$('topBadge').textContent=x.badge}if(x.note){$('noteField').hidden=false;$('note').textContent=x.note}
$('contentList').innerHTML=x.items.map((item,i)=>`<div class="pkg-content-item"><div class="pkg-content-head"><div class="pkg-content-title"><b>${i+1}. ${esc(item.title)}</b>${item.tag?`<span class="pkg-relation">${esc(item.tag)}</span>`:''}</div><span class="pkg-mode">${item.mode==='choose'?'用户选择 1 项':'直接包含'}</span></div><table class="pkg-option-table"><thead><tr><th>来源</th><th>关联产品 / 规格</th><th>确认订单中的选项文案</th><th>补差</th></tr></thead><tbody>${item.options.map(o=>{const r=reference(o);return `<tr><td><span class="pkg-source ${o.source==='product'?'product':''}">${r.source}</span></td><td><div class="pkg-ref">${esc(r.product)}<small>${esc(r.sale)}</small></div></td><td>${esc(o.label)}</td><td class="pkg-addon">${o.addon?`+${money(o.addon)}`:'—'}</td></tr>`}).join('')}</tbody></table></div>`).join('');
$('previewCard').innerHTML=`${x.badge?`<span class="pkg-preview-badge">${esc(x.badge)}</span>`:''}<div class="pkg-preview-title">${esc(x.name)}</div><div class="pkg-preview-list">${x.items.map(i=>`<div class="pkg-preview-item"><span class="pkg-check">✓</span><div>${esc(i.title)}${i.tag?` <span class="pkg-relation">${esc(i.tag)}</span>`:''}</div></div>`).join('')}</div><div class="pkg-preview-fit">适合：<strong>${esc(x.fit)}</strong></div>${x.note?`<div class="pkg-preview-note-line">${esc(x.note)}</div>`:''}<div class="pkg-preview-foot"><small>套餐价</small><b>${money(x.price)}</b></div>`;
document.querySelectorAll('.pkg-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.pkg-tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.pkg-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===btn.dataset.tab))});
</script></body></html>
