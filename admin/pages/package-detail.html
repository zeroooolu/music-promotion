<body data-admin-page="packages" data-page-title="套餐详情">
<div id="admin-shell"></div>
<template id="page-content">
<div class="pkg-breadcrumb"><a href="packages.html">推广套餐</a><span class="arrow"></span><strong id="breadcrumbName">套餐详情</strong></div>
<div class="pkg-object-header"><div class="pkg-object-title"><h1 id="title">人气飙升包（一）</h1><div class="pkg-object-meta"><span class="pkg-meta-item"><span class="pkg-meta-label">套餐编号</span><b id="metaCode"></b></span><span class="pkg-meta-item"><span class="pkg-meta-label">套餐价</span><b id="metaPrice"></b></span><span class="pkg-meta-item"><span class="pkg-meta-label">状态</span><b id="metaStatus"></b></span><span class="pkg-meta-item"><span class="pkg-meta-label">推荐标记</span><b id="metaBadge"></b></span><span class="pkg-meta-item"><span class="pkg-meta-label">更新时间</span><b id="metaUpdated"></b></span></div></div><a class="pk-btn pk-btn-primary" id="editLink" href="package-form.html?mode=edit&id=popular-1">编辑</a></div>

<script>

const commonContent=[{name:'核心流量',mode:'用户任选 1 项',options:[['网易云音乐播放推广','netease-play / play-10000','10,000 次播放'],['TME 播放推广','tme-play / play-12500','12,500 次播放']]},{name:'官方歌单',mode:'套餐直接包含',options:[['QQ 音乐官方歌单打榜','qq-playlist-chart / official-playlist','1 张官方垂类歌单推荐']]},{name:'内容传播',mode:'用户任选 1 项',options:[['抖音投放','douyin-promotion / gesture','10 个手势舞账号参与传播'],['小红书投放','xiaohongshu-promotion / amateur-1-5k','3 个素人账号参与传播']]}];
const data={'popular-1':{name:'人气飙升包（一）',goals:['plays','chart'],target:'短期提升播放量和歌曲热度',intro:'作品质量过关、想短期冲播放量榜单的音乐人。',price:799,marketPrice:'—',badge:'推荐',status:'上架',updated:'今天 12:28',highlights:['10,000+ 播放','1 张官方歌单','抖音 / 小红书任选'],content:commonContent},'popular-2':{name:'人气飙升包（二）',goals:['plays','chart'],target:'更高强度冲量与互动提升',intro:'更高播放量配合歌单和互动资源，适合加强冲量。',price:2199,marketPrice:'¥2,599',badge:'热门',status:'上架',updated:'今天 12:26',highlights:['24,000+ 播放','1 张官方歌单','内容 / 收藏'],content:commonContent},'allround-1':{name:'全能打歌包（一）',goals:['plays','playlist','social','chart'],target:'完整打歌与资源扶持',intro:'歌单、资源位置扶持和真实内容传播的完整打歌组合。',price:2899,marketPrice:'¥3,499',badge:'推荐',status:'上架',updated:'今天 12:24',highlights:['24,000+ 播放','5 个资源位','15 个账号'],content:commonContent},'allround-2':{name:'全能打歌包（二）',goals:['plays','playlist','social','chart'],target:'重点打歌、资源扶持和破圈传播',intro:'更高强度的播放与内容传播组合，适合重点作品破圈。',price:6600,marketPrice:'¥7,500',badge:'热门',status:'上架',updated:'今天 12:22',highlights:['40,000+ 播放','5 个资源位','内容 + 收藏'],content:commonContent},'chart-addon':{name:'冲榜选配包',goals:['playlist','chart'],target:'歌单矩阵与平台榜单冲刺',intro:'集中冲击歌单矩阵与平台榜单。',price:8600,marketPrice:'—',badge:'推荐',status:'上架',updated:'今天 12:20',highlights:['网易 18万/月','QQ 28万/月','酷狗冲榜'],content:commonContent}};
const params=new URLSearchParams(location.search),id=params.get('id')||'popular-1',x=data[id]||data['popular-1'];document.getElementById('title').textContent=x.name;document.getElementById('breadcrumbName').textContent=x.name;document.getElementById('metaCode').textContent=id;document.getElementById('metaPrice').textContent='¥'+x.price.toLocaleString();document.getElementById('metaStatus').textContent=x.status;document.getElementById('metaBadge').textContent=x.badge;document.getElementById('metaUpdated').textContent=x.updated;document.getElementById('editLink').href=`package-form.html?mode=edit&id=${id}`;document.getElementById('name').textContent=x.name;document.getElementById('code').textContent=id;document.getElementById('price').textContent='¥'+x.price.toLocaleString();document.getElementById('goals').innerHTML=x.goals.map(g=>`<span class="pkg-goal">${goalNames[g]}</span>`).join('');document.getElementById('target').textContent=x.target;document.getElementById('intro').textContent=x.intro;document.getElementById('marketPrice').textContent=x.marketPrice;document.getElementById('badge').textContent=x.badge;document.getElementById('status').textContent=x.status;document.getElementById('contentCount').textContent=`共 ${x.content.length} 项`;document.getElementById('contentList').innerHTML=x.content.map(item=>`<div class="pkg-content-group"><div class="pkg-content-title"><strong>${item.name}</strong><span>${item.mode}</span></div><div class="pkg-options">${item.options.map(o=>`<div class="pkg-option"><span>${o[0]}</span><strong class="pkg-code">${o[1]}</strong><strong>${o[2]}</strong></div>`).join('')}</div></div>`).join('');document.getElementById('frontBadge').textContent=x.badge;document.getElementById('frontName').textContent=x.name;document.getElementById('frontIntro').textContent=x.intro;document.getElementById('frontHighlights').innerHTML=x.highlights.map(h=>`<span class="pkg-tag">${h}</span>`).join('');document.getElementById('frontPrice').textContent='¥'+x.price.toLocaleString();document.querySelectorAll('.pkg-tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.pkg-tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.pkg-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===btn.dataset.tab))});
</script>
