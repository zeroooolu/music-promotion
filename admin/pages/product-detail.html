<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品详情｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
</head>
<body data-admin-page="products" data-page-title="产品列表 / 产品详情">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbName">产品详情</b></div>
  <section class="pd-detail-head"><div class="pd-detail-main"><div class="pd-detail-logo" id="logo">云</div><div class="pd-detail-title"><h1 id="title">网易云音乐播放推广</h1><div class="pd-detail-meta" id="meta"></div></div></div><div class="pd-detail-actions"><a class="pd-btn pd-btn-secondary" id="editBtn" href="#">编辑产品</a></div></section>
  <section class="pd-section"><div class="pd-section-head"><h2>基本信息</h2></div><div class="pd-section-body"><div class="pd-info-grid" id="basicInfo"></div></div></section>
  <section class="pd-section"><div class="pd-section-head"><h2 id="saleTitle">固定套餐</h2><a class="pd-btn pd-btn-primary" id="editSaleBtn" href="#">编辑配置</a></div><div class="pd-table-wrap"><table class="pd-spec-table"><thead id="saleHead"></thead><tbody id="saleBody"></tbody></table></div></section>
  <section class="pd-section"><div class="pd-section-head"><h2>前台内容</h2></div><div class="pd-section-body"><div class="pd-info-grid"><div class="pd-info-item" style="grid-column:span 2"><label>一句话介绍</label><div id="summary"></div></div><div class="pd-info-item" style="grid-column:span 2"><label>产品说明</label><div id="description"></div></div></div></div></section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id')||'netease-play';
const fixed={name:'网易云音乐播放推广',logo:'云',category:'播放推广',goal:'增加歌曲播放',platform:'网易云音乐 · DSP 平台',mode:'固定套餐',metric:'播放',summary:'选择固定套餐提升歌曲在网易云音乐内的播放量',description:'选择推广套餐后，按对应档位执行网易云音乐播放推广。',rows:[['体验套餐','保底结果','保底新增播放 1,980 次',99],['起量套餐','保底结果','保底新增播放 4,000 次',209],['加强套餐','保底结果','保底新增播放 10,000 次',509]]};
const douyin={name:'抖音投放',logo:'抖',category:'内容推广',goal:'短视频 / 内容传播',platform:'抖音 · 其他平台',mode:'按数量购买',metric:'参与账号 / 达人',summary:'选择不同类型的抖音账号组合推广歌曲',description:'可同时选择多个账号规格，每个规格按份购买并独立计价。',rows:[['素人号','2,000 个账号','¥3,600 / 份','1 份'],['万粉混剪号','15 个账号','¥1,500 / 份','1 份'],['十万粉混剪号','10 个账号','¥2,400 / 份','1 份'],['手势舞号','10 个账号','¥600 / 份','1 份'],['对口型号','10 个账号','¥600 / 份','1 份'],['剪映模板号','10 个账号','¥800 / 份','1 份'],['广场舞号','10 个账号','¥1,000 / 份','1 份']]};
const data=id==='douyin-gesture'?douyin:fixed;
document.getElementById('crumbName').textContent=data.name;document.getElementById('title').textContent=data.name;document.getElementById('logo').textContent=data.logo;document.getElementById('editBtn').href=`product-form.html?mode=edit&id=${id}`;document.getElementById('editSaleBtn').href=`product-form.html?mode=edit&id=${id}`;document.getElementById('meta').innerHTML=`<span class="pd-tag">${data.category}</span><span class="pd-tag blue">${data.goal}</span><span class="pd-tag">${data.platform}</span>`;document.getElementById('basicInfo').innerHTML=`<div class="pd-info-item"><label>产品名称</label><div>${data.name}</div></div><div class="pd-info-item"><label>所属类目</label><div>${data.category}</div></div><div class="pd-info-item"><label>适用推广目标</label><div><span class="pd-tag blue">${data.goal}</span></div></div><div class="pd-info-item"><label>平台</label><div>${data.platform}</div></div><div class="pd-info-item"><label>主要效果指标</label><div>${data.metric}</div></div><div class="pd-info-item"><label>售卖方式</label><div>${data.mode}</div></div>`;document.getElementById('summary').textContent=data.summary;document.getElementById('description').textContent=data.description;
if(id==='douyin-gesture'){document.getElementById('saleTitle').textContent='数量规格';document.getElementById('saleHead').innerHTML='<tr><th>规格名称</th><th>每份包含</th><th>每份售价</th><th>最低购买</th></tr>';document.getElementById('saleBody').innerHTML=data.rows.map(r=>`<tr><td class="pd-spec-name">${r[0]}</td><td>${r[1]}</td><td class="pd-price">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}else{document.getElementById('saleHead').innerHTML='<tr><th>套餐名称</th><th>结果类型</th><th>推广效果</th><th>售价</th></tr>';document.getElementById('saleBody').innerHTML=data.rows.map(r=>`<tr><td class="pd-spec-name">${r[0]}</td><td><span class="pd-tag">${r[1]}</span></td><td>${r[2]}</td><td class="pd-price">¥${Number(r[3]).toLocaleString('zh-CN')}</td></tr>`).join('')}
</script>
</body>
</html>
