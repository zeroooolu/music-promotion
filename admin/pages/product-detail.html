<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品详情｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/products.css">
</head>
<body data-admin-page="products" data-page-title="产品列表 / 产品详情">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b>网易云音乐播放推广</b></div>

  <section class="pd-detail-head">
    <div class="pd-detail-main">
      <div class="pd-detail-logo">云</div>
      <div class="pd-detail-title">
        <h1>网易云音乐播放推广</h1>
        <div class="pd-detail-meta"><span class="pd-tag">播放推广</span><span class="pd-tag">网易云音乐</span><span class="pd-tag blue">上架中</span></div>
      </div>
    </div>
    <div class="pd-detail-actions">
      <a class="pd-btn pd-btn-secondary" href="product-form.html?mode=edit&id=netease-play">编辑产品</a>
      <button class="pd-btn pd-btn-danger" type="button" onclick="alert('演示：产品已下架')">下架产品</button>
    </div>
  </section>

  <section class="pd-section">
    <div class="pd-section-head"><div><h2>基本信息</h2></div></div>
    <div class="pd-section-body">
      <div class="pd-info-grid">
        <div class="pd-info-item"><label>产品名称</label><div>网易云音乐播放推广</div></div>
        <div class="pd-info-item"><label>所属类目</label><div>播放推广</div></div>
        <div class="pd-info-item"><label>平台</label><div>网易云音乐</div></div>
        <div class="pd-info-item"><label>产品标识</label><div>netease-play</div></div>
        <div class="pd-info-item"><label>售卖方式</label><div>固定套餐</div></div>
        <div class="pd-info-item"><label>购买对象</label><div>歌曲</div></div>
        <div class="pd-info-item"><label>允许单独购买</label><div>是</div></div>
        <div class="pd-info-item"><label>允许加入 Package</label><div>是</div></div>
      </div>
    </div>
  </section>

  <section class="pd-section">
    <div class="pd-section-head">
      <div><h2>固定套餐与价格</h2><p>当前产品通过固定套餐售卖，每个套餐维护独立价格和服务结果。</p></div>
      <a class="pd-btn pd-btn-primary" href="product-form.html?mode=edit&id=netease-play">编辑套餐</a>
    </div>
    <div class="pd-table-wrap">
      <table class="pd-spec-table">
        <thead><tr><th>套餐名称</th><th>服务结果</th><th>销售价</th><th>内部成本</th><th>服务费</th><th>状态</th></tr></thead>
        <tbody id="specTableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="pd-section">
    <div class="pd-section-head"><div><h2>服务与履约</h2></div></div>
    <div class="pd-section-body">
      <div class="pd-info-grid">
        <div class="pd-info-item"><label>结果类型</label><div>保底结果</div></div>
        <div class="pd-info-item"><label>结果指标</label><div>播放量 · 次</div></div>
        <div class="pd-info-item"><label>履约周期</label><div>单次</div></div>
        <div class="pd-info-item"><label>允许追加购买</label><div>是</div></div>
      </div>
    </div>
  </section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const specs=[
{name:'600 播放',result:'600 次',price:39,cost:30,fee:0,status:'active'},
{name:'1,320 播放',result:'1,320 次',price:69,cost:66,fee:0,status:'active'},
{name:'1,980 播放',result:'1,980 次',price:99,cost:99,fee:0,status:'active'},
{name:'3,000 播放',result:'3,000 次',price:159,cost:150,fee:0,status:'active'},
{name:'4,000 播放',result:'4,000 次',price:209,cost:200,fee:0,status:'active'},
{name:'6,000 播放',result:'6,000 次',price:309,cost:300,fee:0,status:'active'},
{name:'10,000 播放',result:'10,000 次',price:519,cost:500,fee:10,status:'active'},
{name:'16,000 播放',result:'16,000 次',price:819,cost:800,fee:10,status:'active'},
{name:'24,000 播放',result:'24,000 次',price:1219,cost:1200,fee:10,status:'active'},
{name:'32,000 播放',result:'32,000 次',price:1619,cost:1600,fee:10,status:'active'},
{name:'40,000 播放',result:'40,000 次',price:2019,cost:2000,fee:10,status:'active'},
{name:'49,980 播放',result:'49,980 次',price:2509,cost:2499,fee:10,status:'active'}
];
const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2});
document.getElementById('specTableBody').innerHTML=specs.map(item=>`
<tr>
<td class="pd-spec-name">${item.name}</td>
<td>${item.result}</td>
<td class="pd-price">¥${fmt(item.price)}</td>
<td>¥${fmt(item.cost)}</td>
<td>¥${fmt(item.fee)}</td>
<td><span class="pd-status${item.status==='active'?'':' off'}">${item.status==='active'?'上架':'下架'}</span></td>
</tr>`).join('');
</script>
</body>
</html>
