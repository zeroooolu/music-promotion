else if(p.specs){set('specCount',p.specs.length+' 个规格');set('priceRange',range(p.specs.map(s=>s.price)));set('salesTitle','固定套餐规格');$('tableHead').innerHTML='<tr><th>#</th><th>规格名称</th><th>效果</th><th>售价</th><th>交付说明</th></tr>';$('specRows').innerHTML=p.specs.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.result||'—'}</td><td class="price">${money(s.price)}</td><td class="delivery">${s.delivery||'—'}</td></tr>`).join('')}
else if(p.quantity){set('specCount',p.quantity.length+' 个规格');set('priceRange',`${money(Math.min(...p.quantity.map(qMin)))} – ${money(Math.max(...p.quantity.map(qMax)))}`);set('salesTitle','数量规格');$('tableHead').innerHTML='<tr><th>#</th><th>规格名称</th><th>每份包含</th><th>价格</th><th>最低购买</th><th>案例</th></tr>';$('specRows').innerHTML=p.quantity.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td>${num(s.qty)} ${s.unit||p.unit}</td><td class="price">${qPrice(s)}</td><td>${s.minBuy} 份</td><td>${s.caseUrl?`<a class="pd-case-link" target="_blank" rel="noopener" href="${s.caseUrl}">查看案例</a>`:'—'}</td></tr>`).join('')}
document.querySelectorAll('.pd-object-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.pd-object-tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.pd-tab-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab))});
</script></body></html>
