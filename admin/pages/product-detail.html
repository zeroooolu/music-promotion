<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品详情｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
<style>
.pd-object-breadcrumb{display:flex;align-items:center;gap:10px;margin:0 0 22px;color:#93a0b1;font-size:13px}.pd-object-breadcrumb a{color:#718197;text-decoration:none}.pd-object-breadcrumb strong{color:#52637a;font-weight:500}.pd-object-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.pd-object-title h1{margin:0;color:#30343a;font-size:24px;font-weight:500}.pd-object-subtitle{max-width:760px;margin-top:8px;color:#7d8794;font-size:13px;line-height:1.7}.pd-object-meta{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;margin-top:10px;color:#43536a;font-size:13px}.pd-meta-item{display:inline-flex;align-items:center}.pd-meta-item+.pd-meta-item:before{content:"";width:1px;height:14px;background:#b8c0ca;margin:0 13px}.pd-meta-label{color:#8d99a8;margin-right:5px}.pd-object-tabs{display:flex;gap:24px;height:48px;margin-top:22px;border-bottom:1px solid #d9dde2}.pd-object-tab{height:48px;padding:0;border:0;background:transparent;color:#8b97a7;font-size:15px;cursor:pointer;position:relative}.pd-object-tab.active{color:var(--brand);font-weight:600}.pd-object-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}.pd-tab-panel{display:none}.pd-tab-panel.active{display:block}.pd-object-card{margin-top:16px;background:#fff;border:1px solid #d8dde3;border-radius:8px;overflow:hidden}.pd-object-card-head{min-height:54px;padding:0 24px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between}.pd-object-card-head h2{margin:0;color:#394b62;font-size:15px}.pd-object-card-body{padding:26px 24px 28px}.pd-object-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 52px}.pd-object-field.full{grid-column:1/-1}.pd-object-field label{display:block;margin-bottom:7px;color:#929fb1;font-size:13px}.pd-object-field .value{color:#40536d;font-size:14px;line-height:1.65;font-weight:500}.pd-object-field .value.normal{font-weight:400}.pd-object-goals{display:flex;flex-wrap:wrap;gap:6px}.pd-object-goal{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:999px;background:#eef2ff;color:var(--brand);font-size:11px}.pd-platform-value{display:flex;align-items:center;gap:9px}.pd-platform-icon{width:28px;height:28px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:10px;font-weight:700}.pd-status-inline{display:inline-flex;align-items:center;gap:7px}.pd-status-inline:before{content:"";width:7px;height:7px;border-radius:50%;background:#35b66f}.pd-summary-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #edf0f3;background:#fafbfc}.pd-summary-item{padding:17px 24px;border-right:1px solid #edf0f3}.pd-summary-item:last-child{border-right:0}.pd-summary-item span{display:block;color:#929fb1;font-size:12px}.pd-summary-item strong{display:block;margin-top:6px;color:#40536d;font-size:14px;font-weight:500}.pd-detail-table-wrap{overflow:auto}.pd-detail-table{width:100%;border-collapse:collapse;min-width:980px}.pd-detail-table th{height:42px;padding:0 16px;background:#eef0f2;border-bottom:1px solid #dfe3e7;color:#3e4854;font-size:13px;text-align:left}.pd-detail-table td{padding:14px 16px;border-bottom:1px solid #edf0f3;color:#44546a;font-size:13px;line-height:1.55}.pd-detail-table td.price{color:#30343a;font-weight:600;white-space:nowrap}.pd-detail-table .note{color:#6f7d8d}.pd-case-link{color:var(--brand);text-decoration:none}.pd-budget-rule{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.pd-rule{padding:13px 14px;border:1px solid #e3e7ed;border-radius:6px;background:#fafbfc}.pd-rule span{display:block;color:#929fb1;font-size:11px}.pd-rule strong{display:block;margin-top:5px;color:#40536d;font-size:13px}.pd-front-preview{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:center;padding:18px 20px;border:1px solid #e4e8ed;border-radius:6px;background:#fafbfc}.pd-front-preview h3{margin:0;color:#34465d;font-size:16px}.pd-front-preview p{margin:6px 0 0;color:#6d7b8e;font-size:12px;line-height:1.7}.pd-front-result{text-align:right;color:#66717e;font-size:11px}.pd-front-result strong{display:block;color:#2448ff;font-size:18px}.pd-front-result em{display:block;margin-top:4px;color:#98a1ad;font-style:normal}@media(max-width:1100px){.pd-object-info-grid,.pd-summary-strip,.pd-budget-rule,.pd-front-preview{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.pd-object-info-grid,.pd-summary-strip,.pd-budget-rule,.pd-front-preview{grid-template-columns:1fr}.pd-object-header{flex-direction:column}}
</style>
</head>
<body data-admin-page="products" data-page-title="产品详情"><div id="admin-shell"></div>
<template id="page-content">
<div class="pd-object-breadcrumb"><a href="products.html">产品列表</a><span>›</span><strong id="breadcrumbName">产品详情</strong></div>
<div class="pd-object-header"><div class="pd-object-title"><h1 id="title"></h1><div class="pd-object-subtitle" id="subtitle"></div><div class="pd-object-meta"><span class="pd-meta-item"><span class="pd-meta-label">类目</span><b id="metaCategory"></b></span><span class="pd-meta-item"><span class="pd-meta-label">平台</span><b id="metaPlatform"></b></span><span class="pd-meta-item"><span class="pd-meta-label">售卖方式</span><b id="metaMode"></b></span><span class="pd-meta-item"><span class="pd-meta-label">状态</span><b id="metaStatus"></b></span></div></div><a class="pd-btn pd-btn-primary" id="editLink">编辑</a></div>
<div class="pd-object-tabs"><button class="pd-object-tab active" data-tab="basic">产品信息</button><button class="pd-object-tab" data-tab="sales">售卖配置</button></div>
<div class="pd-tab-panel active" data-panel="basic"><section class="pd-object-card"><div class="pd-object-card-body"><div class="pd-object-info-grid"><div class="pd-object-field"><label>产品标题</label><div class="value" id="name"></div></div><div class="pd-object-field"><label>所属类目</label><div class="value" id="category"></div></div><div class="pd-object-field"><label>平台</label><div class="value pd-platform-value"><span class="pd-platform-icon" id="platformLogo"></span><span id="platform"></span></div></div><div class="pd-object-field full"><label>产品副标题</label><div class="value normal" id="basicSubtitle"></div></div><div class="pd-object-field full"><label>适用推广目标</label><div class="value pd-object-goals" id="goals"></div></div><div class="pd-object-field full"><label>内部备注</label><div class="value normal" id="internalNote"></div></div><div class="pd-object-field"><label>状态</label><div class="value"><span class="pd-status-inline" id="status"></span></div></div></div><div style="margin-top:24px"><div class="pd-front-preview"><div><h3 id="previewTitle"></h3><p id="previewSubtitle"></p></div><div class="pd-front-result"><strong id="previewEffect"></strong><em id="previewPrice"></em></div></div></div></div></section></div>
<div class="pd-tab-panel" data-panel="sales"><section class="pd-object-card"><div class="pd-summary-strip"><div class="pd-summary-item"><span>售卖方式</span><strong id="saleMode"></strong></div><div class="pd-summary-item"><span>配置数量</span><strong id="specCount"></strong></div><div class="pd-summary-item"><span>起始效果</span><strong id="startEffect"></strong></div><div class="pd-summary-item"><span>起售价</span><strong id="startPrice"></strong></div></div><div class="pd-object-card-head"><h2 id="salesTitle">售卖配置</h2></div><div id="continuousRule" class="pd-object-card-body" hidden><div class="pd-budget-rule" id="ruleGrid"></div></div><div id="configTable" class="pd-detail-table-wrap"><table class="pd-detail-table"><thead id="tableHead"></thead><tbody id="specRows"></tbody></table></div></section></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'netease-play';
const p=getAdminProduct(id)||ADMIN_PRODUCT_CATALOG[0];
const $=x=>document.getElementById(x),set=(x,v)=>{if($(x))$(x).textContent=v},money=n=>'¥'+Number(n||0).toLocaleString('zh-CN'),num=n=>Number(n||0).toLocaleString('zh-CN');
const effect=x=>x?`${x.effectName} ${num(x.value)} ${x.unit}`:'—';
set('title',p.title);set('subtitle',p.subtitle);set('breadcrumbName',p.title);set('metaCategory',p.category);set('metaPlatform',p.platform);set('metaMode',p.mode);set('metaStatus',p.status);set('name',p.title);set('basicSubtitle',p.subtitle);set('category',p.category);set('platformLogo',p.logo);set('platform',p.platform);set('internalNote',p.internalNote||'—');set('status',p.status);$('editLink').href=`product-form.html?mode=edit&id=${p.id}`;$('goals').innerHTML=p.goals.map(g=>`<span class="pd-object-goal">${ADMIN_PRODUCT_GOAL_NAMES[g]||g}</span>`).join('');
const first=getAdminProductFirstSaleItem(p),minPrice=getAdminProductMinPrice(p);set('previewTitle',p.title);set('previewSubtitle',p.subtitle);set('previewEffect',p.modeKey==='quantity'?`${p.specs[0]?.effectName||'效果'} · 按规格`:effect(first));set('previewPrice',Number.isFinite(minPrice)?`${money(minPrice)}${((p.tiers||p.specs||[]).length>1||p.budgetMode==='continuous')?' 起':''}`:'—');set('saleMode',p.mode);set('specCount',getAdminProductConfigLabel(p));set('startEffect',getAdminProductEffectSummary(p));set('startPrice',Number.isFinite(minPrice)?money(minPrice):'—');
if(p.modeKey==='budget'&&p.budgetMode==='continuous'){
  $('configTable').hidden=true;$('continuousRule').hidden=false;set('salesTitle','预算投放规则');
  const b=p.budget;const rules=[['效果名称',p.effectName],['效果单位',p.unit],['最低预算',money(b.min)],['最高预算',money(b.max)],['预算步长',money(b.step)],['参考预算',money(b.referenceBudget)],['参考效果',`${num(b.referenceValue)} ${p.unit}`]];
  $('ruleGrid').innerHTML=rules.map(r=>`<div class="pd-rule"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('');
}else if(p.modeKey==='quantity'){
  set('salesTitle','多规格可选');$('tableHead').innerHTML='<tr><th>#</th><th>规格名称</th><th>效果名称</th><th>每份数值</th><th>单位</th><th>售价</th><th>最低购买</th><th>案例</th></tr>';$('specRows').innerHTML=p.specs.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.effectName}</td><td>${num(s.value)}</td><td>${s.unit}</td><td class="price">${money(s.price)}</td><td>${s.minBuy||1} 份</td><td>${s.caseUrl?`<a class="pd-case-link" target="_blank" rel="noopener" href="${s.caseUrl}">查看案例</a>`:'—'}</td></tr>`).join('');
}else{
  const rows=p.tiers||p.specs||[];set('salesTitle',p.tiers?'固定预算档位':'固定档位');$('tableHead').innerHTML='<tr><th>#</th><th>档位名称</th><th>效果名称</th><th>数值</th><th>单位</th><th>售价</th><th>规格补充说明</th></tr>';$('specRows').innerHTML=rows.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name||`档位 ${i+1}`}</td><td>${s.effectName}</td><td>${num(s.value)}</td><td>${s.unit}</td><td class="price">${money(s.price)}</td><td class="note">${s.note||'—'}</td></tr>`).join('');
}
document.querySelectorAll('.pd-object-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.pd-object-tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.pd-tab-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab))});
</script></body></html>
