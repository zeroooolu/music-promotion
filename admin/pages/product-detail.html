<body data-admin-page="products" data-page-title="产品详情"><div id="admin-shell"></div>
<template id="page-content">
<div class="pd-object-breadcrumb"><a href="products.html">产品列表</a><span>›</span><strong id="breadcrumbName">产品详情</strong></div>
<div class="pd-object-header"><div class="pd-object-title"><h1 id="title"></h1><div class="pd-object-meta"><span class="pd-meta-item"><span class="pd-meta-label">类目</span><b id="metaCategory"></b></span><span class="pd-meta-item"><span class="pd-meta-label">平台</span><b id="metaPlatform"></b></span><span class="pd-meta-item"><span class="pd-meta-label">售卖方式</span><b id="metaMode"></b></span><span class="pd-meta-item"><span class="pd-meta-label">状态</span><b>上架</b></span></div></div><div class="pd-object-actions"><a class="pd-btn pd-btn-primary" id="editLink">编辑</a></div></div>
<div class="pd-object-tabs"><button class="pd-object-tab active" data-tab="basic">基本信息</button><button class="pd-object-tab" data-tab="sales">售卖配置</button><button class="pd-object-tab" data-tab="front">前台展示</button></div>
<div class="pd-tab-panel active" data-panel="basic"><section class="pd-object-card"><div class="pd-object-card-body"><div class="pd-object-info-grid"><div class="pd-object-field"><label>产品名称</label><div class="value" id="name"></div></div><div class="pd-object-field"><label>所属类目</label><div class="value" id="category"></div></div><div class="pd-object-field"><label>平台</label><div class="value pd-platform-value"><span class="pd-platform-icon" id="platformLogo"></span><span id="platform"></span></div></div><div class="pd-object-field"><label>主要效果指标</label><div class="value" id="metric"></div></div><div class="pd-object-field"><label>前台效果名称</label><div class="value" id="effectLabel"></div></div><div class="pd-object-field"><label>效果单位</label><div class="value" id="unit"></div></div><div class="pd-object-field full"><label>适用推广目标</label><div class="value pd-object-goals" id="goals"></div></div><div class="pd-object-field"><label>状态</label><div class="value"><span class="pd-status-inline">上架</span></div></div></div></div></section></div>

</template>
<script src="../assets/js/admin-shell.js"></script><script>
const goalNames={plays:'提升播放曝光',playlist:'进入更多歌单',social:'短视频 / 内容传播',global:'推广到海外',chart:'提升热度 / 冲榜',ktv:'上架到 KTV'};
const netease=[[45,600],[95,1320],[145,1980],[215,3000],[290,4000],[430,6000],[715,10000],[1150,16000],[1430,20000],[1720,24000],[2290,32000],[2860,40000],[3570,49980]],tme=[[45,750],[95,1650],[145,2475],[215,3750],[290,5000],[430,7500],[715,12500],[1150,20000],[1430,25000],[1720,30000],[2290,40000],[2860,50000],[3570,62475]];
const tierProduct=(name,platform,logo,tiers)=>({name,category:'播放推广',platform,logo,goals:['plays'],metric:'播放量',effectLabel:'保底新增真实播放',unit:'次',mode:'按预算投放',budgetMode:'固定预算档位',summary:'来源真实用户点击',tiers});
const data={
'netease-play':tierProduct('网易云音乐播放推广','网易云音乐','云',netease),'qq-play':tierProduct('QQ 音乐播放推广','QQ音乐','Q',tme),'kugou-play':tierProduct('酷狗音乐播放推广','酷狗音乐','酷',tme),'kuwo-play':tierProduct('酷我音乐播放推广','酷我音乐','我',tme),
'spotify-ads':{name:'Spotify 播放推广',category:'海外推广',platform:'Spotify',logo:'S',goals:['global'],metric:'播放量',effectLabel:'预计新增真实播放',unit:'次',mode:'按预算投放',budgetMode:'连续预算',summary:'通过 Spotify 官方广告系统精准触达海外听众',rule:[['最低预算','¥250'],['最高预算','¥2,000'],['预算步长','¥50'],['效果计算','按参考预算等比例估算'],['参考预算','¥250'],['参考效果','4,500 次']]},
'youtube-views':{name:'YouTube 播放推广',category:'海外推广',platform:'YouTube',logo:'YT',goals:['global'],metric:'播放量',effectLabel:'预计新增真实播放',unit:'次',mode:'按预算投放',budgetMode:'连续预算',summary:'通过 YouTube 官方广告系统提升视频播放',rule:[['最低预算','¥1,000'],['最高预算','¥20,000'],['预算步长','¥500'],['效果计算','按参考预算等比例估算']]},
'douyin-promotion':{name:'抖音投放',category:'内容推广',platform:'抖音',logo:'抖',goals:['social'],metric:'参与账号 / 达人',effectLabel:'参与传播',unit:'个账号',mode:'按数量购买',budgetMode:'—',summary:'达人内容合作，素人号到万粉号可自由组合购买',tiers:[[3600,2000],[600,10]]}
};
const id=new URLSearchParams(location.search).get('id')||'netease-play',p=data[id]||data['netease-play'],$=x=>document.getElementById(x),set=(x,v)=>{if($(x))$(x).textContent=v},money=n=>'¥'+Number(n).toLocaleString('zh-CN'),num=n=>Number(n).toLocaleString('zh-CN');
set('title',p.name);set('breadcrumbName',p.name);set('metaCategory',p.category);set('metaPlatform',p.platform);set('metaMode',p.mode);set('name',p.name);set('category',p.category);set('platformLogo',p.logo);set('platform',p.platform);set('metric',p.metric);set('effectLabel',p.effectLabel);set('unit',p.unit);set('saleMode',p.mode);set('budgetMode',p.budgetMode);set('frontName',p.name);set('frontPlatform',p.platform);set('summary',p.summary);set('previewName',p.name);set('previewSummary',p.summary);$('editLink').href=`product-form.html?mode=edit&id=${id}`;$('goals').innerHTML=p.goals.map(g=>`<span class="pd-object-goal">${goalNames[g]||g}</span>`).join('');
if(p.budgetMode==='连续预算'){set('specCount','连续区间');set('priceRange',p.rule?.[0]?.[1]+' – '+p.rule?.[1]?.[1]);$('tierTable').hidden=true;$('continuousRule').hidden=false;$('ruleGrid').innerHTML=(p.rule||[]).map(r=>`<div class="pd-rule"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('');set('salesTitle','连续预算规则')}else{const tiers=p.tiers||[];set('specCount',tiers.length+' 个档位');set('priceRange',tiers.length?`${money(Math.min(...tiers.map(t=>t[0])))} – ${money(Math.max(...tiers.map(t=>t[0])))}`:'—');$('specRows').innerHTML=tiers.map((t,i)=>`<tr><td>${i+1}</td><td class="price">${money(t[0])}</td><td>${num(t[1])} ${p.unit}</td><td>${p.effectLabel} ${num(t[1])} ${p.unit}</td></tr>`).join('');set('salesTitle',p.budgetMode==='固定预算档位'?'固定预算档位':'售卖规格')}
document.querySelectorAll('.pd-object-tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.pd-object-tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.pd-tab-panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.panel===tab.dataset.tab))});
</script></body></html>
