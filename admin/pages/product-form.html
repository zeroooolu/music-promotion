<html lang="zh-CN">
<head>

<title>新增 / 编辑产品｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/products.css">
<style>
[hidden]{display:none!important}.pd-form-layout{grid-template-columns:minmax(0,1fr)!important}.pd-sale-mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pd-sale-mode-card{min-height:84px;border:1px solid #d8dde5;background:#fff;border-radius:6px;padding:16px;text-align:left}.pd-sale-mode-card:hover{border-color:#9cacff}.pd-sale-mode-card.active{border-color:#2448ff;background:#f5f7ff}.pd-sale-mode-card strong{display:block;font-size:14px;color:#303b4a;margin-bottom:7px}.pd-sale-mode-card small{font-size:12px;color:#7b8796}.pd-card-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pd-table-editor-wrap{overflow:visible;position:relative;border:1px solid #e1e5ea;border-radius:5px}.pd-editor-table{width:100%;border-collapse:collapse;min-width:760px}.pd-editor-table tr{position:relative}.pd-editor-table tr:has(.pd-mini-select.open){z-index:90}.pd-editor-table th{height:42px;background:#f2f3f5;border-bottom:1px solid #e2e5e9;padding:0 10px;text-align:left;font-size:12px;color:#4d5662}.pd-editor-table td{position:relative;padding:9px 10px;border-bottom:1px solid #eceff2;overflow:visible}.pd-editor-table tr:last-child td{border-bottom:0}.pd-editor-table input{width:100%;height:34px;border:1px solid #d5dbe2;border-radius:4px;padding:0 9px;outline:none}.pd-editor-table input:focus{border-color:#2448ff;box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pd-row-remove{border:0;background:transparent;color:#d65252}.pd-row-remove:disabled{color:#c1c7cf}.pd-config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}.pd-config-field.full{grid-column:1/-1}.pd-config-field label{display:block;font-size:12px;color:#52637a;margin-bottom:7px}.pd-config-field input{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;padding:0 10px;outline:none}.pd-config-field input:focus{border-color:#2448ff}.pd-inline-unit{display:grid;grid-template-columns:34px 1fr}.pd-inline-unit span{height:38px;display:grid;place-items:center;border:1px solid #d5dbe2;border-right:0;background:#f7f8fa;border-radius:4px 0 0 4px;color:#7c8794}.pd-inline-unit input{border-radius:0 4px 4px 0}.pd-select-wrap,.pd-platform-picker,.pd-mini-select{position:relative;max-width:520px}.pd-select-box,.pd-platform-trigger,.pd-mini-trigger{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;background:#fff;padding:0 36px 0 11px;text-align:left;color:#394b60;position:relative}.pd-select-box:after,.pd-platform-trigger:after,.pd-mini-trigger:after{content:'⌄';position:absolute;right:12px;top:8px;color:#8b97a5}.placeholder{color:#a3acb7!important}.pd-select-wrap.open .pd-select-menu,.pd-platform-picker.open .pd-platform-dropdown,.pd-mini-select.open .pd-mini-menu{display:block}.pd-select-menu,.pd-platform-dropdown,.pd-mini-menu{display:none;position:absolute;z-index:120;left:0;right:0;top:44px;background:#fff;border:1px solid #d8dde5;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14);overflow:hidden}.pd-select-option,.pd-mini-option{padding:10px 12px;font-size:13px;color:#42546b;cursor:pointer;background:#fff}.pd-select-option:hover,.pd-mini-option:hover{background:#f5f7ff;color:#2448ff}.pd-platform-source{display:flex;gap:8px;margin-bottom:10px}.pd-source-choice{height:34px;padding:0 13px;border:1px solid #d8dde5;background:#fff;border-radius:4px;color:#66758a}.pd-source-choice.active{border-color:#2448ff;color:#2448ff;background:#f5f7ff}.pd-platform-search{padding:10px;border-bottom:1px solid #edf0f3}.pd-platform-search input{width:100%;height:34px;border:1px solid #d5dbe2;border-radius:4px;padding:0 10px;outline:none}.pd-platform-results{max-height:250px;overflow:auto}.pd-platform-option{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}.pd-platform-option:hover{background:#f6f8ff}.pd-platform-option-icon{width:30px;height:30px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:11px;font-weight:700}.pd-platform-option strong{display:block;font-size:13px}.pd-platform-option small{display:block;margin-top:2px;color:#99a3af;font-size:11px}.pd-other-platform{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px;max-width:520px}.pd-other-platform input[type=text]{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;padding:0 10px}.pd-icon-upload{height:38px;border:1px dashed #cfd5de;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#66758a;font-size:12px;cursor:pointer}.pd-icon-upload input{display:none}.pd-goal-grid{display:flex;flex-wrap:wrap;gap:8px}.pd-goal-choice{height:32px;border:1px solid #d8dde5;border-radius:4px;background:#fff;padding:0 11px;color:#607187}.pd-goal-choice.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pd-goal-choice.locked:after{content:'主';display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#dfe5ff;color:#2448ff;font-size:9px}.pd-mini-select{max-width:none;z-index:1}.pd-mini-select.open{z-index:110}.pd-mini-trigger{height:34px}.pd-mini-menu{top:40px;z-index:130}.pd-money{display:grid;grid-template-columns:28px 1fr}.pd-money span{height:34px;display:grid;place-items:center;border:1px solid #d5dbe2;border-right:0;background:#f7f8fa;border-radius:4px 0 0 4px;color:#7b8795}.pd-money input{height:34px;border-radius:0 4px 4px 0}.pd-effect-summary{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f7f9fc;border:1px solid #e5e9ef;border-radius:5px;color:#7b8796;font-size:12px}.pd-effect-summary strong{color:#34475d;font-size:13px}.pd-effect-value{display:flex;align-items:center;gap:6px}.pd-effect-value input{width:100px!important}.pd-effect-value .dash{color:#a0a7b0}.pd-effect-unit{color:#8b95a1;font-size:12px;white-space:nowrap}.pd-form-actions{z-index:10}@media(max-width:800px){.pd-sale-mode-grid,.pd-config-grid{grid-template-columns:1fr}.pd-config-field.full{grid-column:auto}.pd-other-platform{grid-template-columns:1fr}}
</style>
</head>
<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
  <div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>
  <div class="pd-form-layout"><div>
    <section class="pd-form-card"><div class="pd-form-card-head"><h2>基本信息</h2></div><div class="pd-form-body">
      <div class="pd-form-row"><div class="pd-form-label pd-required">产品名称</div><div class="pd-form-control"><input id="name" placeholder="例如：抖音投放"></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">所属类目</div><div class="pd-form-control"><div class="pd-select-wrap" id="categorySelect"><button class="pd-select-box placeholder" type="button">请选择产品类目</button><div class="pd-select-menu"></div></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">适用推广目标</div><div class="pd-form-control"><div class="pd-goal-grid" id="goalGrid"></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">平台</div><div class="pd-form-control">
        <div class="pd-platform-source"><button class="pd-source-choice active" type="button" data-source="dsp">DSP 平台</button><button class="pd-source-choice" type="button" data-source="other">其他平台</button></div>
        <div id="dspPlatformPanel"><div class="pd-platform-picker" id="platformPicker"><button class="pd-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button><div class="pd-platform-dropdown"><div class="pd-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div><div class="pd-platform-results" id="platformResults"></div></div></div></div>
        <div id="otherPlatformPanel" hidden><div class="pd-other-platform"><input id="otherPlatformName" type="text" placeholder="平台名称，例如：小红书、哔哩哔哩、抖音"><label class="pd-icon-upload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/*"></label></div></div>
      </div></div>
      <div class="pd-form-row"><div class="pd-form-label">内部备注</div><div class="pd-form-control"><textarea id="internalNote" placeholder="仅后台可见"></textarea></div></div>
    </div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>推广效果</h2></div><div class="pd-form-body">
      <div class="pd-form-row"><div class="pd-form-label pd-required">主要效果指标</div><div class="pd-form-control"><div class="pd-select-wrap" id="metricSelect"><button class="pd-select-box" type="button">播放</button><div class="pd-select-menu"></div></div></div></div>
      <div class="pd-effect-summary"><span>前台统一表达</span><strong id="metricPreview">新增播放</strong><span id="metricUnitPreview">· 单位：次</span></div>
    </div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>售卖方式</h2></div><div class="pd-form-body"><div class="pd-sale-mode-grid">
      <button class="pd-sale-mode-card active" type="button" data-sale-mode="fixed"><strong>固定套餐</strong><small>一个或多个固定价格档位</small></button>
      <button class="pd-sale-mode-card" type="button" data-sale-mode="quantity"><strong>按数量购买</strong><small>一个产品可配置多个可同时购买的规格</small></button>
      <button class="pd-sale-mode-card" type="button" data-sale-mode="budget"><strong>按预算投放</strong><small>用户输入投放预算</small></button>
    </div><input type="hidden" id="saleMode" value="fixed"></div></section>

    <section class="pd-form-card pd-sale-config" id="fixedConfig"><div class="pd-form-card-head"><div class="pd-card-title-row"><h2>固定套餐</h2><button class="pd-btn pd-btn-secondary" id="addPackageBtn" type="button">＋ 添加套餐</button></div></div><div class="pd-form-body"><div class="pd-table-editor-wrap"><table class="pd-editor-table"><thead><tr><th>套餐名称</th><th>结果类型</th><th>推广效果</th><th>售价</th><th></th></tr></thead><tbody id="packageRows"></tbody></table></div></div></section>

    <section class="pd-form-card pd-sale-config" id="quantityConfig" hidden><div class="pd-form-card-head"><div class="pd-card-title-row"><h2>数量规格</h2><button class="pd-btn pd-btn-secondary" id="addQuantitySpecBtn" type="button">＋ 添加规格</button></div></div><div class="pd-form-body"><div class="pd-table-editor-wrap"><table class="pd-editor-table"><thead><tr><th>规格名称</th><th>每份包含</th><th>单位</th><th>每份售价</th><th>最低购买</th><th></th></tr></thead><tbody id="quantitySpecRows"></tbody></table></div></div></section>

    <section class="pd-form-card pd-sale-config" id="budgetConfig" hidden><div class="pd-form-card-head"><h2>按预算投放</h2></div><div class="pd-form-body"><div class="pd-config-grid">
      <div class="pd-config-field"><label>最低预算</label><input id="budgetMin" type="number" min="0" value="1000"></div>
      <div class="pd-config-field"><label>预算步长</label><input id="budgetStep" type="number" min="1" value="500"></div>
      <div class="pd-config-field"><label>结果类型</label><div class="pd-mini-select" id="budgetResultTypeSelect"><button class="pd-mini-trigger" type="button">预估结果</button><div class="pd-mini-menu"></div></div></div>
      <div class="pd-config-field"><label>参考预算</label><input id="budgetReference" type="number" min="1" value="1000"></div>
      <div class="pd-config-field full"><label>推广效果</label><div class="pd-effect-value"><input id="budgetEffectMin" type="number" min="0" value="1800"><span class="dash">–</span><input id="budgetEffectMax" type="number" min="0" value="2500"><span class="pd-effect-unit" id="budgetEffectUnit">次播放</span></div></div>
    </div><div class="pd-effect-summary"><span>前台展示示例</span><strong id="budgetEffectPreview">预算 1,000 · 预计新增播放 1,800–2,500 次</strong></div></div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>前台内容</h2></div><div class="pd-form-body">
      <div class="pd-language-tabs"><button class="pd-language-tab active" data-lang="zh" type="button">简体中文</button><button class="pd-language-tab" data-lang="en" type="button">English</button><button class="pd-language-tab" data-lang="ja" type="button">日本語</button><button class="pd-language-tab" data-lang="zh-Hant" type="button">繁體中文</button></div>
      <div class="pd-form-row" id="translatedNameRow" hidden><div class="pd-form-label">产品名称</div><div class="pd-form-control"><input id="translatedName"></div></div>
      <div class="pd-form-row"><div class="pd-form-label">一句话介绍</div><div class="pd-form-control"><input id="summary" placeholder="用于产品卡片"></div></div>
      <div class="pd-form-row"><div class="pd-form-label">产品说明</div><div class="pd-form-control"><textarea id="description" placeholder="用于用户侧了解服务内容"></textarea></div></div>
    </div></section>
  </div></div>
  <div class="pd-form-actions"><a class="pd-btn pd-btn-secondary" id="cancelBtn" href="products.html">取消</a><button class="pd-btn pd-btn-primary" id="saveBtn" type="button">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script src="../assets/js/product-platform-data.js"></script>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),editing=params.get('mode')==='edit',editingId=params.get('id')||'';
let selectedCategory='',selectedGoals=[],platformSource='dsp',selectedPlatform=null,selectedMetric='plays',budgetResultType='estimated';
let packages=[{name:'体验套餐',type:'guaranteed',min:'1980',max:'',price:'99'}];
let quantitySpecs=[{name:'翻唱账号',quantity:'10',unit:'个账号',price:'600',minBuy:'1'},{name:'音乐推荐账号',quantity:'10',unit:'个账号',price:'800',minBuy:'1'}];
const metrics=[
{value:'plays',label:'播放',unit:'次',front:'新增播放'},
{value:'impressions',label:'曝光',unit:'次',front:'获得曝光'},
{value:'content',label:'传播内容',unit:'条',front:'内容参与传播'},
{value:'accounts',label:'参与账号 / 达人',unit:'个',front:'账号 / 达人参与传播'},
{value:'playlist',label:'歌单收录',unit:'个',front:'进入歌单'},
{value:'engagement',label:'互动',unit:'次',front:'获得互动'},
{value:'ranking',label:'排名',unit:'名',front:'榜单排名'},
{value:'coverage',label:'渠道覆盖',unit:'个',front:'覆盖渠道'}
];
const resultTypes=[{value:'fixed',label:'固定结果'},{value:'guaranteed',label:'保底结果'},{value:'estimated',label:'预估结果'}];
const quantityUnits=['个账号','个达人','条内容','条','次','个'];
const metric=()=>metrics.find(x=>x.value===selectedMetric)||metrics[0];
function closeAll(){document.querySelectorAll('.pd-select-wrap.open,.pd-platform-picker.open,.pd-mini-select.open').forEach(x=>x.classList.remove('open'))}document.addEventListener('click',closeAll);
function setupSimpleSelect(root,options,onSelect){const trigger=root.querySelector('button'),menu=root.querySelector('div');menu.innerHTML=options.map(o=>`<div class="pd-mini-option" data-value="${o.value}">${o.label}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};menu.querySelectorAll('[data-value]').forEach(el=>el.onclick=e=>{e.stopPropagation();onSelect(el.dataset.value);trigger.textContent=el.textContent;root.classList.remove('open')})}
function renderCategory(){const root=$('categorySelect'),trigger=root.querySelector('.pd-select-box'),menu=root.querySelector('.pd-select-menu');menu.innerHTML=PRODUCT_CATEGORIES.filter(c=>c.status==='on').map(c=>`<div class="pd-select-option" data-id="${c.id}">${c.names.zhCN}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};menu.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedCategory=el.dataset.id;const c=getProductCategory(selectedCategory);trigger.textContent=c.names.zhCN;trigger.classList.remove('placeholder');root.classList.remove('open');if(!selectedGoals.includes(c.goalId))selectedGoals.unshift(c.goalId);renderGoals()})}
function renderGoals(){const c=selectedCategory?getProductCategory(selectedCategory):null,primary=c?.goalId;$('goalGrid').innerHTML=PROMOTION_GOALS.map(g=>`<button type="button" class="pd-goal-choice${selectedGoals.includes(g.id)?' active':''}${g.id===primary?' locked':''}" data-goal="${g.id}">${g.name}</button>`).join('');$('goalGrid').querySelectorAll('[data-goal]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.goal===primary)return;selectedGoals=selectedGoals.includes(btn.dataset.goal)?selectedGoals.filter(x=>x!==btn.dataset.goal):[...selectedGoals,btn.dataset.goal];renderGoals()})}
function renderMetric(){const root=$('metricSelect'),trigger=root.querySelector('.pd-select-box'),menu=root.querySelector('.pd-select-menu');menu.innerHTML=metrics.map(m=>`<div class="pd-select-option" data-metric="${m.value}">${m.label}</div>`).join('');trigger.textContent=metric().label;trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};menu.querySelectorAll('[data-metric]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedMetric=el.dataset.metric;root.classList.remove('open');renderMetric();renderPackages();updateBudgetEffectPreview()});$('metricPreview').textContent=metric().front;$('metricUnitPreview').textContent=`· 单位：${metric().unit}`;$('budgetEffectUnit').textContent=`${metric().unit}${metric().label}`}
function renderPlatformResults(q=''){const key=q.trim().toLowerCase(),list=PRODUCT_PLATFORM_LIBRARY.filter(p=>!key||[p.name,p.code,...(p.keywords||[])].join(' ').toLowerCase().includes(key));$('platformResults').innerHTML=list.map(p=>`<div class="pd-platform-option" data-id="${p.id}"><div class="pd-platform-option-icon">${p.icon}</div><div><strong>${p.name}</strong><small>${p.code}</small></div></div>`).join('')||'<div style="padding:18px;color:#98a3af;text-align:center">没有找到平台</div>';$('platformResults').querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedPlatform=getProductPlatform(el.dataset.id);$('platformTrigger').textContent=selectedPlatform.name;$('platformTrigger').classList.remove('placeholder');$('platformPicker').classList.remove('open')})}
$('platformTrigger').onclick=e=>{e.stopPropagation();closeAll();$('platformPicker').classList.toggle('open');if($('platformPicker').classList.contains('open'))setTimeout(()=>$('platformSearch').focus(),0)};$('platformSearch').oninput=e=>renderPlatformResults(e.target.value);renderPlatformResults();
document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>{platformSource=btn.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===btn));$('dspPlatformPanel').hidden=platformSource!=='dsp';$('otherPlatformPanel').hidden=platformSource!=='other'});$('otherPlatformIcon').onchange=e=>{$('iconUploadText').textContent=e.target.files?.[0]?.name||'＋ 上传平台图标'};
function resultTypeSelect(index,value){return `<div class="pd-mini-select" data-package-type="${index}"><button class="pd-mini-trigger" type="button">${resultTypes.find(x=>x.value===value)?.label}</button><div class="pd-mini-menu">${resultTypes.map(x=>`<div class="pd-mini-option" data-value="${x.value}">${x.label}</div>`).join('')}</div></div>`}
function resultInputs(p,i){if(p.type==='estimated')return `<div class="pd-effect-value"><input data-package="${i}" data-field="min" type="number" min="0" value="${p.min}"><span class="dash">–</span><input data-package="${i}" data-field="max" type="number" min="0" value="${p.max}"><span class="pd-effect-unit">${metric().unit}</span></div>`;return `<div class="pd-effect-value"><input data-package="${i}" data-field="min" type="number" min="0" value="${p.min}"><span class="pd-effect-unit">${metric().unit}</span></div>`}
function renderPackages(){$('packageRows').innerHTML=packages.map((p,i)=>`<tr><td><input data-package="${i}" data-field="name" value="${p.name}"></td><td>${resultTypeSelect(i,p.type)}</td><td>${resultInputs(p,i)}</td><td><div class="pd-money"><span>¥</span><input data-package="${i}" data-field="price" type="number" min="0" value="${p.price}"></div></td><td><button class="pd-row-remove" data-remove-package="${i}" type="button" ${packages.length===1?'disabled':''}>删除</button></td></tr>`).join('');document.querySelectorAll('[data-package]').forEach(input=>input.oninput=()=>packages[Number(input.dataset.package)][input.dataset.field]=input.value);document.querySelectorAll('[data-package-type]').forEach(root=>{const i=Number(root.dataset.packageType),trigger=root.querySelector('button');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};root.querySelectorAll('[data-value]').forEach(el=>el.onclick=e=>{e.stopPropagation();packages[i].type=el.dataset.value;if(el.dataset.value!=='estimated')packages[i].max='';renderPackages()})});document.querySelectorAll('[data-remove-package]').forEach(btn=>btn.onclick=()=>{if(packages.length===1)return;packages.splice(Number(btn.dataset.removePackage),1);renderPackages()})}
function unitSelect(i,value){return `<div class="pd-mini-select" data-quantity-unit="${i}"><button class="pd-mini-trigger" type="button">${value}</button><div class="pd-mini-menu">${quantityUnits.map(x=>`<div class="pd-mini-option" data-value="${x}">${x}</div>`).join('')}</div></div>`}
function renderQuantitySpecs(){$('quantitySpecRows').innerHTML=quantitySpecs.map((s,i)=>`<tr><td><input data-quantity-spec="${i}" data-field="name" value="${s.name}" placeholder="例如：手势舞号"></td><td><input data-quantity-spec="${i}" data-field="quantity" type="number" min="1" value="${s.quantity}"></td><td>${unitSelect(i,s.unit)}</td><td><div class="pd-money"><span>¥</span><input data-quantity-spec="${i}" data-field="price" type="number" min="0" value="${s.price}"></div></td><td><div class="pd-effect-value"><input data-quantity-spec="${i}" data-field="minBuy" type="number" min="1" value="${s.minBuy}"><span class="pd-effect-unit">份</span></div></td><td><button class="pd-row-remove" data-remove-quantity="${i}" type="button" ${quantitySpecs.length===1?'disabled':''}>删除</button></td></tr>`).join('');document.querySelectorAll('[data-quantity-spec]').forEach(input=>input.oninput=()=>quantitySpecs[Number(input.dataset.quantitySpec)][input.dataset.field]=input.value);document.querySelectorAll('[data-quantity-unit]').forEach(root=>{const i=Number(root.dataset.quantityUnit),trigger=root.querySelector('button');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};root.querySelectorAll('[data-value]').forEach(el=>el.onclick=e=>{e.stopPropagation();quantitySpecs[i].unit=el.dataset.value;trigger.textContent=el.textContent;root.classList.remove('open')})});document.querySelectorAll('[data-remove-quantity]').forEach(btn=>btn.onclick=()=>{if(quantitySpecs.length===1)return;quantitySpecs.splice(Number(btn.dataset.removeQuantity),1);renderQuantitySpecs()})}
$('addPackageBtn').onclick=()=>{packages.push({name:'',type:'guaranteed',min:'',max:'',price:''});renderPackages()};$('addQuantitySpecBtn').onclick=()=>{quantitySpecs.push({name:'',quantity:'10',unit:'个账号',price:'',minBuy:'1'});renderQuantitySpecs()};
function setSaleMode(mode){$('saleMode').value=mode;document.querySelectorAll('[data-sale-mode]').forEach(x=>x.classList.toggle('active',x.dataset.saleMode===mode));['fixed','quantity','budget'].forEach(x=>$(x+'Config').hidden=x!==mode)}document.querySelectorAll('[data-sale-mode]').forEach(x=>x.onclick=()=>setSaleMode(x.dataset.saleMode));
setupSimpleSelect($('budgetResultTypeSelect'),resultTypes.filter(x=>x.value!=='fixed'),v=>budgetResultType=v);
function updateBudgetEffectPreview(){const ref=Number($('budgetReference').value||0).toLocaleString('zh-CN'),a=Number($('budgetEffectMin').value||0).toLocaleString('zh-CN'),b=Number($('budgetEffectMax').value||0).toLocaleString('zh-CN'),prefix=budgetResultType==='guaranteed'?'保底':'预计';$('budgetEffectPreview').textContent=`预算 ${ref} · ${prefix}${metric().front} ${a}${b&&b!==a?'–'+b:''} ${metric().unit}`}
['budgetReference','budgetEffectMin','budgetEffectMax'].forEach(id=>$(id).oninput=updateBudgetEffectPreview);
const langData={zh:{summary:'',desc:''},en:{name:'',summary:'',desc:''},ja:{name:'',summary:'',desc:''},'zh-Hant':{name:'',summary:'',desc:''}};let currentLang='zh';document.querySelectorAll('[data-lang]').forEach(tab=>tab.onclick=()=>{langData[currentLang]={name:$('translatedName').value,summary:$('summary').value,desc:$('description').value};currentLang=tab.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===tab));$('translatedNameRow').hidden=currentLang==='zh';const d=langData[currentLang]||{};$('translatedName').value=d.name||'';$('summary').value=d.summary||'';$('description').value=d.desc||''});
function setCategory(id){selectedCategory=id;const c=getProductCategory(id),trigger=$('categorySelect').querySelector('.pd-select-box');trigger.textContent=c.names.zhCN;trigger.classList.remove('placeholder')}
function setOtherPlatform(name){platformSource='other';document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='other'));$('dspPlatformPanel').hidden=true;$('otherPlatformPanel').hidden=false;$('otherPlatformName').value=name}
function loadEdit(){document.body.dataset.pageTitle='产品列表 / 编辑';$('formTitle').textContent='编辑产品';$('crumbText').textContent='编辑产品';if(editingId==='douyin-gesture'){$('name').value='抖音投放';setCategory('content');selectedGoals=['social'];setOtherPlatform('抖音');selectedMetric='accounts';quantitySpecs=[{name:'素人号',quantity:'2000',unit:'个账号',price:'3600',minBuy:'1'},{name:'万粉混剪号',quantity:'15',unit:'个账号',price:'1500',minBuy:'1'},{name:'十万粉混剪号',quantity:'10',unit:'个账号',price:'2400',minBuy:'1'},{name:'手势舞号',quantity:'10',unit:'个账号',price:'600',minBuy:'1'},{name:'对口型号',quantity:'10',unit:'个账号',price:'600',minBuy:'1'},{name:'剪映模板号',quantity:'10',unit:'个账号',price:'800',minBuy:'1'},{name:'广场舞号',quantity:'10',unit:'个账号',price:'1000',minBuy:'1'}];setSaleMode('quantity');$('summary').value='选择不同类型的抖音账号组合推广歌曲';$('description').value='可同时选择多个账号规格，每个规格按份购买并独立计价。';$('internalNote').value='支持同一订单组合购买多个账号规格。'}else{$('name').value='网易云音乐播放推广';setCategory('traffic');selectedGoals=['plays'];selectedPlatform=getProductPlatform('netease');$('platformTrigger').textContent=selectedPlatform.name;$('platformTrigger').classList.remove('placeholder');selectedMetric='plays';packages=[{name:'体验套餐',type:'guaranteed',min:'1980',max:'',price:'99'},{name:'起量套餐',type:'guaranteed',min:'4000',max:'',price:'209'},{name:'加强套餐',type:'guaranteed',min:'10000',max:'',price:'509'}];setSaleMode('fixed');$('summary').value='选择固定套餐提升歌曲在网易云音乐内的播放量';$('description').value='选择推广套餐后，按对应档位执行网易云音乐播放推广。';$('internalNote').value='供应侧按套餐执行。'}renderGoals();renderMetric();renderPackages();renderQuantitySpecs();$('cancelBtn').href='product-detail.html?id='+(editingId||'netease-play')}
renderCategory();renderGoals();renderMetric();renderPackages();renderQuantitySpecs();updateBudgetEffectPreview();if(editing)loadEdit();
$('saveBtn').onclick=()=>{const platformOk=platformSource==='dsp'?!!selectedPlatform:!!$('otherPlatformName').value.trim();if(!$('name').value.trim()||!selectedCategory||!selectedGoals.length||!platformOk){alert('请填写产品名称、所属类目、推广目标和平台');return}const mode=$('saleMode').value;if(mode==='fixed'&&packages.some(x=>!x.name||!x.min||!x.price||(x.type==='estimated'&&!x.max))){alert('请完整填写固定套餐');return}if(mode==='quantity'&&quantitySpecs.some(x=>!x.name||!x.quantity||!x.unit||!x.price||!x.minBuy)){alert('请完整填写数量规格');return}if(mode==='budget'&&(!$('budgetMin').value||!$('budgetStep').value||!$('budgetReference').value||!$('budgetEffectMin').value)){alert('请完整填写预算设置和推广效果');return}alert(editing?'演示：产品已保存':'演示：产品已创建');location.href=editing?'product-detail.html?id='+encodeURIComponent(editingId||'product'):'products.html'};
</script>
</body>
</html>
