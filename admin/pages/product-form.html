<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑产品｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
<style>
[hidden]{display:none!important}.pf-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.pf-card{background:#fff;border:1px solid #d9dde2;border-radius:8px;overflow:visible}.pf-head{min-height:54px;padding:0 18px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between}.pf-head h2{margin:0;font-size:15px}.pf-body{padding:18px}.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.pf-field.full{grid-column:1/-1}.pf-field label{display:block;margin-bottom:7px;color:#536277;font-size:12px;font-weight:500}.pf-field label.required:after{content:' *';color:#d65252}.pf-field input,.pf-field select,.pf-field textarea{width:100%;border:1px solid #d4dae1;border-radius:4px;background:#fff;color:#3e4b5c;outline:0}.pf-field input,.pf-field select{height:38px;padding:0 10px}.pf-field textarea{min-height:82px;padding:9px 10px;resize:vertical}.pf-field input:focus,.pf-field select:focus,.pf-field textarea:focus{border-color:#2448ff;box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pf-help{margin-top:6px;color:#99a3af;font-size:11px;line-height:1.5}.pf-goals{display:flex;gap:8px;flex-wrap:wrap}.pf-goal{height:32px;padding:0 11px;border:1px solid #d8dde5;border-radius:4px;background:#fff;color:#607187}.pf-goal.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pf-goal.primary:after{content:'主';display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#dfe5ff;color:#2448ff;font-size:9px}.pf-sale-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pf-sale-mode{min-height:82px;padding:15px;border:1px solid #d8dde5;border-radius:6px;background:#fff;text-align:left}.pf-sale-mode.active{border-color:#2448ff;background:#f5f7ff}.pf-sale-mode strong{display:block;color:#303b4a}.pf-sale-mode small{display:block;margin-top:6px;color:#7b8796;font-size:11px;line-height:1.5}.pf-table-wrap{overflow:auto;border:1px solid #e1e5ea;border-radius:5px}.pf-table{width:100%;min-width:900px;border-collapse:collapse}.pf-table th{height:42px;padding:0 9px;background:#f2f3f5;border-bottom:1px solid #e2e5e9;text-align:left;color:#4d5662;font-size:11px}.pf-table td{padding:8px 9px;border-bottom:1px solid #eceff2;vertical-align:middle}.pf-table tr:last-child td{border-bottom:0}.pf-table input,.pf-table select{width:100%;height:34px;border:1px solid #d5dbe2;border-radius:4px;padding:0 8px;background:#fff;color:#465260}.pf-money{display:grid;grid-template-columns:26px 1fr}.pf-money span{height:34px;display:grid;place-items:center;border:1px solid #d5dbe2;border-right:0;background:#f7f8fa;border-radius:4px 0 0 4px;color:#7b8795}.pf-money input{border-radius:0 4px 4px 0}.pf-add{height:32px;padding:0 11px;border:1px solid #cbd5ff;border-radius:4px;background:#fff;color:#2448ff}.pf-remove{border:0;background:transparent;color:#b36a6a}.pf-summary{margin-top:12px;padding:11px 13px;border:1px solid #e5e9ef;border-radius:5px;background:#f7f9fc;color:#7b8796;font-size:11px;line-height:1.55}.pf-summary strong{color:#34475d}.pf-language-tabs{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid #e6e9ed}.pf-lang{height:37px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:#768294}.pf-lang.active{border-bottom-color:#2448ff;color:#2448ff;font-weight:600}.pf-actions{position:sticky;bottom:0;z-index:10;margin-top:14px;padding:12px 16px;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);display:flex;justify-content:flex-end;gap:9px}.pf-btn{height:36px;padding:0 15px;border-radius:4px}.pf-secondary{border:1px solid #d2d8df;background:#fff;color:#4c5a6d}.pf-primary{border:1px solid #2448ff;background:#2448ff;color:#fff}.pf-budget-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}.pf-platform-source{display:flex;gap:8px;margin-bottom:10px}.pf-source-choice{height:34px;padding:0 13px;border:1px solid #d8dde5;background:#fff;border-radius:4px;color:#66758a}.pf-source-choice.active{border-color:#2448ff;color:#2448ff;background:#f5f7ff}.pf-platform-picker{position:relative;max-width:560px}.pf-platform-trigger{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;background:#fff;padding:0 36px 0 11px;text-align:left;color:#394b60;position:relative}.pf-platform-trigger:after{content:'⌄';position:absolute;right:12px;top:8px;color:#8b97a5}.pf-platform-trigger.placeholder{color:#a3acb7}.pf-platform-dropdown{display:none;position:absolute;z-index:120;left:0;right:0;top:44px;background:#fff;border:1px solid #d8dde5;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14);overflow:hidden}.pf-platform-picker.open .pf-platform-dropdown{display:block}.pf-platform-search{padding:10px;border-bottom:1px solid #edf0f3}.pf-platform-search input{width:100%;height:34px}.pf-platform-results{max-height:250px;overflow:auto}.pf-platform-option{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}.pf-platform-option:hover{background:#f6f8ff}.pf-platform-option-icon{width:30px;height:30px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:11px;font-weight:700}.pf-platform-option strong{display:block;font-size:13px}.pf-platform-option small{display:block;margin-top:2px;color:#99a3af;font-size:11px}.pf-other-platform{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;max-width:560px}.pf-icon-upload{height:38px;border:1px dashed #cfd5de;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#66758a;font-size:12px;cursor:pointer}.pf-icon-upload input{display:none}@media(max-width:1000px){.pf-grid,.pf-sale-modes,.pf-budget-grid{grid-template-columns:1fr}.pf-field.full{grid-column:auto}.pf-other-platform{grid-template-columns:1fr}}
</style>
</head>
<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
<div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
<div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>
<div class="pf-layout">
<section class="pf-card"><div class="pf-head"><h2>基本信息</h2></div><div class="pf-body"><div class="pf-grid">
<div class="pf-field"><label class="required">产品名称</label><input id="name" placeholder="例如：抖音投放"></div>
<div class="pf-field"><label class="required">所属类目</label><select id="category"><option value="">请选择产品类目</option><option value="traffic">播放推广</option><option value="playlist">歌单推广</option><option value="content">内容推广</option><option value="overseas">海外推广</option><option value="platform-resource">平台资源</option><option value="scene-service">场景服务</option></select></div>
<div class="pf-field full"><label class="required">适用推广目标</label><div class="pf-goals" id="goalGrid"></div><div class="pf-help">所属类目的主目标默认选中，产品也可以同时覆盖其他推广目标。</div></div>
<div class="pf-field full"><label class="required">平台</label><div class="pf-platform-source"><button class="pf-source-choice active" type="button" data-source="dsp">DSP 平台</button><button class="pf-source-choice" type="button" data-source="other">其他平台</button></div><div id="dspPlatformPanel"><div class="pf-platform-picker" id="platformPicker"><button class="pf-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button><div class="pf-platform-dropdown"><div class="pf-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div><div class="pf-platform-results" id="platformResults"></div></div></div></div><div id="otherPlatformPanel" hidden><div class="pf-other-platform"><input id="otherPlatformName" type="text" placeholder="输入平台名称，例如：小红书、抖音"><label class="pf-icon-upload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/*"></label></div><div class="pf-help">平台不在系统 DSP 列表时可自行添加名称和图标，仅作为该产品的展示平台。</div></div></div>
<div class="pf-field full"><label>内部备注</label><textarea id="internalNote" placeholder="仅后台可见，例如供应商、成本或履约说明"></textarea></div>
</div></div></section>
<section class="pf-card"><div class="pf-head"><h2>售卖方式</h2></div><div class="pf-body"><div class="pf-sale-modes"><button class="pf-sale-mode active" data-mode="fixed"><strong>固定套餐</strong><small>一个产品配置多个固定价格规格。</small></button><button class="pf-sale-mode" data-mode="quantity"><strong>按数量购买</strong><small>多个规格可同时选择，每个规格按份购买。</small></button><button class="pf-sale-mode" data-mode="budget"><strong>按预算投放</strong><small>用户输入预算，按预算区间展示预估效果。</small></button></div></div></section>
<section class="pf-card"><div class="pf-head"><h2>推广效果</h2></div><div class="pf-body"><div class="pf-grid"><div class="pf-field"><label class="required">主要效果指标</label><select id="metric"><option value="plays">播放 · 新增播放</option><option value="impressions">曝光 · 获得曝光</option><option value="content">传播内容 · 内容参与传播</option><option value="accounts">参与账号 / 达人</option><option value="playlist">歌单收录 · 进入歌单</option><option value="engagement">互动</option><option value="ranking">排名</option><option value="coverage">渠道覆盖</option></select></div><div class="pf-field"><label class="required">效果单位</label><input id="metricUnit" value="次"></div></div><div class="pf-summary">前台统一按 <strong>结果类型 + 效果数值 + 单位</strong> 展示。</div></div></section>
<section class="pf-card sale-panel" id="fixedPanel"><div class="pf-head"><h2>固定套餐规格</h2><button class="pf-add" type="button" id="addFixed">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格名称</th><th>结果类型</th><th>效果最小值</th><th>效果最大值</th><th>售价</th><th></th></tr></thead><tbody id="fixedRows"></tbody></table></div><div class="pf-summary">规格由运营维护名称、效果和价格；系统内部标识由研发侧自动处理。</div></div></section>
<section class="pf-card sale-panel" id="quantityPanel" hidden><div class="pf-head"><h2>数量规格</h2><button class="pf-add" type="button" id="addQuantity">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格名称</th><th>每份包含</th><th>单价</th><th>最低购买</th><th></th></tr></thead><tbody id="quantityRows"></tbody></table></div></div></section>
<section class="pf-card sale-panel" id="budgetPanel" hidden><div class="pf-head"><h2>预算投放规则</h2></div><div class="pf-body"><div class="pf-budget-grid"><div class="pf-field"><label>最低预算</label><input type="number" value="250"></div><div class="pf-field"><label>最高预算</label><input type="number" value="2000"></div><div class="pf-field"><label>预算步长</label><input type="number" value="50"></div><div class="pf-field"><label>结果类型</label><select><option selected>预估结果</option><option>保底结果</option></select></div><div class="pf-field"><label>效果计算方式</label><select><option selected>按参考预算等比例估算</option><option>仅展示参考区间</option></select></div><div class="pf-field"><label>参考预算</label><input type="number" value="250"></div><div class="pf-field"><label>参考效果最小值</label><input type="number" value="4500"></div><div class="pf-field"><label>参考效果最大值</label><input type="number" value="4500"></div></div><div class="pf-summary">预算模式保留最低预算、最高预算、步长、参考预算、效果区间和计算方式。</div></div></section>
<section class="pf-card"><div class="pf-head"><h2>前台内容</h2></div><div class="pf-body"><div class="pf-language-tabs"><button class="pf-lang active" data-lang="zh">简体中文</button><button class="pf-lang" data-lang="en">English</button><button class="pf-lang" data-lang="ja">日本語</button><button class="pf-lang" data-lang="zh-Hant">繁體中文</button></div><div class="pf-grid"><div class="pf-field"><label>产品名称</label><input id="frontName"></div><div class="pf-field"><label>一句话介绍</label><input id="summary" placeholder="用于产品卡片"></div><div class="pf-field full"><label>产品说明</label><textarea id="description" placeholder="用于用户侧了解服务内容"></textarea></div></div></div></section>
</div><div class="pf-actions"><a class="pf-btn pf-secondary" href="products.html">取消</a><button class="pf-btn pf-primary" id="saveBtn">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-category-data.js"></script><script src="../assets/js/product-platform-data.js"></script><script>
const goals=[['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']];let selectedGoals=new Set();let platformSource='dsp',selectedPlatform=null;const fixed=[{name:'体验套餐',type:'guaranteed',min:1980,max:'',price:99}];const quantity=[{name:'素人号',qty:2000,price:3600,minBuy:1},{name:'KOL 投放（粉丝 5–10w）',qty:1,price:2000,minBuy:1}];
const categoryPrimary=()=>window.getProductCategory?.(document.getElementById('category').value)?.goalId||'';function renderGoals(){const primary=categoryPrimary();if(primary)selectedGoals.add(primary);document.getElementById('goalGrid').innerHTML=goals.map(g=>`<button type="button" class="pf-goal ${selectedGoals.has(g[0])?'active':''}${g[0]===primary?' primary':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{if(b.dataset.goal===primary)return;selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals()})}document.getElementById('category').onchange=renderGoals;
function renderPlatformResults(q=''){const key=q.trim().toLowerCase(),list=PRODUCT_PLATFORM_LIBRARY.filter(p=>!key||[p.name,p.code,...(p.keywords||[])].join(' ').toLowerCase().includes(key));document.getElementById('platformResults').innerHTML=list.map(p=>`<div class="pf-platform-option" data-platform="${p.id}"><div class="pf-platform-option-icon">${p.icon}</div><div><strong>${p.name}</strong><small>${p.code}</small></div></div>`).join('')||'<div style="padding:18px;color:#98a3af;text-align:center">没有找到平台</div>';document.querySelectorAll('[data-platform]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedPlatform=getProductPlatform(el.dataset.platform);document.getElementById('platformTrigger').textContent=selectedPlatform.name;document.getElementById('platformTrigger').classList.remove('placeholder');document.getElementById('platformPicker').classList.remove('open')})}renderPlatformResults();document.getElementById('platformTrigger').onclick=e=>{e.stopPropagation();document.getElementById('platformPicker').classList.toggle('open');setTimeout(()=>document.getElementById('platformSearch').focus(),0)};document.getElementById('platformSearch').oninput=e=>renderPlatformResults(e.target.value);document.addEventListener('click',()=>document.getElementById('platformPicker').classList.remove('open'));
document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>{platformSource=btn.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===btn));document.getElementById('dspPlatformPanel').hidden=platformSource!=='dsp';document.getElementById('otherPlatformPanel').hidden=platformSource!=='other'});document.getElementById('otherPlatformIcon').onchange=e=>document.getElementById('iconUploadText').textContent=e.target.files?.[0]?.name||'＋ 上传平台图标';
function fixedRow(x,i){return `<tr><td><input value="${x.name}"></td><td><select><option ${x.type==='fixed'?'selected':''}>固定结果</option><option ${x.type==='guaranteed'?'selected':''}>保底结果</option><option ${x.type==='estimated'?'selected':''}>预估结果</option></select></td><td><input type="number" value="${x.min}"></td><td><input type="number" value="${x.max}"></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><button class="pf-remove" data-remove-fixed="${i}">删除</button></td></tr>`}function quantityRow(x,i){return `<tr><td><input value="${x.name}"></td><td><input type="number" value="${x.qty}"></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><input type="number" value="${x.minBuy}"></td><td><button class="pf-remove" data-remove-quantity="${i}">删除</button></td></tr>`}function renderTables(){document.getElementById('fixedRows').innerHTML=fixed.map(fixedRow).join('');document.getElementById('quantityRows').innerHTML=quantity.map(quantityRow).join('');document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{fixed.splice(+b.dataset.removeFixed,1);renderTables()});document.querySelectorAll('[data-remove-quantity]').forEach(b=>b.onclick=()=>{quantity.splice(+b.dataset.removeQuantity,1);renderTables()})}document.getElementById('addFixed').onclick=()=>{fixed.push({name:'新规格',type:'guaranteed',min:'',max:'',price:''});renderTables()};document.getElementById('addQuantity').onclick=()=>{quantity.push({name:'新规格',qty:1,price:'',minBuy:1});renderTables()};function setMode(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.sale-panel').forEach(x=>x.hidden=true);document.getElementById(mode+'Panel').hidden=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('.pf-lang').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pf-lang').forEach(x=>x.classList.remove('active'));b.classList.add('active')});const params=new URLSearchParams(location.search),editing=params.get('mode')==='edit',editingId=params.get('id')||'';function setDsp(id){platformSource='dsp';selectedPlatform=getProductPlatform(id);document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='dsp'));document.getElementById('dspPlatformPanel').hidden=false;document.getElementById('otherPlatformPanel').hidden=true;document.getElementById('platformTrigger').textContent=selectedPlatform?.name||'搜索并选择 DSP 平台';document.getElementById('platformTrigger').classList.toggle('placeholder',!selectedPlatform)}function setOther(name){platformSource='other';document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='other'));document.getElementById('dspPlatformPanel').hidden=true;document.getElementById('otherPlatformPanel').hidden=false;document.getElementById('otherPlatformName').value=name}if(editing){document.getElementById('crumbText').textContent='编辑产品';document.getElementById('formTitle').textContent='编辑产品';if(editingId==='netease-play'){document.getElementById('name').value='网易云音乐播放推广';document.getElementById('category').value='traffic';selectedGoals=new Set(['plays']);setDsp('netease');document.getElementById('frontName').value='网易云音乐播放推广'}else if(editingId==='spotify-ads'){document.getElementById('name').value='Spotify 广告投放';document.getElementById('category').value='overseas';selectedGoals=new Set(['global','plays']);setDsp('spotify');setMode('budget');document.getElementById('frontName').value='Spotify 广告投放'}else{document.getElementById('name').value=editingId==='xiaohongshu-promotion'?'小红书投放':'抖音投放';document.getElementById('category').value='content';selectedGoals=new Set(['social']);setOther(editingId==='xiaohongshu-promotion'?'小红书':'抖音');setMode('quantity');document.getElementById('metric').value='accounts';document.getElementById('metricUnit').value='个账号';document.getElementById('frontName').value=document.getElementById('name').value}}renderGoals();renderTables();document.getElementById('saveBtn').onclick=()=>{const platformOk=platformSource==='dsp'?!!selectedPlatform:!!document.getElementById('otherPlatformName').value.trim();if(!document.getElementById('name').value.trim()||!document.getElementById('category').value||!platformOk){alert('请填写产品名称、所属类目和平台');return}document.getElementById('saveBtn').textContent='已保存（原型）'};
</script></body></html>
