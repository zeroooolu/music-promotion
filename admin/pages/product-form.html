<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑产品｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
<style>
[hidden]{display:none!important}.pf-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.pf-card{background:#fff;border:1px solid #d9dde2;border-radius:8px;overflow:visible}.pf-head{min-height:54px;padding:0 18px;border-bottom:1px solid #edf0f3;display:flex;align-items:center;justify-content:space-between}.pf-head h2{margin:0;font-size:15px}.pf-body{padding:18px}.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.pf-field.full{grid-column:1/-1}.pf-field label{display:block;margin-bottom:7px;color:#536277;font-size:12px;font-weight:500}.pf-field label.required:after{content:' *';color:#d65252}.pf-field input,.pf-field select,.pf-field textarea{width:100%;border:1px solid #d4dae1;border-radius:4px;background:#fff;color:#3e4b5c;outline:0}.pf-field input,.pf-field select{height:38px;padding:0 10px}.pf-field textarea{min-height:82px;padding:9px 10px;resize:vertical}.pf-field input:focus,.pf-field select:focus,.pf-field textarea:focus{border-color:#2448ff;box-shadow:0 0 0 2px rgba(36,72,255,.07)}.pf-help{margin-top:6px;color:#99a3af;font-size:11px;line-height:1.5}.pf-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pf-goals{display:flex;gap:8px;flex-wrap:wrap}.pf-goal{height:32px;padding:0 11px;border:1px solid #d8dde5;border-radius:4px;background:#fff;color:#607187}.pf-goal.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pf-goal.primary:after{content:'主';display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#dfe5ff;color:#2448ff;font-size:9px}.pf-sale-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.pf-sale-mode{min-height:82px;padding:15px;border:1px solid #d8dde5;border-radius:6px;background:#fff;text-align:left}.pf-sale-mode.active{border-color:#2448ff;background:#f5f7ff}.pf-sale-mode strong{display:block;color:#303b4a}.pf-sale-mode small{display:block;margin-top:6px;color:#7b8796;font-size:11px;line-height:1.5}.pf-table-wrap{overflow:auto;border:1px solid #e1e5ea;border-radius:5px}.pf-table{width:100%;min-width:980px;border-collapse:collapse}.pf-table th{height:42px;padding:0 9px;background:#f2f3f5;border-bottom:1px solid #e2e5e9;text-align:left;color:#4d5662;font-size:11px}.pf-table td{padding:8px 9px;border-bottom:1px solid #eceff2;vertical-align:middle}.pf-table tr:last-child td{border-bottom:0}.pf-table input,.pf-table select{width:100%;height:34px;border:1px solid #d5dbe2;border-radius:4px;padding:0 8px;background:#fff;color:#465260}.pf-mini{width:95px!important}.pf-money{display:grid;grid-template-columns:26px 1fr}.pf-money span{height:34px;display:grid;place-items:center;border:1px solid #d5dbe2;border-right:0;background:#f7f8fa;border-radius:4px 0 0 4px;color:#7b8795}.pf-money input{border-radius:0 4px 4px 0}.pf-add{height:32px;padding:0 11px;border:1px solid #cbd5ff;border-radius:4px;background:#fff;color:#2448ff}.pf-remove{border:0;background:transparent;color:#b36a6a}.pf-summary{margin-top:12px;padding:11px 13px;border:1px solid #e5e9ef;border-radius:5px;background:#f7f9fc;color:#7b8796;font-size:11px;line-height:1.55}.pf-summary strong{color:#34475d}.pf-language-tabs{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid #e6e9ed}.pf-lang{height:37px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:#768294}.pf-lang.active{border-bottom-color:#2448ff;color:#2448ff;font-weight:600}.pf-actions{position:sticky;bottom:0;z-index:10;margin-top:14px;padding:12px 16px;background:rgba(244,246,249,.94);backdrop-filter:blur(8px);display:flex;justify-content:flex-end;gap:9px}.pf-btn{height:36px;padding:0 15px;border-radius:4px}.pf-secondary{border:1px solid #d2d8df;background:#fff;color:#4c5a6d}.pf-primary{border:1px solid #2448ff;background:#2448ff;color:#fff}.pf-result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pf-check{display:flex;align-items:center;gap:7px;height:38px;padding:0 10px;border:1px solid #d5dbe2;border-radius:4px;background:#fff;color:#536277}.pf-check input{width:auto;height:auto}.pf-budget-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 20px}@media(max-width:1000px){.pf-grid,.pf-sale-modes,.pf-budget-grid,.pf-result-grid{grid-template-columns:1fr}.pf-field.full{grid-column:auto}}
</style>
</head>
<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
<div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
<div class="page-header"><div><h1 id="formTitle">新增产品</h1><p>产品、售卖规格和前台展示字段使用同一套业务含义。</p></div></div>
<div class="pf-layout">
<section class="pf-card"><div class="pf-head"><h2>基本信息</h2></div><div class="pf-body"><div class="pf-grid">
<div class="pf-field"><label class="required">产品编号</label><input id="productCode" class="pf-code" value="douyin-promotion" placeholder="例如：douyin-promotion"><div class="pf-help">用于套餐和订单引用，同一个产品保持唯一且不随名称修改。</div></div>
<div class="pf-field"><label class="required">产品名称</label><input id="name" value="抖音投放" placeholder="例如：抖音投放"></div>
<div class="pf-field"><label class="required">所属类目</label><select id="category"><option value="traffic">播放推广</option><option value="playlist">歌单推广</option><option value="content" selected>内容推广</option><option value="overseas">海外推广</option><option value="platform-resource">平台资源</option><option value="scene-service">场景服务</option></select></div>
<div class="pf-field"><label class="required">平台</label><select id="platform"><option>网易云音乐</option><option>TME</option><option>QQ音乐</option><option>酷狗音乐</option><option selected>抖音</option><option>小红书</option><option>Spotify</option><option>YouTube</option><option>KTV</option><option>多平台</option></select><div class="pf-help">这里填写用户实际认知的执行平台；集团或供应渠道不代替具体平台名称。</div></div>
<div class="pf-field full"><label class="required">适用推广目标</label><div class="pf-goals" id="goalGrid"></div><div class="pf-help">所属类目的主目标默认选中，产品可同时覆盖多个推广目标。</div></div>
<div class="pf-field"><label>排序</label><input id="sort" type="number" value="80"></div>
<div class="pf-field"><label>状态</label><select id="status"><option selected>上架</option><option>下架</option></select></div>
<div class="pf-field full"><label>内部备注</label><textarea id="internalNote" placeholder="仅后台可见，例如供应商、成本或履约说明"></textarea></div>
</div></div></section>

<section class="pf-card"><div class="pf-head"><h2>推广效果</h2></div><div class="pf-body"><div class="pf-grid">
<div class="pf-field"><label class="required">主要效果指标</label><select id="metric"><option value="plays">播放 · 新增播放</option><option value="impressions">曝光 · 获得曝光</option><option value="content" selected>传播内容 · 内容参与传播</option><option value="accounts">参与账号 / 达人</option><option value="playlist">歌单收录 · 进入歌单</option><option value="engagement">互动</option><option value="ranking">排名</option><option value="coverage">渠道覆盖</option></select></div>
<div class="pf-field"><label class="required">效果单位</label><input id="metricUnit" value="个账号"></div>
</div><div class="pf-summary">前台统一按 <strong>结果类型 + 效果数值 + 单位</strong> 展示，例如“保底新增播放 10,000 次”“15 个账号参与传播”。</div></div></section>

<section class="pf-card"><div class="pf-head"><h2>售卖方式</h2></div><div class="pf-body"><div class="pf-sale-modes"><button class="pf-sale-mode" data-mode="fixed"><strong>固定套餐</strong><small>一个产品配置多个固定价格规格。</small></button><button class="pf-sale-mode active" data-mode="quantity"><strong>按数量购买</strong><small>多个规格可同时选择，每个规格按份购买。</small></button><button class="pf-sale-mode" data-mode="budget"><strong>按预算投放</strong><small>用户输入预算，按预算区间展示预估效果。</small></button></div></div></section>

<section class="pf-card sale-panel" id="fixedPanel" hidden><div class="pf-head"><h2>固定套餐规格</h2><button class="pf-add" type="button" id="addFixed">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格编号</th><th>规格名称</th><th>结果类型</th><th>效果最小值</th><th>效果最大值</th><th>售价</th><th></th></tr></thead><tbody id="fixedRows"></tbody></table></div><div class="pf-summary">套餐组合时应关联到 <strong>产品编号 + 规格编号</strong>，而不是只关联产品后再手工复制一遍结果。</div></div></section>

<section class="pf-card sale-panel" id="quantityPanel"><div class="pf-head"><h2>数量规格</h2><button class="pf-add" type="button" id="addQuantity">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格编号</th><th>规格名称</th><th>每份包含</th><th>单位</th><th>价格模式</th><th>固定价</th><th>最低价</th><th>最高价</th><th>最低购买</th><th></th></tr></thead><tbody id="quantityRows"></tbody></table></div><div class="pf-summary">支持固定价和价格区间，可覆盖小红书 KOL 等“¥2,000–¥6,000 / 份”的前台展示。</div></div></section>

<section class="pf-card sale-panel" id="budgetPanel" hidden><div class="pf-head"><h2>预算投放规则</h2></div><div class="pf-body"><div class="pf-budget-grid">
<div class="pf-field"><label>规则编号</label><input class="pf-code" value="spotify-budget"></div><div class="pf-field"><label>最低预算</label><input type="number" value="250"></div><div class="pf-field"><label>最高预算</label><input type="number" value="2000"></div><div class="pf-field"><label>预算步长</label><input type="number" value="50"></div><div class="pf-field"><label>结果类型</label><select><option selected>预估结果</option><option>保底结果</option></select></div><div class="pf-field"><label>效果计算方式</label><select><option selected>按参考预算等比例估算</option><option>仅展示参考区间</option></select></div><div class="pf-field"><label>参考预算</label><input type="number" value="250"></div><div class="pf-field"><label>参考效果最小值</label><input type="number" value="4500"></div><div class="pf-field"><label>参考效果最大值</label><input type="number" value="4500"></div>
</div><div class="pf-summary">前台预算滑杆需要的字段已对应：<strong>最低预算、最高预算、步长、参考预算、效果区间、计算方式</strong>。</div></div></section>

<section class="pf-card"><div class="pf-head"><h2>前台内容</h2></div><div class="pf-body"><div class="pf-language-tabs"><button class="pf-lang active" data-lang="zh">简体中文</button><button class="pf-lang" data-lang="en">English</button><button class="pf-lang" data-lang="ja">日本語</button><button class="pf-lang" data-lang="zh-Hant">繁體中文</button></div><div class="pf-grid">
<div class="pf-field"><label>产品名称</label><input id="frontName" value="抖音投放"></div><div class="pf-field"><label>一句话介绍</label><input value="7 种账号规格，可组合购买"></div><div class="pf-field full"><label>产品说明</label><textarea>通过抖音不同类型账号参与音乐内容传播，可按账号规格和购买份数组合下单。</textarea></div>
</div></div></section>
</div>
<div class="pf-actions"><a class="pf-btn pf-secondary" href="products.html">取消</a><button class="pf-btn pf-primary" id="saveBtn">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-category-data.js"></script><script>
const goals=[['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']];let selectedGoals=new Set(['social']);
const fixed=[{id:'basic',name:'基础',type:'guaranteed',min:10000,max:'',price:6000}];
const quantity=[{id:'amateur',name:'素人号',qty:2000,unit:'个账号',priceMode:'fixed',price:3600,minPrice:'',maxPrice:'',minBuy:1},{id:'gesture',name:'手势舞号',qty:10,unit:'个账号',priceMode:'fixed',price:600,minPrice:'',maxPrice:'',minBuy:1},{id:'kol-5-10w',name:'KOL 投放（粉丝 5–10w）',qty:1,unit:'条内容',priceMode:'range',price:'',minPrice:2000,maxPrice:6000,minBuy:1}];
function renderGoals(){document.getElementById('goalGrid').innerHTML=goals.map((g,i)=>`<button type="button" class="pf-goal ${selectedGoals.has(g[0])?'active':''}${i===2?' primary':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{if(b.dataset.goal==='social')return;selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals()})}
function fixedRow(x,i){return `<tr><td><input class="pf-code" value="${x.id}"></td><td><input value="${x.name}"></td><td><select><option ${x.type==='fixed'?'selected':''}>固定结果</option><option ${x.type==='guaranteed'?'selected':''}>保底结果</option><option ${x.type==='estimated'?'selected':''}>预估结果</option></select></td><td><input type="number" value="${x.min}"></td><td><input type="number" value="${x.max}"></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><button class="pf-remove" data-remove-fixed="${i}">删除</button></td></tr>`}
function quantityRow(x,i){return `<tr><td><input class="pf-code" value="${x.id}"></td><td><input value="${x.name}"></td><td><input type="number" value="${x.qty}"></td><td><input value="${x.unit}"></td><td><select data-price-mode="${i}"><option value="fixed" ${x.priceMode==='fixed'?'selected':''}>固定价</option><option value="range" ${x.priceMode==='range'?'selected':''}>价格区间</option></select></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.minPrice}"></div></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.maxPrice}"></div></td><td><input type="number" value="${x.minBuy}"></td><td><button class="pf-remove" data-remove-quantity="${i}">删除</button></td></tr>`}
function renderTables(){document.getElementById('fixedRows').innerHTML=fixed.map(fixedRow).join('');document.getElementById('quantityRows').innerHTML=quantity.map(quantityRow).join('');document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{fixed.splice(+b.dataset.removeFixed,1);renderTables()});document.querySelectorAll('[data-remove-quantity]').forEach(b=>b.onclick=()=>{quantity.splice(+b.dataset.removeQuantity,1);renderTables()})}
function setMode(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.sale-panel').forEach(x=>x.hidden=true);document.getElementById(mode+'Panel').hidden=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('addFixed').onclick=()=>{fixed.push({id:'new-spec',name:'新规格',type:'guaranteed',min:'',max:'',price:''});renderTables()};document.getElementById('addQuantity').onclick=()=>{quantity.push({id:'new-spec',name:'新规格',qty:1,unit:'个',priceMode:'fixed',price:'',minPrice:'',maxPrice:'',minBuy:1});renderTables()};
document.querySelectorAll('.pf-lang').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pf-lang').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('saveBtn').onclick=()=>{document.getElementById('saveBtn').textContent='已保存（原型）'};
const params=new URLSearchParams(location.search);if(params.get('mode')==='edit'){document.getElementById('crumbText').textContent='编辑产品';document.getElementById('formTitle').textContent='编辑产品';if(params.get('id'))document.getElementById('productCode').value=params.get('id')}renderGoals();renderTables();
</script>
</body></html>
