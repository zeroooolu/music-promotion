lor:#99a3af;font-size:11px}.pd-other-platform{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px;max-width:520px}.pd-other-platform input[type=text]{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;padding:0 10px}.pd-icon-upload{height:38px;border:1px dashed #cfd5de;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#66758a;font-size:12px;cursor:pointer}.pd-icon-upload input{display:none}.pd-goal-grid{display:flex;flex-wrap:wrap;gap:8px}.pd-goal-choice{height:32px;border:1px solid #d8dde5;border-radius:4px;background:#fff;padding:0 11px;color:#607187}.pd-goal-choice.active{border-color:#2448ff;background:#f5f7ff;color:#2448ff}.pd-goal-choice.locked:after{content:'主';display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#dfe5ff;color:#2448ff;font-size:9px}.pd-mini-select{max-width:none}.pd-mini-trigger{height:34px}.pd-mini-menu{top:40px}.pd-money{display:grid;grid-template-columns:28px 1fr}.pd-money span{height:34px;display:grid;place-items:center;border:1px solid #d5dbe2;border-right:0;background:#f7f8fa;border-radius:4px 0 0 4px;color:#7b8795}.pd-money input{height:34px;border-radius:0 4px 4px 0}.pd-form-actions{z-index:10}@media(max-width:800px){.pd-sale-mode-grid,.pd-config-grid{grid-template-columns:1fr}.pd-other-platform{grid-template-columns:1fr}}

<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
  <div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>
  <div class="pd-form-layout"><div>
    <section class="pd-form-card"><div class="pd-form-card-head"><h2>基本信息</h2></div><div class="pd-form-body">
      <div class="pd-form-row"><div class="pd-form-label pd-required">产品名称</div><div class="pd-form-control"><input id="name" placeholder="例如：网易云音乐播放推广"></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">所属类目</div><div class="pd-form-control"><div class="pd-select-wrap" id="categorySelect"><button class="pd-select-box placeholder" type="button">请选择产品类目</button><div class="pd-select-menu"></div></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">适用推广目标</div><div class="pd-form-control"><div class="pd-goal-grid" id="goalGrid"></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label pd-required">平台</div><div class="pd-form-control">
        <div class="pd-platform-source"><button class="pd-source-choice active" type="button" data-source="dsp">DSP 平台</button><button class="pd-source-choice" type="button" data-source="other">其他平台</button></div>
        <div id="dspPlatformPanel"><div class="pd-platform-picker" id="platformPicker"><button class="pd-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button><div class="pd-platform-dropdown"><div class="pd-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div><div class="pd-platform-results" id="platformResults"></div></div></div></div>
        <div id="otherPlatformPanel" hidden><div class="pd-other-platform"><input id="otherPlatformName" type="text" placeholder="平台名称，例如：小红书、哔哩哔哩"><label class="pd-icon-upload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/*"></label></div></div>
      </div></div>
      <div class="pd-form-row"><div class="pd-form-label">内部备注</div><div class="pd-form-control"><textarea id="internalNote" placeholder="仅后台可见"></textarea></div></div>
    </div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>售卖方式</h2></div><div class="pd-form-body"><div class="pd-sale-mode-grid" id="saleModeGrid">
      <button class="pd-sale-mode-card active" type="button" data-sale-mode="fixed"><strong>固定套餐</strong><small>一个或多个固定价格档位</small></button>
      <button class="pd-sale-mode-card" type="button" data-sale-mode="quantity"><strong>按数量购买</strong><small>按份数或数量计算价格</small></button>
      <button class="pd-sale-mode-card" type="button" data-sale-mode="budget"><strong>按预算投放</strong><small>用户输入投放预算</small></button>
    </div><input type="hidden" id="saleMode" value="fixed"></div></section>

    <section class="pd-form-card pd-sale-config" id="fixedConfig"><div class="pd-form-card-head"><div class="pd-card-title-row"><h2>固定套餐</h2><button class="pd-btn pd-btn-secondary" id="addPackageBtn" type="button">＋ 添加套餐</button></div></div><div class="pd-form-body"><div class="pd-package-table-wrap"><table class="pd-package-editor"><thead><tr><th>套餐名称</th><th>结果类型</th><th>服务结果</th><th>售价</th><th></th></tr></thead><tbody id="packageRows"></tbody></table></div></div></section>

    <section class="pd-form-card pd-sale-config" id="quantityConfig" hidden><div class="pd-form-card-head"><h2>按数量购买</h2></div><div class="pd-form-body"><div class="pd-config-grid">
      <div class="pd-config-field"><label>每份数量</label><input id="quantityPerUnit" type="number" min="1" value="10"></div>
      <div class="pd-config-field"><label>数量单位</label><div class="pd-mini-select" id="quantityUnitSelect"><button class="pd-mini-trigger" type="button">个账号</button><div class="pd-mini-menu"></div></div></div>
      <div class="pd-config-field"><label>每份售价</label><div class="pd-inline-unit"><span>¥</span><input id="quantityPrice" type="number" min="0" value="600"></div></div>
      <div class="pd-config-field"><label>最低购买份数</label><input id="quantityMin" type="number" min="1" value="1"></div>
      <div class="pd-config-field"><label>最高购买份数</label><input id="quantityMax" type="number" min="1" placeholder="不填则不限制"></div>
    </div></div></section>

    <section class="pd-form-card pd-sale-config" id="budgetConfig" hidden><div class="pd-form-card-head"><h2>按预算投放</h2></div><div class="pd-form-body"><div class="pd-config-grid">
      <div class="pd-config-field"><label>币种</label><div class="pd-mini-select" id="budgetCurrencySelect"><button class="pd-mini-trigger" type="button">USD 美元</button><div class="pd-mini-menu"></div></div></div>
      <div class="pd-config-field"><label>最低预算</label><input id="budgetMin" type="number" min="0" value="250"></div>
      <div class="pd-config-field"><label>预算步长</label><input id="budgetStep" type="number" min="1" value="50"></div>
    </div></div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>履约与销售</h2></div><div class="pd-form-body">
      <div class="pd-form-row"><div class="pd-form-label">履约周期</div><div class="pd-form-control"><div style="display:flex;gap:10px;max-width:420px"><div class="pd-mini-select" id="deliveryTypeSelect" style="width:180px"><button class="pd-mini-trigger" type="button">单次</button><div class="pd-mini-menu"></div></div><div id="deliveryPeriod" hidden style="display:flex;gap:8px"><input id="deliveryDuration" type="number" min="1" value="30" style="width:100px"><div class="pd-mini-select" id="deliveryUnitSelect" style="width:100px"><button class="pd-mini-trigger" type="button">天</button><div class="pd-mini-menu"></div></div></div></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label">允许追加购买</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="repeatSwitch" type="button"></button><span id="repeatText">是</span></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label">允许单独购买</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="directSwitch" type="button"></button><span id="directText">是</span></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label">可用于推广方案</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="planSwitch" type="button"></button><span id="planText">是</span></div></div></div>
      <div class="pd-form-row"><div class="pd-form-label">排序</div><div class="pd-form-control"><input id="sort" type="number" min="0" value="10"></div></div>
      <div class="pd-form-row"><div class="pd-form-label">状态</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="statusSwitch" type="button"></button><span id="statusText">上架</span></div></div></div>
    </div></section>

    <section class="pd-form-card"><div class="pd-form-card-head"><h2>前台内容</h2></div><div class="pd-form-body">
      <div class="pd-language-tabs"><button class="pd-language-tab active" data-lang="zh" type="button">简体中文</button><button class="pd-language-tab" data-lang="en" type="button">English</button><button class="pd-language-tab" data-lang="ja" type="button">日本語</button><button class="pd-language-tab" data-lang="zh-Hant" type="button">繁體中文</button></div>
      <div class="pd-form-row" id="translatedNameRow" hidden><div class="pd-form-label">产品名称</div><div class="pd-form-control"><input id="translatedName"></div></div>
      <div class="pd-form-row"><div class="pd-form-label">一句话介绍</div><div class="pd-form-control"><input id="summary" placeholder="用于产品卡片"></div></div>
      <div class="pd-form-row"><div class="pd-form-label">产品说明</div><div class="pd-form-control"><textarea id="description" placeholder="用于用户侧了解服务内容"></textarea></div></div>
    </div></section>
  </div></div>
  <div class="pd-form-actions"><a class="pd-btn pd-btn-secondary" id="cancelBtn" href="products.html">取消</a><button class="pd-btn pd-btn-primary" id="saveBtn" type="button">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script src="../assets/js/product-platform-data.js"></script>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const editing=params.get('mode')==='edit';
let selectedCategory='';let selectedGoals=[];let platformSource='dsp';let selectedPlatform=null;let quantityUnit='个账号';let budgetCurrency='USD';let deliveryType='single';let deliveryUnit='天';
let packages=[{name:'标准套餐',type:'guaranteed',result:'',price:''}];
const resultTypes=[{value:'fixed',label:'固定结果'},{value:'guaranteed',label:'保底结果'},{value:'estimated',label:'预估结果'},{value:'none',label:'不承诺结果'}];
function closeAll(){document.querySelectorAll('.pd-select-wrap.open,.pd-platform-picker.open,.pd-mini-select.open').forEach(x=>x.classList.remove('open'))}
document.addEventListener('click',closeAll);
function setupSimpleSelect(id,options,getValue,setValue){const root=$(id),trigger=root.querySelector('button'),menu=root.querySelector('div');menu.innerHTML=options.map(o=>`<div class="pd-mini-option" data-value="${o.value}">${o.label}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};menu.querySelectorAll('[data-value]').forEach(el=>el.onclick=e=>{e.stopPropagation();setValue(el.dataset.value);trigger.textContent=el.textContent;root.classList.remove('open')})}
function renderCategory(){const root=$('categorySelect'),trigger=root.querySelector('.pd-select-box'),menu=root.querySelector('.pd-select-menu');menu.innerHTML=PRODUCT_CATEGORIES.filter(c=>c.status==='on').map(c=>`<div class="pd-select-option" data-id="${c.id}">${c.names.zhCN}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};menu.querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedCategory=el.dataset.id;const c=getProductCategory(selectedCategory);trigger.textContent=c.names.zhCN;trigger.classList.remove('placeholder');root.classList.remove('open');if(!selectedGoals.includes(c.goalId))selectedGoals.unshift(c.goalId);renderGoals()})}
function renderGoals(){const c=selectedCategory?getProductCategory(selectedCategory):null;const primary=c?.goalId;window.goalGrid.innerHTML=PROMOTION_GOALS.map(g=>`<button type="button" class="pd-goal-choice${selectedGoals.includes(g.id)?' active':''}${g.id===primary?' locked':''}" data-goal="${g.id}">${g.name}</button>`).join('');goalGrid.querySelectorAll('[data-goal]').forEach(btn=>btn.onclick=()=>{if(btn.dataset.goal===primary)return;selectedGoals=selectedGoals.includes(btn.dataset.goal)?selectedGoals.filter(x=>x!==btn.dataset.goal):[...selectedGoals,btn.dataset.goal];renderGoals()})}
function renderPlatformResults(q=''){const key=q.trim().toLowerCase();const list=PRODUCT_PLATFORM_LIBRARY.filter(p=>!key||[p.name,p.code,...(p.keywords||[])].join(' ').toLowerCase().includes(key));$('platformResults').innerHTML=list.map(p=>`<div class="pd-platform-option" data-id="${p.id}"><div class="pd-platform-option-icon">${p.icon}</div><div><strong>${p.name}</strong><small>${p.code}</small></div></div>`).join('')||'<div style="padding:18px;color:#98a3af;text-align:center">没有找到平台</div>';$('platformResults').querySelectorAll('[data-id]').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedPlatform=getProductPlatform(el.dataset.id);$('platformTrigger').textContent=selectedPlatform.name;$('platformTrigger').classList.remove('placeholder');$('platformPicker').classList.remove('open')})}
$('platformTrigger').onclick=e=>{e.stopPropagation();closeAll();$('platformPicker').classList.toggle('open');if($('platformPicker').classList.contains('open'))setTimeout(()=>$('platformSearch').focus(),0)};$('platformSearch').oninput=e=>renderPlatformResults(e.target.value);renderPlatformResults();
document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>{platformSource=btn.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===btn));$('dspPlatformPanel').hidden=platformSource!=='dsp';$('otherPlatformPanel').hidden=platformSource!=='other'});
$('otherPlatformIcon').onchange=e=>{$('iconUploadText').textContent=e.target.files?.[0]?.name||'＋ 上传平台图标'};
function packageTypeSelect(index,value){return `<div class="pd-mini-select" data-package-select="${index}"><button class="pd-mini-trigger" type="button">${resultTypes.find(x=>x.value===value)?.label}</button><div class="pd-mini-menu">${resultTypes.map(x=>`<div class="pd-mini-option" data-value="${x.value}">${x.label}</div>`).join('')}</div></div>`}
function renderPackages(){$('packageRows').innerHTML=packages.map((p,i)=>`<tr><td><input data-package="${i}" data-field="name" value="${p.name}" placeholder="例如：600 播放"></td><td>${packageTypeSelect(i,p.type)}</td><td><input data-package="${i}" data-field="result" value="${p.result}" placeholder="例如：保底 600 次播放"></td><td><div class="pd-money"><span>¥</span><input data-package="${i}" data-field="price" type="number" min="0" value="${p.price}"></div></td><td><button class="pd-row-remove" data-remove="${i}" type="button" ${packages.length===1?'disabled':''}>删除</button></td></tr>`).join('');document.querySelectorAll('[data-package]').forEach(input=>input.oninput=()=>packages[Number(input.dataset.package)][input.dataset.field]=input.value);document.querySelectorAll('[data-package-select]').forEach(root=>{const i=Number(root.dataset.packageSelect),trigger=root.querySelector('button');trigger.onclick=e=>{e.stopPropagation();closeAll();root.classList.toggle('open')};root.querySelectorAll('[data-value]').forEach(el=>el.onclick=e=>{e.stopPropagation();packages[i].type=el.dataset.value;trigger.textContent=el.textContent;root.classList.remove('open')})});document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{if(packages.length===1)return;packages.splice(Number(btn.dataset.remove),1);renderPackages()})}
$('addPackageBtn').onclick=()=>{packages.push({name:'',type:'guaranteed',result:'',price:''});renderPackages()};
function setSaleMode(mode){$('saleMode').value=mode;document.querySelectorAll('[data-sale-mode]').forEach(x=>x.classList.toggle('active',x.dataset.saleMode===mode));['fixed','quantity','budget'].forEach(x=>$(x+'Config').hidden=x!==mode)}document.querySelectorAll('[data-sale-mode]').forEach(x=>x.onclick=()=>setSaleMode(x.dataset.saleMode));
function bindSwitch(id,textId,onText='是',offText='否'){let on=true;$(id).onclick=()=>{on=!on;$(id).classList.toggle('off',!on);$(textId).textContent=on?onText:offText}}bindSwitch('repeatSwitch','repeatText');bindSwitch('directSwitch','directText');bindSwitch('planSwitch','planText');bindSwitch('statusSwitch','statusText','上架','下架');
setupSimpleSelect('quantityUnitSelect',['个账号','条','次','播放','收藏'].map(x=>({value:x,label:x})),()=>quantityUnit,v=>quantityUnit=v);setupSimpleSelect('budgetCurrencySelect',[{value:'USD',label:'USD 美元'},{value:'CNY',label:'CNY 人民币'}],()=>budgetCurrency,v=>budgetCurrency=v);setupSimpleSelect('deliveryTypeSelect',[{value:'single',label:'单次'},{value:'period',label:'固定周期'}],()=>deliveryType,v=>{deliveryType=v;$('deliveryPeriod').hidden=v!=='period'});setupSimpleSelect('deliveryUnitSelect',['天','周','个月'].map(x=>({value:x,label:x})),()=>deliveryUnit,v=>deliveryUnit=v);
const langData={zh:{summary:'',desc:''},en:{name:'',summary:'',desc:''},ja:{name:'',summary:'',desc:''},'zh-Hant':{name:'',summary:'',desc:''}};let currentLang='zh';document.querySelectorAll('[data-lang]').forEach(tab=>tab.onclick=()=>{langData[currentLang]={name:$('translatedName').value,summary:$('summary').value,desc:$('description').value};currentLang=tab.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===tab));$('translatedNameRow').hidden=currentLang==='zh';const d=langData[currentLang]||{};$('translatedName').value=d.name||'';$('summary').value=d.summary||'';$('description').value=d.desc||''});
