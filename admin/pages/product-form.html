e{height:34px;padding:0 13px;border:1px solid #d8dde5;background:#fff;border-radius:4px;color:#66758a}.pf-source-choice.active{border-color:#2448ff;color:#2448ff;background:#f5f7ff}.pf-platform-picker{position:relative;max-width:560px}.pf-platform-trigger{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;background:#fff;padding:0 36px 0 11px;text-align:left;color:#394b60;position:relative}.pf-platform-trigger:after{content:'';position:absolute;right:13px;top:13px;width:7px;height:7px;border-right:1px solid #8b97a5;border-bottom:1px solid #8b97a5;transform:rotate(45deg)}.pf-platform-trigger.placeholder{color:#a3acb7}.pf-platform-dropdown{display:none;position:absolute;z-index:120;left:0;right:0;top:44px;background:#fff;border:1px solid #d8dde5;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14);overflow:hidden}.pf-platform-picker.open .pf-platform-dropdown{display:block}.pf-platform-search{padding:10px;border-bottom:1px solid #edf0f3}.pf-platform-results{max-height:250px;overflow:auto}.pf-platform-option{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}.pf-platform-option:hover{background:#f6f8ff}.pf-platform-option-icon{width:30px;height:30px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:11px;font-weight:700}.pf-platform-option strong{display:block;font-size:13px}.pf-platform-option small{display:block;margin-top:2px;color:#99a3af;font-size:11px}.pf-other-platform{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;max-width:560px}.pf-icon-upload{height:38px;border:1px dashed #cfd5de;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#66758a;font-size:12px;cursor:pointer}.pf-icon-upload input{display:none}.pf-budget-section{margin-top:18px;padding-top:18px;border-top:1px solid #edf0f3}.pf-budget-title{margin:0 0 12px;color:#43536a;font-size:13px;font-weight:600}.pf-inline-actions{display:flex;gap:8px}.pf-batch{margin-top:12px;padding:14px;border: <body data-admin-page="products" data-page-title="产品列表 / 新增"><div id="admin-shell"></div>
<template id="page-content">
<div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div><div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>
<div class="pf-layout">
<section class="pf-card"><div class="pf-head"><h2>产品信息</h2></div><div class="pf-body"><div class="pf-grid"><div class="pf-field"><label class="required">产品标题</label><input id="title" placeholder="例如：网易云音乐播放推广"></div><div class="pf-field"><label class="required">所属类目</label><select id="category"><option value="">请选择产品类目</option><option value="traffic">播放推广</option><option value="playlist">歌单推广</option><option value="content">内容推广</option><option value="overseas">海外推广</option><option value="platform-resource">平台资源</option><option value="scene-service">场景服务</option></select></div><div class="pf-field full"><label class="required">产品副标题</label><input id="subtitle" placeholder="例如：来源真实用户点击"></div><div class="pf-field full"><label class="required">适用推广目标</label><div class="pf-goals" id="goalGrid"></div></div><div class="pf-field full"><label class="required">平台</label><div class="pf-platform-source"><button class="pf-source-choice active" type="button" data-source="dsp">DSP 平台</button><button class="pf-source-choice" type="button" data-source="other">其他平台</button></div><div id="dspPlatformPanel"><div class="pf-platform-picker" id="platformPicker"><button class="pf-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button><div class="pf-platform-dropdown"><div class="pf-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div><div class="pf-platform-results" id="platformResults"></div></div></div></div><div id="otherPlatformPanel" hidden><div class="pf-other-platform"><input id="otherPlatformName" type="text" placeholder="输入平台名称，例如：小红书、抖音"><label class="pf-icon-upload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/*"></label></div></div></div><div class="pf-field full"><label>内部备注</label><textarea id="internalNote" placeholder="仅后台可见，例如供应商、成本或履约说明"></textarea></div></div></div></section>
<section class="pf-card"><div class="pf-head"><h2>售卖方式</h2></div><div class="pf-body"><div class="pf-sale-modes"><button class="pf-sale-mode active" data-mode="fixed"><strong>固定档位</strong><small>一个产品有一个或多个固定档位，用户一次选择其中一个。</small></button><button class="pf-sale-mode" data-mode="quantity"><strong>多规格可选</strong><small>多个规格可以同时购买，每个规格独立展示效果和价格。</small></button><button class="pf-sale-mode" data-mode="budget"><strong>按预算投放</strong><small>用户选择预算，效果按预算计算或选择固定预算档位。</small></button></div></div></section>
<section class="pf-card"><div class="pf-head"><h2>前台展示预览</h2></div><div class="pf-body"><div class="pf-preview"><div class="pf-preview-rule">前台产品卡片统一由后台生成：<strong>标题 + 副标题 + 当前/最低档位效果 + 价格</strong>。效果不再维护一整段“交付结果”文案，而是拆成 <strong>效果名称、数值、单位</strong> 三个字段。</div><div class="pf-preview-card"><div class="pf-preview-title" id="previewTitle">产品标题</div><div class="pf-preview-subtitle" id="previewSubtitle">产品副标题</div><div class="pf-preview-result" id="previewEffect">效果名称 <strong>0</strong> 单位</div><div class="pf-preview-price" id="previewPrice">¥0 起</div></div></div></div></section>
<section class="pf-card sale-panel" id="fixedPanel"><div class="pf-head"><h2>固定档位</h2><button class="pf-add" type="button" id="addFixed">＋ 添加档位</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>档位名称</th><th class="pf-effect-name">效果名称</th><th class="pf-effect-value">数值</th><th class="pf-effect-unit">单位</th><th>售价</th><th class="pf-note">规格补充说明</th><th class="pf-preview-cell">前台效果预览</th><th></th></tr></thead><tbody id="fixedRows"></tbody></table></div></div></section>
<section class="pf-card sale-panel" id="quantityPanel" hidden><div class="pf-head"><h2>多规格可选</h2><button class="pf-add" type="button" id="addQuantity">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格名称</th><th class="pf-effect-name">效果名称</th><th class="pf-effect-value">每份数值</th><th class="pf-effect-unit">单位</th><th>最低价</th><th>最高价</th><th>最低购买</th><th class="pf-url">案例链接（可选）</th><th class="pf-preview-cell">前台效果预览</th><th></th></tr></thead><tbody id="quantityRows"></tbody></table></div><div class="pf-summary">固定价时最低价与最高价填写相同金额；区间价分别填写上下限。用户增加购买份数后，效果数值按每份数值累加。</div></div></section>
<section class="pf-card sale-panel" id="budgetPanel" hidden><div class="pf-head"><h2>预算投放规则</h2></div><div class="pf-body"><div class="pf-field full"><label class="required">预算配置方式</label><div class="pf-budget-modes"><button class="pf-budget-mode active" type="button" data-budget-mode="continuous"><strong>连续预算</strong><small>用户可在预算范围内自由选择金额。</small></button><button class="pf-budget-mode" type="button" data-budget-mode="tiered"><strong>固定预算档位</strong><small>每个预算档位都对应一个明确效果。</small></button></div></div><div class="pf-budget-section" id="continuousBudget"><div class="pf-grid three"><div class="pf-field"><label class="required">效果名称</label><input id="continuousEffectName" value="预计新增真实播放"></div><div class="pf-field"><label class="required">效果单位</label><input id="continuousEffectUnit" value="次"></div><div class="pf-field"><label>参考预算</label><input id="referenceBudget" type="number" value="250"></div><div class="pf-field"><label>最低预算</label><input id="budgetMin" type="number" value="250"></div><div class="pf-field"><label>最高预算</label><input id="budgetMax" type="number" value="2000"></div><div class="pf-field"><label>预算步长</label><input id="budgetStep" type="number" value="50"></div><div class="pf-field"><label>参考效果数值</label><input id="referenceEffect" type="number" value="4500"></div></div><div class="pf-summary">前台根据“参考预算 → 参考效果数值”按比例计算当前预算对应的效果，展示仍然是「效果名称 + 数值 + 单位」。</div></div><div class="pf-budget-section" id="tieredBudget" hidden><div class="pf-head" style="padding:0;min-height:42px;border:0"><div class="pf-budget-title">固定预算档位</div><div class="pf-inline-actions"><button class="pf-add" type="button" id="batchToggle">批量录入</button><button class="pf-add" type="button" id="addTier">＋ 添加档位</button></div></div><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>#</th><th>售价</th><th class="pf-effect-name">效果名称</th><th class="pf-effect-value">数值</th><th class="pf-effect-unit">单位</th><th class="pf-preview-cell">前台效果预览</th><th></th></tr></thead><tbody id="tierRows"></tbody></table></div><div class="pf-batch" id="batchPanel" hidden><textarea id="batchInput" placeholder="45,保底新增真实播放,600,次&#10;95,保底新增真实播放,1320,次"></textarea><div class="pf-batch-actions"><span class="pf-batch-note">每行：售价、效果名称、数值、单位；支持逗号或 Tab 分隔。</span><div><button class="pf-mini-btn" type="button" id="batchCancel">取消</button><button class="pf-mini-btn primary" type="button" id="batchApply">解析并导入</button></div></div></div><div class="pf-tier-summary"><span>档位数量<strong id="tierCount">0</strong></span><span>价格范围<strong id="tierPriceRange">—</strong></span><span>效果范围<strong id="tierEffectRange">—</strong></span></div></div></div></section>
</div><div class="pf-actions"><a class="pf-btn pf-secondary" href="products.html">取消</a><button class="pf-btn pf-primary" id="saveBtn">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-category-data.js"></script><script src="../assets/js/product-platform-data.js"></script><script>
const goals=[['plays','提升播放曝光'],['playlist','进入更多歌单'],['social','短视频·内容传播'],['global','推广到海外'],['chart','提升热度、互动量或冲榜'],['ktv','上架到 KTV']];
let selectedGoals=new Set(),platformSource='dsp',selectedPlatform=null,currentMode='fixed',budgetMode='continuous';
const fixed=[{name:'基础档',effectName:'保底新增真实播放',value:1980,unit:'次',price:145,note:''}];
const quantity=[{name:'万粉混剪号',effectName:'参与传播',value:15,unit:'个账号',priceMin:1100,priceMax:1100,minBuy:1,caseUrl:''}];
const NETEASE_TIERS=[[45,600],[95,1320],[145,1980],[215,3000],[290,4000],[430,6000],[715,10000],[1150,16000],[1430,20000],[1720,24000],[2290,32000],[2860,40000],[3570,49980]],TME_TIERS=[[45,750],[95,1650],[145,2475],[215,3750],[290,5000],[430,7500],[715,12500],[1150,20000],[1430,25000],[1720,30000],[2290,40000],[2860,50000],[3570,62475]];
let tiers=NETEASE_TIERS.map(([price,value])=>({price,effectName:'保底新增真实播放',value,unit:'次'}));
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN'),num=n=>Number(n||0).toLocaleString('zh-CN');
const categoryPrimary=()=>window.getProductCategory?.($('category').value)?.goalId||'';
const effectText=x=>`${x.effectName||'效果'} ${num(x.value)} ${x.unit||''}`.replace(/\s+/g,' ').trim();
function renderGoals(){const primary=categoryPrimary();if(primary)selectedGoals.add(primary);$('goalGrid').innerHTML=goals.map(g=>`<button type="button" class="pf-goal ${selectedGoals.has(g[0])?'active':''}${g[0]===primary?' primary':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{if(b.dataset.goal===primary)return;selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals()})}$('category').onchange=()=>{renderGoals();syncPreview()};
function renderPlatformResults(q=''){const key=q.trim().toLowerCase(),list=PRODUCT_PLATFORM_LIBRARY.filter(p=>!key||[p.name,p.code,...(p.keywords||[])].join(' ').toLowerCase().includes(key));$('platformResults').innerHTML=list.map(p=>`<div class="pf-platform-option" data-platform="${p.id}"><div class="pf-platform-option-icon">${p.icon}</div><div><strong>${p.name}</strong><small>${p.code}</small></div></div>`).join('');document.querySelectorAll('[data-platform]').forEach(el=>el.onclick=e=>{e.stopPropagation();setDsp(el.dataset.platform);$('platformPicker').classList.remove('open')})}renderPlatformResults();$('platformTrigger').onclick=e=>{e.stopPropagation();$('platformPicker').classList.toggle('open')};$('platformSearch').oninput=e=>renderPlatformResults(e.target.value);document.addEventListener('click',()=>$('platformPicker').classList.remove('open'));
document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>{platformSource=btn.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===btn));$('dspPlatformPanel').hidden=platformSource!=='dsp';$('otherPlatformPanel').hidden=platformSource!=='other'});$('otherPlatformIcon').onchange=e=>$('iconUploadText').textContent=e.target.files?.[0]?.name||'＋ 上传平台图标';
function setDsp(id){platformSource='dsp';selectedPlatform=getProductPlatform(id);document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='dsp'));$('dspPlatformPanel').hidden=false;$('otherPlatformPanel').hidden=true;$('platformTrigger').textContent=selectedPlatform?.name||'搜索并选择 DSP 平台';$('platformTrigger').classList.toggle('placeholder',!selectedPlatform)}function setOther(name){platformSource='other';document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='other'));$('dspPlatformPanel').hidden=true;$('otherPlatformPanel').hidden=false;$('otherPlatformName').value=name}
function fixedRow(x,i){return `<tr data-fixed-row="${i}"><td><input data-k="name" value="${x.name||''}"></td><td><input class="pf-effect-name" data-k="effectName" value="${x.effectName||''}"></td><td><input class="pf-effect-value" data-k="value" type="number" value="${x.value??''}"></td><td><input class="pf-effect-unit" data-k="unit" value="${x.unit||''}"></td><td><div class="pf-money"><span>¥</span><input data-k="price" type="number" value="${x.price??''}"></div></td><td><input class="pf-note" data-k="note" value="${x.note||''}" placeholder="可选"></td><td class="pf-preview-cell">${effectText(x)}</td><td><button class="pf-remove" data-remove-fixed="${i}">删除</button></td></tr>`}
function quantityRow(x,i){return `<tr data-quantity-row="${i}"><td><input data-k="name" value="${x.name||''}"></td><td><input class="pf-effect-name" data-k="effectName" value="${x.effectName||''}"></td><td><input class="pf-effect-value" data-k="value" type="number" value="${x.value??''}"></td><td><input class="pf-effect-unit" data-k="unit" value="${x.unit||''}"></td><td><div class="pf-money"><span>¥</span><input data-k="priceMin" type="number" value="${x.priceMin??''}"></div></td><td><div class="pf-money"><span>¥</span><input data-k="priceMax" type="number" value="${x.priceMax??''}"></div></td><td><input data-k="minBuy" type="number" value="${x.minBuy||1}"></td><td><input class="pf-url" data-k="caseUrl" value="${x.caseUrl||''}" placeholder="https://..."></td><td class="pf-preview-cell">${effectText(x)}</td><td><button class="pf-remove" data-remove-quantity="${i}">删除</button></td></tr>`}
function bindRowInputs(){document.querySelectorAll('[data-fixed-row]').forEach(row=>row.querySelectorAll('[data-k]').forEach(input=>input.oninput=()=>{const x=fixed[+row.dataset.fixedRow],k=input.dataset.k;x[k]=['value','price'].includes(k)?Number(input.value||0):input.value;row.querySelector('.pf-preview-cell').textContent=effectText(x);syncPreview()}));document.querySelectorAll('[data-quantity-row]').forEach(row=>row.querySelectorAll('[data-k]').forEach(input=>input.oninput=()=>{const x=quantity[+row.dataset.quantityRow],k=input.dataset.k;x[k]=['value','priceMin','priceMax','minBuy'].includes(k)?Number(input.value||0):input.value;row.querySelector('.pf-preview-cell').textContent=effectText(x);syncPreview()}));document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{fixed.splice(+b.dataset.removeFixed,1);renderTables()});document.querySelectorAll('[data-remove-quantity]').forEach(b=>b.onclick=()=>{quantity.splice(+b.dataset.removeQuantity,1);renderTables()})}
function renderTables(){$('fixedRows').innerHTML=fixed.map(fixedRow).join('');$('quantityRows').innerHTML=quantity.map(quantityRow).join('');bindRowInputs();syncPreview()}
function tierRow(t,i){return `<tr data-tier-row="${i}"><td>${i+1}</td><td><div class="pf-money"><span>¥</span><input data-k="price" type="number" value="${t.price??''}"></div></td><td><input class="pf-effect-name" data-k="effectName" value="${t.effectName||''}"></td><td><input class="pf-effect-value" data-k="value" type="number" value="${t.value??''}"></td><td><input class="pf-effect-unit" data-k="unit" value="${t.unit||''}"></td><td class="pf-preview-cell">${effectText(t)}</td><td><button class="pf-remove" data-remove-tier="${i}">删除</button></td></tr>`}
function renderTiers(){$('tierRows').innerHTML=tiers.map(tierRow).join('');document.querySelectorAll('[data-tier-row]').forEach(row=>row.querySelectorAll('[data-k]').forEach(input=>input.oninput=()=>{const t=tiers[+row.dataset.tierRow],k=input.dataset.k;t[k]=['price','value'].includes(k)?Number(input.value||0):input.value;row.querySelector('.pf-preview-cell').textContent=effectText(t);renderTierSummary();syncPreview()}));document.querySelectorAll('[data-remove-tier]').forEach(x=>x.onclick=()=>{tiers.splice(+x.dataset.removeTier,1);renderTiers()});renderTierSummary();syncPreview()}
function renderTierSummary(){$('tierCount').textContent=tiers.length+' 个';$('tierPriceRange').textContent=tiers.length?`${money(Math.min(...tiers.map(t=>Number(t.price)||0)))} – ${money(Math.max(...tiers.map(t=>Number(t.price)||0)))}`:'—';$('tierEffectRange').textContent=tiers.length?`${num(Math.min(...tiers.map(t=>Number(t.value)||0)))} – ${num(Math.max(...tiers.map(t=>Number(t.value)||0)))}`:'—'}
$('addFixed').onclick=()=>{const base=fixed[0]||{};fixed.push({name:'新档位',effectName:base.effectName||'推广效果',value:0,unit:base.unit||'次',price:0,note:''});renderTables()};$('addQuantity').onclick=()=>{const base=quantity[0]||{};quantity.push({name:'新规格',effectName:base.effectName||'参与传播',value:1,unit:base.unit||'个',priceMin:0,priceMax:0,minBuy:1,caseUrl:''});renderTables()};$('addTier').onclick=()=>{const base=tiers[0]||{};tiers.push({price:0,effectName:base.effectName||'推广效果',value:0,unit:base.unit||'次'});renderTiers()};
function setMode(mode){currentMode=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.sale-panel').forEach(x=>x.hidden=true);$(mode+'Panel').hidden=false;syncPreview()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));function setBudgetMode(mode){budgetMode=mode;document.querySelectorAll('[data-budget-mode]').forEach(b=>b.classList.toggle('active',b.dataset.budgetMode===mode));$('continuousBudget').hidden=mode!=='continuous';$('tieredBudget').hidden=mode!=='tiered';syncPreview()}document.querySelectorAll('[data-budget-mode]').forEach(b=>b.onclick=()=>setBudgetMode(b.dataset.budgetMode));
$('batchToggle').onclick=()=>{$('batchPanel').hidden=!$('batchPanel').hidden};$('batchCancel').onclick=()=>{$('batchPanel').hidden=true};$('batchApply').onclick=()=>{const parsed=$('batchInput').value.split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>line.split(/[\t,，]+/).map(x=>x.trim())).filter(x=>x.length>=4&&Number.isFinite(Number(x[0]))&&Number.isFinite(Number(x[2]))).map(([price,effectName,value,unit])=>({price:Number(price),effectName,value:Number(value),unit}));if(!parsed.length)return alert('没有识别到有效档位');tiers=parsed;$('batchPanel').hidden=true;renderTiers()};
function currentPreview(){if(currentMode==='fixed')return fixed[0]||null;if(currentMode==='quantity')return quantity[0]||null;if(budgetMode==='tiered')return tiers[0]||null;const refBudget=Number($('referenceBudget').value||0),refEffect=Number($('referenceEffect').value||0);return {effectName:$('continuousEffectName').value||'推广效果',value:refEffect,unit:$('continuousEffectUnit').value||'',price:refBudget}}
function syncPreview(){const x=currentPreview();$('previewTitle').textContent=$('title').value.trim()||'产品标题';$('previewSubtitle').textContent=$('subtitle').value.trim()||'产品副标题';$('previewEffect').innerHTML=x?`${x.effectName||'效果名称'} <strong>${num(x.value)}</strong> ${x.unit||''}`:'效果名称 <strong>0</strong> 单位';let price=0;if(currentMode==='fixed')price=Math.min(...fixed.map(x=>Number(x.price)||0).filter(x=>x>0),0)||0;else if(currentMode==='quantity')price=Math.min(...quantity.map(x=>Number(x.priceMin)||0).filter(x=>x>0),0)||0;else if(budgetMode==='tiered')price=Math.min(...tiers.map(x=>Number(x.price)||0).filter(x=>x>0),0)||0;else price=Number($('budgetMin').value||0);$('previewPrice').textContent=(price?money(price):'¥0')+' 起'}
['title','subtitle','continuousEffectName','continuousEffectUnit','referenceBudget','referenceEffect','budgetMin','budgetMax','budgetStep'].forEach(id=>$(id).oninput=syncPreview);
const params=new URLSearchParams(location.search),editing=params.get('mode')==='edit',editingId=params.get('id')||'';
function baseProduct({title,subtitle,category,platform,goal,other=false,note=''}){$('title').value=title;$('subtitle').value=subtitle;$('category').value=category;selectedGoals=new Set([goal]);other?setOther(platform):setDsp(platform);$('internalNote').value=note}
function setupBudgetProduct({title,subtitle,platform,tierData=null,effectName='保底新增真实播放',unit='次',min=250,max=2000,step=50,refBudget=250,refEffect=4500}){baseProduct({title,subtitle,category:platform==='spotify'||platform==='youtube'?'overseas':'traffic',platform,goal:platform==='spotify'||platform==='youtube'?'global':'plays'});setMode('budget');$('continuousEffectName').value=effectName;$('continuousEffectUnit').value=unit;$('budgetMin').value=min;$('budgetMax').value=max;$('budgetStep').value=step;$('referenceBudget').value=refBudget;$('referenceEffect').value=refEffect;if(tierData){tiers=tierData.map(([price,value])=>({price,effectName,value,unit}));setBudgetMode('tiered');renderTiers()}else setBudgetMode('continuous')}
function setupFixedProduct({title,subtitle,category,platform,goal='playlist',specs=[],note=''}){baseProduct({title,subtitle,category,platform,goal,note});setMode('fixed');fixed.splice(0,fixed.length,...specs);renderTables()}
