:1px solid #2448ff;background:#2448ff;color:#fff}.pf-platform-source{display:flex;gap:8px;margin-bottom:10px}.pf-source-choice{height:34px;padding:0 13px;border:1px solid #d8dde5;background:#fff;border-radius:4px;color:#66758a}.pf-source-choice.active{border-color:#2448ff;color:#2448ff;background:#f5f7ff}.pf-platform-picker{position:relative;max-width:560px}.pf-platform-trigger{width:100%;height:38px;border:1px solid #d5dbe2;border-radius:4px;background:#fff;padding:0 36px 0 11px;text-align:left;color:#394b60;position:relative}.pf-platform-trigger:after{content:'';position:absolute;right:13px;top:13px;width:7px;height:7px;border-right:1px solid #8b97a5;border-bottom:1px solid #8b97a5;transform:rotate(45deg)}.pf-platform-trigger.placeholder{color:#a3acb7}.pf-platform-dropdown{display:none;position:absolute;z-index:120;left:0;right:0;top:44px;background:#fff;border:1px solid #d8dde5;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14);overflow:hidden}.pf-platform-picker.open .pf-platform-dropdown{display:block}.pf-platform-search{padding:10px;border-bottom:1px solid #edf0f3}.pf-platform-search input{width:100%;height:34px}.pf-platform-results{max-height:250px;overflow:auto}.pf-platform-option{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}.pf-platform-option:hover{background:#f6f8ff}.pf-platform-option-icon{width:30px;height:30px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:11px;font-weight:700}.pf-platform-option strong{display:block;font-size:13px}.pf-platform-option small{display:block;margin-top:2px;color:#99a3af;font-size:11px}.pf-other-platform{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;max-width:560px}.pf-icon-upload{height:38px;border:1px dashed #cfd5de;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#66758a;font-size:12px;cursor:pointer}.pf-icon-upload input{display:none}.pf-budget-section{margin-top:18px;padding-top:18px;border-top:1px solid #edf0f3}.pf-budget-title{margin:0 0 12px;color:#43536a;font-size:13px;font-weight:600}.pf-inline-actions{display:flex;gap:8px}.pf-batch{margin-top:12px;padding:14px;border:1px solid #dfe4eb;border-radius:6px;background:#fafbfc}.pf-batch textarea{width:100%;min-height:140px;padding:10px;border:1px solid #d4dae1;border-radius:4px;background:#fff;color:#425167;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;resize:vertical}.pf-batch-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px}.pf-batch-note{color:#929eac;font-size:11px}.pf-batch-actions div:last-child{display:flex;gap:8px}.pf-mini-btn{height:30px;padding:0 11px;border-radius:4px;border:1px solid #d4dae1;background:#fff;color:#56677d}.pf-mini-btn.primary{border-color:#2448ff;color:#2448ff}.pf-tier-summary{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:#f7f9fc;border:1px solid #e5e9ef;border-radius:5px;color:#7b8796;font-size:11px}.pf-tier-summary strong{color:#34475d;margin-left:4px}@media(max-width:1000px){.pf-grid,.pf-grid.three,.pf-sale-modes,.pf-budget-modes{grid-template-columns:1fr}.pf-field.full{grid-column:auto}.pf-other-platform{grid-template-columns:1fr}}

<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
<div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
<div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>
<div class="pf-layout">
<section class="pf-card"><div class="pf-head"><h2>基本信息</h2></div><div class="pf-body"><div class="pf-grid">
<div class="pf-field"><label class="required">产品名称</label><input id="name" placeholder="例如：网易云音乐播放推广"></div>
<div class="pf-field"><label class="required">所属类目</label><select id="category"><option value="">请选择产品类目</option><option value="traffic">播放推广</option><option value="playlist">歌单推广</option><option value="content">内容推广</option><option value="overseas">海外推广</option><option value="platform-resource">平台资源</option><option value="scene-service">场景服务</option></select></div>
<div class="pf-field full"><label class="required">适用推广目标</label><div class="pf-goals" id="goalGrid"></div><div class="pf-help">所属类目的主目标默认选中，产品也可以同时覆盖其他推广目标。</div></div>
<div class="pf-field full"><label class="required">平台</label><div class="pf-platform-source"><button class="pf-source-choice active" type="button" data-source="dsp">DSP 平台</button><button class="pf-source-choice" type="button" data-source="other">其他平台</button></div><div id="dspPlatformPanel"><div class="pf-platform-picker" id="platformPicker"><button class="pf-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button><div class="pf-platform-dropdown"><div class="pf-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div><div class="pf-platform-results" id="platformResults"></div></div></div></div><div id="otherPlatformPanel" hidden><div class="pf-other-platform"><input id="otherPlatformName" type="text" placeholder="输入平台名称，例如：小红书、抖音"><label class="pf-icon-upload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/*"></label></div><div class="pf-help">平台不在 DSP 列表时可自行添加名称和图标，仅作为该产品的展示平台。</div></div></div>
<div class="pf-field full"><label>内部备注</label><textarea id="internalNote" placeholder="仅后台可见，例如供应商、成本或履约说明"></textarea></div>
</div></div></section>
<section class="pf-card"><div class="pf-head"><h2>售卖方式</h2></div><div class="pf-body"><div class="pf-sale-modes"><button class="pf-sale-mode active" data-mode="fixed"><strong>固定套餐</strong><small>一个产品配置多个固定价格规格。</small></button><button class="pf-sale-mode" data-mode="quantity"><strong>按数量购买</strong><small>多个规格可同时选择，每个规格按份购买。</small></button><button class="pf-sale-mode" data-mode="budget"><strong>按预算投放</strong><small>按预算购买；可配置连续预算或固定预算档位。</small></button></div></div></section>
<section class="pf-card"><div class="pf-head"><h2>推广效果</h2></div><div class="pf-body"><div class="pf-grid three"><div class="pf-field"><label class="required">主要效果指标</label><select id="metric"><option value="plays">播放量</option><option value="impressions">曝光量</option><option value="content">传播内容</option><option value="accounts">参与账号 / 达人</option><option value="playlist">歌单收录</option><option value="engagement">互动</option><option value="ranking">排名</option><option value="coverage">渠道覆盖</option></select></div><div class="pf-field"><label class="required">前台效果名称</label><input id="effectLabel" value="保底新增真实播放" placeholder="例如：保底新增真实播放"></div><div class="pf-field"><label class="required">效果单位</label><input id="metricUnit" value="次"></div></div><div class="pf-summary">效果名称和单位维护在产品层。固定预算档位中只需要维护 <strong>售价 + 效果数量</strong>；固定套餐可为每个规格单独维护交付说明。</div></div></section>
<section class="pf-card sale-panel" id="fixedPanel"><div class="pf-head"><h2>固定套餐规格</h2><button class="pf-add" type="button" id="addFixed">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格名称</th><th>结果类型</th><th>效果最小值</th><th>效果最大值</th><th>售价</th><th class="pf-delivery">交付说明</th><th></th></tr></thead><tbody id="fixedRows"></tbody></table></div><div class="pf-summary">“交付说明”用于不同档位各自的榜单范围、未登榜保底、资源说明等，不与产品层的统一效果名称重复。</div></div></section>
<section class="pf-card sale-panel" id="quantityPanel" hidden><div class="pf-head"><h2>数量规格</h2><button class="pf-add" type="button" id="addQuantity">＋ 添加规格</button></div><div class="pf-body"><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th>规格名称</th><th>每份包含</th><th>单价</th><th>最低购买</th><th></th></tr></thead><tbody id="quantityRows"></tbody></table></div></div></section>
<section class="pf-card sale-panel" id="budgetPanel" hidden><div class="pf-head"><h2>预算投放规则</h2></div><div class="pf-body">
<div class="pf-field full"><label class="required">预算配置方式</label><div class="pf-budget-modes"><button class="pf-budget-mode active" type="button" data-budget-mode="continuous"><strong>连续预算</strong><small>用户可在预算范围内自由选择金额，系统按规则估算效果。适合 Spotify、YouTube 等。</small></button><button class="pf-budget-mode" type="button" data-budget-mode="tiered"><strong>固定预算档位</strong><small>仅允许购买预设档位，预算和效果一一对应。适合网易云、QQ、酷狗、酷我。</small></button></div></div>
<div class="pf-budget-section" id="continuousBudget"><div class="pf-budget-title">连续预算规则</div><div class="pf-grid three"><div class="pf-field"><label>最低预算</label><input id="budgetMin" type="number" value="250"></div><div class="pf-field"><label>最高预算</label><input id="budgetMax" type="number" value="2000"></div><div class="pf-field"><label>预算步长</label><input id="budgetStep" type="number" value="50"></div><div class="pf-field"><label>结果类型</label><select id="continuousResultType"><option selected>预估结果</option><option>保底结果</option></select></div><div class="pf-field"><label>效果计算方式</label><select id="calcMode"><option selected>按参考预算等比例估算</option><option>仅展示参考区间</option></select></div><div class="pf-field"><label>参考预算</label><input id="referenceBudget" type="number" value="250"></div><div class="pf-field"><label>参考效果最小值</label><input id="referenceMin" type="number" value="4500"></div><div class="pf-field"><label>参考效果最大值</label><input id="referenceMax" type="number" value="4500"></div></div><div class="pf-summary">前台允许在最低与最高预算之间选择金额，并按这里的参考规则计算或展示预估效果。</div></div>
<div class="pf-budget-section" id="tieredBudget" hidden><div class="pf-head" style="padding:0;min-height:42px;border:0"><div><div class="pf-budget-title" style="margin:0">固定预算档位</div><div class="pf-help">每个档位只维护售价和效果数量；前台效果文案自动使用上方的“前台效果名称 + 数量 + 单位”。</div></div><div class="pf-inline-actions"><button class="pf-add" type="button" id="batchToggle">批量录入</button><button class="pf-add" type="button" id="addTier">＋ 添加档位</button></div></div><div class="pf-table-wrap"><table class="pf-table"><thead><tr><th class="pf-index">#</th><th>售价</th><th id="tierEffectHead">保底新增真实播放</th><th>前台预览</th><th></th></tr></thead><tbody id="tierRows"></tbody></table></div><div class="pf-batch" id="batchPanel" hidden><textarea id="batchInput" placeholder="支持直接粘贴 Excel 两列，或按“售价,效果数量”逐行录入：&#10;45,600&#10;95,1320&#10;145,1980"></textarea><div class="pf-batch-actions"><span class="pf-batch-note">支持逗号、Tab 或空格分隔；导入会替换当前档位。</span><div><button class="pf-mini-btn" type="button" id="batchCancel">取消</button><button class="pf-mini-btn primary" type="button" id="batchApply">解析并导入</button></div></div></div><div class="pf-tier-summary"><span>档位数量<strong id="tierCount">0</strong></span><span>价格范围<strong id="tierPriceRange">—</strong></span><span>效果范围<strong id="tierEffectRange">—</strong></span></div></div>
</div></section>
<section class="pf-card"><div class="pf-head"><h2>前台内容</h2></div><div class="pf-body"><div class="pf-language-tabs"><button class="pf-lang active" data-lang="zh">简体中文</button><button class="pf-lang" data-lang="en">English</button><button class="pf-lang" data-lang="ja">日本語</button><button class="pf-lang" data-lang="zh-Hant">繁體中文</button></div><div class="pf-grid"><div class="pf-field"><label>产品名称</label><input id="frontName"></div><div class="pf-field"><label>一句话介绍</label><input id="summary" placeholder="用于产品卡片"></div><div class="pf-field full"><label>产品说明</label><textarea id="description" placeholder="用于用户侧了解服务内容"></textarea></div></div></div></section>
</div><div class="pf-actions"><a class="pf-btn pf-secondary" href="products.html">取消</a><button class="pf-btn pf-primary" id="saveBtn">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-category-data.js"></script><script src="../assets/js/product-platform-data.js"></script><script>
const goals=[['plays','提升播放曝光'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','头部热度冲刺'],['ktv','上架到 KTV']];
let selectedGoals=new Set(),platformSource='dsp',selectedPlatform=null,currentMode='fixed',budgetMode='continuous';
const fixed=[{name:'体验套餐',type:'guaranteed',min:1980,max:'',price:145,delivery:''}],quantity=[{name:'素人号',qty:2000,price:3600,minBuy:1}];
const NETEASE_TIERS=[[45,600],[95,1320],[145,1980],[215,3000],[290,4000],[430,6000],[715,10000],[1150,16000],[1430,20000],[1720,24000],[2290,32000],[2860,40000],[3570,49980]];
const TME_TIERS=[[45,750],[95,1650],[145,2475],[215,3750],[290,5000],[430,7500],[715,12500],[1150,20000],[1430,25000],[1720,30000],[2290,40000],[2860,50000],[3570,62475]];
let tiers=NETEASE_TIERS.map(([price,effect])=>({price,effect}));
const $=id=>document.getElementById(id),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN'),num=n=>Number(n||0).toLocaleString('zh-CN');
const categoryPrimary=()=>window.getProductCategory?.($('category').value)?.goalId||'';
function renderGoals(){const primary=categoryPrimary();if(primary)selectedGoals.add(primary);$('goalGrid').innerHTML=goals.map(g=>`<button type="button" class="pf-goal ${selectedGoals.has(g[0])?'active':''}${g[0]===primary?' primary':''}" data-goal="${g[0]}">${g[1]}</button>`).join('');document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{if(b.dataset.goal===primary)return;selectedGoals.has(b.dataset.goal)?selectedGoals.delete(b.dataset.goal):selectedGoals.add(b.dataset.goal);renderGoals()})}$('category').onchange=renderGoals;
function renderPlatformResults(q=''){const key=q.trim().toLowerCase(),list=PRODUCT_PLATFORM_LIBRARY.filter(p=>!key||[p.name,p.code,...(p.keywords||[])].join(' ').toLowerCase().includes(key));$('platformResults').innerHTML=list.map(p=>`<div class="pf-platform-option" data-platform="${p.id}"><div class="pf-platform-option-icon">${p.icon}</div><div><strong>${p.name}</strong><small>${p.code}</small></div></div>`).join('')||'<div style="padding:18px;color:#98a3af;text-align:center">没有找到平台</div>';document.querySelectorAll('[data-platform]').forEach(el=>el.onclick=e=>{e.stopPropagation();setDsp(el.dataset.platform);$('platformPicker').classList.remove('open')})}renderPlatformResults();$('platformTrigger').onclick=e=>{e.stopPropagation();$('platformPicker').classList.toggle('open');setTimeout(()=>$('platformSearch').focus(),0)};$('platformSearch').oninput=e=>renderPlatformResults(e.target.value);document.addEventListener('click',()=>$('platformPicker').classList.remove('open'));
document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>{platformSource=btn.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===btn));$('dspPlatformPanel').hidden=platformSource!=='dsp';$('otherPlatformPanel').hidden=platformSource!=='other'});$('otherPlatformIcon').onchange=e=>$('iconUploadText').textContent=e.target.files?.[0]?.name||'＋ 上传平台图标';
function setDsp(id){platformSource='dsp';selectedPlatform=getProductPlatform(id);document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='dsp'));$('dspPlatformPanel').hidden=false;$('otherPlatformPanel').hidden=true;$('platformTrigger').textContent=selectedPlatform?.name||'搜索并选择 DSP 平台';$('platformTrigger').classList.toggle('placeholder',!selectedPlatform)}function setOther(name){platformSource='other';document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x.dataset.source==='other'));$('dspPlatformPanel').hidden=true;$('otherPlatformPanel').hidden=false;$('otherPlatformName').value=name}
function fixedRow(x,i){return `<tr><td><input value="${x.name}"></td><td><select><option ${x.type==='fixed'?'selected':''}>固定结果</option><option ${x.type==='guaranteed'?'selected':''}>保底结果</option><option ${x.type==='estimated'?'selected':''}>预估结果</option></select></td><td><input type="number" value="${x.min}"></td><td><input type="number" value="${x.max}"></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><input class="pf-delivery" value="${x.delivery||''}" placeholder="例如：排名参考 40–60 名"></td><td><button class="pf-remove" data-remove-fixed="${i}">删除</button></td></tr>`}
function quantityRow(x,i){return `<tr><td><input value="${x.name}"></td><td><input type="number" value="${x.qty}"></td><td><div class="pf-money"><span>¥</span><input type="number" value="${x.price}"></div></td><td><input type="number" value="${x.minBuy}"></td><td><button class="pf-remove" data-remove-quantity="${i}">删除</button></td></tr>`}
function renderTables(){$('fixedRows').innerHTML=fixed.map(fixedRow).join('');$('quantityRows').innerHTML=quantity.map(quantityRow).join('');document.querySelectorAll('[data-remove-fixed]').forEach(b=>b.onclick=()=>{fixed.splice(+b.dataset.removeFixed,1);renderTables()});document.querySelectorAll('[data-remove-quantity]').forEach(b=>b.onclick=()=>{quantity.splice(+b.dataset.removeQuantity,1);renderTables()})}
function renderTiers(){const label=$('effectLabel').value.trim()||'推广效果',unit=$('metricUnit').value.trim();$('tierEffectHead').textContent=label;$('tierRows').innerHTML=tiers.map((t,i)=>`<tr><td class="pf-index">${i+1}</td><td><div class="pf-money"><span>¥</span><input type="number" value="${t.price}" data-tier-price="${i}"></div></td><td><input type="number" value="${t.effect}" data-tier-effect="${i}"></td><td>${label} ${num(t.effect)} ${unit}</td><td><button class="pf-remove" data-remove-tier="${i}">删除</button></td></tr>`).join('');document.querySelectorAll('[data-tier-price]').forEach(x=>x.onchange=()=>{tiers[+x.dataset.tierPrice].price=Number(x.value||0);renderTiers()});document.querySelectorAll('[data-tier-effect]').forEach(x=>x.onchange=()=>{tiers[+x.dataset.tierEffect].effect=Number(x.value||0);renderTiers()});document.querySelectorAll('[data-remove-tier]').forEach(x=>x.onclick=()=>{tiers.splice(+x.dataset.removeTier,1);renderTiers()});$('tierCount').textContent=tiers.length+' 个';if(tiers.length){$('tierPriceRange').textContent=`${money(Math.min(...tiers.map(t=>t.price)))} – ${money(Math.max(...tiers.map(t=>t.price)))}`;$('tierEffectRange').textContent=`${num(Math.min(...tiers.map(t=>t.effect)))} – ${num(Math.max(...tiers.map(t=>t.effect)))} ${unit}`}else{$('tierPriceRange').textContent='—';$('tierEffectRange').textContent='—'}}
$('addFixed').onclick=()=>{fixed.push({name:'新规格',type:'guaranteed',min:'',max:'',price:'',delivery:''});renderTables()};$('addQuantity').onclick=()=>{quantity.push({name:'新规格',qty:1,price:'',minBuy:1});renderTables()};$('addTier').onclick=()=>{tiers.push({price:'',effect:''});renderTiers()};$('effectLabel').oninput=renderTiers;$('metricUnit').oninput=renderTiers;
function setMode(mode){currentMode=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.sale-panel').forEach(x=>x.hidden=true);$(mode+'Panel').hidden=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function setBudgetMode(mode){budgetMode=mode;document.querySelectorAll('[data-budget-mode]').forEach(b=>b.classList.toggle('active',b.dataset.budgetMode===mode));$('continuousBudget').hidden=mode!=='continuous';$('tieredBudget').hidden=mode!=='tiered'}document.querySelectorAll('[data-budget-mode]').forEach(b=>b.onclick=()=>setBudgetMode(b.dataset.budgetMode));
$('batchToggle').onclick=()=>{$('batchPanel').hidden=!$('batchPanel').hidden};$('batchCancel').onclick=()=>{$('batchPanel').hidden=true};$('batchApply').onclick=()=>{const parsed=$('batchInput').value.split(/\n+/).map(line=>line.trim()).filter(Boolean).map(line=>line.split(/[\t,， ]+/).filter(Boolean).map(Number)).filter(x=>x.length>=2&&Number.isFinite(x[0])&&Number.isFinite(x[1])).map(([price,effect])=>({price,effect}));if(!parsed.length){alert('没有识别到有效档位，请按“售价,效果数量”逐行录入');return}tiers=parsed;$('batchPanel').hidden=true;renderTiers()};
document.querySelectorAll('.pf-lang').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pf-lang').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
const params=new URLSearchParams(location.search),editing=params.get('mode')==='edit',editingId=params.get('id')||'';
function setupBudgetProduct({name,platform,tierData=null,label='保底新增真实播放',summary=''}){$('name').value=name;$('category').value='traffic';selectedGoals=new Set(['plays']);setDsp(platform);setMode('budget');$('metric').value='plays';$('effectLabel').value=label;$('metricUnit').value='次';$('frontName').value=name;$('summary').value=summary;if(tierData){tiers=tierData.map(([price,effect])=>({price,effect}));setBudgetMode('tiered')}renderTiers()}
function setupFixedProduct({name,category,platform,goal='chart',label='保底新增真实播放',summary='',specs=[]}){$('name').value=name;$('category').value=category;selectedGoals=new Set([goal]);setDsp(platform);setMode('fixed');$('metric').value='plays';$('effectLabel').value=label;$('metricUnit').value='次';$('frontName').value=name;$('summary').value=summary;fixed.splice(0,fixed.length,...specs.map(s=>({...s,type:s.type||'guaranteed',max:s.max??''})));renderTables()}
if(editing){$('crumbText').textContent='编辑产品';$('formTitle').textContent='编辑产品';
if(editingId==='netease-play')setupBudgetProduct({name:'网易云音乐播放推广',platform:'netease',tierData:NETEASE_TIERS,summary:'来源真实用户点击'});
else if(editingId==='qq-play')setupBudgetProduct({name:'QQ 音乐播放推广',platform:'qqmusic',tierData:TME_TIERS,summary:'来源真实用户点击'});
else if(editingId==='kugou-play')setupBudgetProduct({name:'酷狗音乐播放推广',platform:'kugou',tierData:TME_TIERS,summary:'来源真实用户点击'});
else if(editingId==='kuwo-play')setupBudgetProduct({name:'酷我音乐播放推广',platform:'kuwo',tierData:TME_TIERS,summary:'来源真实用户点击'});
else if(editingId==='netease-playlist')setupFixedProduct({name:'网易云歌单矩阵',category:'playlist',platform:'netease',goal:'playlist',label:'保底新增播放',summary:'将歌曲加入网易云高质量歌单资源位，持续获得自然曝光',specs:[{name:'基础',min:120000,price:6000,delivery:'保底新增播放 12 万次'},{name:'进阶',min:250000,price:12000,delivery:'保底新增播放 25 万次'},{name:'高级',min:380000,price:18000,delivery:'保底新增播放 38 万次'}]});
else if(editingId==='qq-playlist-chart')setupFixedProduct({name:'QQ 音乐歌单矩阵',category:'playlist',platform:'qqmusic',goal:'playlist',label:'保底新增播放',summary:'将歌曲加入QQ音乐高质量歌单资源位，持续获得自然曝光',specs:[{name:'基础打榜',min:200000,price:10000,delivery:'保底新增播放 20 万次'},{name:'中级打榜',min:300000,price:15000,delivery:'保底新增播放 30 万次'},{name:'高级打榜',min:400000,price:20000,delivery:'保底新增播放 40 万次'}]});
else if(editingId==='qq-chart-sprint')setupFixedProduct({name:'QQ音乐热度冲刺',category:'platform-resource',platform:'qqmusic',summary:'提升歌曲热度声量·助力登上官方榜单',specs:[{name:'基础打榜',min:200000,price:14500,delivery:'未登榜保底实际播放 20 万'},{name:'中级打榜',min:300000,price:21500,delivery:'未登榜保底实际播放 30 万'},{name:'高级打榜',min:400000,price:28600,delivery:'未登榜保底实际播放 40 万'}]});
else if(editingId==='netease-chart-sprint')setupFixedProduct({name:'网易云音乐热度冲刺',category:'platform-resource',platform:'netease',summary:'提升歌曲热度声量·助力登上官方榜单',specs:[{name:'基础',min:120000,price:8600,delivery:'官方私人歌单打榜服务'},{name:'进阶',min:250000,price:17200,delivery:'官方私人歌单打榜服务'},{name:'高级',min:380000,price:25800,delivery:'官方私人歌单打榜服务'}]});
else if(editingId==='kugou-chart-sprint')setupFixedProduct({name:'酷狗音乐热度冲刺',category:'platform-resource',platform:'kugou',summary:'提升歌曲热度声量·助力登上官方榜单',specs:[{name:'基础',min:100000,price:8600,delivery:'冲飙升榜、内地榜（排名参考 40–60 名）'},{name:'进阶',min:200000,price:17200,delivery:'冲飙升榜、新歌榜、内地榜（排名参考 20–30 名）'},{name:'高级',min:400000,price:34300,delivery:'冲飙升榜、新歌榜、内地榜等（排名参考 5–20 名）'}]});
else if(editingId==='spotify-ads'){$('name').value='Spotify 播放推广';$('category').value='overseas';selectedGoals=new Set(['global']);setDsp('spotify');setMode('budget');setBudgetMode('continuous');$('metric').value='plays';$('effectLabel').value='预计新增真实播放';$('frontName').value='Spotify 播放推广';$('summary').value='通过 Spotify 官方广告系统精准触达海外听众'}
else if(editingId==='youtube-views'){$('name').value='YouTube 播放推广';$('category').value='overseas';selectedGoals=new Set(['global']);setDsp('youtube');setMode('budget');setBudgetMode('continuous');$('metric').value='plays';$('effectLabel').value='预计新增真实播放';$('frontName').value='YouTube 播放推广'}
else{$('name').value=editingId==='xiaohongshu-promotion'?'小红书投放':'抖音投放';$('category').value='content';selectedGoals=new Set(['social']);setOther(editingId==='xiaohongshu-promotion'?'小红书':'抖音');setMode('quantity');$('metric').value='accounts';$('effectLabel').value='参与传播';$('metricUnit').value='个账号';$('frontName').value=$('name').value}}
renderGoals();renderTables();renderTiers();$('saveBtn').onclick=()=>{const platformOk=platformSource==='dsp'?!!selectedPlatform:!!$('otherPlatformName').value.trim();if(!$('name').value.trim()||!$('category').value||!platformOk){alert('请填写产品名称、所属类目和平台');return}if(currentMode==='budget'&&budgetMode==='tiered'&&!tiers.length){alert('请至少配置一个固定预算档位');return}$('saveBtn').textContent='已保存（原型）'};
</script></body></html>
