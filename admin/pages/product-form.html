<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑产品｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/products.css">
<style>[hidden]{display:none!important}.pd-goal-choice.locked{cursor:default}.pd-goal-choice.locked:after{content:'主';display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:#dfe5ff;color:#2448ff;font-size:9px}.pd-result-type{min-width:118px}.pd-package-editor th:nth-child(1){width:180px}.pd-package-editor th:nth-child(2){width:140px}.pd-package-editor th:nth-child(3){min-width:230px}.pd-package-editor th:nth-child(4){width:150px}.pd-package-editor th:last-child{width:54px}</style>
</head>
<body data-admin-page="products" data-page-title="产品列表 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pd-breadcrumb"><a href="products.html">产品列表</a><span>/</span><b id="crumbText">新增产品</b></div>
  <div class="page-header"><div><h1 id="formTitle">新增产品</h1></div></div>

  <div class="pd-form-layout" style="grid-template-columns:minmax(0,1fr)">
    <div>
      <section class="pd-form-card">
        <div class="pd-form-card-head"><h2>基本信息</h2></div>
        <div class="pd-form-body">
          <div class="pd-form-row"><div class="pd-form-label pd-required">产品名称</div><div class="pd-form-control"><input id="name" placeholder="例如：网易云音乐播放推广"></div></div>
          <div class="pd-form-row">
            <div class="pd-form-label pd-required">所属类目</div>
            <div class="pd-form-control">
              <div class="pd-select-wrap" id="categorySelect"><button class="pd-select-box placeholder" type="button">请选择产品类目</button><div class="pd-select-menu"></div></div>
            </div>
          </div>
          <div class="pd-form-row">
            <div class="pd-form-label pd-required">适用推广目标</div>
            <div class="pd-form-control"><div class="pd-goal-grid" id="goalGrid"></div></div>
          </div>
          <div class="pd-form-row">
            <div class="pd-form-label pd-required">平台</div>
            <div class="pd-form-control">
              <div class="pd-platform-source" id="platformSource">
                <button class="pd-source-choice active" type="button" data-source="dsp">DSP 平台</button>
                <button class="pd-source-choice" type="button" data-source="other">其他平台</button>
              </div>
              <div id="dspPlatformPanel">
                <div class="pd-platform-picker" id="platformPicker">
                  <button class="pd-platform-trigger placeholder" type="button" id="platformTrigger">搜索并选择 DSP 平台</button>
                  <div class="pd-platform-dropdown">
                    <div class="pd-platform-search"><input id="platformSearch" placeholder="输入平台名称或关键词"></div>
                    <div class="pd-platform-results" id="platformResults"></div>
                  </div>
                </div>
              </div>
              <div id="otherPlatformPanel" hidden>
                <div class="pd-other-platform">
                  <div><input id="otherPlatformName" placeholder="平台名称，例如：小红书、哔哩哔哩"></div>
                  <label class="pd-icon-upload" id="iconUpload"><span id="iconUploadText">＋ 上传平台图标</span><input id="otherPlatformIcon" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
                </div>
              </div>
            </div>
          </div>
          <div class="pd-form-row"><div class="pd-form-label">内部备注</div><div class="pd-form-control"><textarea id="internalNote" placeholder="仅后台可见"></textarea></div></div>
        </div>
      </section>

      <section class="pd-form-card">
        <div class="pd-form-card-head"><h2>售卖方式</h2></div>
        <div class="pd-form-body">
          <div class="pd-sale-mode-grid" id="saleModeGrid">
            <button class="pd-sale-mode-card active" type="button" data-sale-mode="fixed"><strong>固定套餐</strong><small>一个或多个固定价格档位</small></button>
            <button class="pd-sale-mode-card" type="button" data-sale-mode="quantity"><strong>按数量购买</strong><small>按份数或数量计算价格</small></button>
            <button class="pd-sale-mode-card" type="button" data-sale-mode="budget"><strong>按预算投放</strong><small>用户输入投放预算</small></button>
            <button class="pd-sale-mode-card" type="button" data-sale-mode="quote"><strong>询价</strong><small>最终价格人工确认</small></button>
          </div>
          <input type="hidden" id="saleMode" value="fixed">
        </div>
      </section>

      <section class="pd-form-card pd-sale-config" id="fixedConfig">
        <div class="pd-form-card-head"><div class="pd-card-title-row"><h2>固定套餐</h2><button class="pd-btn pd-btn-secondary" id="addPackageBtn" type="button">＋ 添加套餐</button></div></div>
        <div class="pd-form-body">
          <div class="pd-package-table-wrap"><table class="pd-package-editor"><thead><tr><th>套餐名称</th><th>结果类型</th><th>服务结果</th><th>售价</th><th></th></tr></thead><tbody id="packageRows"></tbody></table></div>
        </div>
      </section>

      <section class="pd-form-card pd-sale-config" id="quantityConfig" hidden>
        <div class="pd-form-card-head"><h2>按数量购买</h2></div>
        <div class="pd-form-body"><div class="pd-config-grid">
          <div class="pd-config-field"><label>每份数量</label><input id="quantityPerUnit" type="number" min="1" value="10"></div>
          <div class="pd-config-field"><label>数量单位</label><div class="pd-native-select-wrap"><select class="pd-native-select" id="quantityUnit"><option>个账号</option><option>条</option><option>次</option><option>播放</option><option>收藏</option></select></div></div>
          <div class="pd-config-field"><label>每份售价</label><div class="pd-inline-unit"><span>¥</span><input id="quantityPrice" type="number" min="0" value="600"></div></div>
          <div class="pd-config-field"><label>最低购买份数</label><input id="quantityMin" type="number" min="1" value="1"></div>
          <div class="pd-config-field"><label>每次增加</label><input id="quantityStep" type="number" min="1" value="1"></div>
          <div class="pd-config-field"><label>最大购买份数</label><input id="quantityMax" type="number" min="1" placeholder="不限制"></div>
          <div class="pd-config-field"><label>结果类型</label><div class="pd-native-select-wrap"><select class="pd-native-select" id="quantityResultType"><option value="fixed">固定结果</option><option value="guaranteed">保底结果</option><option value="estimated">预估结果</option><option value="none">不承诺结果</option></select></div></div>
          <div class="pd-config-field"><label>每份服务结果</label><input id="quantityResult" value="10 个账号发布"></div>
        </div><div class="pd-sale-preview" id="quantityPreview"></div></div>
      </section>

      <section class="pd-form-card pd-sale-config" id="budgetConfig" hidden>
        <div class="pd-form-card-head"><h2>按预算投放</h2></div>
        <div class="pd-form-body"><div class="pd-config-grid">
          <div class="pd-config-field"><label>结算币种</label><div class="pd-native-select-wrap"><select class="pd-native-select" id="budgetCurrency"><option value="USD">USD 美元</option><option value="CNY">CNY 人民币</option></select></div></div>
          <div class="pd-config-field"><label>最低预算</label><input id="budgetMin" type="number" min="0" value="250"></div>
          <div class="pd-config-field"><label>预算步长</label><input id="budgetStep" type="number" min="1" value="50"></div>
          <div class="pd-config-field"><label>计费指标</label><input id="billingMetric" placeholder="例如：CPV / CPC" value="CPV"></div>
          <div class="pd-config-field full"><label>支持市场 / 地区</label><input id="budgetMarkets" value="欧美、东南亚、拉美"></div>
          <div class="pd-config-field"><label>参考预算</label><input id="budgetReference" type="number" min="1" value="1000"></div>
          <div class="pd-config-field"><label>预估结果单位</label><input id="budgetResultUnit" value="有效播放"></div>
          <div class="pd-config-field full"><label>参考预算对应的预估结果</label><div class="pd-range-inputs"><input id="budgetResultMin" type="number" value="1800"><span>–</span><input id="budgetResultMax" type="number" value="2500"></div></div>
        </div></div>
      </section>

      <section class="pd-form-card pd-sale-config" id="quoteConfig" hidden>
        <div class="pd-form-card-head"><h2>询价设置</h2></div>
        <div class="pd-form-body"><div class="pd-config-grid">
          <div class="pd-config-field"><label>价格展示</label><div class="pd-native-select-wrap"><select class="pd-native-select" id="quoteDisplay"><option value="range">显示价格区间</option><option value="from">显示起售价</option><option value="quote">仅显示“询价”</option></select></div></div>
          <div class="pd-config-field"><label>计价单位</label><input id="quoteUnit" value="条"></div>
          <div class="pd-config-field" id="quoteMinPriceField"><label>最低参考价</label><div class="pd-inline-unit"><span>¥</span><input id="quoteMinPrice" type="number" value="2000"></div></div>
          <div class="pd-config-field" id="quoteMaxPriceField"><label>最高参考价</label><div class="pd-inline-unit"><span>¥</span><input id="quoteMaxPrice" type="number" value="6000"></div></div>
          <div class="pd-config-field"><label>最低起投数量</label><input id="quoteMinQuantity" type="number" min="1" value="1"></div>
          <div class="pd-config-field"><label>结果类型</label><div class="pd-native-select-wrap"><select class="pd-native-select" id="quoteResultType"><option value="fixed">固定结果</option><option value="guaranteed">保底结果</option><option value="estimated">预估结果</option><option value="none" selected>不承诺结果</option></select></div></div>
          <div class="pd-config-field full"><label>服务内容</label><input id="quoteResult" value="根据账号量级与内容形式确认"></div>
        </div></div>
      </section>

      <section class="pd-form-card">
        <div class="pd-form-card-head"><h2>履约与销售</h2></div>
        <div class="pd-form-body">
          <div class="pd-form-row"><div class="pd-form-label">履约周期</div><div class="pd-form-control"><div style="display:flex;gap:10px"><div class="pd-native-select-wrap" style="width:170px"><select class="pd-native-select" id="deliveryType"><option value="single">单次</option><option value="period">固定周期</option></select></div><div id="deliveryPeriod" style="display:none;gap:8px"><input id="deliveryDuration" type="number" min="1" value="30" style="width:100px"><div class="pd-native-select-wrap" style="width:100px"><select class="pd-native-select" id="deliveryUnit"><option>天</option><option>周</option><option>个月</option></select></div></div></div></div></div>
          <div class="pd-form-row"><div class="pd-form-label">允许追加购买</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="repeatSwitch" type="button"></button><span id="repeatText">是</span></div></div></div>
          <div class="pd-form-row"><div class="pd-form-label">允许单独购买</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="directSwitch" type="button"></button><span id="directText">是</span></div></div></div>
          <div class="pd-form-row"><div class="pd-form-label">可用于推广方案</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="planSwitch" type="button"></button><span id="planText">是</span></div></div></div>
          <div class="pd-form-row"><div class="pd-form-label">排序</div><div class="pd-form-control"><input id="sort" type="number" min="0" value="10"></div></div>
          <div class="pd-form-row"><div class="pd-form-label">状态</div><div class="pd-form-control"><div class="pd-switch-row"><button class="pd-switch" id="statusSwitch" type="button"></button><span id="statusText">上架</span></div></div></div>
        </div>
      </section>

      <section class="pd-form-card">
        <div class="pd-form-card-head"><h2>前台内容</h2></div>
        <div class="pd-form-body">
          <div class="pd-language-tabs"><button class="pd-language-tab active" data-lang="zh" type="button">简体中文</button><button class="pd-language-tab" data-lang="en" type="button">English</button><button class="pd-language-tab" data-lang="ja" type="button">日本語</button><button class="pd-language-tab" data-lang="zh-Hant" type="button">繁體中文</button></div>
          <div class="pd-form-row" id="translatedNameRow" hidden><div class="pd-form-label">产品名称</div><div class="pd-form-control"><input id="translatedName"></div></div>
          <div class="pd-form-row"><div class="pd-form-label">一句话介绍</div><div class="pd-form-control"><input id="summary" placeholder="用于产品卡片"></div></div>
          <div class="pd-form-row"><div class="pd-form-label">产品说明</div><div class="pd-form-control"><textarea id="description" placeholder="用于用户侧了解服务内容"></textarea></div></div>
        </div>
      </section>
    </div>
  </div>

  <div class="pd-form-actions"><a class="pd-btn pd-btn-secondary" id="cancelBtn" href="products.html">取消</a><button class="pd-btn pd-btn-primary" id="saveBtn" type="button">保存产品</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script src="../assets/js/product-platform-data.js"></script>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const editing=params.get('mode')==='edit';
const productId=params.get('id')||'';
const resultTypes={fixed:'固定结果',guaranteed:'保底结果',estimated:'预估结果',none:'不承诺结果'};
let selectedCategory='';
let selectedGoals=[];
let platformSource='dsp';
let selectedPlatform=null;
let otherIconData='';
let packages=[{name:'标准套餐',resultType:'guaranteed',result:'',price:''}];
let currentLang='zh';
const langData={zh:{name:'',summary:'',desc:''},en:{name:'',summary:'',desc:''},ja:{name:'',summary:'',desc:''},'zh-Hant':{name:'',summary:'',desc:''}};

function selectCategory(categoryId){
  const category=PRODUCT_CATEGORIES.find(item=>item.id===categoryId);if(!category)return;
  selectedCategory=categoryId;
  const box=$('categorySelect').querySelector('.pd-select-box');box.textContent=category.names.zhCN;box.classList.remove('placeholder');
  $('categorySelect').querySelectorAll('.pd-select-option').forEach(x=>x.classList.toggle('active',x.dataset.value===categoryId));
  if(!selectedGoals.includes(category.goalId))selectedGoals.push(category.goalId);
  renderGoals();
}
function initCategorySelect(){
  const root=$('categorySelect'),menu=root.querySelector('.pd-select-menu');
  menu.innerHTML=PRODUCT_CATEGORIES.filter(x=>x.status==='on'||editing).map(item=>`<div class="pd-select-option" data-value="${item.id}"><span>${item.names.zhCN}</span><small>${getPromotionGoal(item.goalId)?.name||''}</small></div>`).join('');
  root.querySelector('.pd-select-box').onclick=e=>{e.stopPropagation();root.classList.toggle('open');};
  menu.querySelectorAll('.pd-select-option').forEach(option=>option.onclick=()=>{selectCategory(option.dataset.value);root.classList.remove('open');});
}
function renderGoals(){
  const mainGoal=PRODUCT_CATEGORIES.find(x=>x.id===selectedCategory)?.goalId||'';
  $('goalGrid').innerHTML=PROMOTION_GOALS.map(goal=>`<button class="pd-goal-choice${selectedGoals.includes(goal.id)?' active':''}${goal.id===mainGoal?' locked':''}" type="button" data-goal="${goal.id}">${goal.name}</button>`).join('');
  $('goalGrid').querySelectorAll('[data-goal]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.goal;if(id===mainGoal)return;
    selectedGoals=selectedGoals.includes(id)?selectedGoals.filter(x=>x!==id):[...selectedGoals,id];renderGoals();
  });
}

function platformOptionHtml(item){return `<div class="pd-platform-option" data-platform="${item.id}"><div class="pd-platform-icon">${item.icon}</div><div><strong>${item.name}</strong><small>${item.code}</small></div></div>`;}
function renderPlatformResults(q=''){
  const keyword=q.trim().toLowerCase();
  const results=PRODUCT_PLATFORM_LIBRARY.filter(item=>!keyword||[item.name,item.code,...(item.keywords||[])].join(' ').toLowerCase().includes(keyword));
  $('platformResults').innerHTML=results.length?results.map(platformOptionHtml).join(''):'<div class="pd-platform-empty">没有匹配的平台</div>';
  $('platformResults').querySelectorAll('[data-platform]').forEach(option=>option.onclick=()=>{selectedPlatform=getProductPlatform(option.dataset.platform);renderPlatformTrigger();$('platformPicker').classList.remove('open');});
}
function renderPlatformTrigger(){
  const trigger=$('platformTrigger');
  if(!selectedPlatform){trigger.className='pd-platform-trigger placeholder';trigger.innerHTML='搜索并选择 DSP 平台';return;}
  trigger.className='pd-platform-trigger';trigger.innerHTML=`<div class="pd-platform-icon">${selectedPlatform.icon}</div><div><strong>${selectedPlatform.name}</strong><small>${selectedPlatform.code}</small></div>`;
}
function setPlatformSource(source){
  platformSource=source;document.querySelectorAll('[data-source]').forEach(btn=>btn.classList.toggle('active',btn.dataset.source===source));
  $('dspPlatformPanel').hidden=source!=='dsp';$('otherPlatformPanel').hidden=source!=='other';
}
function initPlatform(){
  renderPlatformResults();
  $('platformTrigger').onclick=e=>{e.stopPropagation();$('platformPicker').classList.toggle('open');if($('platformPicker').classList.contains('open'))setTimeout(()=>$('platformSearch').focus(),0);};
  $('platformSearch').oninput=()=>renderPlatformResults($('platformSearch').value);
  document.querySelectorAll('[data-source]').forEach(btn=>btn.onclick=()=>setPlatformSource(btn.dataset.source));
  $('otherPlatformIcon').onchange=()=>{const file=$('otherPlatformIcon').files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{otherIconData=reader.result;$('iconUpload').innerHTML=`<img src="${otherIconData}" alt=""><span>更换图标</span><input id="otherPlatformIconReplacement" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">`;const input=$('otherPlatformIconReplacement');input.onchange=()=>{const next=input.files?.[0];if(!next)return;const r=new FileReader();r.onload=()=>{otherIconData=r.result;$('iconUpload').querySelector('img').src=otherIconData};r.readAsDataURL(next);};};reader.readAsDataURL(file);};
}

function resultTypeSelect(value,index){return `<div class="pd-native-select-wrap pd-result-type"><select class="pd-native-select" data-package="${index}" data-field="resultType">${Object.entries(resultTypes).map(([key,label])=>`<option value="${key}"${key===value?' selected':''}>${label}</option>`).join('')}</select></div>`;}
function renderPackages(){
  $('packageRows').innerHTML=packages.map((item,index)=>`<tr><td><input data-package="${index}" data-field="name" value="${item.name}" placeholder="例如：基础套餐"></td><td>${resultTypeSelect(item.resultType,index)}</td><td><input data-package="${index}" data-field="result" value="${item.result}" placeholder="例如：保底 20 万播放"></td><td><div class="pd-table-money"><span>¥</span><input data-package="${index}" data-field="price" type="number" min="0" value="${item.price}"></div></td><td><button class="pd-row-remove" type="button" data-remove="${index}" ${packages.length===1?'disabled':''}>删除</button></td></tr>`).join('');
  $('packageRows').querySelectorAll('[data-package]').forEach(input=>input.oninput=()=>{packages[Number(input.dataset.package)][input.dataset.field]=input.value;});
  $('packageRows').querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{if(packages.length===1)return;packages.splice(Number(btn.dataset.remove),1);renderPackages();});
}
function setSaleMode(mode){
  $('saleMode').value=mode;document.querySelectorAll('[data-sale-mode]').forEach(card=>card.classList.toggle('active',card.dataset.saleMode===mode));
  ['fixed','quantity','budget','quote'].forEach(key=>$(key+'Config').hidden=key!==mode);updateQuantityPreview();
}
function updateQuantityPreview(){if($('saleMode').value!=='quantity')return;const count=Number($('quantityPerUnit').value||0),min=Number($('quantityMin').value||1),price=Number($('quantityPrice').value||0);$('quantityPreview').innerHTML=`<span>最低购买</span><strong>${(count*min).toLocaleString('zh-CN')} ${$('quantityUnit').value}</strong><span>最低价格</span><strong>¥${(price*min).toLocaleString('zh-CN')}</strong>`;}
function bindSwitch(id,textId,onText,offText){let on=true;const sw=$(id),text=$(textId);sw.onclick=()=>{on=!on;sw.classList.toggle('off',!on);text.textContent=on?onText:offText;};return()=>on;}

function saveCurrentLanguage(){langData[currentLang].summary=$('summary').value;langData[currentLang].desc=$('description').value;if(currentLang!=='zh')langData[currentLang].name=$('translatedName').value;else langData.zh.name=$('name').value;}
function loadLanguage(lang){currentLang=lang;document.querySelectorAll('.pd-language-tab').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));$('translatedNameRow').hidden=lang==='zh';$('translatedName').value=langData[lang].name||'';$('summary').value=langData[lang].summary||'';$('description').value=langData[lang].desc||'';}

function loadEditDemo(){
  $('formTitle').textContent='编辑产品';$('crumbText').textContent='编辑产品';document.querySelector('.admin-breadcrumb strong').textContent='产品列表 / 编辑';
  $('name').value='网易云音乐播放推广';selectCategory('traffic');selectedGoals=['plays'];renderGoals();selectedPlatform=getProductPlatform('netease');renderPlatformTrigger();
  $('internalNote').value='供应侧按套餐执行，可多次追加。';$('sort').value='10';
  packages=[
    {name:'600 播放',resultType:'guaranteed',result:'保底 600 次播放',price:'39'},
    {name:'1,320 播放',resultType:'guaranteed',result:'保底 1,320 次播放',price:'69'},
    {name:'1,980 播放',resultType:'guaranteed',result:'保底 1,980 次播放',price:'99'},
    {name:'3,000 播放',resultType:'guaranteed',result:'保底 3,000 次播放',price:'159'},
    {name:'4,000 播放',resultType:'guaranteed',result:'保底 4,000 次播放',price:'209'},
    {name:'6,000 播放',resultType:'guaranteed',result:'保底 6,000 次播放',price:'309'},
    {name:'10,000 播放',resultType:'guaranteed',result:'保底 10,000 次播放',price:'519'},
    {name:'16,000 播放',resultType:'guaranteed',result:'保底 16,000 次播放',price:'819'},
    {name:'24,000 播放',resultType:'guaranteed',result:'保底 24,000 次播放',price:'1219'},
    {name:'32,000 播放',resultType:'guaranteed',result:'保底 32,000 次播放',price:'1619'},
    {name:'40,000 播放',resultType:'guaranteed',result:'保底 40,000 次播放',price:'2019'},
    {name:'49,980 播放',resultType:'guaranteed',result:'保底 49,980 次播放',price:'2509'}
  ];renderPackages();setSaleMode('fixed');
  langData.zh={name:'网易云音乐播放推广',summary:'选择固定套餐提升歌曲在网易云音乐内的播放量',desc:'选择推广套餐后，按对应档位执行网易云音乐播放推广。'};
  langData.en={name:'NetEase Cloud Music Promotion',summary:'Choose a package to increase song plays',desc:'Select a promotion package for the released track.'};
  langData.ja={name:'NetEase Cloud Music プロモーション',summary:'パッケージを選択して再生数を増やします',desc:'配信済み楽曲のプロモーションパッケージを選択します。'};
  langData['zh-Hant']={name:'網易雲音樂播放推廣',summary:'選擇套餐提升歌曲播放量',desc:'選擇推廣套餐後，按對應檔位執行播放推廣。'};
  loadLanguage('zh');$('cancelBtn').href='product-detail.html?id='+encodeURIComponent(productId||'netease-play');
}

initCategorySelect();renderGoals();initPlatform();renderPackages();
document.querySelectorAll('[data-sale-mode]').forEach(card=>card.onclick=()=>setSaleMode(card.dataset.saleMode));
$('addPackageBtn').onclick=()=>{packages.push({name:'',resultType:'guaranteed',result:'',price:''});renderPackages();};
['quantityPerUnit','quantityUnit','quantityPrice','quantityMin'].forEach(id=>$(id).addEventListener('input',updateQuantityPreview));
$('quoteDisplay').onchange=()=>{$('quoteMinPriceField').hidden=['quote'].includes($('quoteDisplay').value);$('quoteMaxPriceField').hidden=$('quoteDisplay').value!=='range';};
$('deliveryType').onchange=()=>{$('deliveryPeriod').style.display=$('deliveryType').value==='period'?'flex':'none';};
bindSwitch('repeatSwitch','repeatText','是','否');bindSwitch('directSwitch','directText','是','否');bindSwitch('planSwitch','planText','是','否');bindSwitch('statusSwitch','statusText','上架','下架');
document.querySelectorAll('.pd-language-tab').forEach(tab=>tab.onclick=()=>{saveCurrentLanguage();loadLanguage(tab.dataset.lang);});
document.addEventListener('click',e=>{if(!e.target.closest('#categorySelect'))$('categorySelect').classList.remove('open');if(!e.target.closest('#platformPicker'))$('platformPicker').classList.remove('open');});

$('saveBtn').onclick=()=>{
  saveCurrentLanguage();const name=$('name').value.trim();const category=PRODUCT_CATEGORIES.find(x=>x.id===selectedCategory);const platformName=platformSource==='dsp'?selectedPlatform?.name:$('otherPlatformName').value.trim();
  if(!name||!selectedCategory||!platformName){alert('请填写产品名称、所属类目和平台');return;}
  if(!selectedGoals.length||!selectedGoals.includes(category.goalId)){alert('适用推广目标需包含所属类目的推广目标');return;}
  if($('saleMode').value==='fixed'&&packages.some(item=>!item.name||!item.result||!item.price)){alert('请完整填写套餐名称、服务结果和售价');return;}
  alert(editing?'演示：产品已保存':'演示：产品已创建');location.href=editing?'product-detail.html?id='+encodeURIComponent(productId||'netease-play'):'products.html';
};

setSaleMode('fixed');updateQuantityPreview();if(editing)loadEditDemo();else loadLanguage('zh');
</script>
