<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品类目详情｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/product-categories.css">
</head>
<body data-admin-page="categories" data-page-title="产品类目 / 详情">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pc-breadcrumb"><a href="product-categories.html">产品类目</a><span>/</span><b id="breadcrumbName">类目详情</b></div>

  <section class="pc-detail-head">
    <div>
      <div class="pc-detail-title"><h1 id="categoryName">—</h1><span class="pc-status" id="categoryStatus">启用</span></div>
      <div class="pc-detail-sub">类目标识：<span id="categoryCode">—</span></div>
      <div class="pc-metric-strip">
        <div class="pc-metric"><strong id="productCount">0</strong><span>产品数量</span></div>
        <div class="pc-metric"><strong id="planCount">0</strong><span>方案数量</span></div>
      </div>
    </div>
    <div style="display:flex;gap:10px"><a class="pc-btn pc-btn-secondary" href="product-categories.html">返回列表</a><a class="pc-btn pc-btn-primary" id="editLink" href="product-category-form.html?mode=edit">编辑类目</a></div>
  </section>

  <section class="pc-section">
    <div class="pc-section-head"><h2>基本信息</h2></div>
    <div class="pc-section-body">
      <div class="pc-info-grid">
        <div class="pc-info-item"><label>类目标识</label><div id="infoCode">—</div></div>
        <div class="pc-info-item"><label>排序</label><div id="infoSort">—</div></div>
        <div class="pc-info-item"><label>状态</label><div><span class="pc-status" id="infoStatus">启用</span></div></div>
        <div class="pc-info-item"><label>最后更新</label><div id="infoUpdated">—</div></div>
      </div>
    </div>
  </section>

  <section class="pc-section">
    <div class="pc-section-head"><h2>多语言内容</h2></div>
    <div class="pc-section-body">
      <div id="languageContent"></div>
    </div>
  </section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script>
const params=new URLSearchParams(location.search);
const category=getProductCategory(params.get('id')||'traffic');
const enabled=category.status==='on';
const statusClass=enabled?'pc-status':'pc-status off';
const statusText=enabled?'启用':'停用';

document.getElementById('breadcrumbName').textContent=category.names.zhCN;
document.getElementById('categoryName').textContent=category.names.zhCN;
document.getElementById('categoryCode').textContent=category.id;
document.getElementById('productCount').textContent=category.products;
document.getElementById('planCount').textContent=category.plans;
document.getElementById('categoryStatus').className=statusClass;
document.getElementById('categoryStatus').textContent=statusText;
document.getElementById('infoCode').textContent=category.id;
document.getElementById('infoSort').textContent=category.sort;
document.getElementById('infoUpdated').textContent=category.updated;
document.getElementById('infoStatus').className=statusClass;
document.getElementById('infoStatus').textContent=statusText;
document.getElementById('editLink').href='product-category-form.html?mode=edit&id='+encodeURIComponent(category.id);
document.getElementById('languageContent').innerHTML=PRODUCT_CATEGORY_LANGUAGES.map((language,index)=>`
  <div style="${index?'border-top:1px solid #edf0f4;padding-top:18px;margin-top:18px':''}">
    <div style="font-size:12px;font-weight:600;color:#6f7d90;margin-bottom:12px">${language.label}</div>
    <div class="pc-info-grid">
      <div class="pc-info-item"><label>类目名称</label><div>${category.names[language.key]||'—'}</div></div>
      <div class="pc-info-item" style="grid-column:span 2"><label>描述</label><div>${category.descriptions?.[language.key]||'—'}</div></div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
