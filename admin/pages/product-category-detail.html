  <section class="pc-section">
    <div class="pc-section-head"><h2>基本信息</h2></div>
    <div class="pc-section-body">
      <div class="pc-info-grid">

            <td><span class="pc-spu-platform"><span class="pc-platform-mark">云</span>网易云音乐</span></td>
            <td>流量包型 · 固定价格 / 固定目标播放</td><td><span class="pc-count">12</span></td><td><span class="pc-status">已上架</span></td><td>2026-08-18 10:30</td>

      </table>

    <div class="pc-section-body"><div class="pc-empty-note">类目只负责组织推广产品。具体平台、服务模型、SKU 规格、成本、售价和履约配置均在 SPU / SKU 层维护；Package 再跨 SPU 组合 SKU。</div></div>
  </section>
