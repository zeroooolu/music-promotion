<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推广套餐｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/packages.css">
<style>
.pk-filter-select{position:relative}.pk-filter-trigger{height:34px;min-width:132px;padding:0 34px 0 11px;border:1px solid #d3d8df;border-radius:4px;background:#fff;text-align:left;color:#4b5c71;position:relative}.pk-filter-trigger:after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid #8e99a7;border-bottom:1.5px solid #8e99a7;transform:translateY(-65%) rotate(45deg);transform-origin:center;transition:transform .15s ease}.pk-filter-select.open .pk-filter-trigger:after{transform:translateY(-35%) rotate(225deg)}.pk-filter-menu{display:none;position:absolute;z-index:60;left:0;top:40px;min-width:180px;background:#fff;border:1px solid #d9dde4;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14)}.pk-filter-select.open .pk-filter-menu{display:block}.pk-filter-option{padding:10px 12px;font-size:13px;cursor:pointer;white-space:nowrap}.pk-filter-option:hover{background:#f5f7ff;color:#2448ff}.pk-name-link{color:inherit;text-decoration:none}.pk-name-link:hover{color:var(--brand)}.pk-goal-chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;margin:2px 4px 2px 0;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pk-code{display:block;margin-top:4px;color:#a1a9b2;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pk-target{color:#52637a;font-size:13px;line-height:1.5}.pk-table-wrap{overflow:auto}.pk-table{min-width:1180px}.pk-toolbar{padding:0;background:transparent;border:0;border-radius:0}.pk-filters{flex-wrap:wrap}.pk-status-text{font-size:12px;color:#4c5c70}
</style>
</head>
<body data-admin-page="packages" data-page-title="推广套餐">
<div id="admin-shell"></div>
<template id="page-content">
<div class="page-header"><div><h1>推广套餐</h1></div><a class="pk-btn pk-btn-primary" href="package-form.html">＋ 新增套餐</a></div>
<div class="pk-toolbar"><div class="pk-filters"><input class="pk-input" id="searchInput" placeholder="搜索套餐名称 / 套餐编号 / 适合场景"><div class="pk-filter-select" data-filter="goal"><button class="pk-filter-trigger" type="button">全部推广目标</button><div class="pk-filter-menu"></div></div><div class="pk-filter-select" data-filter="status"><button class="pk-filter-trigger" type="button">全部状态</button><div class="pk-filter-menu"></div></div></div></div>
<section class="pk-card"><div class="pk-table-wrap"><table class="pk-table"><thead><tr><th>套餐名称</th><th>推广目标</th><th>适合场景</th><th>套餐价格</th><th>套餐内容</th><th>前台亮点</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pk-pagination"><span id="resultCount"></span><span>1 / 1</span></div></section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const goalNames={plays:'增加歌曲播放',playlist:'进入更多歌单',social:'短视频 / 内容传播',global:'推广到海外',chart:'提升热度 / 冲榜',ktv:'上架到 KTV'};
const packages=[
{id:'popular-1',name:'人气飙升包（一）',goals:['plays','chart'],target:'短期提升播放量和歌曲热度',price:799,items:3,choose:2,highlights:['10,000+ 播放','1 张官方歌单','内容传播'],status:'上架',updated:'今天 12:28'},
{id:'popular-2',name:'人气飙升包（二）',goals:['plays','chart'],target:'更高强度冲量与互动提升',price:2199,items:3,choose:2,highlights:['24,000+ 播放','1 张官方歌单','内容 / 收藏'],status:'上架',updated:'今天 12:26'},
{id:'allround-1',name:'全能打歌包（一）',goals:['plays','playlist','social','chart'],target:'完整打歌与资源扶持',price:2899,items:4,choose:1,highlights:['24,000+ 播放','5 个资源位','15 个账号'],status:'上架',updated:'今天 12:24'},
{id:'allround-2',name:'全能打歌包（二）',goals:['plays','playlist','social','chart'],target:'重点打歌、资源扶持和破圈传播',price:6600,items:5,choose:3,highlights:['40,000+ 播放','5 个资源位','内容 + 收藏'],status:'上架',updated:'今天 12:22'},
{id:'chart-addon',name:'冲榜选配包',goals:['playlist','chart'],target:'歌单矩阵与平台榜单冲刺',price:8600,items:3,choose:1,highlights:['网易 18万/月','QQ 28万/月','酷狗冲榜'],status:'上架',updated:'今天 12:20'}
];
const filters={goal:'',status:''};
const options={goal:[['','全部推广目标'],['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']],status:[['','全部状态'],['上架','上架'],['下架','下架']]};
const search=document.getElementById('searchInput');
function render(){const q=search.value.trim().toLowerCase();const list=packages.filter(x=>(!q||[x.name,x.id,x.target].join(' ').toLowerCase().includes(q))&&(!filters.goal||x.goals.includes(filters.goal))&&(!filters.status||x.status===filters.status));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><div class="pk-name"><a class="pk-name-link" href="package-detail.html?id=${x.id}">${x.name}</a></div><span class="pk-code">${x.id}</span></td><td>${x.goals.map(g=>`<span class="pk-goal-chip">${goalNames[g]}</span>`).join('')}</td><td><div class="pk-target">${x.target}</div></td><td class="pk-price">¥${x.price.toLocaleString('zh-CN')}</td><td>${x.items} 项${x.choose?` · ${x.choose} 项需用户选择`:''}</td><td>${x.highlights.map(h=>`<span class="pk-tag blue">${h}</span>`).join('')}</td><td><div class="pk-status"><button class="pk-switch${x.status==='下架'?' off':''}" data-toggle="${x.id}" type="button"></button><span class="pk-status-text">${x.status}</span></div></td><td class="pk-muted">${x.updated}</td><td><a class="pk-link" href="package-form.html?mode=edit&id=${x.id}">编辑</a><a class="pk-link" href="package-form.html?mode=copy&id=${x.id}">复制</a></td></tr>`).join('');document.getElementById('resultCount').textContent=`共 ${list.length} 个套餐`;document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const x=packages.find(i=>i.id===btn.dataset.toggle);x.status=x.status==='上架'?'下架':'上架';render()})}
function initFilters(){document.querySelectorAll('[data-filter]').forEach(root=>{const key=root.dataset.filter,trigger=root.querySelector('.pk-filter-trigger'),menu=root.querySelector('.pk-filter-menu');menu.innerHTML=options[key].map(([value,label])=>`<div class="pk-filter-option" data-value="${value}">${label}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();document.querySelectorAll('.pk-filter-select').forEach(x=>x!==root&&x.classList.remove('open'));root.classList.toggle('open')};menu.querySelectorAll('[data-value]').forEach(item=>item.onclick=e=>{e.stopPropagation();filters[key]=item.dataset.value;trigger.textContent=item.textContent;root.classList.remove('open');render()})})}
search.oninput=render;document.addEventListener('click',()=>document.querySelectorAll('.pk-filter-select').forEach(x=>x.classList.remove('open')));initFilters();render();
</script>
</body></html>
