<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推广套餐｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css">
<style>
.pk-name-link{color:inherit;text-decoration:none}.pk-name-link:hover{color:var(--brand)}.pk-code{display:block;margin-top:4px;color:#a1a9b2;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pk-name-line{display:flex;align-items:center;gap:7px}.pk-recommend{height:19px;display:inline-flex;align-items:center;padding:0 6px;border-radius:3px;background:#2448ff;color:#fff;font-size:9px}.pk-fit{color:#52637a;font-size:12px;white-space:nowrap}.pk-content{display:flex;flex-direction:column;gap:5px;min-width:300px}.pk-content-item{display:flex;align-items:center;gap:5px;color:#536174;font-size:11px;line-height:1.45}.pk-content-item:before{content:'✓';width:15px;height:15px;display:grid;place-items:center;border-radius:50%;background:#eef2ff;color:#2448ff;font-size:8px;font-weight:700;flex:none}.pk-relation{height:18px;display:inline-flex;align-items:center;padding:0 6px;border-radius:9px;background:#eef2ff;color:#2448ff;font-size:9px;white-space:nowrap}.pk-rule-summary{color:#647186;font-size:11px;line-height:1.55}.pk-sort{width:56px;height:30px;border:1px solid #d4dae1;border-radius:4px;text-align:center}.pk-status-text{font-size:12px;color:#4c5c70}.pk-table{min-width:1320px}.pk-table td{vertical-align:top}.pk-toolbar{padding:0;background:transparent;border:0}.pk-price{white-space:nowrap}.pk-muted{white-space:nowrap}
</style>
</head>
<body data-admin-page="packages" data-page-title="推广套餐"><div id="admin-shell"></div>
<template id="page-content">
<div class="page-header"><div><h1>推广套餐</h1></div><a class="pk-btn pk-btn-primary" href="package-form.html">＋ 新增套餐</a></div>
<div class="pk-toolbar"><div class="pk-filters"><input class="pk-input" id="searchInput" placeholder="搜索套餐名称 / 包含内容 / 适合场景"><select class="pk-input" id="statusFilter"><option value="">全部状态</option><option>上架</option><option>下架</option></select></div></div>
<section class="pk-card"><div class="pk-table-wrap"><table class="pk-table"><thead><tr><th>套餐</th><th>适合</th><th>套餐价</th><th>包含内容</th><th>选择关系</th><th>排序</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pk-pagination"><span id="resultCount"></span><span>1 / 1</span></div></section>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/package-catalog-data.js"></script>
<script>
const packages=ADMIN_PACKAGE_CATALOG,search=document.getElementById('searchInput'),statusFilter=document.getElementById('statusFilter');
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');
function render(){const q=search.value.trim().toLowerCase(),status=statusFilter.value;const list=packages.slice().sort((a,b)=>a.sort-b.sort).filter(x=>(!status||x.status===status)&&(!q||[x.name,x.fit,...x.items.map(i=>i.title)].join(' ').toLowerCase().includes(q)));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><div class="pk-name-line"><a class="pk-name-link" href="package-detail.html?id=${x.id}"><strong>${esc(x.name)}</strong></a>${x.badge?`<span class="pk-recommend">${esc(x.badge)}</span>`:''}</div><span class="pk-code">${x.id}</span></td><td><div class="pk-fit">${esc(x.fit)}</div></td><td class="pk-price"><strong>${money(x.price)}</strong></td><td><div class="pk-content">${x.items.map(i=>`<div class="pk-content-item"><span>${esc(i.title)}</span>${i.tag?`<span class="pk-relation">${esc(i.tag)}</span>`:''}</div>`).join('')}</div></td><td><div class="pk-rule-summary">${x.items.filter(i=>i.mode==='choose').length?x.items.filter(i=>i.mode==='choose').map(i=>`${i.tag||'用户选择'}：${i.options.length} 个执行选项`).join('<br>'):'全部直接包含'}${x.note?`<br>${esc(x.note)}`:''}</div></td><td><input class="pk-sort" type="number" value="${x.sort}" data-sort="${x.id}"></td><td><div class="pk-status"><button class="pk-switch${x.status==='下架'?' off':''}" data-toggle="${x.id}" type="button"></button><span class="pk-status-text">${x.status}</span></div></td><td class="pk-muted">${x.updated}</td><td><a class="pk-link" href="package-form.html?mode=edit&id=${x.id}">编辑</a><a class="pk-link" href="package-form.html?mode=copy&id=${x.id}">复制</a></td></tr>`).join('');document.getElementById('resultCount').textContent=`共 ${list.length} 个套餐`;document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const x=packages.find(p=>p.id===btn.dataset.toggle);x.status=x.status==='上架'?'下架':'上架';render()});document.querySelectorAll('[data-sort]').forEach(input=>input.onchange=()=>{const x=packages.find(p=>p.id===input.dataset.sort);x.sort=Number(input.value||0);render()})}
search.oninput=render;statusFilter.onchange=render;render();
</script></body></html>
