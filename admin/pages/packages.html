<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推广套餐｜星球发行 · 音乐推广 Admin</title><link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/packages.css"></head>
<body data-admin-page="packages" data-page-title="推广套餐"><div id="admin-shell"></div><template id="page-content">
<div class="page-header"><div><h1>推广套餐</h1><p>将已有推广产品组合成面向用户售卖的官方套餐。</p></div><a class="pk-btn pk-btn-primary" href="package-form.html">＋ 新增套餐</a></div>
<div class="pk-toolbar"><div class="pk-filters"><input class="pk-input" id="searchInput" placeholder="搜索套餐名称 / 适合目标"><select class="pk-select" id="statusFilter"><option value="">全部状态</option><option>上架</option><option>下架</option></select></div><span class="pk-muted" id="toolbarCount"></span></div>
<section class="pk-card"><table class="pk-table"><thead><tr><th>套餐名称</th><th>适合目标</th><th>套餐价格</th><th>套餐内容</th><th>前台亮点</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="pk-pagination"><span id="resultCount"></span><span>1 / 1</span></div></section>
</template><script src="../assets/js/admin-shell.js"></script><script>
const packages=[
{id:'popular-1',name:'人气飙升包（一）',target:'短期提升播放量和歌曲热度',intro:'作品质量过关、想短期冲播放量榜单的音乐人。',price:799,items:3,choose:2,highlights:['10,000+ 播放','1 张官方歌单','内容传播'],status:'上架',updated:'今天 11:56'},
{id:'popular-2',name:'人气飙升包（二）',target:'更高强度冲量与互动提升',intro:'更高播放量配合歌单和互动资源，适合加强冲量。',price:2199,items:3,choose:2,highlights:['24,000+ 播放','1 张官方歌单','内容 / 收藏'],status:'上架',updated:'今天 11:52'},
{id:'allround-1',name:'全能打歌包（一）',target:'完整打歌与资源扶持',intro:'歌单、资源位置扶持和真实内容传播的完整打歌组合。',price:2899,items:4,choose:1,highlights:['24,000+ 播放','5 个资源位','15 个账号'],status:'上架',updated:'昨天 18:20'},
{id:'allround-2',name:'全能打歌包（二）',target:'重点打歌、资源扶持和破圈传播',intro:'更高强度的播放与内容传播组合，适合重点作品破圈。',price:6600,items:5,choose:3,highlights:['40,000+ 播放','5 个资源位','内容 + 收藏'],status:'上架',updated:'昨天 17:42'},
{id:'chart-addon',name:'冲榜选配包',target:'歌单矩阵与平台榜单冲刺',intro:'集中冲击歌单矩阵与平台榜单。',price:8600,items:3,choose:1,highlights:['网易 18万/月','QQ 28万/月','酷狗冲榜'],status:'上架',updated:'08-20 15:06'}
];
const search=document.getElementById('searchInput'),status=document.getElementById('statusFilter');
function render(){const q=search.value.trim().toLowerCase();const list=packages.filter(x=>(!q||(x.name+x.target+x.intro).toLowerCase().includes(q))&&(!status.value||x.status===status.value));document.getElementById('rows').innerHTML=list.map(x=>`<tr><td><div class="pk-name">${x.name}</div><span class="pk-desc">${x.intro}</span></td><td>${x.target}</td><td class="pk-price">¥${x.price.toLocaleString('zh-CN')}</td><td>${x.items} 项${x.choose?` · ${x.choose} 项需要用户选择`:''}</td><td>${x.highlights.map(h=>`<span class="pk-tag blue">${h}</span>`).join('')}</td><td><div class="pk-status"><button class="pk-switch${x.status==='下架'?' off':''}" data-toggle="${x.id}"></button><span>${x.status}</span></div></td><td class="pk-muted">${x.updated}</td><td><a class="pk-link" href="package-detail.html?id=${x.id}">查看</a><a class="pk-link" href="package-form.html?mode=edit&id=${x.id}">编辑</a><a class="pk-link" href="package-form.html?mode=copy&id=${x.id}">复制</a></td></tr>`).join('');document.getElementById('resultCount').textContent=`共 ${list.length} 个套餐`;document.getElementById('toolbarCount').textContent=`当前上架 ${packages.filter(x=>x.status==='上架').length} 个`;document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const x=packages.find(i=>i.id===btn.dataset.toggle);x.status=x.status==='上架'?'下架':'上架';render()})}
search.addEventListener('input',render);status.addEventListener('change',render);render();
</script></body></html>
