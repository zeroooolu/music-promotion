<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新增 / 编辑产品类目｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/product-categories.css">
</head>
<body data-admin-page="categories" data-page-title="产品类目 / 新增">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="pc-breadcrumb"><a href="product-categories.html">产品类目</a><span>/</span><b id="crumbText">新增类目</b></div>
  <div class="page-header">
    <div><h1 id="formTitle">新增产品类目</h1></div>
  </div>

  <div class="pc-form-layout" style="grid-template-columns:1fr">
    <section class="pc-form-card">
      <div class="pc-form-card-head"><h2>多语言内容</h2></div>
      <div class="pc-form-body">
        <div class="pc-form-row"><div class="pc-form-label pc-required">简体中文名称</div><div class="pc-form-control"><input id="nameZhCN" placeholder="例如：播放推广"></div></div>
        <div class="pc-form-row"><div class="pc-form-label">简体中文描述</div><div class="pc-form-control"><textarea id="descriptionZhCN" placeholder="请输入类目描述"></textarea></div></div>
        <div class="pc-form-row"><div class="pc-form-label">English Name</div><div class="pc-form-control"><input id="nameEn" placeholder="例如：Streaming Promotion"></div></div>
        <div class="pc-form-row"><div class="pc-form-label">English Description</div><div class="pc-form-control"><textarea id="descriptionEn" placeholder="Enter category description"></textarea></div></div>
        <div class="pc-form-row"><div class="pc-form-label">日本語名称</div><div class="pc-form-control"><input id="nameJa" placeholder="例：再生数プロモーション"></div></div>
        <div class="pc-form-row"><div class="pc-form-label">日本語説明</div><div class="pc-form-control"><textarea id="descriptionJa" placeholder="カテゴリの説明を入力"></textarea></div></div>
        <div class="pc-form-row"><div class="pc-form-label">繁體中文名稱</div><div class="pc-form-control"><input id="nameZhTW" placeholder="例如：播放推廣"></div></div>
        <div class="pc-form-row"><div class="pc-form-label">繁體中文描述</div><div class="pc-form-control"><textarea id="descriptionZhTW" placeholder="請輸入類目描述"></textarea></div></div>
      </div>
    </section>

    <section class="pc-form-card" style="margin-top:16px">
      <div class="pc-form-card-head"><h2>基础设置</h2></div>
      <div class="pc-form-body">
        <div class="pc-form-row"><div class="pc-form-label pc-required">推广目标</div><div class="pc-form-control"><select id="goal"><option value="">请选择推广目标</option></select><div class="pc-help">一个类目仅归属一个推广目标。</div></div></div>
        <div class="pc-form-row"><div class="pc-form-label pc-required">类目标识</div><div class="pc-form-control"><input id="code" placeholder="例如：traffic"><div class="pc-help">英文小写，可使用连字符。</div></div></div>
        <div class="pc-form-row"><div class="pc-form-label pc-required">排序</div><div class="pc-form-control"><input id="sort" type="number" min="0" value="10"><div class="pc-help">数字越小越靠前。</div></div></div>
        <div class="pc-form-row"><div class="pc-form-label">状态</div><div class="pc-form-control"><div class="pc-switch-row"><button type="button" class="pc-switch" id="statusSwitch" aria-label="启用类目"></button><span id="statusText" style="font-size:13px;color:#4b5e75">启用</span></div></div></div>
      </div>
    </section>
  </div>

  <div class="pc-form-actions"><a class="pc-btn pc-btn-secondary" id="cancelBtn" href="product-categories.html">取消</a><button class="pc-btn pc-btn-primary" id="saveBtn" type="button">保存类目</button></div>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script src="../assets/js/product-category-data.js"></script>
<script>
const params=new URLSearchParams(location.search);
const editing=params.get('mode')==='edit';
const category=editing?getProductCategory(params.get('id')||'traffic'):null;
const nameFields={
  zhCN:document.getElementById('nameZhCN'),
  en:document.getElementById('nameEn'),
  ja:document.getElementById('nameJa'),
  zhTW:document.getElementById('nameZhTW')
};
const descriptionFields={
  zhCN:document.getElementById('descriptionZhCN'),
  en:document.getElementById('descriptionEn'),
  ja:document.getElementById('descriptionJa'),
  zhTW:document.getElementById('descriptionZhTW')
};
const goal=document.getElementById('goal');
const code=document.getElementById('code');
const sort=document.getElementById('sort');
const statusSwitch=document.getElementById('statusSwitch');
const statusText=document.getElementById('statusText');
let enabled=true;

goal.insertAdjacentHTML('beforeend',PROMOTION_GOALS.map(item=>`<option value="${item.id}">${item.name}</option>`).join(''));

if(editing){
  document.querySelector('.admin-page-title').textContent='产品类目 / 编辑';
  document.getElementById('formTitle').textContent='编辑产品类目';
  document.getElementById('crumbText').textContent='编辑类目';
  PRODUCT_CATEGORY_LANGUAGES.forEach(language=>{
    nameFields[language.key].value=category.names[language.key]||'';
    descriptionFields[language.key].value=category.descriptions?.[language.key]||'';
  });
  goal.value=category.goalId||'';
  code.value=category.id;
  code.readOnly=true;
  code.style.background='#f7f8fa';
  sort.value=category.sort;
  enabled=category.status==='on';
  statusSwitch.classList.toggle('is-off',!enabled);
  statusText.textContent=enabled?'启用':'停用';
  document.getElementById('cancelBtn').href='product-category-detail.html?id='+encodeURIComponent(category.id);
}

statusSwitch.addEventListener('click',()=>{
  enabled=!enabled;
  statusSwitch.classList.toggle('is-off',!enabled);
  statusText.textContent=enabled?'启用':'停用';
});

document.getElementById('saveBtn').addEventListener('click',()=>{
  const zhCN=nameFields.zhCN.value.trim();
  const categoryCode=code.value.trim();
  const goalId=goal.value;
  if(!zhCN||!categoryCode||!goalId){
    alert('请填写简体中文名称、推广目标和类目标识');
    return;
  }
  alert(editing?'演示：类目已保存':'演示：类目已创建');
  location.href=editing?'product-category-detail.html?id='+encodeURIComponent(categoryCode):'product-categories.html';
});
</script>
</body>
</html>
