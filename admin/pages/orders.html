<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单管理｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<style>
.om-tabs{display:flex;gap:2px;border-bottom:1px solid #d9dde2;margin-bottom:14px}.om-tab{position:relative;height:42px;padding:0 17px;border:0;background:transparent;color:#6f7f91;font-size:13px}.om-tab.active{color:var(--brand);font-weight:600}.om-tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brand)}.om-count{display:inline-flex;min-width:19px;height:19px;align-items:center;justify-content:center;margin-left:5px;padding:0 5px;border-radius:10px;background:#eef0f3;color:#7d8998;font-size:10px}.om-tab.active .om-count{background:var(--brand-soft);color:var(--brand)}.om-toolbar{background:#fff;border:1px solid #d9dde2;border-radius:8px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;min-height:68px}.om-search{position:relative;width:330px}.om-search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:#9da7b4}.om-search input,.om-select{height:34px;border:1px solid #d3d8df;border-radius:4px;background:#fff;outline:0}.om-search input{width:100%;padding:0 12px 0 34px}.om-select{padding:0 28px 0 10px;color:#526173}.om-search input:focus,.om-select:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(36,72,255,.07)}.om-spacer{flex:1}.om-reset{height:34px;padding:0 13px;border:1px solid #cbd1d8;border-radius:4px;background:#fff;color:#536175}.om-reset:hover{border-color:var(--brand);color:var(--brand)}.om-card{background:#fff;border:1px solid #d9dde2;border-radius:8px;overflow:hidden}.om-table{width:100%;border-collapse:collapse;table-layout:fixed}.om-table th{height:43px;padding:0 14px;background:#eef0f2;border-bottom:1px solid #e1e4e8;text-align:left;color:#3e444b;font-size:13px;font-weight:600}.om-table td{padding:13px 14px;border-bottom:1px solid #eceff2;vertical-align:middle;color:#3d434a;font-size:13px}.om-table tbody tr:hover{background:#f8f9fb}.om-no{color:#5b6d83;font-size:12px;font-weight:600}.om-time,.om-sub{margin-top:5px;color:#929dac;font-size:11px}.om-customer{font-weight:500}.om-song{display:flex;align-items:center;gap:10px;min-width:0}.om-cover{width:42px;height:42px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:650;flex:none}.om-song-copy{min-width:0}.om-song-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.om-chips{display:flex;gap:6px;flex-wrap:wrap}.om-chip{height:25px;display:inline-flex;align-items:center;padding:0 8px;border-radius:3px;background:#f2f4f7;color:#59697d;font-size:11px}.om-more{color:#8d98a5;font-size:11px}.om-amount{font-weight:650}.om-badge{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:3px;font-size:11px;font-weight:500;white-space:nowrap}.om-pending{background:#fff0ef;color:#c84d49}.om-waiting{background:#fff7e5;color:#9a6a16}.om-running{background:#eef2ff;color:#2448ff}.om-done{background:#edf8f2;color:#1c8c5a}.om-closed{background:#f0f2f4;color:#7b8693}.om-link{color:var(--brand)}.om-link:hover{text-decoration:underline}.om-empty{display:none;padding:70px 20px;text-align:center;color:#9ba5b0}.om-footer{height:50px;border-top:1px solid #eceff2;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#8b96a4;font-size:12px}.om-pager{display:flex;gap:6px}.om-page{width:28px;height:28px;border:1px solid #d9dde2;border-radius:3px;background:#fff;color:#596a7e}.om-page.active{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body data-admin-page="orders" data-page-title="订单管理">
<div id="admin-shell"></div>
<template id="page-content">
  <div class="page-header"><div><h1>订单管理</h1><p>查看用户推广订单，并跟进各推广项目的执行进度。</p></div></div>
  <div class="om-tabs" id="tabs"></div>
  <section class="om-toolbar">
    <div class="om-search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.2 15.2 5 5" stroke="currentColor" stroke-width="2"/></svg><input id="q" placeholder="搜索订单号 / 歌曲 / 艺人 / 用户"></div>
    <select class="om-select" id="platform"><option value="all">全部平台</option><option>网易云音乐</option><option>QQ音乐</option><option>抖音</option><option>Spotify</option><option>KTV</option></select>
    <select class="om-select" id="date"><option value="all">全部时间</option><option value="today">今天</option><option value="7d">近 7 天</option><option value="30d">近 30 天</option></select>
    <span class="om-spacer"></span><button class="om-reset" id="reset">重置</button>
  </section>
  <section class="om-card">
    <table class="om-table"><colgroup><col style="width:14%"><col style="width:13%"><col style="width:20%"><col style="width:25%"><col style="width:11%"><col style="width:11%"><col style="width:6%"></colgroup><thead><tr><th>订单号 / 创建时间</th><th>用户</th><th>推广歌曲</th><th>推广项目</th><th>订单金额</th><th>订单状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table>
    <div class="om-empty" id="empty">没有找到符合条件的订单</div>
    <div class="om-footer"><span id="resultText"></span><div class="om-pager"><button class="om-page">‹</button><button class="om-page active">1</button><button class="om-page">›</button></div></div>
  </section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const orders=[
{id:'KJ202608200006',created:'2026-08-20 14:46',user:'Sunset Records',contact:'ops@sunsetrecords.com',song:'海岸之外',artist:'JUNO',album:'海岸之外',cover:'海',gradient:'linear-gradient(145deg,#4d83df,#65b7cc)',items:[['Spotify','海外广告推广','waiting'],['抖音','内容推广','waiting']],total:2499,payment:'已支付',status:'waiting',statusName:'待执行'},
{id:'KJ202608190001',created:'2026-08-19 14:32',user:'林屿工作室',contact:'138****6621',song:'晚风来信',artist:'林屿',album:'城市漫游',cover:'夜',gradient:'linear-gradient(145deg,#5468ff,#8d6af7)',items:[['网易云音乐','播放推广','running'],['QQ音乐','歌单推广','running'],['抖音','内容推广','done']],total:1199,payment:'已支付',status:'running',statusName:'推广中'},
{id:'KJ202608190KTV',created:'2026-08-19 15:38',user:'林屿工作室',contact:'138****6621',song:'晚风来信',artist:'林屿',album:'城市漫游',cover:'夜',gradient:'linear-gradient(145deg,#5468ff,#8d6af7)',items:[['KTV','制作上架','pending']],total:2000,payment:'待支付',status:'pending',statusName:'待支付'},
{id:'KJ202608180018',created:'2026-08-18 16:10',user:'沈禾',contact:'shenhe@example.com',song:'如果海知道',artist:'沈禾',album:'如果海知道',cover:'海',gradient:'linear-gradient(145deg,#27a9df,#39c6bb)',items:[['网易云音乐','播放推广','waiting'],['QQ音乐','歌单推广','waiting']],total:699,payment:'已支付',status:'waiting',statusName:'待执行'},
{id:'KJ202608160007',created:'2026-08-16 10:25',user:'周棠音乐',contact:'zhoutang@example.com',song:'慢慢走',artist:'周棠',album:'沿途',cover:'慢',gradient:'linear-gradient(145deg,#e08084,#ca93bd)',items:[['网易云音乐','播放推广','done'],['QQ音乐','歌单推广','done'],['抖音','内容推广','done']],total:1899,payment:'已支付',status:'done',statusName:'已完成'},
{id:'KJ202608150021',created:'2026-08-15 19:08',user:'Noah Chen',contact:'noah@example.com',song:'Daylight Again',artist:'Noah Chen',album:'Daylight Again',cover:'D',gradient:'linear-gradient(145deg,#f09d55,#ef6f78)',items:[['Spotify','海外广告推广','pending'],['QQ音乐','歌单推广','pending']],total:1299,payment:'待支付',status:'pending',statusName:'待支付'},
{id:'KJ202608120009',created:'2026-08-12 09:40',user:'Miro',contact:'miro@example.com',song:'凌晨三点的城市',artist:'Miro',album:'凌晨三点',cover:'城',gradient:'linear-gradient(145deg,#38445e,#776c9d)',items:[['网易云音乐','播放推广','closed'],['QQ音乐','歌单推广','closed']],total:799,payment:'未支付',status:'closed',statusName:'已关闭'}
];
const tabDefs=[['all','全部'],['pending','待支付'],['waiting','待执行'],['running','推广中'],['done','已完成'],['closed','已关闭']];let active='all';
const $=id=>document.getElementById(id),tabs=$('tabs'),q=$('q'),platform=$('platform'),date=$('date'),tbody=$('tbody'),empty=$('empty'),resultText=$('resultText'),reset=$('reset');
function countFor(k){return k==='all'?orders.length:orders.filter(o=>o.status===k).length}
function buildTabs(){tabs.innerHTML=tabDefs.map(([k,n])=>`<button class="om-tab ${k===active?'active':''}" data-k="${k}">${n}<span class="om-count">${countFor(k)}</span></button>`).join('');tabs.querySelectorAll('.om-tab').forEach(b=>b.onclick=()=>{active=b.dataset.k;buildTabs();render()})}
function itemHtml(o){return o.items.slice(0,2).map(x=>`<span class="om-chip">${x[0]} · ${x[1]}</span>`).join('')+(o.items.length>2?`<span class="om-more">+${o.items.length-2}</span>`:'')}
function render(){const term=q.value.trim().toLowerCase(),pf=platform.value;let rows=orders.filter(o=>active==='all'||o.status===active);rows=rows.filter(o=>!term||[o.id,o.user,o.contact,o.song,o.artist,o.album,...o.items.flat()].join(' ').toLowerCase().includes(term));rows=rows.filter(o=>pf==='all'||o.items.some(i=>i[0]===pf));tbody.innerHTML=rows.map(o=>`<tr><td><div class="om-no">${o.id}</div><div class="om-time">${o.created}</div></td><td><div class="om-customer">${o.user}</div><div class="om-sub">${o.contact}</div></td><td><div class="om-song"><span class="om-cover" style="background:${o.gradient}">${o.cover}</span><div class="om-song-copy"><div class="om-song-name">${o.song}</div><div class="om-sub">${o.artist} · ${o.album}</div></div></div></td><td><div class="om-chips">${itemHtml(o)}</div></td><td><div class="om-amount">¥${o.total.toLocaleString('zh-CN')}</div><div class="om-sub">${o.payment}</div></td><td><span class="om-badge om-${o.status}">${o.statusName}</span><div class="om-sub">${o.items.filter(i=>i[2]==='done').length}/${o.items.length} 项完成</div></td><td><a class="om-link" href="order-detail.html?id=${encodeURIComponent(o.id)}">详情</a></td></tr>`).join('');empty.style.display=rows.length?'none':'block';resultText.textContent=`共 ${rows.length} 笔订单`}
q.oninput=render;platform.onchange=render;date.onchange=render;reset.onclick=()=>{q.value='';platform.value='all';date.value='all';active='all';buildTabs();render()};buildTabs();render();
</script>
</body>
</html>
