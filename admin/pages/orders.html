nt-size:10px}.om-goal{background:#eef2ff;color:#2448ff}.om-source{display:inline-flex;height:22px;align-items:center;padding:0 7px;border-radius:3px;background:#f5f6f8;color:#6d7784;font-size:10px;margin-bottom:4px}.om-amount{font-weight:650}.om-badge{display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:3px;font-size:11px;font-weight:500}.om-pending{background:#fff0ef;color:#c84d49}.om-waiting{background:#fff7e5;color:#9a6a16}.om-running{background:#eef2ff;color:#2448ff}.om-done{background:#edf8f2;color:#1c8c5a}.om-closed{background:#f0f2f4;color:#7b8693}.om-link{color:var(--brand)}.om-empty{display:none;padding:70px 20px;text-align:center;color:#9ba5b0}.om-footer{height:50px;border-top:1px solid #eceff2;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#8b96a4;font-size:12px}
</style></head>
<body data-admin-page="orders" data-page-title="订单管理"><div id="admin-shell"></div><template id="page-content">
<div class="page-header"><div><h1>订单管理</h1><p>查看用户推广订单，并保留用户下单方式、推广方案和原始推广目标。</p></div></div><div class="om-tabs" id="tabs"></div>
<section class="om-toolbar"><div class="om-search"><input id="q" placeholder="搜索订单号 / 歌曲 / 艺人 / 用户 / 方案"></div><select class="om-select" id="source"><option value="all">全部下单方式</option><option>官方套餐</option><option>自定义组合</option><option>专家方案</option><option>KTV 单项</option></select><select class="om-select" id="platform"><option value="all">全部平台</option><option>网易云音乐</option><option>QQ音乐</option><option>抖音</option><option>Spotify</option><option>KTV</option></select><span class="om-spacer"></span><button class="om-reset" id="reset">重置</button></section>
<section class="om-card"><div class="om-table-wrap"><table class="om-table"><thead><tr><th>订单号 / 创建时间</th><th>用户</th><th>推广歌曲</th><th>下单方式 / 方案</th><th>推广目标</th><th>推广项目</th><th>订单金额</th><th>订单状态</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="om-empty" id="empty">没有找到符合条件的订单</div><div class="om-footer"><span id="resultText"></span><span>1 / 1</span></div></section>

const tabDefs=[['all','全部'],['pending','待支付'],['waiting','待执行'],['running','推广中'],['done','已完成'],['closed','已关闭']];let active='all';const $=id=>document.getElementById(id),tabs=$('tabs'),q=$('q'),platform=$('platform'),source=$('source'),tbody=$('tbody'),empty=$('empty'),resultText=$('resultText');function countFor(k){return k==='all'?orders.length:orders.filter(o=>o.status===k).length}function buildTabs(){tabs.innerHTML=tabDefs.map(([k,n])=>`<button class="om-tab ${k===active?'active':''}" data-k="${k}">${n}<span class="om-count">${countFor(k)}</span></button>`).join('');tabs.querySelectorAll('.om-tab').forEach(b=>b.onclick=()=>{active=b.dataset.k;buildTabs();render()})}function render(){const term=q.value.trim().toLowerCase(),pf=platform.value,src=source.value;let rows=orders.filter(o=>(active==='all'||o.status===active)&&(!term||[o.id,o.user,o.contact,o.song,o.artist,o.album,o.plan,o.source,...o.items.flat()].join(' ').toLowerCase().includes(term))&&(pf==='all'||o.items.some(i=>i[0]===pf))&&(src==='all'||o.source===src));tbody.innerHTML=rows.map(o=>`<tr><td><div class="om-no">${o.id}</div><div class="om-time">${o.created}</div></td><td><div class="om-customer">${o.user}</div><div class="om-sub">${o.contact}</div></td><td><div class="om-song"><span class="om-cover" style="background:${o.gradient}">${o.cover}</span><div><div class="om-song-name">${o.song}</div><div class="om-sub">${o.artist} · ${o.album}</div></div></div></td><td><span class="om-source">${o.source}</span><div class="om-plan">${o.plan}</div></td><td><div class="om-goals">${o.goals.map(g=>`<span class="om-goal">${goalNames[g]}</span>`).join('')}</div></td><td><div class="om-chips">${o.items.slice(0,2).map(x=>`<span class="om-chip">${x[0]} · ${x[1]}</span>`).join('')}${o.items.length>2?`<span class="om-sub">+${o.items.length-2}</span>`:''}</div></td><td><div class="om-amount">¥${o.total.toLocaleString('zh-CN')}</div><div class="om-sub">${o.payment}</div></td><td><span class="om-badge om-${o.status}">${o.statusName}</span><div class="om-sub">${o.items.filter(i=>i[2]==='done').length}/${o.items.length} 项完成</div></td><td><a class="om-link" href="order-detail.html?id=${encodeURIComponent(o.id)}">详情</a></td></tr>`).join('');empty.style.display=rows.length?'none':'block';resultText.textContent=`共 ${rows.length} 笔订单`}q.oninput=render;platform.onchange=render;source.onchange=render;document.getElementById('reset').onclick=()=>{q.value='';platform.value='all';source.value='all';active='all';buildTabs();render()};buildTabs();render();
</script></body></html>
