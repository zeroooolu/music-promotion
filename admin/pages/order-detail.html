const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id')||'KJ202608190001';let o=JSON.parse(JSON.stringify(db[id]||db['KJ202608190001'])),currentProject=0;
const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');const cls=s=>['pending','waiting','running','done','closed'].includes(s)?s:'closed';

function openResult(i){currentProject=i;const p=o.projects[i];$('resultProject').textContent=`${p.platform} · ${p.service}`;$('resultText').value=p.result?.text||'';$('resultLink').value=p.result?.link||'';$('resultModal').classList.add('show')}
