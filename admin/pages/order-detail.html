const id=new URLSearchParams(location.search).get('id')||'KJ202608190001';let o=JSON.parse(JSON.stringify(db[id]||db['KJ202608190001'])),currentProject=0,pendingImages=[];
function derive(){if(['pending','closed'].includes(o.status))return;if(o.projects.every(p=>p.status==='done')){o.status='done';o.statusName='已完成'}else if(o.projects.some(p=>p.status==='running'||p.status==='done')){o.status='running';o.statusName='推广中'}else{o.status='waiting';o.statusName='待执行'}}
function toastMsg(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1400)}
function resultHtml(r){return `<div class="od-result-row"><div class="od-result-time">${r.time}</div><div class="od-result-dot"></div><div class="od-result-body">${r.text?`<div>${r.text}</div>`:''}${r.link?`<a class="od-result-link" href="${r.link}" target="_blank" rel="noopener">查看链接</a>`:''}${r.images?.length?`<div class="od-result-images">${r.images.map(img=>`<img class="od-result-thumb" src="${img.src}" alt="${img.name||'执行结果图片'}" data-preview="${encodeURIComponent(img.src)}">`).join('')}</div>`:''}</div></div>`}
function bindPreview(){document.querySelectorAll('[data-preview]').forEach(img=>img.onclick=()=>{ $('imagePreview').src=decodeURIComponent(img.dataset.preview);$('imageModal').classList.add('show')})}
function render(){derive();$('orderStatus').textContent=o.statusName;$('orderStatus').className='od-badge od-'+cls(o.status);$('orderMeta').textContent=`订单号 ${id} · ${o.created} 创建`;$('cover').textContent=o.cover;$('cover').style.background=o.gradient;$('songName').textContent=o.song;$('songMeta').textContent=`${o.artist} · ${o.album}`;$('songSource').textContent=o.source;$('customer').textContent=o.user;$('contact').textContent=o.contact;$('projectCount').textContent=`${o.projects.length} 个推广项目 · ${o.projects.filter(p=>p.status==='done').length} 个已完成`;
