<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品列表｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
<style>
.pd-filter-select{position:relative}.pd-filter-trigger{height:34px;min-width:132px;padding:0 34px 0 11px;border:1px solid #d3d8df;border-radius:4px;background:#fff;text-align:left;color:#4b5c71;position:relative}.pd-filter-trigger:after{content:'⌄';position:absolute;right:11px;top:7px;color:#8e99a7}.pd-filter-menu{display:none;position:absolute;z-index:60;left:0;top:40px;min-width:180px;background:#fff;border:1px solid #d9dde4;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14)}.pd-filter-select.open .pd-filter-menu{display:block}.pd-filter-option{padding:10px 12px;font-size:13px;cursor:pointer;white-space:nowrap}.pd-filter-option:hover{background:#f5f7ff;color:#2448ff}.pd-sale-badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600}.fixed{background:#eef2ff;color:#3155ff}.quantity{background:#edf8f2;color:#24865a}.budget{background:#fff6e8;color:#a86a00}.pd-goal-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;margin:2px 4px 2px 0;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pd-platform-cell{display:flex;align-items:center;gap:8px}.pd-platform-icon{width:28px;height:28px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:10px;font-weight:700}.pd-platform-cell small{display:block;color:#9aa4b0;font-size:10px;margin-top:2px}.pd-sort-input{width:58px;height:30px;border:1px solid #d4dae1;border-radius:4px;text-align:center;outline:none}.pd-sort-input:focus{border-color:#2448ff}.pd-status-control{display:flex;align-items:center;gap:8px}.pd-status-switch{width:34px;height:20px;border:0;border-radius:999px;background:#2448ff;position:relative;padding:0}.pd-status-switch:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;right:3px}.pd-status-switch.off{background:#c8ced6}.pd-status-switch.off:after{right:17px}.pd-status-text{font-size:12px;color:#4c5c70}
</style>
</head>
<body data-admin-page="products" data-page-title="产品列表">
<div id="admin-shell"></div>
<template id="page-content">
<div class="page-header"><div><h1>产品列表</h1></div><a class="pd-btn pd-btn-primary" href="product-form.html">＋ 新增产品</a></div>
<div class="pd-toolbar"><div class="pd-filters"><input class="pd-input" id="searchInput" placeholder="搜索产品名称 / 平台"><div class="pd-filter-select" data-filter="goal"><button class="pd-filter-trigger" type="button">全部推广目标</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="category"><button class="pd-filter-trigger" type="button">全部类目</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="platform"><button class="pd-filter-trigger" type="button">全部平台</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="mode"><button class="pd-filter-trigger" type="button">全部售卖方式</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="status"><button class="pd-filter-trigger" type="button">全部状态</button><div class="pd-filter-menu"></div></div></div></div>
<section class="pd-card"><div class="pd-table-wrap"><table class="pd-table"><thead><tr><th>产品名称</th><th>所属类目</th><th>推广目标</th><th>平台</th><th>售卖方式</th><th>售卖配置</th><th>价格 / 起投</th><th>排序</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div><div class="pd-pagination"><span id="resultCount"></span><div class="pd-pages"><span class="pd-page active">1</span></div></div></section>
</template>
<script src="../assets/js/admin-shell.js"></script>
<script>
const products=[
['netease-play','网易云音乐播放推广','云','播放推广',['plays'],'增加歌曲播放','网易云音乐','DSP 平台','固定套餐','fixed','12 个套餐','¥39 – ¥2,509',10,'上架','今天 16:42'],
['tme-play','TME 播放推广','T','播放推广',['plays'],'增加歌曲播放','TME','DSP 平台','固定套餐','fixed','12 个套餐','¥39 – ¥2,509',20,'上架','今天 16:35'],
['netease-playlist','网易云歌单矩阵','云','歌单推广',['playlist','chart'],'进入更多歌单 / 提升热度','网易云音乐','DSP 平台','固定套餐','fixed','4 个套餐','¥1,000 – ¥18,000',30,'上架','昨天 18:20'],
['qq-playlist-chart','QQ 音乐官方歌单打榜','榜','平台资源',['chart','playlist'],'提升热度 / 进入更多歌单','TME','DSP 平台','固定套餐','fixed','3 个套餐','¥10,000 – ¥20,000',40,'上架','今天 15:04'],
['douyin-gesture','抖音投放','抖','内容推广',['social'],'短视频 / 内容传播','抖音','其他平台','按数量购买','quantity','7 个规格','¥600 起',50,'上架','今天 14:44'],
['netease-diy-comments','网易云音乐 DIY 评论','评','播放推广',['plays'],'增加歌曲播放','网易云音乐','DSP 平台','按数量购买','quantity','1 个规格','¥95 / 份',60,'上架','08-17 15:52'],
['spotify-ads','Spotify 广告投放','S','播放推广',['global','plays'],'推广到海外 / 增加歌曲播放','Spotify','DSP 平台','按预算投放','budget','250 起投','预算自定义',70,'上架','今天 14:28'],
['youtube-views','YouTube 有效播放推广','YT','播放推广',['global'],'推广到海外','YouTube','DSP 平台','按预算投放','budget','1,000 起投','预算自定义',80,'上架','今天 14:14'],
['ktv-publish','KTV 制作上架','KTV','场景服务',['ktv'],'上架到 KTV','KTV','其他平台','固定套餐','fixed','1 个套餐','¥2,000',90,'上架','08-16 11:30']
].map(x=>({id:x[0],name:x[1],logo:x[2],category:x[3],goals:x[4],goalText:x[5],platform:x[6],source:x[7],mode:x[8],modeKey:x[9],config:x[10],price:x[11],sort:x[12],status:x[13],updated:x[14]}));
const filters={goal:'',category:'',platform:'',mode:'',status:''},search=document.getElementById('searchInput');const options={goal:[['','全部推广目标'],['plays','增加歌曲播放'],['playlist','进入更多歌单'],['social','短视频 / 内容传播'],['global','推广到海外'],['chart','提升热度 / 冲榜'],['ktv','上架到 KTV']],category:[['','全部类目'],['播放推广','播放推广'],['歌单推广','歌单推广'],['内容推广','内容推广'],['平台资源','平台资源'],['场景服务','场景服务']],platform:[['','全部平台'],['网易云音乐','网易云音乐'],['TME','TME'],['抖音','抖音'],['Spotify','Spotify'],['YouTube','YouTube'],['KTV','KTV']],mode:[['','全部售卖方式'],['固定套餐','固定套餐'],['按数量购买','按数量购买'],['按预算投放','按预算投放']],status:[['','全部状态'],['上架','上架'],['下架','下架']]};
function render(){const q=search.value.trim().toLowerCase(),list=products.slice().sort((a,b)=>a.sort-b.sort).filter(p=>(!q||[p.name,p.platform,p.category].join(' ').toLowerCase().includes(q))&&(!filters.goal||p.goals.includes(filters.goal))&&(!filters.category||p.category===filters.category)&&(!filters.platform||p.platform===filters.platform)&&(!filters.mode||p.mode===filters.mode)&&(!filters.status||p.status===filters.status));document.getElementById('productRows').innerHTML=list.map(p=>`<tr><td><div class="pd-product"><div class="pd-logo">${p.logo}</div><div class="pd-name">${p.name}</div></div></td><td>${p.category}</td><td><span class="pd-goal-tag">${p.goalText}</span></td><td><div class="pd-platform-cell"><div class="pd-platform-icon">${p.logo}</div><div><strong>${p.platform}</strong><small>${p.source}</small></div></div></td><td><span class="pd-sale-badge ${p.modeKey}">${p.mode}</span></td><td><span class="pd-tag">${p.config}</span></td><td class="pd-price">${p.price}</td><td><input class="pd-sort-input" value="${p.sort}" type="number" min="0" data-sort="${p.id}"></td><td><div class="pd-status-control"><button class="pd-status-switch${p.status==='下架'?' off':''}" type="button" data-toggle="${p.id}"></button><span class="pd-status-text">${p.status}</span></div></td><td class="pd-muted">${p.updated}</td><td><a class="pd-link" href="product-detail.html?id=${p.id}">查看</a><a class="pd-link" href="product-form.html?mode=edit&id=${p.id}">编辑</a></td></tr>`).join('');document.getElementById('resultCount').textContent=`共 ${list.length} 个产品`;document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const p=products.find(x=>x.id===btn.dataset.toggle);p.status=p.status==='上架'?'下架':'上架';render()});document.querySelectorAll('[data-sort]').forEach(input=>input.onchange=()=>{products.find(x=>x.id===input.dataset.sort).sort=Number(input.value||0);render()})}
function initFilters(){document.querySelectorAll('[data-filter]').forEach(root=>{const key=root.dataset.filter,trigger=root.querySelector('.pd-filter-trigger'),menu=root.querySelector('.pd-filter-menu');menu.innerHTML=options[key].map(([value,label])=>`<div class="pd-filter-option" data-value="${value}">${label}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();document.querySelectorAll('.pd-filter-select').forEach(x=>x!==root&&x.classList.remove('open'));root.classList.toggle('open')};menu.querySelectorAll('[data-value]').forEach(item=>item.onclick=e=>{e.stopPropagation();filters[key]=item.dataset.value;trigger.textContent=item.textContent;root.classList.remove('open');render()})})}search.oninput=render;document.addEventListener('click',()=>document.querySelectorAll('.pd-filter-select').forEach(x=>x.classList.remove('open')));initFilters();render();
</script>
</body>
</html>
