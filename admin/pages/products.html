<script src="../assets/js/admin-shell.js"></script>
<script>
const search=document.getElementById('searchInput');
const category=document.getElementById('categoryFilter');
const platform=document.getElementById('platformFilter');
const saleMode=document.getElementById('saleModeFilter');
const status=document.getElementById('statusFilter');

function filterRows(){
  const q=search.value.trim().toLowerCase();
  let count=0;
  document.querySelectorAll('#productTable tbody tr').forEach(row=>{
    const text=row.textContent.toLowerCase();
    const visible=
      (!q||text.includes(q))&&
      (!category.value||row.dataset.category===category.value)&&
      (!platform.value||row.dataset.platform===platform.value)&&
      (!saleMode.value||row.dataset.saleMode===saleMode.value)&&
      (!status.value||row.dataset.status===status.value);
    row.style.display=visible?'':'none';
    if(visible)count++;
  });
  document.getElementById('resultCount').textContent='共 '+count+' 个产品';
}
[search,category,platform,saleMode,status].forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',filterRows));
</script>
