<script>
const filters={goal:'',category:'',platform:'',saleMode:'',status:''};
const search=document.getElementById('searchInput');

function setupFilter(id,key,placeholder,options,{searchable=false}={}){
  const root=document.getElementById(id),trigger=root.querySelector('.pd-filter-trigger'),menu=root.querySelector('.pd-filter-menu');
  function optionsHtml(q=''){
    const keyword=q.trim().toLowerCase();
    const list=options.filter(item=>!keyword||[item.label,item.keywords||''].join(' ').toLowerCase().includes(keyword));
    return `<div class="pd-filter-option${filters[key]===''?' active':''}" data-value="">${placeholder}</div>`+list.map(item=>`<div class="pd-filter-option${filters[key]===item.value?' active':''}" data-value="${item.value}">${item.label}</div>`).join('');
  }
  function bindOptions(){
    menu.querySelectorAll('.pd-filter-option').forEach(option=>option.onclick=()=>{filters[key]=option.dataset.value;trigger.textContent=option.textContent;root.classList.remove('open');renderMenu();filterRows();});
  }
  function renderMenu(){
    menu.innerHTML=(searchable?'<div class="pd-filter-search"><input placeholder="搜索平台"></div>':'')+`<div class="pd-filter-options">${optionsHtml()}</div>`;
    bindOptions();
    const input=menu.querySelector('.pd-filter-search input');
    if(input)input.oninput=()=>{menu.querySelector('.pd-filter-options').innerHTML=optionsHtml(input.value);bindOptions();};
  }
  trigger.onclick=e=>{e.stopPropagation();document.querySelectorAll('.pd-filter-select').forEach(x=>x!==root&&x.classList.remove('open'));root.classList.toggle('open');if(root.classList.contains('open'))setTimeout(()=>menu.querySelector('input')?.focus(),0);};
  renderMenu();
}

function filterRows(){
  const q=search.value.trim().toLowerCase();let count=0;
  document.querySelectorAll('#productTable tbody tr').forEach(row=>{
    const goals=(row.dataset.goals||'').split(',');
    const visible=(!q||row.textContent.toLowerCase().includes(q))&&(!filters.goal||goals.includes(filters.goal))&&(!filters.category||row.dataset.category===filters.category)&&(!filters.platform||row.dataset.platform===filters.platform)&&(!filters.saleMode||row.dataset.saleMode===filters.saleMode)&&(!filters.status||row.dataset.status===filters.status);
    row.style.display=visible?'':'none';if(visible)count++;
  });
  document.getElementById('resultCount').textContent=`共 ${count} 个产品`;
}

setupFilter('goalFilter','goal','全部推广目标',PROMOTION_GOALS.map(x=>({value:x.id,label:x.name})));
setupFilter('categoryFilter','category','全部类目',PRODUCT_CATEGORIES.map(x=>({value:x.names.zhCN,label:x.names.zhCN})));
setupFilter('platformFilter','platform','全部平台',[...PRODUCT_PLATFORM_LIBRARY.map(x=>({value:x.name,label:x.name,keywords:(x.keywords||[]).join(' ')})),{value:'抖音',label:'抖音',keywords:'douyin'},{value:'小红书',label:'小红书',keywords:'red xiaohongshu'},{value:'KTV',label:'KTV'}],{searchable:true});
setupFilter('saleModeFilter','saleMode','全部售卖方式',['固定套餐','按数量购买','按预算投放','询价'].map(x=>({value:x,label:x})));
setupFilter('statusFilter','status','全部状态',['上架','下架'].map(x=>({value:x,label:x})));
search.addEventListener('input',filterRows);
document.addEventListener('click',()=>document.querySelectorAll('.pd-filter-select').forEach(x=>x.classList.remove('open')));
filterRows();
</script>
