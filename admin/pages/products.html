<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>产品列表｜星球发行 · 音乐推广 Admin</title>
<link rel="stylesheet" href="../assets/css/admin-common.css"><link rel="stylesheet" href="../assets/css/products.css">
<style>
.pd-filter-select{position:relative}.pd-filter-trigger{height:34px;min-width:132px;padding:0 34px 0 11px;border:1px solid #d3d8df;border-radius:4px;background:#fff;text-align:left;color:#4b5c71;position:relative}.pd-filter-trigger:after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid #8e99a7;border-bottom:1.5px solid #8e99a7;transform:translateY(-65%) rotate(45deg)}.pd-filter-menu{display:none;position:absolute;z-index:60;left:0;top:40px;min-width:180px;background:#fff;border:1px solid #d9dde4;border-radius:5px;box-shadow:0 10px 28px rgba(36,50,70,.14)}.pd-filter-select.open .pd-filter-menu{display:block}.pd-filter-option{padding:10px 12px;font-size:13px;cursor:pointer}.pd-filter-option:hover{background:#f5f7ff;color:#2448ff}.pd-sale-badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600}.fixed{background:#eef2ff;color:#3155ff}.quantity{background:#edf8f2;color:#24865a}.budget{background:#fff6e8;color:#a86a00}.pd-goal-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;margin:2px 4px 2px 0;border-radius:999px;background:#eef2ff;color:#2448ff;font-size:11px}.pd-platform-cell{display:flex;align-items:center;gap:8px}.pd-platform-icon{width:28px;height:28px;border-radius:6px;background:#eef1f5;display:grid;place-items:center;font-size:10px;font-weight:700}.pd-platform-cell small{display:block;color:#9aa4b0;font-size:10px;margin-top:2px}.pd-sort-input{width:58px;height:30px;border:1px solid #d4dae1;border-radius:4px;text-align:center}.pd-status-control{display:flex;align-items:center;gap:8px}.pd-status-switch{width:34px;height:20px;border:0;border-radius:999px;background:#2448ff;position:relative}.pd-status-switch:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;right:3px}.pd-status-switch.off{background:#c8ced6}.pd-status-switch.off:after{right:17px}.pd-status-text{font-size:12px;color:#4c5c70}.pd-name-link{color:inherit;text-decoration:none}.pd-name-link:hover{color:#2448ff}.pd-product-copy{min-width:0}.pd-product-subtitle{max-width:280px;margin-top:4px;color:#98a1ad;font-size:10px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pd-effect{display:block;color:#40536d;font-size:12px;font-weight:500}.pd-config{display:block;color:#43536a;font-size:12px}.pd-price{white-space:nowrap}.pd-table{min-width:1440px}
</style>
</head>
<body data-admin-page="products" data-page-title="产品列表"><div id="admin-shell"></div>
<template id="page-content">
<div class="page-header"><div><h1>产品列表</h1></div><a class="pd-btn pd-btn-primary" href="product-form.html">＋ 新增产品</a></div>
<div class="pd-toolbar"><div class="pd-filters"><input class="pd-input" id="searchInput" placeholder="搜索产品标题 / 副标题 / 平台"><div class="pd-filter-select" data-filter="goal"><button class="pd-filter-trigger" type="button">全部推广目标</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="category"><button class="pd-filter-trigger" type="button">全部类目</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="platform"><button class="pd-filter-trigger" type="button">全部平台</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="mode"><button class="pd-filter-trigger" type="button">全部售卖方式</button><div class="pd-filter-menu"></div></div><div class="pd-filter-select" data-filter="status"><button class="pd-filter-trigger" type="button">全部状态</button><div class="pd-filter-menu"></div></div></div></div>
<section class="pd-card"><div class="pd-table-wrap"><table class="pd-table"><thead><tr><th>产品</th><th>所属类目</th><th>推广目标</th><th>平台</th><th>售卖方式</th><th>规格</th><th>效果</th><th>价格</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div><div class="pd-pagination"><span id="resultCount"></span><div class="pd-pages"><span class="pd-page active">1</span></div></div></section>
</template>
<script src="../assets/js/admin-shell.js"></script><script src="../assets/js/product-catalog-data.js"></script><script>
const products=ADMIN_PRODUCT_CATALOG.map(p=>({...p}));
const goals=ADMIN_PRODUCT_GOAL_NAMES;
const money=n=>'¥'+Number(n||0).toLocaleString('zh-CN');
const uniq=k=>[...new Set(products.map(p=>p[k]))];
const filters={goal:'',category:'',platform:'',mode:'',status:''};
const search=document.getElementById('searchInput');
const options={
  goal:[['','全部推广目标'],...Object.entries(goals)],
  category:[['','全部类目'],...uniq('category').map(x=>[x,x])],
  platform:[['','全部平台'],...uniq('platform').map(x=>[x,x])],
  mode:[['','全部售卖方式'],['fixed','固定档位'],['quantity','多规格可选'],['budget','按预算投放']],
  status:[['','全部状态'],['上架','上架'],['下架','下架']]
};
function priceText(p){const min=getAdminProductMinPrice(p),max=getAdminProductMaxPrice(p);if(!Number.isFinite(min))return '—';if(p.modeKey==='budget'&&p.budgetMode==='continuous')return `${money(min)} 起`;const count=(p.tiers||p.specs||[]).length;return count>1?`${money(min)} 起`:money(min)}
function render(){
  const q=search.value.trim().toLowerCase();
  const list=products.slice().sort((a,b)=>a.sort-b.sort).filter(p=>(!q||[p.title,p.subtitle,p.platform,p.category].join(' ').toLowerCase().includes(q))&&(!filters.goal||p.goals.includes(filters.goal))&&(!filters.category||p.category===filters.category)&&(!filters.platform||p.platform===filters.platform)&&(!filters.mode||p.modeKey===filters.mode)&&(!filters.status||p.status===filters.status));
  document.getElementById('productRows').innerHTML=list.map(p=>`<tr><td><div class="pd-product"><div class="pd-logo">${p.logo}</div><div class="pd-product-copy"><a class="pd-name pd-name-link" href="product-detail.html?id=${p.id}">${p.title}</a><div class="pd-product-subtitle">${p.subtitle}</div></div></div></td><td>${p.category}</td><td>${p.goals.map(g=>`<span class="pd-goal-tag">${goals[g]||g}</span>`).join('')}</td><td><div class="pd-platform-cell"><div class="pd-platform-icon">${p.logo}</div><div><strong>${p.platform}</strong><small>${p.source}</small></div></div></td><td><span class="pd-sale-badge ${p.modeKey}">${p.mode}</span></td><td><span class="pd-config">${getAdminProductConfigLabel(p)}</span></td><td><span class="pd-effect">${getAdminProductEffectSummary(p)}</span></td><td class="pd-price">${priceText(p)}</td><td><input class="pd-sort-input" value="${p.sort}" type="number" min="0" data-sort="${p.id}"></td><td><div class="pd-status-control"><button class="pd-status-switch${p.status==='下架'?' off':''}" type="button" data-toggle="${p.id}"></button><span class="pd-status-text">${p.status}</span></div></td><td><a class="pd-link" href="product-form.html?mode=edit&id=${p.id}">编辑</a></td></tr>`).join('');
  document.getElementById('resultCount').textContent=`共 ${list.length} 个产品`;
  document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const p=products.find(x=>x.id===btn.dataset.toggle);p.status=p.status==='上架'?'下架':'上架';render()});
  document.querySelectorAll('[data-sort]').forEach(input=>input.onchange=()=>{products.find(x=>x.id===input.dataset.sort).sort=Number(input.value||0);render()});
}
function initFilters(){document.querySelectorAll('[data-filter]').forEach(root=>{const key=root.dataset.filter,trigger=root.querySelector('.pd-filter-trigger'),menu=root.querySelector('.pd-filter-menu');menu.innerHTML=options[key].map(([value,label])=>`<div class="pd-filter-option" data-value="${value}">${label}</div>`).join('');trigger.onclick=e=>{e.stopPropagation();document.querySelectorAll('.pd-filter-select').forEach(x=>x!==root&&x.classList.remove('open'));root.classList.toggle('open')};menu.querySelectorAll('[data-value]').forEach(item=>item.onclick=e=>{e.stopPropagation();filters[key]=item.dataset.value;trigger.textContent=item.textContent;root.classList.remove('open');render()})})}
search.oninput=render;document.addEventListener('click',()=>document.querySelectorAll('.pd-filter-select').forEach(x=>x.classList.remove('open')));initFilters();render();
</script></body></html>
